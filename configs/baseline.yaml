model:
  name: "aubmindlab/bert-base-arabertv02"
  num_labels: 2  # 0 = continuité, 1 = frontière de segment

training:
  batch_size: 16
  learning_rate: 2e-5
  num_epochs: 10
  warmup_steps: 100
  weight_decay: 0.01
  max_seq_length: 512
  seed: 42

data:
  train_file: "data/processed/train.jsonl"
  val_file: "data/processed/val.jsonl"
  test_file: "data/processed/test.jsonl"

logging:
  use_wandb: false
  project: "khabar-segmentation"
  run_name: "baseline-arabert"

output:
  checkpoint_dir: "checkpoints/baseline"
  log_dir: "logs/baseline"
