# Configuration pour fine-tuner AraBERT v2 sur la segmentation d'akhbars

model:
  name: aubmindlab/bert-base-arabertv2  # Modèle AraBERT v2

data:
  dir: ./data/processed
  train_file: train_akhbars_bio.jsonl
  val_file: val_akhbars_bio.jsonl
  max_length: 512  # Max token sequence length

training:
  output_dir: ./checkpoints/arabertv2_akhbars
  num_epochs: 10
  batch_size: 16
  learning_rate: 2e-5
  warmup_steps: 500
  weight_decay: 0.01
  logging_steps: 100
  eval_strategy: steps
  eval_steps: 500
  save_strategy: steps
  save_steps: 500
  seed: 42
  use_wandb: false  # Mettre à true si vous voulez utiliser Weights & Biases

evaluation:
  threshold: 0.9  # Confiance minimale pour accepter une prédiction
