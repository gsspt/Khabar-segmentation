كسِنُوْرِ عبدالله بـيـع بـدرهم صغيراً، فلما شب بيع بقيراط ! قال عبدالله بن إدريس : فقنّعتُ رأسي ودخلت بين أضعاف الناس ولم أعد إلى مسألته .  ٣٤٦ أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا محمد بن عبدالله بن شبيب قال : حدثنا أحمد بن لقمان قال : حدثنا محمد بن إبراهيم المقرىء قال: محمد بن عبد الرحمن الأشهلي يقول : سمعت عبد الله بن إدريس يقول : كان لنا جار من خزاعة يقال له أبن أبي مالك، وكان معتوهاً حتى يُكلَّم فإذا كُلَّمَ أجاب جواباً معجِباً . فمررت به ذات يوم وأنا أريد الجمعة فقلت له : يابن أبي مالك، متى تقوم الساعة؟ قال : ما المسؤول عنها بأعلم من السائل غير أن من مات فقد قامت قيامته، والموت أول عدل الآخرة. فقلت له : المصلوب يعذب؟ قال: إن كان مستحقا فإن روحه تعذب، وما أدري لعل البدن في عذاب من عذاب الله لا تدركه عقولنا ولا أبصارنا . فإن الله لطفاً لا يُدرك. وكان جالساً في موضع فيه رماد ومعه قطعة جص يخط بها فيستبين بياض الجص في سواد الرماد فقلت له : يابن أبي مالك : أيش تصنع ؟ قال : ما كان يصنع صاحبنا . قلت : ومن صاحبكم ؟ قال : مجنون بني عامر . قلت : وما كان يصنع ؟ قال : أما سمعته يقول؟ : وما لي بها من حيلةٍ غير أنني بلقط الحصى والخط في الدار مولع قلت : ما سمعته ! . فضحك وقال : أما سمعت الله يقول أَلَمْ تَرَ إلى رَبِّكَ كيف مد الظل فهل رأيته؟ . هذا يا بن إدريس كلام العرب .  ٣٤٧ قال أيضاً: ومر بي وأنا أتنقل في صحن المسجد، فصحت به ليعطف علي فقال: أَقبل على من أنت بين يديه، فأنت بين يدي رب العالمين. قال: فأفزعني والله.  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو موسى قال : حدثنا محمد بن الحسين عن أبي عبد الرحمن الأشهلي به سواء  أخبرنا محمد قال: أخبرنا الحسن قال : أخبرنا أبو موسى قال : حدثنا أبو عوانة قال : حدثنا أبو علي قال : حدثنا محمد بن الحسين قال : حدثنا محمد بن إسماعيل بن أبي فديك قال : كان عندنا رجل يكنى أبا نصر من جهينة، ذاهب العقل توفي منذ شهر أو أقل وكان يجلس مع أهل الصفة في آخر مسجد رسول الله صلى الله عليه وسلم . وكان إذا سئل عن شيء أجاب فيه جواباً حسناً . فأتيته يوماً وهو في مؤخّر المسجد مع أهل الصفة منكس رأسه، فجلست إلى جنبه فحركته وأعطيته شيئاً كان معي فقال : قد صادفت منا حاجةً . فقلت : يا أبا نصر ما الشرف؟ قال : حمل ما نال العشيرة أدناها وأقصاها، والقبول من محسنها والتجاوز عن مسيئها . قلت : فما المروءة؟ قال: إطعام الطعام وإفشاء السلام وتوقي الأدناس والآثام . قلت : فما السخاء؟ قال : جُهد المقل ! . قلت : فما البخل ؟ قال : أُفَةٌ، وحول وجهه عني . قلت: لم لا تجيبني قال : قد أجبتك  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو موسى قال : حدثنا أبو عوانة قال : حدثنا أبو علي قال : حدثنا محمد بن الحسين قال : حدثنا ابن أبي فديك قال : قدم علينا هارون سنة ثلاث فأخلي له المسجد، فوقف على مسجد رسول الله صلى الله عليه وسلم وعلى منبره وفي موقف جبريل عليه السلام، واعتنق أسطوانة التوبة ثم قال : قفوا بي على أهل الصفة . فلما أتاهم حُرِّكَ أبو نصر وقيل : هذا أمير المؤمنين فرفع رأسه وقال : أيها الرجل إنه ليس بين عباد الله وأمة نبيه ورعيتك وبين الله خلقٌ غيرك، وإنّ الله سائلُك عنهم فأعد للمسألة جواباً . فقد قال عمر بن الخطاب رضي الله عنه : لو ضاعت سخلة على شاطىء الفرات لأخذ بها عمر يوم القيامة. قال : فبكي هارون ثم قال : يا أبا نصر، إن رعيتي ودهري غير رعية عمر ودهره . قال : دع عنك هذا والله غيرُ مُغن فانظر لنفسك، فإنك وعمر تسألان عما خولكما الله . قال : فدعا هارون بمئة دينار فقال: أعطوها إلى أبي نصر. قال أبو نصر : ما أنا إلا رجل من أهل الصفة، فادفعوها إلى فلان يفرقها بينهم ويجعلني رجلا منهم .  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو موسى قال : حدثنا أبو عوانة قال : حدثنا أبو علي قال : حدثنا محمد بن الحسين عن ابن أبي فديك قال : أجدبَتِ المدينة واشتد حالُ أهلها وانكشف قوم كانوا مستورين بها، فخرجوا يدعون، فمررتُ بسوق الطعام وما فيها حبة حنطة ولا شعير إذا أبو نصر جالس منكس رأسه. فقلت : يا أبا نصر، أما ترى ما فيه أهل حرم رسول الله صلى الله عليه وسلم؟ قال : بلى . قلت : أفلا تدعو الله لعل الله يفرج عنهم؟ قال: بلى. فحول وجهه إلى القبلة وقال : اجلس بجنبي فجلستُ، فانكب فعفر وجهه في التراب ثم رفع رأسه وقال : يا فارج الهم ويا كاشف الغم مجيب دعوة المضطر، رحمن الدنيا والآخرة ورحيمهما، صل على محمد وآل محمد ، وفرّج ما أصبح فيه أهل حرم نبيك صلى الله عليه وسلم. ثم غُلِبَ فذهب فقمت من عنده فوالله ما خرجت من السوق حتى رأيتُ الشمس قد تغطّت، فرفعتُ رأسي فإذا رجلٌ من جراد أرى سوادهن في الهواء، فما زلن يسقطن وأنا واقف حتى ملأن المدينة، واشتغل كل قوم بما في دارهم من الجراد فَحَشَوا الأجواف وطبخوا وملحوا ، وملأ الناس الجباب والجرار والقواصر. والتوى في جانب بيوتهم ثم نهض بعد ثلاثة أيام فانتشر في أعراض المدينة لم يخرج منها إلى غيرها . ثم ما مرت بنا ثلاثة أيام إلا جاءنا أنّ عشر سفائن دخلت المجاز فإذا هي دخلت في الوقت الذي دعا فيه أبو نصر، فرجع السعر إلى أرخص ما كان ورجعت حال الناس إلى أحسن ما كانت. فأتيت أبا نصر وهو في مسجد رسول الله صلى الله عليه وسلم فقلت: يا أبا نصر ألا ترى إلى بركة دعائك فقال: لا إله إلا الله ، هذه رحمة الله التي وَسِعَتْ كلّ شيء.  وبهذا قال ابن أبي فديك : كان أبو نصر يخرج كل جمعة، فيدخل السوق مما يلي الثنية، فلا يزال يقف على مربعة مربعة ويقول : يا أيها الناس اتقوا يوماً لا تجزي نَفْسٌ عن نَفْس شيئاً ولا يُقْبَلُ منها عَدْلٌ ولا تَنْفَعُها شفاعة . وإن العبد إذا مات صَحِبَه أهله وماله وعمله، فإذا وُضِع في قبره رجع أهله وماله وبقي عمله، فاختاروا لأنفسكم ما يؤنسكم في قبوركم . ثم لا يزال يفعل ذلك في مربعة مربعة حتى يأتي مصلى رسول الله صلى الله عليه وسلم ثم ينهض إلى الجمعة فلا يخرج من المسجد إلا لطهور حتى يصلي العشاء الآخرة .  أخبرنا محمد قال: أخبرنا الحسن قال: أخبرنا أبو القاسم منصور بن العباس بن منصور الفقيه ببوشنج قال: حدثنا أبو عبدالله محمد بن إبراهيم بن خالد الهروي قال: حدثنا ابن أبي الدنيا قال: حدثنا محمد بن الحسين عن سلمة الباقلاني عن عطاء السلمي. أخبرنا محمد قال: أخبرنا الحسن قال: أخبرنا محمد بن كامل بن علي الموصلي الراحل إلى الأصم قال: أخبرنا أبي قال: حدثنا مغيرة بن سابق الأزدي عن داود بن المحبر بن قحدم عن عطاء السلمي قال: مررت بقصر الزيت فإذا أنا ببعض أصدقائي فقال لي: يا عطاء، بالذي هو في قلبك لا غيره ألا أبررت قسمي؟ قلت: وما هو؟ فناولني شكراً وسمناً ونشاء وقال: أصلحه لي. فأمرت من أصلحه وأخذته تحت كسائي أمر بها إليه، إذا نحن بحيان المجنون فقال لي: ما معك؟ قلت: شيء أصلحناه لبعض أصدقائي. فقال: اكشف عنه. فكشفت عنه، فقال لي: ارفعه فإنّ نفوسنا تطرف من أن تأكل. قلت: فما تريد؟ قال: فالوذ العارفين. قلت: وما هو؟ قال: خذ قند الصفاء وسمن البهاء وزعفران الرضاء وماء المراقبة، وانصب طنجير القلق، وأوقد تحتها حطب الحرق، واعقده بإسطام الحياء ونار الشوق حتى تزيد زبد الصبر وترغو رغوة التوكل، ثم ابسطه على صحاف الأنس، ثم كُله. قلت: فإذا أكلته؟ قال: تضج أوجاع القلوب إلى مداويها، وتشكو الضمائر إلى مُبليها، وتبكي العيون من محبة مبكيها شوقاً إلى من آنسها بحبه. ثم أنشأ يقول : فهام بحب الله في القفر سائحاً وحطت على شوق القدوم رواحله

نهاه النهي وارتاع للخوف باطنه وخاف وعيد الله فالحق شاغله

فلما جرى في القلب ماء يقينه فأَنْبَتَ زرعاً لم تَجِفَّ سنابله

طوی دهره بالصوم حتى كأنما عليه يمين أنه لا يُزايله

فعاد بحزن قد جرى في ضميره تبوح به أعضاؤه ومفاصله

يَسُرُّ الفتى ما كان قدّم من تقى إذا عرف الداء الذي هو قاتله  ٣٥٤ - وبهذا قال عطاء : ومررتُ به يوماً في مقابر البصرة وهو واقف على قبر يخاطبه فقلت له: يا حيان من تخاطب؟ قال: صاحب هذا القبر، كان صديقي ورفيقي . قلت : وما تقول؟ قال : أقول : يا صاحب القبر يا من كان يؤنسني
وكان يكثر في الدنيا مـواتـاتي قلت : وما أجابك؟ قال : شُغَلْتُ عنك بشيءٍ لستُ واصفـه من الهموم ولوعات وترحات  ٣٥٥ وبهذا قال عطاء ومررت فقلت: كيف أصبحت يا حيان؟ فقال : ذات يوم في بعض أزقة البصرة أصبحتُ لا أعرف ما صباحي من الهموم لا ولا رواحي
أفرطتُ في جُرمي وفي اجتراحي فصرت كالبازي بلا جناح همام بن أبي همام  أخبرنا محمد قال: أخبرنا الحسن قال : أخبرنا أبو موسى عمران بن موسى بن الحصين قال : حدثنا أبو عوانة قال : حدثنا أبو علي قال : حدثنا محمد بن الحسين قال : حدثنا محمد بن عبد الرحمن الأشهلي قال : أخبرني بشر بن أبي قبيصة ابن أخي أبي همام قاضي أرجان وكان أبو همام يقول بالاعتزال وكان ابن أخيه بشر بن أبي قبيصة يقول بخلافه، وكان أبو همام قد اتبعه على قوله خلق كثير، وكان مسنا وكان أكبر ولده يقول بالاعتزال مقالة أبيه . فغُلِبَ على عقله وتاه، فقيد وشدّت يده إلى عنقه. قال: فدخلت عليه فجلستُ منه بعيداً خوفاً منه، فقلت له : يا همام كيف تجدك ؟ فقال لي : اسكت يا قدري . فقلت : يا سبحان الله، ما هذا الجواب؟ أليس مقالتنا ومقالتك واحدة؟ قال : لا ، ولا كرامة لك يا بن الفاعلة! إني نظرت في مقالتك ومقالة عمّك الضّال المفتون، فوجدتُكما كافرين بالله . فقلت : كيف؟ قال: إنكما تزعمان أن الله جعل فيكما استطاعةً تغلبان بها استطاعة الله . قلت له : يا همام، ومن يزعم أن استطاعته تغلب استطاعة الله ؟ . قال : أنت يا بن الفاعلة! تزعم أن الله لم يقض عليك الزنى وأنت قضيته على نفسك، فشاركت الله في حكمه وزعمت أن الله لو قال لك افعل قلت لا أفعل، فلعنك الله ولعن عمك . قلت له : فأي قول اخترت لنفسك قال : رَدَدْتُ الأمور إلى مدبّرها وخالقها وعلمتُ أن خيرها وشرها وضُرّها ونفعها منه . قلت : ليتك كنت مُتَّ قبل هذا الوقت . قال : يا بن الفاعلة، الله كان أرحم بي . أمهلني إلى هذا الوقت الذي أبصرت فيه رشدي .  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو موسى قال : حدثنا أبو عوانة قال : حدثنا أبو علي قال : حدثنا محمد بن الحسين قال : حدثنا محمد بن عبدالرحمن قال : أخبرني بشر بن أبي قبيصة قال: دخلت عليه يوماً أعوده من علة كانت به، فجلستُ حيث آمَنُه فقلتُ له : يا همام ما نقدر بكلامك قال : ولم؟ قلت له : تقول فينا ما لا يحل لك . فقال لي : يا بن الفاعلة، أنت تقول في التابعين ما لا يحل لك. قلت : مَنْ مِنَ التابعين قلت فيه ما لا يحل لي ؟ قال : الحسن بن أبي الحسن، تزعم أنه كان قدرياً، فإن كنت كاذباً فعليك لعنة الله .  وبهذا قال بشر بن أبي قبيصة : دخل عليه شعيب بن مخلد الدهان فقال له : يا همام ما هذا الذي يبلغنا عنك ؟ قال : وما يبلغكم عني؟ قال : يبلغنا أنك انقلبت من القول بالعدل إلى القول بالجور. قال له همام : يا بن الفاعلة، لو كنت تقول بالعدل لرددت الأمول إلى مدبرها وخالقها . وبعد فأنت تقول بالعدل وأنت تغش السمسم؟! ثم رماه بحجر كبير فأصاب قدمه فلم يزل شعيب يعرج منها.  ٣٥٩ قال بشر : واجتمعنا يوماً فقلنا له : أي شيء تأمر في سهمك من ميراثك عن أبيك؟ قال : فأقبل علينا مُغْضَباً ثم قال : يا بشر أتتوارث أهل ملّتين مختلفتين؟ قلنا : له : ونحن ملتان؟ قال : نعم . إنكم تزعمون أن الله خلق الخير ولم يخلق الشر، وأنا أزعم أن الله خلق الخير والشر، وتزعمون أن الله قضى الخير ولم يقض الشر، وأنا أقول إن الله قضى الخير والشر، وإن من عذبه عذبه غَيْرَ ظالم، ومن رحمه فرحمته وسعت كل شيء، قم عني! .  ٣٦٠ أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو الفرج أحمد بن محمد بن دينار النهاوندي قال : حدثنا عبد الملك بن أحمد الاستراباذي قال: حدثنا أبي قال : حدثنا بشر بن أبي قبيصة ابن أخي أبي همام بالحديث سواء . *** : جعيل المجنون  ٣٦١ مقدسي. أخبرنا محمد قال: أخبرنا الحسن قال: سمعت أبا الفضل نصر بن أبي نصر العطار يقول: سمعت عبيد الله بن بكير الحمصي يقول: سألت جعيل المقدسي، وكان من أهل المحبة: متى تصح للعبد الولاية؟ قال: إذا سَبَقَتْ له العناية وكان من مولاه في كفاية.  ٣٦٢ قال نصر : وسمعت عبيد الله يقول : سمعت جعيلا يقول : من عرف الله سار، ومن سار طار، ومن طار حار!  قال : وسمعت عبد الله بن عبدالعزيز الصوفي بجرجان يقول : سمعت جعفر بن عبد القادر المقدسي يقول : سألت جعيلا عن حد الزهد فقال: استصغار الدنيا. فلما وليت دعاني فقال : بل محو الدنيا من القلب.  ٣٦٤ وسمعت عبد الله يقول : سمعت جعفراً يقول : طلبت جعيلاً ذات يوم فإذا به في بعض الخرابات وقد خَنقته العبرة وهو يقول : يا رجائي وعصمتي ومنائي ترحم اليوم ذلتي وبكائي
يا حبيبي ومؤنسي وعمادي وغياثي ومعقلي ورجائي  ٣٦٥ أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا الفضل العطار يقول : سمعت عبيد الله بن بكير الحمصي يقول : سألت جعيلا عن العارفين بالله فأنشأ يقول قوم لهم همم تسمو بهم أبداً إلى جليل عظيم القدر غفار يوحنا المجنون  حيري. أخبرنا محمد قال: أخبرنا الحسن قال : أخبرنا أبو موسى عمران بن موسى قال : حدثنا أبو عوانة قال : حدثنا أبو علي قال : حدثنا محمد بن الحسين قال : حدثنا محمد بن عبد الرحمن قال : قال أبي : كنت أنا ووكيع بن الجراح في فناء دار صالح بن علي بالجبان، فطلع علينا عبادي من أهل الحيرة، على حمار تحته خرج يقال له يوحنا، وكان ممروراً، وكانت مِرَّته تهيج به وتكف عنه . فقال وكيع : يا أبا محمد اسمع جواب العبادي . فلما حاذانا قال له وكيع : يا يوحنا، لو نزلت فتحدثت في هذا الفناء الكتب . فقال له يوحنا : يا أبا سفيان، نعم، المجلس لمن كُفِي أهله مصالحهم . فقال له وكيع : ناولني خاتمك فناوله، فإذا مكتوب عليه : العزة لله ، محمد خير البرية. قال له وكيع : يا يوحنا ما تقول في تقدمة أبي بكر وعمر ؟ قال : أقدّمهما في الإمامة ولا أقدمهما في المحبة ! . ثم أقبل على وكيع فقال : يا أبا سفيان، وفي المحبة ! .  ٣٦٧ بصري. أخبرنا محمد قال: أخبرنا الحسن قال: أخبرنا أبو موسى قال: حدثنا أبو عوانة قال: حدثنا أبو علي محمد بن الحسين قال: أخبرني محمد بن عبد الرحمن قال: حدثنا أبو زيد الأنصاري قال: دعا ابن أبي بردة أبا علقمة، فلما دخل عليه قال: أتدري لم أرسلت إليك؟ قال: لا. قال: لأسخر منك، فقال أبو علقمة: لئن فعلت ذلك لقد سخر أحد الحكمين بصاحبه. فلعنه ابن أبي بردة وأمر بحبسه، فمكث أياماً ثم أخرجه يوم السبت. فلما وقف بين يديه قال له: يا أبا علقمة، ما هذا الذي في كمك؟ قال: طُرَفٌ من طرف السجن قال: ألا تهب لنا منه؟ قال: هذا يوم لا نأخذ فيه ولا نعطي. فقال له ابن أبي بردة: ما أبردك وأثقلك يا أبا علقمة. قال: أبرد مني وأثقل من كانت أمه يهودية من أهل السواد!  أخبرنا محمد قال: أخبرنا الحسن قال: أخبرنا أبو موسى قال: حدثنا أبو عوانة قال: أخبرنا أبو علي قال: حدثنا محمد بن الحسين قال: حدثنا أبو عبد الرحمن قال: حدثنا أبو زيد النحوي قال: مرّ رجل من قيس ومعه ابن له يريد الجمعة، وأبو علقمة على باب المسجد جالس، فقال الغلام لأبيه: أكلم أبا علقمة؟ قال: لا. فأعاد عليه ثانياً وثالثاً. فقال أبوه: أنت أعلم. فقال له الغلام: يا أبا علقمة ما بال لحى قيس قليلة خفيفة المؤنة ولحى اليمن كبيرة عريضة شديدة المؤنة؟ قال: من قول الله عز وجل: والبَلَدُ الطَّيِّبُ يَخْرُجُ نَباتُه بإذن رَبِّهِ وَالَّذِي خَبُثَ لا يَخْرُجُ إلا نَكِداً مثل لحية أبيك. فجذب القيسي يده من يد ابنه ودخل في غمار الناس حياء وتشوراً.  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو موسى قال : أخبرنا أبو عوانة قال : حدثنا أبو علي قال : حدثنا محمد بن الحسين قال: حدثنا أبو عبدالرحمن قال : حدثنا عبد الله بن نمير وذكرت له عليان المجنون وما كلم به علي بن ظبيان فقال : بلغني حسن جواب عليّان وهو من أهل بيت صدق، وكان قبل أن يبتلى من صلحاء أهل الكوفة . ثم قال ابن نمير : كان لي ابن أخت سمته أختي باسم أبي ، نمير. وكان من نساك أهل الكوفة قد سمع سماعاً حسناً. وكان حسن الطهور حسن الصلاة يراعي الشمس في الزوال. فعرض له فذهب عقله، وكان لا يؤويه سقف بيت ؛ إذا كان النهار فهو في جبانة القبور، وإذا كان الليل ففي السطح قائماً على رجليه في البرد والمطر والرياح. وكنا معه في نحو مما هو فيه من التردد في المطر والبرد والرياح إلا أن عقولنا معنا . فنزل بكرةً ذات يوم يريد المقابر فقلت : يا نمير تنام؟ قال : لا . قلت : وما العلة التي تمنعك من النوم؟ قال : هذا البلاء الذي تراه بي . قلت له : يا نمير ما تخاف الله تقول بي بلاء؟ قال : أليس قد جاء في الخبر: «أشد الناس بلاء الأنبياء ثم الأمثل فالأمثل قلت له : فأنت أعلم مني . قال : كلا ومضى .  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو موسى قال : حدثنا أبو عوانة قال : حدثنا أبو علي قال : حدثنا محمد قال : حدثنا أبو عبدالرحمن قال: أخبرني ابن نمير قال : صعدت إليه ذات ليلة وهو قائم في السطح وأمه تبكي ، قلت له : يا نمير، بقي منك شيء لم تنكره ، قال : نعم . قلت : وما هو ؟ قال : حُبّ الله وحُبّ رسوله .  أخبرنا أبو موسى قال: حدثنا أبو عوانة قال: حدثنا أبو علي قال: حدثنا محمد قال: حدثنا أبو عبد الرحمن قال: أخبرني عبدالله بن نمير قال: صعدت إليه ليلةً في شهر رمضان فقلت له: يا نمير لم أفطر. قال: ولم؟ قلت: أحب أن تراك أختي تأكل معي. قال: أَفْعَلُ. فجاؤوا بطعام فجعل يأكل حتى فرغت وفرغ. فلما أردت أن أقوم رحمته من أن يرى قفاي مولياً وهو في الظلمة والريح فبكيت. فقال: ما يبكيك يرحمك الله؟ قلت له: أنزل إلى الكن والضوء وأدعك في الظلمة والبرد؟ قال: فغضب ثم قال: إنّ لي رباً هو أرحم بي منك وأعلم بما يُصلحني فَدَعْه يُصرفني كيف يشاء فلا أتهمه في قضائه. قال: فقلت له: لئن كنت في ظلمة الليل إن جدك لفي ظلمة اللحد! أريد أن أُعزّيه وأطيب نفسه. ثم أتيته من الغد فقال لي: أتاني البارحة آت وأبوك نمير، فوقف ثم قال لي: يا نمير إنك ستأتينا يوم الجمعة شهيداً. قال: فدعوت أمه فصعدت إلي فأخبرتها بها. قال: فقالت: والله ما جربت عليه كذباً. وقال لي هذه المقالة عشية الأربعاء، فجعلنا نتعجب ونقول غداً الخميس وبعد غد يوم الجمعة، فهبه مرض غداً ومات يوم الجمعة فأين الشهادة؟. فلما كان ليلة الجمعة في شطر الليل سمعنا هَدَةً فبادرنا فإذا هو قد هاج كما كان يهيج، فبادر إلى الدرجة فزلت قدمه فسقط منها واندقت عنقه ومات، فحفرت له إلى جنب أبي ودفنته. قال: واتكأت على قبر أبي فقلت: يا أبه قد أتاك نمير وجاورك، ثم انصرفت. فلما كان الليل رأيتُ أبي في النوم كأنه دخل علي من باب البيت فقال: يا بني جزاك الله خيراً فقد أَنِسْتُ بنمير!! اعلم أنه مذ أَتيتُمونا به تزوّج الحور العين. سلمة جار الحسن بن صالح  أخبرنا أبو موسى : قال أبو عوانة قال : حدثنا أبو علي قال : حدثنا محمد بن الحسين عن أبي عبد الرحمن قال : أخبرني عثمان بن حكيم الأودي قال : كان للحسن بن صالح جار يقال له سلمة، معتوه ذاهب العقل حتى يكلم فإذا كلّم أحسن الجواب . وكان يخرج من بيته فيجفل كما يحفل النعام حتى يأتي الفرات، فيرمي نفسه في ضحضاح فيتمرغ فيه ثم يرجع . فرجع يوماً والحسن بن صالح جالس على بابه، فقال له الحسن : يا سلمة . قال : لبيك . قال : تؤمن بالمعاد؟ ففتح سلمة عينيه وغضب وقال : نعم يا حسن، كأني أنظر إلى القيامة وقد قامت، وإلى كرسي القضاء وقد وضع كما شاء الله، وإلى الموازين قد نُصبت، وإلى الصحف قد نُشِرَت كما شاء الله. وكأني أنظر إلى فريق في الجنة وفريق في السعير. ولكن يا حسن اتق الله ولا ترد أمر الله . فقال له الحسن : وكيف أرد أمر الله ؟ قال: إنكم معاشر الشيعة تدفعون أن أبا بكر وعمر إماما عَدْلٍ ، وقد قال الله عزّ وجلّ في كتابه : إن الله يأمرُ بالعَدْلِ والإحسان) فتولية أبي بكر وعمر من عدل الله الذي أمر به، ثم تزعم أن عليا أولى بالأمر منهما، فإن لقيت الله بهذه المقالة لقيته وأنت من الخاسرين. فقال الحسن : ليس هذه مقالة أهل بيتك . قال : لكنها مقالتي يا حسن، اشتفيت مني فاشتفيتُ منك. قال الله وإن عاقبتُمْ فعاقبوا بمثل ما عُوقِبْتُمْ بِهِ.  ۳۷۳ أخبرنا أبو موسى قال : حدثنا أبو عوانة قال: حدثنا أبو علي قال : حدثنا محمد عن ابن عبد الرحمن عن عثمان بن حكيم قال: قلتُ له : يا سلمة، حسن بن صالح شيعي؟ قال : لا ، الشيعة الخلص من أحب علي بن أبي طالب وقدم أبا بكر وعمر عليه، رضي الله عنهم.  قال عثمان : وقلت له يوماً : يا سلمة ادع الله لي . فقال : أستعيذ بالله من الشيطان الرجيم بسم الله الرحمن الرحيم وإذا سألك عبادي عني فإني قريب ثم قال : يا عثمان، إن الله لم يخص أحداً ولم يحظرها على أحد فليستجيبوا لي وليؤمنوا بي لعلهم يرشدون فيا من أمر بذلك هَبْ لنا ولعثمان العافية في الدنيا والآخرة.  أخبرنا أبو موسى قال : حدثنا أبو عوانة قال : حدثنا أبو علي قال : حدثنا محمد بن إسحاق أبو عبدالله المسيبي قال: حدثنا أبو ضمرة أنس بن عياض قال : كان ها هنا رجل أبو هؤلاء الذين يعرفون ببني مسمار، وكان رجلاً أعجميا يجلس في ظل دار سعيد بن العاص وكان إذا قيل له : يا عُشرة، يغضب ويشتم ويُزني . فأقبل أبان بن عثمان يوماً فقال لصاحب شُرطه : احْجُبِ الناس من بين يدي ومن خلفي . ثم دنا منه فقال : السلام عليك يا عُشرة . فرفع رأسه فنظر إليه فلم يتكلم . فقال له أبان : ما لك لا تتكلم يا عشرة؟ لقد أصبحت حليماً. قال: فضرب بيده إلى لحيته وتكلم بالفارسية : يا ريش كان اللحم إذا فسد داويناه بالملح، فإذا فسد الملح بأي شيء نداويه؟! فقال أبان : أما إذا كان هذا هكذا فلا أعلم أحدا يقول لك يا عشرة إلا ضربته من الحد كذا وكذا .  أخبرنا أبو موسى قال : حدثنا أبو عوانة قال : حدثنا أبو علي قال : حدثنا محمد قال : حدثنا أبو همام إسرائيل بن محمد القاضي قال : كان بالمهرجان رجل يقال له سابق، وكان معتوهاً ذاهب العقل حتى يُكلّم. وكان متوحشاً وكان مأواه الخرابات والمقابر والغياض. قال : وكنت أحب أن أراه وأكلمه وأسمع جوابه، فأتيت المقابر ذات يوم فإذا به منكس رأسه في قبر، فلم يعلم حتى سلّمتُ عليه فرفع رأسه وقال : وعليكم السلام . قال : وَهِبْتُه فانقطعت ولم أتكلم . قال : فرأى ذلك في فقال : يا إسرائيل بن محمد ، خَفِ الله خوفاً لا يَشْغَلُك عن الرجاء، فإنك إن ألزمت قلبك الرجاء شغلته عن الخوف، وَفِرَّ إلى الله ولا تَفِرَّ منه، فإنه مُدْرِكُكَ ولن تُعْجِزَه، ولا تطع المخلوق في معصية الخالق. وأعلم أن الله يوماً تَشْخَصُ فيه الأبصار مهطعين مُقْنِعِي رؤوسهم لا يرتد إليهم طَرْفُهم وأفئدتهم هواء. قال: ثم قام فدخل الخرابات. فعدت إليه بعد شهر فلما رآني هرب فقلت يا سابق لا أعود إليك بعد اليوم . فوقف فقلت : علمني كلمات أدعو بهن فقال : إن أخذ الكلام للقلوب ما جاء من القلوب، وإن أفضل الأعمال ما أُكْرِهَتْ عليه النفوس. ثم قال: اللهم اجعل نظري عِبْرَةً وسكوني فكرةً وكلامي ذِكْراً . ثم تخطى حائطاً فمضى في الخرابات. أبو علي المخرمي  بغدادي أخبرنا أبو موسى قال : حدثنا أبو عوانة قال : حدثنا أبو علي قال : حدثنا محمد قال : حدثنا ابن عبد الرحمن قال: حدثنا خلف بن سالم قال : قلتُ لأبي علي المعتوه وكان ينزل في المخرّم دار البالوق : يا أبا علي لك مأوى؟ قال : نعم . قلت: فأين مأواك؟ قال : في دار يستوي فيها العزيز والذليل. قلت: فأين هذه الدار؟ قال: المقابر. قلت له : يا أبا علي، أما تستوحش في ظلمة الليل؟ قال: إني أُكْثَرُ ذكر ظلمة اللحد ووحشته فيهون علي ظلمة الليل ووحشته . قلت له : فهل ترى في المقابر شيئاً تكرهه؟ قال : ربما، ولكن في هول الآخرة ما يشغل عن هول المقابر.  ۳۷۸ مدائني . سمعت أبا حاتم محمد بن حبان بن أحمد قال : سمعت أبا منصور التكريري يقول : كان أبو جوالق المدائني معتوهاً، فنظر بعض الأغبياء في استه وقال : يا أبا جوالق من شَجَّك هذه الشجة ؟ قال : الذي شج أمك شجتين ! . قال : فتشور الرجل ومضى .  وبلغني أن أبا جوالق ذهب ليشتري حماراً، فقال صديق له : إلى أين؟ قال: أشتري حماراً . فقال صديقه : قل إن شاء الله . فقال أبو جوالق : ليس هذا موضع إن شاء الله، الدراهم في كمي والحمار في السوق. فطرت دراهمه من كمه، فرآه صديقه حزيناً، فقال له : ما صنعت؟ اشتريت الحمار ؟ فقال : سُرِقَتِ الدراهم إن شاء الله ! .  أخبرنا أبو عبدالله محمد بن الطيب قال : حدثنا حفص بن عمر بن حفص قال : حدثنا علي بن عبد الحميد قال : حدثنا إبراهيم الجنيد عن إسماعيل بن وهيب قال : ركبت يوماً من البصرة أريد سيراف، فلما صرنا في وسط البحر هبت ريح شديدة، وكان معنا ثوبان المجنون، فنظرت إليه وقد لاحظ السماء وهو يقول : أقسمت عليك يا مأوى همم العارفين إلا كشفت عنا الأذى . فما استتم الكلام حتى سَكَنَتِ الرِّيح ونَجَوْنا . وبهذا عن إبراهيم بن الجنيد عن إسماعيل بن وهيب قال : كان ثوبان إذا جَنّه الليل يناجي ربه ويقول : يا سروري ومنيتي وعمادي وأنيسي في غايتي ومرادي
أنت روح الفؤاد أنت رجائي أنت لي مؤنس وشوقك زادي  ۳۸۱ بغدادي . أخبرنا أبو موسى قال : حدثنا أبو عوانة قال : حدثنا أبو علي قال : حدثنا عبد الله بن محمد المقرىء قال : رأيت أبا الصقر المعتوه ونحن في صف الجوهري في البزازين في يوم صائف وسقاء يصيح : صائف وسقاء يصيح : هذا يوم يُسقى فيه الماء. فقال أبو الصقر : وأي يوم يُطعم فيه الخبز؟  سمعت أبا الفوارس حنتف بن أحمد بن حنتف الطبري برباط فراوة يقول: سمعتُ سهل بن أحمد الذكاني المقرىء يقول: سمعت بكر بن سليمان الصوفي يقول: مررتُ بأبي الصقر المعتوه ذات يوم فسلمت عليه، فقال لي: معك سبورة. قلت: وما تريد؟ قال: أُملي عليك شيئاً. قلت: نعم. فأخرجتُ ألواحي فقال: اكتب: إنا إلى الله وإنا يرفع الناس وأَنْحَطَّ
قد صرتُ نِضُواً في فراش الهوى كأنني من فوقه خَطُّ سَلَمَة  موصلي أخبرنا أبو حاتم محمد بن حبان بن أحمد البستي قال : حدثنا عبدالرحمن بن إدريس الخياط بالموصل. قال : حدثنا نعيم الخشاب قال: كان سلمة الموصلي أديباً ظريفاً قبل أن خُولط، فماتت امرأته وكان كلفاً بها فخولط ودهش. وكان شديد الكلام فسمعته ذات يوم وهو يقول لبعض إخوانه : عليك بقصر الأمل والاختلاع من الحول والقوة، وكل الأمور إلى خالقها ومدبرها تسترح، وإياك والكسل فإن أخذه أليم شديد.  ٣٨٤ قال نعيم : ورأيته في مقابر الموصل ذات يوم واقفاً على قبر وهو يقول : حَسْبُ الخليلين نأي الأرض بينهما  ٣٨٥ قال نعيم : وكان يأنس بي في الأحايين فأطعمه ما يشتهيه، فتشهى علي ذات يوم أرزا بلبن فاتخذتها له . فلما أكله قلتُ له : ما الفرق بين الفعال والفعال . قال : الفعال العيار في المصنوعات وهي عام، والفعال في المكارم وهي خاص.  ٣٨٦ قال : وكان عندي ذات ليلة، فلما أراد الخروج هبت ريح شديدة، فقال : يا غلام، هات الهلة. فقلت : وما الهلة؟ قال : بيت السراج .  حدثنا أبو القاسم قال: سمعت أبا بكر محمد بن عبدالله بن محمد الحفيد قال: سمعت جدي العباس بن حمزة يقول: سمعت ذا النون المصري يقول: رأيت ولهان يطوف حول البيت ـ وكان ذاهب العقل ـ وهو يقول: شوقك قتلني، وحبُّك أَقْلَقَني، والاتصال بك أسقمني. فقدتُ قلباً يحب غيرك، وثكلتُ خواطر تُسَرُّ بسواك. ثم يطوف ويقول: ثم العرس ثم العرس.  ۳۸۸ وحكي لي عن أحمد بن إبراهيم الدورقي قال : كان ولهان مهيباً يهابه كل من رآه من سلطان وغيره . وكان يأمر بالمعروف وينهى عن المنكر، وكان يقول : يا أيها الناس تزودوا ليوم الدين، يوم تنشر فيه الدواوين وتنصب فيه الموازين وينتصف المظلومون من الظالمين، اعْمَلُوا وفي الأيام تراخ وفي النفس مُهْلَةٌ قبل أن تؤخذوا على غرة ثم لا يغني عنكم أحد من الله شيئا.  بصري. أخبرنا محمد بن الطيب قال : حدثنا حفص بن عمر قال: حدثنا علي بن عبد الحميد قال : حدثنا إبراهيم بن الجنيد عن إدريس بن عبدالرحمن قال : خرجت من الجامع بالبصرة راجعاً إلى منزلي إذا ببكار المجنون واقف في وسط السوق وهو يقول : واتقوا يوماً تُرْجَعون فيه إلى الله ثم تُوَفَّى كُلُّ نَفْسٍ مَا كَسَبَتْ وهم لا يُظْلَمون فلا يزال يقولها في مربعة مربعة . فلما أَفَلَتِ الشمس نادى : ﴿وَمَن يَتَّقِ الله يَجْعَل له مخرجاً . ويَرْزُقه من حيثُ لا يحتسب ومن يتوكل على الله فهو حَسْبُه ثم أنشأ يقول : وَلِهَتْ قلوب العارفين بحبه فتباشروا وتتابعوا الأعمـالا  ۳۹۰ حدثنا محمد قال: حدثنا حفص قال: حدثنا علي بن إبراهيم قال: حدثنا بكار بن علي قال: سمعت بكار المجنون يقول في جامع البصرة: يا أيها الناس استَحْيُوا من الله حق الحياء ولا تعبدوه رَهَباً من نيرانه، ولا طمعاً في جنانه، بل عبودية واستحقاقاً.  بصري . حدثنا أبو الهيثم جميل بن أحمد القهستاني قال : حدثنا إسحاق بن السري بن بهلول قال : حدثنا علي بن حلبس عن عبدالله بن محمد العتبي وحدثنا أبو موسى قال : حدثنا أبو عوانة قال : حدثنا أبو علي قال: حدثنا أحمد بن محمد الباهلي عن عبدالله بن محمد العتبي قال : كنتُ في بقية علة اعتللتها. فبينا أنا في صحن داري ذات يوم هجم علي نقرة المعتوه فقلت: إنا لله أنا منه بين لطمةٍ وضربة ! فوقف حذائي وأنشأ يقول : نظرتُ إلى الدنيا بعين مريضة وفكرة مغرور وتأميـل جــاهل
فقلتُ هي الدنيا التي ليس مثلها ونافست منها في غرور وباطل
وضيعت أياماً أمامي طويلة بلذات أيام قصار قلائل ثم ولّى . فوثبتُ إلى الدواة وكتبتُ الأبيات وأغلقت الباب خوفاً من عوده .  ۳۹۲ بصري. سمعت أبا الحسن محمد بن الحسين الحاكم الجرجاني ببوشنج يقول : سمعت إبراهيم بن فاتك يقول : خطر ببال سمنون ذات ليلة شيء من الصبر فقال : يا ربّ، ابلني بما شئت فإني صبور. قال فأسر فاشتد عليه الأسر، فجعل يطوف في أسواق البصرة ويقول : كذبت لا أعود، كذبت لا أعود، حتى أُطلق عنه.  ۳۹۳ سمعت أبا نصر منصور بن عبدالله الأصبهاني بهراة قال : سمعت أبا بكر القحطبي يقول : كنت في مجلس سمنون فوقف عليه رجل فسأله عن المحبة فقال : لا أعرف اليوم من أتكلم عليه بعلم هذه المسألة. فسقطت حمامة فجثمت على ركبته فقال : إن كان فهذا. ثم جعل يقول ويشير إلى الطائر : بلغ من أحوال القوم كذا كذا فشاهدوا كذا كذا وكانوا على كذا كذا . فلم يزل يتكلم عليه حتى سقط الطائر عن ركبته ميتاً ثم أنشأ يقول : لو صاح إنسان لشدّة حُبّه لملأت بين الخافقين صياحـا  سمعت أبا الحسن الحاكم قال : سمعت إبراهيم بن فاتك يقول: قلت لسمنون : كيف كنت البارحة؟ فقال: لا كنتُ إن كنتُ أدري كيف كنتُ
ولا كنتُ إن كنتُ أدري كيف لم أَكُنِ  وسمعت الحاكم قال : سمعت إبراهيم يقول: سمعت سمنون يقول كان رجل من العباد فوق سطح داره، فسقط من سطحه فوقع في جوف جُبّ، فرفع رأسه إلى السماء، وقال: يا سيدي حبك القاني في الجب!  قال ابن فاتك قلت لسمنون: أي منزل إذا قام به العبد قام مقام العباد؟ قال: إذا ترك التدبير.  سمعت الحاكم قال : إبراهيم بن فاتك يقول: سألت سمنون عن المحبة فقال : عن محبة الله إياك تسأل أو عن محبتك له؟ قلتُ : عن محبة الله لي . قال : لا تطيق الملائكة أن تسمع ذلك فكيف تطيق أنت؟! .  قال إبراهيم: وسألته عن القرب فقال: ارتفاع المسافة.  أنشدنا الحاكم قال : أنشدنا إبراهيم قال : أنشدنا سمنون : أُكْثِرُ الذِّكْرَ لا لأني أنساك ولكن بذاك يجري لساني
أنت في النفس والجوانج والفكر وأنت المنى وفوق الأماني
كلُّ شيءٍ أراه منك بعين صِرْتُ مستغنياً بها عن عياني
فإذا غبت عن عياني أبصر تُكَ مني بحيث كلُّ مكان  أنشدنا أبو نصر منصور بن عبدالله الأصبهاني قال: أنشدنا محمد بن علي الكتاني بمكة قال: أنشدنا سمنون: لا مت حتى أراك تشكو حب حبيب على جفائك
هذا دعائي عليك فاسمع وهات ما شئت من دعائك  ٤٠١ - سمعت الحاكم أبا الحسن قال : سمعت إبراهيم بن فاتك يقول : سمعت سمنون يقول : قلوب أهل الهوى سجون البلاء، فإذا أراد الله أن يعذب البلاء حبسه في قلوب أهل الهوى، فيضج إلى الله بالاستغاثة والخروج منها!  حدثني أبو عبد الله محمد بن صالح المعافري الأندلسي قال: حدثنا ليث بن السري الصوفي يقول : أُنهي إلى بعض الخلفاء خبر سمنون فأحب لقاءه في خلوة، فما زال يطلبه حتى ظفر به في الطواف . فقال له : يا سمنون، مع القربة خدمة؟ فقال : يا أمير المؤمنين، إن حياة قلوب الواصلين إليه في خدمته . فقال له : كيف وصلت إليه؟ قال : ما وصلت إليه حتى عملت ستة أشياء : أَمَتْ ما كان حيا وهو النفس، وأحييت ما كان ميتاً وهو القلب، وشاهدت ما كان غائباً وهو الآخرة، وغيبت ما كان شاهداً وهو الدنيا، وأبقيتُ ما كان فانياً وهو المراد، وأفنيتُ ما كان باقياً وهو الهوى، فاستوحشت مما تأنسون به وأَنِسْتُ بما تستوحشون ! . سمنون :  أخبرنا الحاكم قال: سمعت إبراهيم بن فاتك يقول: أنشدني روحي إليك بكلها قد أجمعت لو أن فيه هلاكها ما أفلعت
تبكي عليك بكلها في كلها حتى يقال: من البكاء تقطعت
انظر إليها نظرةً بمودةٍ فلربما متعتها فتمتعت  أنشدنا الحاكم قال: أنشدنا ابن فاتك قال: أنشدنا سمنون: لطائفُ بِرِّكَ ما تنقضي وطاعــات خـلقـك ليست تُضِي
تقاضوك بِرًا فَأَوْفَيْتَهُمْ ولم يقتضـوا لـك ما يقتضي
وما تُبصر العين يا سيدي سوی ما تُحبّ وما ترتضي  وأنشدنا الحاكم قال : أنشدنا إبراهيم قال : أنشدنا سمنون : صار قلبا
عجبتُ من قَلْبِ قَلْبِ قَلْبَتُه
فمن رأى قَلْبَ قَلْبٍ في القَلْبِ يزداد حُبّا  أنشدنا الحاكم قال : أنشدنا إبراهيم قال : أنشدنا سمنون : لقد وضح الطريق إليك حقاً فما أحد أرادك يستدل
فإن وَرَدَ الشتاء فأنت صيف وإن وَرَدَ المصيف فأنت ظِلُّ  سمعت أبا نصر منصور بن عبدالله يقول : سمعت أبا الحسن بن زرعان يقول : كنت عند سمنون وقد أصابته فترة فوقع به خاطر من الله ، فقلت له : كيف كنت؟ فقال : تستخبرني عني وأنت أَخْبَرُ بي مني، إن كنتُ أدري كيف كنتُ فلا كنت حين كنتُ .  ٤٠٨- سمعت أبا علي الزنجاني الصوفي يقول: سمعت أبا أحمد الخباز الصوفي يقول: سمعت سمنوناً يقول : بقيت مطروحاً على باب بني شيبة طاوياً سبعة أيام، فهتف بي هاتف في آخر ليلتي : من طلب من الدنيا فوق ما يُجزيه أعمى الله عيني قلبه .  أنشدني الحاكم قال : أنشدنا إبراهيم بن فاتك لسمنون : أُجِلُّك أن أسكو الهوى فيك إنني أجلك أن تُومي إليك الأصابع
وأَصْرِفُ طرفي نحو غيرك عامداً على أنه بالرغم نحوك راجع  سمعت الحاكم يقول: سمعت إبراهيم يقول: سمعت سمنوناً يقول: إني أذكر مجيء الناس إلي فأقول: اللهم هب لهم من العلم ما تشغلهم به عني.  ٤١١ سمعت الحاكم يقول : سمعت إبراهيم يقول : سُئل سمنون : أي الطعام أشهى ؟ قال : لقمة من ذكر الله في فم اليقين بتوحيد الله رفعتها من مائدة الرضى عن الله عند حسن الظن بكرامة الله ! .  سمعت أبا سعيد محمد بن جعفر الصوفي الهروي يقول: سمعت محمد بن علي القراطيسي يقول: سمعت سمنون يقول: مكاشفات الأعيان بالأبصار، ومكاشفات القلوب بالاتصال.  ٤١٣ أنشدني الحاكم قال: أنشدني إبراهيم بن فاتك لسمنون: حرام على قلب تحرّم بالهوى يكون لغير الحق فيه نصيب
تفرّدت فيه فانفردت بحبه فصار علي شاهد ورقيب  سمعت محمد بن علي بن محمد بن حاتم الرازي الصوفي يقول: سمعت أحمد بن علي الدمشقي يقول: سألت سمنون عن أول مقام يستحق به العبد أن يُقال له عارف، فقال: هو أن يكون واقفاً بعلمه على همةٍ تعرف كل هم يخطر على قلبه!  ٤١٥ سمعت محمد بن علي يقول : سمعت الدمشقي يقول: سألت سمنون: ما علامة من بقي له ربه؟ قال : من بقي لربه ! .  ٤١٦ أنشدنا الحاكم قال : أنشدنا ابن فاتك لسمنون : وكم أداوي لسقم لا شفاء له سقامَ سُقم، هو الشافي من السقم  ٤١٧ سمعت منصور بن عبدالله قال : سمعت أبا عمر الدمشقي يقول : سمعت سمنون يقول : إذا بسط الجليل غداً بساط المجد دخل ذنوب الأولين والآخرين في حواشيه، وإذا بدت ذرة من عين الجود ألحقت المسيء بالمحسن! .  أنشدني الحاكم قال : أنشدني ابن فاتك لسمنون : تبادر تني حتى إذا ما تبادرت معانيك في معناي أدهشتني عني
وعرفتني إياك حتى كأنني أرى كل ما ألقاه من دهش مني
فوا أسفي إن فاتني منك ذرة ووا أسفي إن حُلْتَ عن موضع الظَّنِّ  سمعت محمد بن أحمد بن الحارث المقرىء بمرو يقول : سمعت أبا بكر القحطبي يقول : سمعت سمنوناً يقول لرجل يعظه : اجعل قبرك خزانتك واحشها من كل عمل صالح، فإذا وَرَدْتَ على ربِّكَ سَرَّك ما ترى.  سمعت أبا ذر الترمذي يقول : سمعت أحمد بن علي الدمشقي يقول : سألت سمنون عن الصبر في ذاته فقال : حمل المؤن الله عزّ وجلّ حتى تنقضي أوقات المكروه .  وسمعت أبا ذر يقول: سمعت الدمشقي يقول: سمعت سمنون يقول: رأيت إبليس في المنام لا أشك أنه إبليس، فأخذت عصاي لأضربه فهتف بي هاتف: هو لا يهرب من عصاك إنما يهرب من نور القلب.  أنشدنا أبو ذر قال : أنشدنا الدمشقي السمنون : بين المحبين سر ليس يُفشيه قول ولا قلم للخلق يحكيه
سر يمازجه أنس يقابله نور تحير في جو من من التيه  ٤٢٣- سمعت أبا عبدالله محمد بن عبيد الله الشاشي يقول : سمعت عبيد بن بحر يقول : قال سمنون الصوفي : الحب شيء لطيف ليس يدركه عقل لإدراكه عز وتدير
لكنه في مجاري السر يعرفه أهل الإشارة عن لا كيف تقدير  ٤٢٤- سمعت أبا الحسن الحاكم يقول : سمعت ابن فاتك يقول : سألت سمنوناً عن قوله جل ذكره يمحو الله ما يشاء ويُثبِتُ قال : يمحو شواهد نفوسهم عنهم ويثبت شاهده فيهم.  سمعت أبا عبدالله محمد بن عبيد الله الشاشي يقول : سمعت عبيد بن بحر يقول: سألت سمنوناً عن معنى قول النبي صلى الله عليه وسلم روحوا القلوب بالذكر فقال : معناه روّحوا القلوب من هموم الدنيا بأذكار الآخرة.  ٤٢٦- سمعت محمد بن الحسين الحاكم يقول: سمعت إبراهيم بن فاتك يقول : سئل سمنون عن معنى قول النبي صلى الله عليه وسلم : «المؤمن يأكل في معى واحد والكافر يأكل في سبعة أمعاء. فقال : للعبد سبعة أمعاء : واحد منها طبع وستة حرص، فالمؤمن يأكل بمعي الطبع والكافر يأكل بأمعاء الحرص.  ٤٢٧ أنشدنا الحاكم قال : أنشدنا ابن فاتك قال : أنشدنا سمنون : لئن أمسيت في ثوبي عديم لقد بليا على حرٍ كريم
فلا يحزنك إن أبصرت حالاً مغيرة عن الحال القديم
فلي نفس ستذهب أو سترقى لعمرك بي إلى أمر جسيم  سمعت منصور بن عبد الله يقول : سمعت أبا بكر القحطبي يقول : سمعت سمنون يقول : رؤية التواب حجاب عن الحجاب، ورؤية الحجاب حجاب عن الإعجاب.  ٤٢٩- سمعت أبا ذر الترمذي يقول : سمعت أحمد بن علي الدمشقي يقول : سمعت سمنون يقول : رأيت راهباً في صومعته فقلت : مذكم أنت في صومعتك؟ قال : مذ ثلاثون سنة . قلت : فما أفادك الله في طول خلوتك؟ قال : يا ويحك ! هل رأيت وزيراً يُخرج سر أميره؟  سمعت أبا عبدالله الوليد بن أحمد الهمذاني يقول : سئل سمنون عن المحبة فقال : ما خلق الله شيئاً إلا والمحبة ألطف منه ، فكيف أعبر عما لا عبارة له؟ .  سمعت عمرو بن محمد بن سعيد الكرجي قال : سمعت أبا عمر محمد بن عبدالواحد اللغوي غلام ثعلب يقول : أنشدني سمنون المجنون : يا مَن فؤادي عليه موقوف وكلُّ هـمـي إلـيـه مـصـروف
يا حسرتي حسرةً أموتُ بها إن لم يكن لي لديك معروف  سمعت أبا القاسم النصراباذي يقول: حكي لي عن سمنون أنه قال: أول وصال العبد للحق هجرانه لنفسه وأول هجران العبد للحق مواصلته لنفسه.  أنشدني أبو الطيب طاهر بن أحمد المرزبان الصوفي بمرو الروذ لسمنون : قد بان بَيْنِي بِبَيْنِي فَبِنْتُ عن بَيْن بَيْنِي
وتُهتُ في كل قفرٍ وَجْداً بقُرّة عيني  أنشدني الوليد بن أحمد الهمذاني قال : أنشدني أبو عمر الزاهد قال : أنشدني سمنون : أهل المحبة ما نالوا الذي وجدوا
حتى بسيدهم في الخلوة انفردوا
تراهم الدهر ما يمضون من بلد
إلا ويبكي عليهم ذلك البلد  ٤٣٥ أنشدنا أبو نصر منصور بن عبدالله الأصبهاني قال : أنشدنا أبو بكر بن طاهر لسمنون : ألستَ لي عوضاً مني كفى شرفاً فما وراءك لي حظ ومطلوب
رأيتُ أسباب راحاتي بها عَطَني عَزَّ العزاء فصبري فيك مغلوب
لو أن أيوب لاقى بعض ضُرِكَ بي لضج من بعض ما ألقاه أيوب  أنشدنا الحاكم قال: أنشدنا ابن فاتك قال: أنشدنا سمنون: أفسدتني بهواك بل أصلَحْتَني لم أرض بعدك كائناً من كانــا
من ودني قد كان وُدُّك فوقه فتركتني أتسخط الإخـوانــا  ٤٣٧ قال : وكان سمنون يدخل كل يوم السجن والمقابر ودار المرضى ويقول لنفسه : لو كنت في السجن ماذا كنت تصنع وكذلك في المقابر ودار المرضى ؟ .  حمصي. سمعت أبا عبدالله محمد بن عبيد الله الجرجاني يقول: سمعت عمر بن محمد بن حمزة يقول: سمعت سعيد بن عثمان يقول: سمعت ذا النون يقول: أردت الخروج إلى بيت الله الحرام، فإذا بفتى في الطريق قد افترش التراب وتوسده وهو يئن أنيناً شديداً. فقلت لرفيقي: مُرَّ بنا نَعُد هذا العليل. قال: ما هذا عليل، هذا عبيد المجنون. فَعَدَلْنا إليه فإذا عليه جبة صوف خَلَق قد أدخل رأسه فيها وهو يبكي ويقول: يا طبيب السقام داو اعتلالي فعليل الفؤاد ليس يعاد
حلف السقم لا يزايل قلبي أو يزور الفؤاد مني اللحاد ثم قال: عجبتُ ممن خلقه الله بشراً سوياً وجعل له عقلاً سنياً وبصراً مضياً كيف تهدأ جوارحه وكيف لا تنوح عليه نوائحه ثم بكى وقال: قطعوا الليالي في الظلام فأعقبوا يوم المعاد تحية وسلاما  أخبرنا أبو القاسم عبدالعزيز بن محمد بن النضر الفهري قال : أخبرني مدرك بن عمرو الحراني عن أبيه عمرو بن مدرك قال : كان بحران مجنون يقال له لغدان، فمر يوماً بقوم من تيم اللات بن ثعلبة فعبثوا به وعذبوه فقال : يا بني به تيم اللات، ما أعلم في الدنيا قوماً خيراً منكم . قالوا : وكيف ذاك يا لغدان؟ قال: بنو أسد ليس فيهم مجنون غيري ، وقد قيدوني وسلسلوني ، وكلكم مجانين ليس فيكم مقيد ! صباح  ٤٤٠ - مكي. أخبرنا عبد العزيز بن محمد قال: أخبرني محمد بن المغيرة بمكة قال : وقف صباح الموسوس على قوم فسألهم شيئاً فَرَدُّوه فولى وهو يقول : أسأت إذ أحسنت ظنّي بكم
والحزم سوء الظن بالناس  ٤٤١ أخبرني عبد العزيز قال : أخبرني محمد بن المغيرة بمكة قال : مر صباح بقوم قُعود - وكان محتالاً للمعيشة - فظن بهم خيراً فأتاهم يسألهم شيئاً، وكانوا سبعة، فسألهم فحرموه، فقال لأحدهم: ما اسمك؟ قال: غليظ. وقال للثاني : ما اسمك؟ قال : خشن. قال للثالث وأنت؟ قال : وعر. وقال للرابع : وأنت؟ قال : شدّاد. وقال للخامس : وأنت؟ قال : ردّاد. وقال للسادس : وأنت؟ قال : ظالم . وقال للسابع : وأنت؟ قال : لاطم . فقال : أين مالك؟ قالوا : ومن مالك يا مجنون؟ قال : ألستم خَزنة النار السداد الغِلاظ؟  سمعت أبا الحسن علي بن عبد الرحيم القتاد يقول : مر موسى بن الزرقاء، فناداه صباح الموسوس : يا موسى أَسْمَنْتَ بِرْدَوْنَكَ وأَعْجَفْتَ دِينَكَ! أما والله إن أمامك عقبة لا يجوز بها إلا المُخِفُّ . فاحتبس موسى، فقيل: هذا صباح الموسوس! فقال : ما هو بموسوس .  ٤٤٣ - ثغري . سمعت أبا بكر محمد بن أحمد بن زياد بن عبد الخالق الأزدي الخطيب بكرمانية قال : سمعت أبا عبد الله محمد بن الضوء يقول: سمعت أبا عثمان الواسطي يقول : خرجنا غزاة في الصائفة، فرأيت في بعض الثغور مجنوناً يقال له شقران، وقد ازدحم عليه الناس وهو يقول : يا أيها الناس الدنيا دار خراب، وأَخْرَبُ منها قلب مَن يَعْمُرها، والآخرة دار عمران، وأَعْمَر منها قلب من يطلبها.  ٤٤٤ قال الواسطي : وسمعته يقول مرة أخرى: الدنيا دار زوال وانتقال واضمحلال، والآخرة دار جلال وجمال وكمال.  قال : وسألته : من الحكيم ؟ قال : من لا يتعرض للعذاب الأليم. قلت : وما العذاب الأليم؟ قال: البعد عن الكريم. عتاهية المجنون  ٤٤٦ - واسطي . أخبرنا أبو الفضل أحمد بن محمد بن حمدون الفقيه بشرمقان نيسا يقول: سمعت أبا بكر أحمد بن محمد بن إبراهيم الجواربي بواسط يقول: سمعت أبي يقول : كان عندنا مجنون يقال له عتاهية يجن ستة أشهر ويفيق ستة أشهر، فيكون في إفاقته ساكناً ساكتاً، وإذا هاج أكثر الكلام وصعد السطح بالليالي ويقول : إلى الصباح يا نيام، تنبهوا عن رقدة الغفلة قبل انقطاع المهلة، واعملوا في إعداد العدّة قبل انقراض المدة. واعلموا أن أجالكم منقوضة وأعمالكم محفوظة، والموت يأتي بغتة . بگار  أخبرنا منصور بن عبدالله الأصبهاني بهراة قال : حدثنا الحسين بن كرامة قال : سمعت أبا يعقوب السوسي يقول : رأيت ببلد مجنوناً يقال له بكار، عريان على سوأته خرقة، وبيده قصبة على رأسها كالعلم، وهو يعدو ويقول : كفى حَزَناً أنّي مقيم ببلدةٍ
أَخِلايَ عنها نازحون بعيد
أُقلّب طرفي في البلاد فلا أرى
وجوه أحِبَّايَ الذين أريد قال : فقلت له : من أحباؤك ؟ قال : فأخذ بيدي وأدخلني المقابر وأشار إلى القبور وقال : هؤلاء . شیبان  سمعت أبا بكر أحمد بن عبدالرحمن المروزي يقول: سمعت يعقوب بن نصر النسوي يقول: سمعت سالماً خادم ذي النون المصري يقول: بينا أنا أسير مع ذي النون في جبل لبنان إذ قال لي: مكانك يا سالم لا تبرح حتى أعود إليك. فغاب عني ثلاثة أيام وأنا أتقمش من نبات الأرض وبقولها، وأشرب من غدران الماء. ثم عاد بعد ثلاث متغير اللون حائراً. فلما رآني ثابت إليه نفسه فقلت له: أين كنت؟ قال: إني دخلتُ كهفاً من كهوف الجبل، فرأيت رجلاً أغبر أشعث نحيفاً نحيلاً كأنما أخرج من حفرته وهو يصلي. فما قضى صلاته سلمت عليه فرد علي وقام إلى الصلاة، فما زال يركع ويسجد حتى قَرُبَ العصر، فصلى العصر واستند إلى حجر بحذاء المحراب يسبح فقلت: يرحمك الله توصيني بشيء أو تدعولي بدعوة؟ فقال: يا بني آنسك الله بقربه، وسكت. فقلت: زدني. فقال: يا بني من انسه الله بقربه أعطاه أربع خصال: عزا من غير عشيرة، وعلماً من غير طلب، وغناء من غير مال، وأنساً من غير جماعة. ثم شهق شهقة فلم يُفق إلى الغد، حتى توهمت أنه ميت. ثم أفاق فقام وتوضأ ثم قال: يا بني كم فاتني من الصلوات؟ فقلت: ثلاث فقضاها ثم قال: إن ذكر الحبيب هيج شوقي وأزال عقلي. قلت: إني راجع فزدني. قال: حب مولاك ولا ترد بحبه بديلاً، فإن المحبين لله هم تيجان العباد وزين البلاد. ثم صرخ صرخة فحركته فإذا هو ميت. فما كان إلا بعد هنيهة إذا بجماعة من العباد منحدرين من الجبل فصلوا عليه وواروه. فقلت: ما اسم هذا الشيخ؟ قالوا: شيبان المجنون. قال سالم: فسألت أهل الشام عنه فقالوا: كان مجنوناً هرب من أذى الصبيان. قلت: فهل تعرفون من كلامه شيئاً؟ قالوا: نعم، كان إذا خرج إلى الصحاري يقول: فإذا ما لم أُجَنِّ بإلهي
فبمن أجن
وربما قال:
فإذا ما لم أُجَنِّ بك
فيمن ربي  ٤٤٩ يماني . أخبرنا أبو عبد الله محمد بن عبد الله بن محمد بن شبيب قال : أخبرنا أبو بكر أحمد بن لقمان قال : حدثنا محمد بن إسحاق قال : قال الأصمعي : قيل لغفار الموسوس : لم لا تتعالج لما بك؟ فقال : قَصر الرشاء وطالت البئر، فأين الملتقى ؟ .  سمعت أبا أحمد محمد بن يحيى البغوي بها يقول: سمعت عمي يقول: سمعت محمد بن قطن يقول: سمعت ذا النون المصري يقول: مررت ذات يوم بلقيط في أزقة مصر وإذا هو يخط على الأرض بإصبعه، فتأملت فإذا هو: قل حياء الناس من ربهم فكلُّهُمْ يُظهر تقواه

ليس يبالي المرء في دينه
ما نال في عاجل دنياه
يخاف أن يَمْقُتَه أهله
ولا يبالي مَقْتَ مولاه
وعامل الله یری بره
في كل ما سر وما ساه
هِمَّتُه في كل أسبابه
رضوان ذي العزة مولاه  ميمون واسطي . قال المسيب بن شريك: بلغني أن ميموناً المجنون أدخل على الحجاج بن يوسف وكان رجلاً بليغاً عابداً . فقال له الحجاج : تحسن مثل هذا الكلام وتسمى مجنوناً؟ قال: يا حجاج، إن أهل البطالة إذا نظروا إلى أهل محبة الله سموهم مجانين، وقد سبق القول منهم لو رأيتموهم لقلتم مجانين ولو رأوكم لقالوا لا يؤمنون بيوم الحساب، وأنت يا حجاج لو كنت تؤمن بالله واليوم الآخر بكلية قلبك لَشَغَلَكَ عن أكل الطيب ولبس اللين، ولكنه استقذرك فطردك ولو أرادك لاستعملك . إن الله عباداً مطهرين مطيعين، بالعبادة مشتغلين، وهم ثلاثة أصناف: فقوم عبدوه شوقاً إليه، فقلوبهم لا تشتغل بغيره، لأن جوراحهم قد ألفته . سقاهم بكأس الوداد شربةً فقاموا شوقاً إليه، فلا تحط رحالهم إلا في قرب الله ، فهم خاصته في أرضه. وقوم عبدوه خوفاً من النار لما سمعوا قوله تعالى : ﴿ قُوا أَنْفُسَكُم وأَهْلِيكُم ناراً ﴾ فَحَذِروا وبادروا واجتهدوا خوفاً من نار من تحتهم ونار من فوقهم وعن أيمانهم وعن شمائلهم، والأفاعي تلسعهم والعقارب تلدغهم. فكلما استغاثوا جدّد لهم العذاب، وهو عدل من الرحمن. وقوم عبدوه طمعا في الجنة ودار أوليائه ومحل أصفيائه لما سمعوا قوله : سلام عليكم بما صَبَرْتُم فَنِعْمَ عُقْبَى الدَّار فصبروا على الألم حتى استوجبوا الرضى والعفو عما مضى ، فقلوبهم تحن إلى جوار الله ليسكنهم قصوراً من ذهب وفضة، وخياماً مزيّنةً ومجالس منجدة . فالحور أزواجهم والطير تُظلُّهم والملائكة تخدمهم . فقال الحجاج : يا ميمون، وصفت الجنة ولم تصف أزواجها، فهل لك أن أُريك شيئاً يتحير فيه عقلك ويتلجلج لسانك؟ ثم نادى الحجاج : يا أنيس . فخرجت جارية معتدلة القامة في حسن تام ، عليها قباء رقيق، وهي تمشي وتخطر، لها ذوائب قد جلتْ أكتافها. فلما نظر إليها ميمون قال : ويحك يا حجاج ! وما تصنع بهذه الجارية ولها أَجَلٌ مسمّى وأيام محصاة؟ ثم أخرج من كمه رغيفاً يابساً فقال : يا حجاج، انظر إلى هذا الرغيف ويبوسته، إن أطعمته جائعاً ملهوفاً رجوت الله أن يزوجني جارية كأن الشمس تطلع من بين عينيها، وكأن الغنج يجري في حركاتها، تُحدّثني فأطرب وتكلمني فأنعم . وأرجو أن أكون قد استوجبتها في هذا الوقت لقولي الحق وتركي الهوادة . قال الحجاج : يا ميمون امدحني أُحْسِنُ جائزتك ! قال : يا حجاج، والله ما أعرف فيك خيراً فأقوله، ولئن قلتُ ما أعرف فيك لذممتك ولكني ما أَدم الناس لأن في نفسي ما شغلني عن عيب غيري. قال الحجاج : قد أمرت لك بأربعة آلاف درهم. قال: أما المال فرده إلى الموضع الذي سَرَقْتَ منه، ولا تكن لصاً جواداً تجود على من إنْ ذمك لا يضرك، وإن مدحك لا ينفعك . فَخَل سبيلي، وَنَيْلُ الله ينوب عن نوالك ونوال أضرابك . قال: فخلى سبيله .  سمعت أبا عرابة يحيى بن المتمم الدوسي يقول: كان بدير عاقول مجنون يقال له طبرونة فأخذه الشرط وهو يبول على باب مسجد فجعلوا يضربونه فقال: أرأيتم لو بال ها هنا حمار أكنتم ضاربيه؟ قالوا: لا. قال: فلا عقل لي فهبوني حماراً فتركوه. غَوْدَك  أخبرنا أبو علي الحسن بن أحمد الصوفي القزويني باسفراين قال : حدثنا شاذك بن جعفر بن شاذك قال: حدثنا يحيى بن سليمان المادراني قال : حدثنا إسحاق بن إبراهيم الأبلي قال : رأيت غورك يوماً خارجاً من الحمام والصبيان يؤذونه . فقلت : ما خبرك أبا محمد ؟ قال : قد آذاني هؤلاء الصبيان، أما يكفيني ما أنا فيه من العشق والجنون؟ قلت : ما أظنك مجنوناً. قال: بلى والله وبي عشق شديد. قلت : هل قلت في حبك وجنونك شيئاً؟ قال: نعم، وأنشد : جنون وعشق ذا يروح وذا يغدو فهذا له حَدُّ وهذا له حد
هما استوطنا جسمي وقلبي كليهما فلم يبق لي قلب صحيح ولا جِلْدُ
وقد سكنا تحت الحشى وتحالفا على مهجة أن لا يُفارقها الجَهْدُ
وأي طبيب يستطيع بحيلة يعالج من داءين ما منهما بد؟  ٤٥٤ أخبرنا أبو علي قال : حدثنا شاذك قال : حدثنا يحيى بن سليمان قال : سمعت محمد بن الزراد يقول : قلت لغورك يوماً ما خبرك؟ قال: جنون وعشق قد بليت بهما، والذي بليت به من هؤلاء الصبيان أشد. ثم قال: جنون ليس يضبطه الحديد وحب لا يزول ولا يَبيدُ
فجسمي بين ذاك وذا نحيل وقلبي بـيـن ذاك وذا عـمـيـد  وبهذا قال محمد بن زراد: ورأيته ذات يوم وقد أخذ بيد المتهم به، فقال له المحبوب رجاء الخلاص من يده: كيف أصبحت فقال: أصبحتُ منك على شفا جُرُفِ متعرّضاً لموارد التلف
وأراك نحوي غير ملتفت متحرّفاً عن غير منحرف
يا من أطال بهجره أسفي أسفي عليك أشد من تلفي  ٤٥٦ - وبهذا قال محمد : وقلت له يوماً : متى حدث بك هذا العشق قال : مذ زمان، إلا أني كنت أكتمه فلما غلب علي بُحْتُ به . قلت: أنشدني من أحسن ما قلت في ذلك . فقال : كتمتُ جنوني وهو في القلب كامن فلما استوى والحبُّ أعلنه الحب
وَخُلّي والجسم الصحيح يذيبه فلما أذاب الجسم ذل له القلب
فجسمي نحيل للجنون وللهـوى فهذا له نهب وهذا له نهب  سمعت أبا الحسن علي بن أحمد القهندري بهراة يقول : سمعت سلمة بن بشر الفراء يقول : سمعت جعفر بن إسماعيل يقول : أتي غورك يوماً بطبيب يعالجه، فقال له الطبيب لو تركتني لفعلت بك وصنعت، يعني العلاج. فأنشأ غورك يقول : اعلم وأيقن أيها المتكلم
ما بي أجل من الجنون وأعظم
أنا عاشق فإن استطعت لعاشق برءاً مننت به وأنت محكم
حسبي عذابي في الهوى حسبي به إذ من أهيم به يصد ويصدم
هيهات! أنت بغير دائي عالم وسواك بالداء الذي بي أعلم  حدثنا أبو عمران موسى بن عبدالرحمن السندي قال: حدثني محمد بن عبد العزيز الأسدي ببغداد قال: حدثنا أحمد بن محمد اليزيدي قال: مررنا بغورك يوماً والنساء والصبيان حوله يبكون رحمة له، فأومأ إلينا فقربنا منه، فقال: اسمعوا، وأنشأ يقول: هلموا إلى جسم برى الشوقُ عَظْمَهُ وأوهن بعد العز والجـاه صــاحبـة
هلموا انظروا ما أورث الحبُّ أهله أُحَذِّرُكُمُ سِرَّ الهوى وعواقبه
وأغرى بنفسي الشوق والهم والأسى وأرقني بالليل أرعى كواكبه  أخبرنا أبو جعفر محمد بن صالح الأوبري قال : حدثنا علي بن بدر الرملي بالرافقة قال : حدثنا محمد بن المبارك الصوري قال: صعدت جبل لبنان فإذا برجل عليه جبة من صوف مكتوب عليها : لا تباع ولا تُوهَب، قد ائتزر بمئزر الخشوع، وارتدى برداء الورع، وتعمم بعمامة التوكل، فلما رآني استخفى وراء شجرة بلوط، فناشدته الله أن يظهر فظهر، فقلت: كيف تصبر على الوحدة في هذه القفار فضحك وأنشأ يقول: يا حبيب القلوب من لي سواكا ارحم اليوم مذنباً قد أتاكا
أنت سولي ومنيتي وسروري قد أبي القلب أن يحب سواكا
يا مُرادي وسيدي واعتمادي طال شوقي متى يكون لقاكا
ليس سولي من الجنان نعيماً
غير أني أريدها لأراكا ثم غاب فطلبته وعدتُ إلى الموضع مراراً فلم أصادفه . ثم لقيت غلام أبي سليمان الداراني فوصفته له فقال : واشوقاه إلى نظرة أخرى قبل الموت وبكى. فسألت عنه فقال : ذاك عباس المجنون له أكلتان في كل شهر من ثمر الشجر ونبات الأرض .  ٤٦٠ - بغدادي . حدثنا أبو بكر أحمد بن عبدالرحمن المروزي قال : حدثنا أبو بكر بن الأنباري قال : حدثنا أبي قال : عزم محمد بن عبيدالله بن طاهر يوماً على الصبوح وعنده الحسن بن محمد بن طالوت . فقال له محمد : نحتاج اليوم إلى ثالث نأنس به فمن ترى أن يكون ؟ فقال : أعز الله الأمير ! قد خطر ببالي رجل ليس علينا في منادمته مؤنة، قد خلا من إبرام المؤانسين، وبرىء من ثقل المجالسين، خفيف الوطأة إذا أحببت سريع الوثبة إذا أمرت . قال : من هو ؟ قال : ماني الموسوس. قال : ما عدوت ما في نفسي ! . فتقدم إلى صاحب الشرطة في إحضاره . فما كان بأسرع من أن قبض عليه بباب الكرخ، فأتي به فأدخل الحمام وألبس ثياباً ثم أُدخل عليه فقال : السلام عليك أيها الأمير ورحمة الله وبركاته . فقال : وعليك السلام يا ماني، قد آن أن تزورنا على شوقنا إليك . قال : أصلح الله الأمير الشوق شديد والود عتيد والحجاب صعب والبواب فظ !. ولوسهل لنا الإذن لسهلت علينا الزيارة. فقال محمد للحسن : ما أحسن ما تلطف في تسهيل الإذن . فأمره بالجلوس فجلس ودعا محمد ببنوسة جارية محمد المهدي وكان يحب سماعها، فكان أول ما غنت به : ولستُ بناس إذ غَدَوا فتحملوا دموعي على الخدين من شدّة الوَجْدِ
وقولي وقد زالت بعيني حمولهم بواكِرَ تُحدى : لا يكن آخر العهد ! فقال ماني : أتأذن لي يا سيدي . قال : في أي شيء يا ماني؟ قال: في استحسان ما أسمع . قال : قد أَذِنْتُ لك، فقل ما أحببت . قال: أحسنت، فبحق الأمير إلا زدت هذين البيتين : وكيف أناجي الفكر والدمع حائر بمقلة موقوف على الضر والجهد
ولم يُعدني هذا الأمير بعزّه على ظالم قد لج في الهجر والصد فقال له محمد أحسنت والله ، أفعاشق أنت؟ فاستحيا، فقال: لا يا سيدي، ولكن حرّك الطرب شوقاً كامناً فظهر، وهل بعد المشيب من صبوة؟! ثم غنت بنوسة بشعر أبي العتاهية : حجبوها عن الرياح لأني قلتُ للريح بلغيها السلاما
لو رَضُوا بالحجاب هان ولكن منعوها يوم الرياح الكلاما فقال ماني : ما على قائل هذا الشعر لو زاد فيه : فتنفستُ ثم قلتُ لطيفي آهِ إِن زُرْتَ طَيْفَها إلماما
حَيّها بالسلام سراً وإلا منعوها لشقوتي أن تناما فقال محمد : أحسنت يا ماني . ثم غنت بشعر أبي نواس : يا خليلي ساعةً لا تريما وعلى ذي صبابة فأقيما
ما مَرَرْنا بقصر زينب إلا فضح الدمع سري المكتوما فقال ماني : والله لولا رهبة الأمير الأصفتُ إلى هذين بيتين لا يردان على سمع ذي لب فيصدر إلا عن استحسان منه لهما . فقال محمد الرغبة في حُسن ما تأتي به يا ماني حائلة بينك وبين كل رهبة، فقل ما بدا ذلك . فقال : ظبية كالهلال لو تَلْحَظُ الصخ
وإذا ما تبسّمَتْ خِلْتَ ما يب فقال محمد : أحسنت فأجز هذين البيتين : ر بطرف لغـادرته هشيما
دو من الثغر لؤلؤاً منظوما لم تَطِبِ اللَّذاتُ إلا بما دارت به ألفاظ بنوسة
غنَّتْ غناء مظهراً عبرةً كانت بحبس الصبر محبوسه فقال ماني : وكيف صَبْرُ النفس عن غادةٍ تَظْلِمُها إن قلت طاووسه
وجُرْتَ إن شبَّهْتَها بانةً في جنة الفردوس مـغـروسـه
وغيرُ عدل إن عَدَلْنا بها لؤلؤةً في البحـر مـغــمــوســه فقال له محمد : اعدل في الوصف. فقال ماني : جَلَّتْ عن النعت فما فكرةً تُدركها بالنعت محسوسه فقالت بنوسة : وجب شكرك يا ماني، وعطف عليك الفك وقارنك سرورك وفارقك محذورك، والله يديم لنا ولك بقاء من ببقائه اجتمع شملنا وطاب يومنا . ثم قال ماني : مُدمن الإغضاء موصول ومديمُ العَتْب مملولُ
ليس لي خلّ فيقطعني فارقت نفسي الأباطيل
أنا مغبوطٌ بِزَوْرة من
رَبِّعُه بالجود مأهول ثم أومأ إليه الحسن أن قم، فنهض وهو يقول : طاهري في مُرتَّبِهِ عُرْفُه في النّاس مبذول
دَمُ مَن يَشقى بصارمه مَعْ هبوط الريح مَطلولُ فلما خرج قال محمد للحسن : ليست خساسة المرء ولا اتضاع حاله ولا نبو العين عن ناظره بمذهبة جوهر الأدب المركب فيه . وما أخطأ صالح بن عبدالقدوس حيث يقول : لا يُعجبنك مَن يصونُ ثيابه حَذَرَ الغُبار وعِرْضُه مبذول
ولربما افتقر الفتى فرأيته دَنِسَ الثياب وعِرْضُه مغسول  أنشدني أبو عبد الله محمد بن الحسين الوضاحي الماني: لما رأيتُ البدر في أفق السماء قد استقلا
ورأيت قرن الشمس في أفق الغروب وقد تدلّى
شبّهتُ ذاك وهذه وأرى شبيههما أجلا
وجه الحبيب إذا بدا وقفا الحبيب إذا تولّى  ٤٦٢ أنشدني عبدالعزيز بن محمد بن النضر الفهري لماني: زعموا أن من تشاغل باللذات عمن يحبه يتسلى
كذبوا والذي تُساق له البدن ومن عاذ بالطواف وصلّى
إن نار الهوى أحر من الجمر على قلب عاشق يتقلى  أنشدنا أبو عرابة يحيى بن المتمم الدوسي له : شادن وجهه من البدر أوضا
بعضه في الجمال يعشق بعضا
بأبي من تَزَرْفَنَ الصُّدعُ بالعُنبر في خده المُوَرَّد عَرْضا
أين للورد منك ورد بخدَّيْكَ إذا ما قَطَفْتَه صار غضا
ليس يعطيك ذاك منه سوى الشم وهذا يعطيك شما وعَضًا  وله : يا نسيم الريح في السَّحَر وشبيه الشمس والقمر

إِنَّ مَن أَسْهَرْتَ ليلته لَقَريرُ العين بالسهر  وله : أنا من مَيْلِكَ في مَشْيِكَ مرعوب مُخرَّفٌ

بالذي أَنْبَتَ في حدَّيْكَ ورداً ليس يُقْطَفْ

لا تميلنَّ فإنّي خائف أن تتقصف  وله : ولقد قلتُ حين قَبَّلْتُ منه مَبْسِماً عَلَّني فُوَيْه اللثام

رَبِّ إن كان ذا حراماً فإني أشتهي أن تَخُصَّنِي بحرام  سمعت علي بن عبدالملك بن دهثم القاضي يقول: كان بطرسوس مجنون يقال له رزام، وكان مدهوشاً يهذي ويُسمع ويؤذي. فإذا خرج العسكر إلى أرض الروم خرج بخروجهم وحمل درقة وسيفاً، فكلما لقي العدو أفاق كأن لم يكن به جنون، وكان من أخشن الناس عليهم، وربما قتل في اليوم جملة من العدو، فإذا عاد إلى أرض الإسلام عاد إلى جنونه.  مجانين الأعراب جساس - ٤٦٨ بدوي. أخبرنا أبو علي الحسن بن عمران الحنظلي بهراة قال: أخبرنا سليمان بن العباس بن علي الهاشمي ببغداد قال: أخبرنا أبو نصر ابن أخي الأصمعي قال: سمعت عمي يقول: دخلت بعض أحياء العرب فرأيت شيخاً موسوساً يهذي وقد اجتمع عليه الناس، فقلت: من هذا؟ قالوا: جساس الموسوس لا يزال نائماً ليله ونهاره، وربما انتبه فزعاً مذعوراً فيُجلب ساعة ويصيح ثم يهيم على وجهه ثم يعود إلى نومه. فيت ليلة هناك وهو على الحال التي وصفت لي، فلما أصبح انتبه فقلت: ما اسمك يا شيخ؟ أنت أَنْوَمُ من فهد، ما لك تنام دهرك؟ فقال: النوم لا تبعة علي فيه، وفي مجالستك وأضرابك تبعات. قلت: وأي تَبِعَةٍ عليك في مجالستي؟ قال: أشتغل بك عمن أنشأني. ثم أنشأ يقول: لقد أُغْنِيتَ عن هذا السؤال وعما أنت فيه من المقال
فإن كنت الغداة تريد قولاً فما فيه رضى مولى الموالي ثم عدا هائماً على وجهه في تلك الرمال وهو يقول: ما أكثر فضول أهل الحضر.  أخبرنا أبو حاتم محمد بن حبان البستي قال: حدثنا محمد بن إبراهيم الخالدي قال: حدثنا الحسن بن محمد الأزدي قال: حدثنا محمد بن أبي السري عن المدائني قال: كان عندي بمكة مجنون يقال له أرفى، بدوي، وكان يصلي الليل كله، فإذا أحس بالصبح رمى بطرفه نحو السماء وأنشأ يقول: رب مكحول بملمول الأرق قلبه وقف بنيران الحرق
فِكْرُه في الله في أوقاته وبة يفتح فاه إن نطق
سيدي طال اشتيافي فمتى يَأْنِ للعاشق يلقى من عشق  أخبرنا أبو العباس الفضل بن سهل بن نفيس السجزي بهراة قال : حدثنا علي بن محمد بن أيوب المروزي أن محمد بن عبدالله بن إسحاق بن شمر الضبي حدثه قال : سمعت الأصمعي يقول : بينا أنا قاعد عند محمد بن سليمان الهاشمي والي البصرة دخل عليه رجل فقال : أصلح الله الأمير إن بالمربد أعرابياً مجنوناً من بني سعد لا يتكلم إلا بشعر . فقال : علي به . فأتاه فقال : أجب الأمير. فأبى عليه فأجبره وساقه وناقته سوقاً عنيفاً حتى أدخله فلما نظر الأعرابي إلى محمد أنشأ يقول : حياك ربُّ الناس من أمير
يا فاضل الدين عظيم الخير فقال الأمير : وأنت فحياك الله يا أخا سعد. فقال الأعرابي : إني أتاني الفاسقُ الجِلْوازُ
والقلب قد طار به اهتزاز فقال الأمير: إنا بعثنا إليك لنشتري ناقتك . فقال الأعرابي : ما قال شيئاً في شراء النــاقــة
وقد أتى بجهله حماقه فقال الأمير وما الذي قال؟ فقال : شَقَّ سِرْ بالي وشَقَّ بُرْدي
وكان زيني في الملا ومجدي فقال الأمير: إذا نخلع عليك ونُعْمَةُ عَين . فقال الأعرابي : نعمك الله وأرخى بالـكـا
وأكثر الله لنا أمثالكا فقال الأمير: أتبيع ناقتك هذه؟ فقال: نعم أبيع بعد أن لا أُوْكَسُ
والبيع في بعض الزمان أكيس فقال الأمير: فبكم اشتريتها؟ فقال : شراؤها عشر ببطن مگه
من الدنانير القيام السكه فقال الأمير: أتبيع بما اشتريت؟ فقال: ولن أبيع الدهر أو أُزاد
إني لربح في الشرا معتاد فقال الأمير: فبكم أخُذُها ؟ فقال : خُذْهـا بعشـر وبـخمس وازنــه
فإنها ناقة صدق مارنه فقال الأمير : بل تحط وتُحسن . فقال : سبحان ربي ذي الجلال العالي
تسأل إحـسـانـي وأنـت الـوالـي فقال الأمير: فإني أسألك أن تحط . فقال : والله ما يجبرني ما تُعطي
ولا يزيد الفقر مني حطي قال : فأمر بقبض الناقة منه وتوفير ثمنها ، ثم ردّها وأمر له بألف دينار وثياب من خاصة ملبسه . فقال الأعرابي : إنِّي رَمَتْ بي نحوك الفجاج
أبو ثمان معدم محتاج
طاوي الحصير ضيّق المعيش
فأنبت الله لديك ريـشـي
شرَّفتني منك بألف حاضره
شرَّفك الله بها في الآخـره
وكسوة طاهرةٍ حِسان
كساك ربي حلل الجنان قال : فضحك الأمير وقال : من يزعم أن هذا مجنون؟ وددت أني كنتُ مثله ! . آخر  ٤٧١ أخبرنا أبو القاسم منصور بن العباس ببوشنج قال: حدثنا محمد بن عبد الرحمن الشامي الهروي قال : حدثنا العباس بن علي الهاشمي قال : كنت والى مكة فجلست ذات يوم في المسجد وعندي جماعة كلهم لي مُعظم، فإذا بأعرابي مجنون طرأ علينا فقال : أيكم الأمير فأشاروا إلي فقال : يا من ترفّع بالإمارة طاغياً خَفّض عـلـيـك فللأمور زوال
فلئن أفادك ذا الزمانُ بصَرْفِهِ لَبِصَرفه تتقلب الأحوال  سمعت أبا الحسن عيسى بن زيد بن عيسى الفرضي المديني النسابة يقول : سمعت بشر بن موسى الأسدي يقول : سمعت الأصمعي يقول : بينا أنا ذات يوم عند والي الكوفة وهو يسألني عن أهل البصرة وأنا أحدثه، إذ قيل : أعرابي مجنون بالباب يتكلم بالشعر . قال : أدخلوه فأدخل، فإذا رجل كأنه نخلة سموق شتن الأطراف موسوس، فسلم على الأمير فرد عليه فقال له الأمير: أبو من؟ فقال الأعرابي : أبو السرندی شاعر سجاعه
من سال عني فأنا التلقاعه فقال الوالي : ما أَمدَحَكَ لنفسك ! فقال : لأنني أرتجل ارتجالا
ما شئتُ يا مَنْ أَلْبِسَ الجَمالا فقال الأصمعي : فقال لي الأمير: ما هذا بمجنون فَأَلْقِ عليه شيئاً مما عندك . فقلت : ما الريم ؟ فقال : الريم فضل اللحم للجزار
يَنْحَرُه للفتية الأيسار فقلت : مال الحلوان ؟ فقال : أليس ما يُعطى على الكهانة
والحر لا يقنع بالمـهـانـه فقلت : ما الدكاع ؟ فقال : إن الدكاع هو سعال الماشيه
والله لا تخفى عليه خافيه فقلت : ما التَّوَلَة ؟ فقال : عَوْذَةُ عُنق الطفل عندي تُوَله
وقد تُسمى العنكبوت توله فقلت : فما الرفه ؟ فقال : الرُّفَهُ الدِّين فَسَلْ ما شِيْتا
لقد وجدت عالماً جريتا قال الأصمعي : فاستحييت من كثرة ما سألتُ. فقال لي : قل لي ما الهلقْسُ والشحشاح والجمل الرازح لا يُراح قلت : الهِلَّقْسُ : الطَّمِع الحريص والشحشاح الذي لا يستقر في موضع ، والرازح : المهزول . فقال : ما أنت إلا حافظ للعلم
أحسنت، ما قلت بغير وهم قال : فقال الوالي : حبذا كل مجنون مثل هذا . ثم أمر له بعشرة آلاف درهم . فلما قدم إليه المال قال : أكلُّ ها هو لي بمره
تمّ سروري واعتـرتنـي شـره ثم أقبل على الأمير فقال : رِشت جناحي يا أخا قريش
أقْرَرْتَ عيني وأَطَبْتَ عَيْشي ثم ضج إلى الريح فقال : يا ريحُ أَذِي خَبَري إليهمُ
ثُمَّتَ قُصي قصتي عليهم وخرج .  بدوي. سمعت أبا الحسن محمد بن محمد بن مسعود النسوي بها يقول : سمعت أبا بكر محمد بن داود الأصبهاني يقول : بلغني أن فتى من الأعراب كان يقال له امرؤ القيس هوي فتاة من الحي، فلما وقفت على أنه يحبها هجرته، فزال عنه عقله وخولط وأشفى على التلف وصار رحمة للناس. فلما بلغ المرأة حاله وما هو فيه أتت فأخذت بعضادتي الباب فقالت: كيف تجدك يا امرأ القيس؟ فقال : دنت وظلال الموت بيني وبينها وأدلت بوصل حين لا ينفع الوصل ثم لم يلبث إلا يسيراً حتى مات.  قيسي أخبرنا أبو عبدالله بن شبيب قال : حدثنا أحمد بن لقمان قال : حدثنا عبدالعزيز بن سعيد السيرافي قال : سمعت أبي يقول : أنشد رجلٌ هبنقة القيسي : أهجر محل السوء لا تلم به وإذا نبا بك منزل فتحول قال : هذا أحمق بيت قالته العرب، وكيف يطيق أهل السجن النقلة؟ هلا قال : إذا كنت في دارٍ يهينك أهلها ولم تك مكبولا بها فتحول  أخبرنا أبو عبد الله محمد بن الطيب قال : حدثنا حفص بن عمر قال : حدثنا علي بن عبد الحميد قال : حدثنا إبراهيم بن الجنيد عن محمد بن الحسين عن طريف الرومي تلميذ إبراهيم بن أدهم قال : سمعت إبراهيم بن أدهم يقول: ذكرت لي ريحانة فخرجت إلى الأبلة، فإذا أنا بجارية سوداء قد أثر البكاء في خديها، فذاكرتها شيئاً من أمر الآخرة فأنشأت تقول : من كان راكب يوم ليس يأمنه
وليلة باتها في عقب دنياه
فكيف يلتذ عيشاً لا يطيب له
وكيف تعرف طعم الغُمض عيناه  وأخبرنا أبو عبد الله قال : حدثنا حفص قال : حدثنا علي قال : حدثنا إبراهيم عن محمد بن الحسين عن إسماعيل بن عبد الرحمن الشامي قال : سمعت عبدالوهاب بن علي يقول : أنشدتني ريحانة : صبرت عن اللذات حتى تولّتِ وألزمت نفسي صبرها فاستمرت
وكانت على الأيام نفسي عزيزةً فلما رأت عزمي على الذلّ ذلت
وما النفس إلا حيث يجعلها الفتى فإن طمعت تاقت وإلا تسلّت  وأخبرنا أبو عبد الله، حدثنا حفص، حدثنا علي، حدثنا إبراهيم عن محمد بن الحسين عن موسى بن خالد قال : سمعت شعوانة تقول : تذاكرنا الدنيا بين يدي ريحانة المجنونة فقالت : وما عاشق الدنيا بناج من الردى ولا خارج منها بغير غليل
وكم ملك قد صفر الموت بيته فأخرج من ظل عليه ظليل  ٤٧٨ قيل لسهل بن عبدالله : ما تقول في ريحانة؟ قال: ما أقول فيها إلا خيراً. وأنشدوني لها : لها من لطيف العزم فهم سَرَتْ به يهتك بالأستار ما داخل الحجب
فإن أمنت خوف الفراق مِنَ الْفِها أحبت حبيباً يطلب الأنس من قرب
رَضِيها فأرضته فحازت من الرضى وحلت من المحبوب بالمنزل الرحب  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبد الله قال : حدثنا حفص قال : حدثنا علي قال : حدثنا إبراهيم عن بكار بن خالد عن صالح المري قال : رأيت ريحانة المجنونة وقد كتبت من وراء جبتها : أنت أُنسي ومنيتي وسروري قد أبي القلب أن يحب سواكا
يا عزيزي وهمتي ومرادي طال شوقي متى يكون لقاكا
ليس سولي من الجنان نعيماً غير أني أريدها لأراكا وإذا على صدرها مكتوب : حسب المحب من الحبيب بعلمه أن الـمـحـب بـبــابـه مطروح
والقلب منه إن تنفس في الدجى بسهام لـوعــات الهـوى مجروح وإذا على كمها الأيمن مكتوب : بوجهك لا تُعَذِّبْنِي فَإِنِّي أُؤَمِّلُ أن أفوز بـخـيـر دار
مُنَجِّدة مزخرفة العلالي بها المأوى ونعم هي القرار
وأنت مجاور الأبرار فيها ولولا أنت ما طاب المزار وعلى كمها الأيسر مكتوب : برى أعظمي شوقي فأوهن قوتي وحالفتُ أحزاني فهاج رقادي  قال فرقد السبخي : لم يكن في نساء الأبلة والبصرة أقوم بالليل من ريحانة، ولقد سمعتها ذات ليلة وهي تقول: اجعل لنفسك في الليالي نبهةً يُنبهك من خلل المنام قيام
وَأَنَس إلى طول الصلاة تجلُّداً واترك لذاذ النوم والأحلام  أخبرنا محمد قال: أخبرنا الحسن قال: حدثنا أبو عبدالله قال: حدثنا حفص قال: حدثنا علي قال: حدثنا إبراهيم عن أوس الأعور قال: رأيت ريحانة المجنونة ذات ليلة تدعو وتقول: أعوذ بك من بدن لا ينصب بين يديك، وعَمِيَتْ عينان حبيي لا تبكيان شوقاً إليك وجفت كف لا تبتهل بالتضرع إليك، ثم أنشأت تقول: يا حبيب القلوب أنت
لم تزل أنت يا مناي سروري  ٤٨٢ - أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبدالله قال : حدثنا حفص قال : حدثنا علي قال : حدثنا إبراهيم عن روح بن منصور قال: قال لي عباد القطان : قمتُ ذات ليلة وأنا أقول في دعائي : اللهم اكس وجهي الحياء منك. فصرخت ريحانة وقالت : ادْعُ بإسقاط الرياء، الورع أولى بك من ذا . ثم أنشأت تقول : تعود سَهَرَ اللّيل فإن النوم خسران
ولا تركن إلى الذنب فعقبى الذنب نيران
أخدان
وكن للوحي دراساً فللقرآن
إذا ما الليل فاجاهم فهم في الليل رهبان
يميلون كما مالت من الأرياح أغصان  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبد الله قال : حدثنا حفص قال : حدثنا علي قال: حدثنا إبراهيم عن عبد العزيز بن جابر قال: طفتُ ببيت الله الحرام، فإذا أنا بريحانة، وكانت سوداء من الأبلة، فرأيتها وقد سقط الخمار عن رأسها وهي تقول : البيت بيتك، والحرم حرمك، وهؤلاء الخَلْقُ خَدَمك، وأنا ضيفك وزائرك، فإن رددتني إلى البصرة مسلمة وقيل لي : ما أولاكِ؟ أقول : المغفرة بحُسْنِ ظني بك وأنت المحبوب فافعل ما شئت . قال : فدنوت منها فقلت: اسكتي يا هذه. فقالت: يا طفيلي، البيت بيتك أم بيته ؟ قلت : بيته . قالت : وأنا ضيفك أم ضيفه ؟ قلت : ضيفه . قالت : يا بعيد الأمل . يستزيرنا ولا يغفر ؟ كلا، إنه لا يفعل . ثم صرخت واضطربت فماتت رحمها الله .  ٤٨٤ أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبد الله قال : حدثنا حفص قال : حدثنا علي قال : حدثنا إبراهيم عن عبد الله بن سهل قال : خطبت ريحانة فأنشأت تقول : يا ذا الذي خطب الجنون لنفسه ماذا تقول إذا وقفت ذليلا  وقال عبد الله بن سهل: أنشدتني ريحانة: أرى الدنيا لمن هي في يديه عذاباً كلما كثرت لديه
تهين المكرمين لها بصُغْرٍ وتُكرم كلّ من هانت عليه
إذا استغنيت عن شيءٍ فَدَعْهُ وخُذ ما أنت محتاج إليه  ٤٨٦ أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو جعفر محمد بن علي بن الطيان القمي قال : حدثنا عثمان بن مردان النهاوندي قال: حدثنا خلف بن العباس الدمشقي عن محمد بن الحسين قال : سمعت طريف الرومي يقول : سمعت إبراهيم بن أدهم يقول : ذُكرت لي ريحانة، فطلبتها فرأيتها في خربة تتمرغ في التراب وتقول ويلي لذنبي في كتابي ويلي ويلي إذا نُودِيَ باسمي ويلي
ويلي إذا قيل خذوها ويلي ويلي إلى النار مصيري ويلي  ٤٨٧ بغدادية. أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبدالله قال : حدثنا حفص قال : حدثنا على قال : حدثنا إبراهيم عن بعض الأدباء قال : ذُكرت آسية لعبدالله بن طاهر فدعا بها فأدخلت عليه ، فلَزِمَتِ الصمت خمسة أيام، فقال لها عبدالله : أخرساء أنت ما لكِ لا تنطقين؟ قالت : لكني أقول : قالوا نراك طويل الصمت قلت لهم ما طول صمتي من عِيّ ولا خَرَس
الصمتُ أَحمدُ في الحالين عاقبةً عندي وأحسن بي من منطق شكس
قالوا فأنت مصيب لست ذا خطأ فقلت هاتوا أروني وجه مقتبس
أ أنشر البز فيمن ليس يعرفه
أم أنثر الدر بين العمي في الغلس حَيُّونة  ٤٨٨ أهوازية أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبدالله قال : حدثنا حفص قال : حدثنا علي قال : حدثنا إبراهيم عن عطاء بن إسرائيل قال : ما رأيتُ أعجب من حيونة المجنونة ؛ كانت إذا جنّها الليل تبكي وتقول: عزّ علي أن تعصى، أما قلبي فإنه واله بك، وأما جوارحي فإنها تشكو ضميرها إليك. إلهي إلى متى تَحْبِسُني مع البطالين؟ فلا تزال كذلك حتى تصبح .  أخبرنا محمد قال : أخبرنا أبو عبد الله قال : حدثنا حفص قال : حدثنا علي قال : حدثنا إبراهيم عن راشد بن علقمة الأهوازي قال كانت حيونة المجنونة إذا جَنّها الليل تقول في دعائها : يا واحدي تمتعني بالليل بدرس التلاوة ثم تَقْطَعُني عنك بك في ضياء النهار؟ إلهي ودِدْتُ أن النهار ليل حتى أتمتع بقربك . أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبد الله قال : حدثنا حفص قال : حدثنا علي قال : حدثنا إبراهيم عن إسماعيل بن عبدالله قال كنت إذا نظرت إلى حيونة أقول إنها من أهل الآخرة. ورأيتها يوماً في سوق الحدادين تنظر إلى المطارق تضرب على الحديد، وهي تعدو في السوق وتنادي : يا مالك لا أعود، يا مالك لا أعود . أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبدالله قال : حدثنا حفص قال : حدثنا علي قال : حدثنا إبراهيم قال : قال سلام الأسود طلعت الشمس على حيونة فاذتها فقالت : إن كنت تعلم أنني بـك والـه فاصرف سموم الشمس عني سيدي قال : فتغيمت السماء في الوقت.  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبد الله قال : حدثنا حفص قال : حدثنا علي قال : حدثنا إبراهيم عن إسماعيل بن عبدالله قال : كنت إذا نظرت إلى حيونة أقول إنها من أهل الآخرة. ورأيتها يوماً في سوق الحدادين تنظر إلى المطارق تضرب على الحديد، وهي تعدو في السوق وتنادي : يا مالك لا أعود، يا مالك لا أعود .  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبدالله قال : حدثنا حفص قال : حدثنا علي قال : حدثنا إبراهيم قال : قال سلام الأسود طلعت الشمس على حيونة فاذتها فقالت : إن كنت تعلم أنني بـك والـه فاصرف سموم الشمس عني سيدي قال : فتغيمت السماء في الوقت.  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبد الله قال : حدثنا حفص قال : حدثنا علي قال : حدثنا إبراهيم عن سلام الأسود قال : كانت حيونة إذا جنّها تقول : إلهي ، لا يكون صباحي إلا في جنة المأوى. فإذا كانت ليلة كثيرة الهول والمطر قالت : ما أشبه هذه الليلة بيوم القيامة .  وبهذا قال سلام صامت حيونة حتى اسودت. فعوتبت في ذلك فرفعت طرفها نحو السماء وقالت : قد لامني خلقك في خدمتك، فوعزتك وجلالك لأخد منك حتى لا يبقى لي عصب ولا قصب. ثم أنشأت تقول : يا ذا الذي وعد الرضى لحبيبه أنت الذي ما إن سواك أريد  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبد الله قال : حدثنا حفص قال : حدثنا علي قال : حدثنا إبراهيم قال : حدثنا سلام قال : نظرت إليها في يوم شديد الحر وقد صامت وذلت فقلت لها : إنّ النهار شديد الحر. فقالت : اسكت . عند المبلغ يفرح الواردون، وعند العرض تنقطع الأسباب، وعند قوله «خذوه» تنشر أعلام العارفين .  أخبرنا محمد قال: أخبرنا الحسن قال: أخبرنا أبو عبد الله قال: حدثنا حفص قال: حدثنا علي قال: حدثنا إبراهيم قال: سلام: زارت رابعة حيونة. فلما كان جوف الليل حمل رابعة النوم، فقامت إليها فركلتها برجلها وهي تقول: قومي قد جاء عرس المهتدين، يا من زين عرائس الليل بنور التهجد.  ٤٩٦ وقال علي بن هاشم الأبلي : دخلت الأهواز فسألت عن حيونة فقيل : في خرابات دار الأشناني . فدخلتها فإذا أنا بامرأة قد توجّهت من خوف الله، قد قتلها الحب وأضناها، روحانية الظاهر سماوية الباطن. فقلت : السلام عليك. فأنشأت تقول : خوالص أسرار ضوامر أَعظم بَلِين وباقي وَجْدِهن جديد قال : فكفاني البيت وتركتها.  وبهذا قال عن محمد بن الحسين: إنه قد بلغني من حديث حيونة ما أنساني زهد الحسن ومالك، وذلك أن سلاماً قال: رأيتها وقد وقفت على مجلس عبدالواحد ثم نادت: يا متكلم تكلم عن نفسك، والله لو مت ما تبعت جنازتك. قال: ولم؟ قالت: تتكلم على الخليقة وتتزين لهم، ما شَبَّهتُك إلا بمعلم صبي علمه فحفظ إلى العشي، فلما ذهب إلى بيت أمه نسي فيحتاج إلى ضربه. اذهب يا عبد الواحد فاضرب نفسك بدرة الأدب، وتزود زاد القناعة، واجعل حظك مما أنت فيه الكلام على نفسك ثم تكلم على الخليقة. قال سلام: فلقد عَرِقَ عبدالواحد وقام وما تكلّم على الناس سنة.  ٤٩٨ وبهذا قال سلام : وكنت إذا فقدت حيونة طلبتها في المقابر . قال : فقلت لها يوما ما تعملين في المقابر؟ فقالت : وليس للميت في قبره فطر ولا أضحى ولا عِشْرُ
بان من الأهل على قربه كذاك من مسكنه القبر  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبد الله قال : حدثنا حفص قال : حدثنا علي قال : حدثنا إبراهيم قال : حدثنا سلام قال : سمعت حيونة تقول : من أحبَّ اللَّهَ أَنِسَ ، ومن أنِسَ طَرِب، ومن طرب اشتاق، ومن اشتاق وله، ومن وله خدم، ومن خدم وصل، ومن وصل اتصل ، ومن اتصل عرف، ومن عرف قرب، ومن قَرُب لم يرقد وتسورت عليه بوارق الأحزان.  وبهذا قال سلام : سمعتُ حيونة تقول لبعض الناس : يا بطال، ألك طاقة بكلام مالك، وهو إذا غضب على النار زجرها زجرةً تَدَكْدَكَت فأكل بعضها بعضاً من الفرق؟  وكانت إذا شهقت في بعض الأحايين يخرج من مناخرها الدم، فأقول لها : ما هذا ؟ قالت : ذكر النار ورب الكعبة .  قال: وكانت تقول: اللهم هب لي سكون قلبي بعقد الثقة بك، واجعل جميع خواطري واثقة برضاك، ولا تجعل حظي الحرمان منك يا أمل الآملين.  قال سلام : وكنت أضع الطعام بين يديها فتبكي وتقول : حبيب يحبّ حبيبه، يشتغل بالأكل عن خدمة حبيبه، يوشك أن يقدم رسول حبيبه وهو مشغول بالأكل عن خدمة حبيبه، فلا تَقَرَّ عيناه بلقائه . ثم تترك الطعام . اجتماع ريحانة وحيونة :  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبدالله قال : حدثنا حفص قال : حدثنا علي قال : حدثنا إبراهيم قال : زارت ريحانة حيونة . فلما جن الليل جاء المطر والريح الشديدة، ففزعت ريحانة، فضجت حيونة وقالت لها : يا قذرة العمل! لو علمت أن في قلبي محلة غيره أو خوف سواه لوجأته بالسكين. سلمونة  أخبرنا محمد قال: أخبرنا الحسن قال: سمعت أبا عبد الله محمد بن جعفر الخاقاني يقول: سمعت سهل بن سعيد بعبادان يقول: كانت عندنا امرأة مجنونة تسمى سلمونة، وكانت تُغيب شخصها بالنهار فلا تُرى، فإذا كان الليل صعدت السطح وجعلت تنادي إلى الصباح: سيدي ومولاي، جنتتني عن عقلي وأَوْحَشْتَني عن خَلْقك وآنستني بذكرك، وقد نُفِيتُ عن خَلْقك فواسوأتاه إن نفيت عنك..  حمصية. أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو سعيد أحمد بن محمد بن رميح الزيدي، وأبو صابر المعلى بن أسد الواسطي قالا : حدثنا محمد بن علي بن حمدان البغدادي قال : حدثنا علي بن بكر الرافقي قال : حدثنا الحجاج بن عبدالكريم البلخي قال: حدثنا إبراهيم بن أدهم قال : رأيت في المنام كأن قائلاً قال لي : ميمونة السوداء زوجتك . قال : وكنت أطلبها حتى وجدتُ أثرها بحمص، فطلبتها فقيل إنها مجنونة لا تَأْلَفُ أحداً . فقلت: فأين هي؟ قالوا : دَفَعنا إليها أغنامنا فهي تكون في الجبابين. فخرجت إلى الجبانة فإذا هي قائمة تصلي والشاء والذئاب في مكان واحد، فَقَضَيتُ عجباً . فلما قَضَت صلاتها قالت: يا إبراهيم . الوعد في الجنة لا هاهنا . قال : فتعجبت من فطنتها فقلت: يا سبحان الله ألست مؤتمنة على هذه الأغنام ؟ قالت : بلى . قلت : فلم عطلتها حتى توسّطتها الذئاب؟ قالت : سلَّمتها إلى منشئها. ثم قالت : ارتفعت الوحشة بيني وبين من أنا قائمة بين يديه، فهو الذي رفع الحشمة بين الشاء والذئاب . ثم ولت وأنشدت تقول : قلوب العارفين لها عيون ترى ما لا يراه الناظرونا
وألسنة بسر قد تناجي تغيب عن الكرام الكاتبينا
وأجنحة تطير بغير ريش إلى ملكوت رب العالمينا
يسقيها العزيز شراب صدق وتشرب من كؤوس العارفينا  كوفية . أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو موسى عمران بن الحصين قال : حدثنا أبو عوانة قال : حدثنا أبو علي سهل بن علي قال : حدثنا محمد بن الحسين قال : حدثنا محمد بن عبد الرحمن الأشهلي قال : أخبرني يحيى بن إسماعيل بن سلمة بن كهيل قال : كانت أختي أسن مني، فاختلطت وذهب عقلها وتوحشت. وكانت في غرفة في أقصى سطحنا، فمكثت بضع عشرة سنة. وكانت مع ذهاب عقلها تحرص على الطهارة والصلاة، وتتفقد الأوقات، وربما غلبت على عقلها أياماً فتحفظ ذلك حتى تقضيه . فبينا أنا نائم ذات ليلة إذا بباب بيتي يدق في نصف الليل، فقلت: من هذا؟ قالت : بخة . قلت : أختي ؟ قالت : أختك. فقلت : لبيك . فقمتُ وفتحت الباب فدخلت ولا عهد لها بالبيت من أكثر من عشر سنين. فقلت لها : يا أختاه خير؟ قالت : خير. أتيت الليلة في منامي فقيل : السلام عليك يا بخة . فرددت فقيل : إن الله قد غفر لجدك سلمة وحفظك بأبيك إسماعيل، فإن شئتِ دَعَوْتِ الله فأذهب ما بك، وإن شئتِ صبرت ولك الجنة . فإن أبا بكر وعمر قد شفعا لك إلى الله بحب أبيك وجدك إياهما . قالت: فقلت : إن كان لا بد من اختيار أحدهما فالصبر على ما أنا فيه والجنة، وإن الله لَوَاسِعُ الخَلْقه لا يتعاظمه شيء إن شاء أن يجمعهما لي فعل . فقيل : فقد جمعهما الله لك ورضي عن أبيك وجدك بحبهما أبا بكر وعمر . قومي . فانزلي فأذهب الله ما كان بها وعادت إلى أحسن الحال.  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا بكر محمد بن عبدالله بن محمد يقول : سمعت جدي العباس بن حمزة يقول: سمعت أحمد بن أبي الحواري يقول : بينا أنا أسير في بلاد الشام إذا امرأة قد أقبلت فقالت : السلام عليك يا أحمد. قلت: وعليك السلام، كيف عرفتني ؟ قالت: عرفت روحي روحك فعرفت نفسي نفسك . قلت : من أنت؟ قالت : أنا امرأة ضالة دلني على الطريق . قلت : عن أي الطريقين تسألينني؟ قالت عن طريق النجاة. قلت: يا هذه بينك وبينه عقبات، وأي عقبات ، لا تُقطع إلا بصحة المعاملة . وإنك لو أتيت يوم القيامة بعمل ستين نبيا لم يكن لك أن تتكلي إلا على ما سبق لك في اللوح المحفوظ . قال : فصاحت صيحة ثم قالت: سبحان الله، من أمسك عليك جوارحك فلم تتقطع، وأمسك قلبك فلم يتصدع . ثم خرَّتْ مغشيةً عليها . قال أحمد : فسألت امرأةً مرت بي أن تنظر إليها وتتعرف حالها، فَدَنَتْ منها وحركتها فإذا هي قد فارقت الدنيا. فبينا أنا كذلك إذ أحاط بها خَدَمٌ ، فقلت لبعضهم من هذه المرأة؟ قال: هذه جارية مصابة بعقلها مدهوشة، وكان الذي يأخذها يمنعها من الطعام والشراب، فكنا نعرض عليها أطباء الشام فكانت تقول : خُلُّوا بيني وبين طبيبي أشكو إليه بعض ما أجد من بلائي ، فلعله يكون عنده شفائي .  ٥٠٩ أخبرنا محمد قال : أخبرنا الحسن قال : سمعت الحاكم أبا الحسن محمد بن الحسين يقول : سمعت إبراهيم بن فاتك يقول : سمعت يوسف بن الحسين يقول : سمعت ذا النون يقول : بينا أنا أسير في طريق أنطاكية إذا بجارية مجنونة عليها جبة صوف قالت : ألست ذا النون؟ قلت : بلى وكيف عرفتني؟ قالت : فتق الحبيب بين قلبي وقلبك فعرفتك . ثم رفعت رأسها إلى السماء وقالت : يا من سبى قلوب أوليائه شوقاً إليه، فقلوبهم مربوطة بسلاسل الأنس ينظرون إليه بمعارف الألباب . ثم قالت : أسألك ؟ قلت : نعم . قالت : أي شيء السخاء ؟ قلت : البذل والعطاء . قالت : هذا السخاء في الدنيا. فما السخاء في الدين ؟ قلت : المسارعة إلى طاعة الله . قالت : فإذا سارعت إلى طاعته ترجو منه شيئاً؟ قلت : نعم بالواحدة عشراً . قالت : مُرَّ يا بطال! هذا في الدين قبيح وإنما المسارعة في الطاعة أن يطلع المولى على قلبك وأنت لا تريد منه بدلاً . ثم قالت : إني أريد أن أقسم عليه منذ عشرين سنة في طلب شهوة فأستحيي منه مخافة أن أكون كأجير السوء؛ يعمل لطلب الأجر؛ ولكني أعمل تعظيماً لهيبته ريطة  مكية . هي ريطة بنت عُمير بن كعب بن سعد بن تيم بن مرة . وكانت تلقب بجعدة لحمقها. وكان لها جوار، وكانت اتخذت مغزلاً بغلظ إصبع، وفَلْكَةً مثل حجر. فجعلت تأمرهن بغزل الصوف من الصبح إلى العصر ثم تأمرهن فَيَنْقُضْنَ ما غَزَلْنَ إلى المساء . فشبه الله ناقض العهد بها بقوله تعالى : ولا تكونوا كالتي نقضت غزلها الآية .  ٥١١ واسطية أخبرنا أبو عبدالله محمد بن الطيب قال : حدثنا حفص قال : حدثنا علي قال : حدثنا إبراهيم عن محمد بن صالح بن إسماعيل الزراد قال : سمعت عوسجة تطوف بالبيت وتقول : سرائر كتمان يبوح بها الهوى وإظهار وجد ما يُراد سـواه  وسمعت أبا نصر منصور بن عبدالله الأصبهاني قال : سمعت عبدالله بن أحمد الجوهري القاضي قال : سمعت أبي قال: سمعت محمد بن المبارك الصوري يقول خرجت حاجاً فإذا أنا بجارية سوداء لا غطاء لها ولا وطاء، فسلمت عليها فردَّتِ السلام ثم قالت : ائت يا بن المبارك على بطالتك بعد. قلت لها : وكيف عَرَفْتِني ؟ فقالت : أضاءت مصابيح الأمال في قلوب العمال وتزعزعت جوارحي بنور الصفاء فعرفتك بمعرفة من على العرش استوى . قلت : وما الصفاء؟ قالت : ترك أخلاق الجفاء . قلت لها : من أين جئت ؟ قالت من عنده . قلت: وإلى أين تريدين؟ قالت : هم إليه . قلت : بلا زاد ولا راحلة؟ قالت : يا أعمى أسألك عن مسألة : لو أن أحدكم استزار أخاً إلى منزله أَيجملُ أن يحمل معه زاداً؟ ثم أنشأت تقول : ارْضَ بالله صاحبا
وَذَرِ النّاس جانبا
لا تُرِدْ غير ذي الجلا ل رفيقاً مُصاحبا
صَافِهِ الود شاهدا
كنت أم كنت غائبا  أخبرنا محمد بن الطيب قال: حدثنا حفص قال: حدثنا علي قال: حدثنا إبراهيم عن عبد الرحمن الواسطي قال: كانت عوسجة تنزل بقربي، فسمعتها ذات ليلة وهي تقول: جعل الظلام مطيّةً لقيامه لينال وصـلا مـا يــريــد ســواه  وبهذا عن إبراهيم عن سعيد بن عبد الرحمن قال: رأيت عوسجة في خرابات واسط تبكي وتقول: قل للظلام وللسكون مع السُّرى كن كيف شئت فإنني أهواكا  وبهذا عن إبراهيم عن عبدالرحمن الواسطي قال: سمعتها مرة وهي تقول: ظهر البلاء بجسمه فأذابه ورمى الوداد فؤاده فتصدعا  وبهذا عن إبراهيم قال : سمعت إسماعيل بن ذر يقول : رأيت عوسجة حول بيت الله الحرام وهي تقول: طاب المقام له وطاب نعيمه في دار عدن والجليل يراه قال: فسمعت الصراخ في الطواف من كل جانب.  وبهذا قال إبراهيم : سمعت زيد بن الحباب يقول : رأيت عوسجة حول بيت الله وهي تقول : يا ذا الذي طَرِبَ الفؤادُ بِذِكْرِهِ
أنت الذي ما إن سواك أريد مجانين لا يبينون ولا تُعرف أسماؤهم  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو الحسن محمد بن محمد بن الحسن بن الحارث الكارزي قال : أخبرنا الحسن بن علي بن نصر الطوسي قال : حدثنا إسحاق بن أحمد الخزاعي عن أبيه قال : قدم هارون الرشيد مدينة رقة، وخارج رقة دير يُقال له دير زَكَّى . قلما أقبلت المواكب أشرف أهل الدير ينظرون وفيهم مجنون مسلسل فلما أقبل هارون رمى بنفسه وقال : يا أمير المؤمنين قد قلت فيك ثلاثة أبيات أفأنشدك؟ قال : نعم، فقال : لَحَاتُ طَرْفك في العِدا تغنيك عن سلّ السيوف
وعَزيمُ رأيك في النُّهى يكفيك عاقبة الصروف
وسيول كفك بالندى بحر يفيض على الضعيف ثم قال : يا أمير المؤمنين هات ثلاثة آلاف دينار أشتري بها كسباً وتمراً . فقال هارون : يدفع إليه ثلاثة آلاف دينار. فحُمِلَتْ إلى أهله وأخرج من الدير وكان من أهل الشرف .  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا بشر محمد بن عبدالله بن بشر الأصبهاني بجرجان يقول : سمعت إسحاق بن علي الأنماطي يقول : سمعت محمد بن جهم السمري يقول : سمعت سوار بن عبدالله القاضي يقول : دخلتُ بعض حمامات البصرة فقلت لصاحب الحمام فيه أحد ؟ قال : لا إلا شيخ موسوس . فدخلت فإذا بشيخ قد اختضب مُقبل على زاوية فقلت: يا شيخ ما حرفتُك؟ قال : أنا أبيع الكعاب والدوامات من الصبيان. فقلت في نفسي : مع من وقعت! فقال لي الشيخ : ما حرفتك ؟ قلت: لا أخبرك . قال : والله ما أنصفتني! سألتني عن حرفتي فأخبرتك وسألتك عن حرفتك فلم تخبرني . فقلت : أنا أنظر فيما بين الناس وأمنع الظالم من المظلوم . قال الشيخ : ويقبلون منك؟ قلت : من لم يقبل حبسته وأدبته . قال : ويمكنك ذلك؟ قلت : نعم إن معي أعواناً من السلطان . قال الشيخ : الحمد لله الذي عافاني مما ابتلاك به . قال سوار : فتصاغرت إلى نفسي .  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا سعيد أحمد بن أحمد بن محمد بن رميح الزيدي يقول : سمعت محمد بن إبراهيم الأرجاني يقول: سمعت محمد بن يعقوب الأزدي عن أبيه قال: دخلت دير هزقل فرأيت مجنوناً مكبلاً فكلمته فوجدتُه أديباً ، فقلت له : ما الذي صيرك إلى ما أرى؟ فقال : نظرت إليها فاستحلت بنظرة
دمي ودمي غال فأرخصه الحُبُّ
وغاليت في حبي لها ورأت دمي
رخيصاً فَمِن هذين داخلها العُجْبُ قال : فحدثت به إدريس بن عبدالله اللخمي فقال : أتيتُ مجنوناً بالشام فقلت له في يوم غيم : أرى اليوم يوماً قد تكاثف غيمه وإقتامه فاليوم لا شك ماطر فقال من غير روية : وقد حجبت فيه السحائب شمسه كما حجبت ورد الخدود المعاجر  الحسن قال : سمعت أبي رحمه الله يقول : سمعت أحمد بن محمد بن الصلت المعروف بابن شنبوذ البغدادي يقول : سمعت أبا الحسن محمد بن أحمد بن البراء يقول : سمعت أبا عثمان الجدعاني يقول : كان عندنا مجنون إذا قيل له : يا غنباوة يضج ويصيح ويغضب فيصيح به الصبيان وهو كالنائم : يا غنباوة فيرفع رأسه وقد اجتمعوا عليه فيقول : ما أنت منحدراً من رأس رابية يوماً بأسرع من غاو إلى غاو ثم يصيح ويقول : فإني وإياهم كمن نبه القطا ولو لم تُنبه باتت الطير لا تسري ثم يحمل عليهم بعصا فيتصدّعون عنه فيقف عنهم ويقول : أمرنا أمير المؤمنين علي بن أبي طالب رضي الله عنه ألا نتبع مديراً ولا ندفف على جريح . وعند نفسه أنه قد هزمهم فيقول : فألقت عصاها واستقر بها النوى كما قرَّ عيناً بالإياب المسافر  الحسن قال : سمعت أبا القاسم عبد الرحمن بن المظفر الأنباري بسرخس يقول : سمعت أبا القاسم بن أبي حية يقول : سمعت الجاحظ يقول : رأيت مجنوناً بالكوفة فقال لي: من أنت؟ قلت : عمرو بن بحر الجاحظ قال: الذي تزعم أهل البصرة أنك أعلمهم؟ قال : إن ذاك ليقال . قال : من أشعر الناس؟ قلت: امرؤ القيس . قال : حيث يقول ماذا؟ قلت : حيث يقول : كأن قلوب الطير رطباً ويابساً قال : فأنا أشعر منه . قلت : حيث تقول ماذا ؟ قال : حيث أقول : لدى وكرها العناب والحشف البالي
كأن وراء الستر فوق فراشها قناديل زيت من وراء قرام فأينا أشعر ؟ قلت : أنت . قال : فأيهما أقوى الماء أم الريح ؟ قلت : الريح . قال : لم تُصب . قلت : وكيف؟ قال : يقع الثوب في الماء فيبتل في أقل من طرفة عين، ويبسط في الريح فلا يجف إلا بعد ساعات . أصبتُ أم أخطأت؟ قلتُ: أصبت. قال: فاذهب فما تعقل أنت ولا أهل البصرة شيئاً !  الحسن قال : سمعت الحاكم يقول : حدثنا الحسن محمد بن الحسين بجرجان قال: سمعت فارس بن عيسى الدينوري يقول: سمعت يوسف بن الحسين يقول : سمعت ذا النون يقول : ركبت البحر ومعنا مجنون أسود ذاهب العقل. فلما توسطنا البحر قال الملاح : زِنُوا الكِرَى فَوَزنا حتى بلغوا إليه فقالوا له : زن فأنشأ يقول : أنس القلوب بقرب أنس أنيسها فتحيّرت بين المحبة والهـوى قال الملاح : زن . قال : قد بعثنا إلى الخازن ليزن لك. قال : وفي البحر صيرفي وخازن؟ قال ذو النون : فبينا نحن في ذلك إذ هاج موج عظيم، فخرجت منه سمكة فاغرة فاها مملوء فوها دنانير، فجاءت حتى وقفت بقرب الأسود، فقال الأسود: يا ملاح خُذها إليك وإياك أن تُسرف . فأخذ منها ديناراً فلما خرجنا منها سألت عنه فقيل : هذا مجنون لم يفطر منذ خمسين سنة لا يطعم في الشهر إلا مرة واحدة.  قال المصنف: وبلغني عن المبرد أنه قال: دخلت دار المرضى فإذا أنا بشاب مقيد إلى جدار، فقال لي: من أنت وما حرفتك؟ فسكت. فنظر إلى المحبرة في يدي فقال: أمن أهل الحديث وحملة الآثار أم من أهل الأدب والنحو؟ قلت: من أهل الأدب والنحو قال: من أصحاب من؟ قلت: من أصحاب أبي عثمان المازني. فقال: هل لك معرفة بصاحبه الذي قعد في مكانه؟ قلت: إني به لعارف. قال: ما سمعت في نسبه؟ قلت: يقولون من ثمالة الأزد. قال: إنه مطعون فيه. قلت: قد قال فيه عبد الصمد بن المعذل: سألنا عن ثمالة كل حي فقال القائلون: ومن ثماله؟
فقلت: محمد بن يزيد منهم فقالوا: زدتنا بهم جهالة فقال: الله در ذاك الخبيث. هو بريء من هذا الشعر وإنما يقع لي أنه قاله في نفسه على لسان عبد الصمد تحقيقاً لنسبه. قلت له: أنت أعلم. ثم قال: قد وجب حقي عليك بهذه المذاكرة فأخبرني عن الاسم. قلت: محمد. قال: ابن من؟ قلت: ابن يزيد. قال: والكنية؟ قلت: أبو العباس. قال: قبح الله الآخر لقد ألجأني إلى الاعتذار الحسن.  قال : أخبرنا أبو الحسين عبيد الله بن موسى السلامي قال : حدثنا محمد بن أحمد الدقاق بتستر قال : حدثنا الحسن بن سعيد الهروي قال : حدثنا معقل بن علي قال : كان عندنا بالمدينة رجل من وَلَدِ كثير بن الصلت حسن الوجه نظيف الثياب كثير المال ملازماً لمسجد رسول الله صلى الله عليه وسلّم. فغلبت عليه المَرَّةُ فأحرقته وذهبت بعقله فكان بعد ذلك يتبع المزابل . فمررتُ به يوماً وهو على رماد حمام فقلت له : يابن كثير، عزّ علي ما أرى بك. فقال : الحمد لله الذي لم يجعلني ساخطاً لقضائه وقدره يا أخا الأنصار .  روى أهل العراق أن عطاء الخراساني كان يقاربهم في سبيل الله ، فيقوم الليل حتى إذا انفجر الصباح نادى بأعلى صوته: يا عبدالرحمن بن يزيد ويا هشام بن الغار، قوموا فصلوا فإن مكابدة هذا الليل خير من مقطعات النيران والسلاسل والأغلال النجاء النجاء النجاء الوحاء الوحاء! فلعل يا أخا الأنصار ما أنا فيه بدل من النار.  الحسن قال : سمعت الشريف أبا الحسن محمد بن علي بن الحسين بن الحسن الهمذاني يقول : سمعت محمد بن علي الأطروش يقول : سمعت أبا القاسم الصيرفي يقول : دخلت المارستان بالبصرة فرأيت في المجانين من تفرَّسْتُ فيه فسلمت فرد علي فقلت: ما هذا المكان؟ فقال: رضي لي بهذا ولا يُعارَضُ فيما يريد. قلت : أنشدني. فأنشأ يقول : يغرق في الفكر إذا رحله الشوق رحل
وحيثما كان إذا نزَّلَهُ الحبّ نَزَلْ
وهكذا أهل الهوى يلقون في الحُبِّ الخَبَلْ
مختبل معتبر يهيم في كل جَبَلْ
لو خطر الوهم به على التجني لاعتدل  الحسن قال : حدثنا أبو علي الحسن بن أحمد بن الحناط النسوي بها قال : حدثنا محمد بن عبد الرحمن البرزاباذي قال : حدثنا عبد الله بن أحمد القاضي قال : كانت مناظرة في مسجد الكرخ بين رجلين أحدهما معتزلي والآخر جبري، قد احتوشها الناس. فمر بهم مجنون معروف بالجنون فقال : ما هذه الزحمة؟ فذكروا له القصة. قال : فمن المعتزلي منهما ؟ فأشاروا إليه فقال : يا هذا أنت القائل إنك مخير بين فعلين إن شئت فعلت أحدهما دون الآخر؟ قال: نعم. قال: فأخر ولا تبل والأمر على ما تقول. فتعجب الناس من قوله.  الحسن قال : حدثنا أبو حاتم محمد بن حيان بن أحمد قال : حدثنا محمد بن الحسن بن قتيبة قال : أخبرني محمد بن زياد قاضي الأهواز قال : رأيت مجنوناً وقد دخل على مريض عائداً وهو يقول : وصف الطبيبُ فَهُم بما وصف الطبيب يعالجونه
بدوائه وغذائِهِ يَغْذونه ويروحونه
يرجون صحة جسمه هيهات مما يرتجونه  الحسن قال : كتب إلي جعفر بن محمد بن نصير الخُلدي أن أبا العباس أحمد بن يحيى حدثهم قال : كان ببغداد فتى يُجنّ ستة أشهر ويفيق ستة أشهر، فاستقبلني ذات يوم في بعض السكك فقال : ثعلب؟ قلت : نعم . قال : أنشدني . فأنشدته : وإذا مررت بقبره فاعقر به كوم الهجان وكل طرف سابح
وانضح جوانب قبره بدمائها فلقد يكون أخادم وذبائح فتضاحك وسكت ساعة ثم قال : ألا قال : اذهبا بي إن لم يكن لكما عقر إلى تُرْبِ قبره فاعقراني
وانضحا من دمي عليه فقد كان دمي من نداه لو تعلمان ثم إني رأيته يوماً بعد ذلك فتأملني وقال : ثعلب؟ قلت : نعم . قال : أنشدني . فأنشدته : أغار الجود نائله إذا ما ماله نفدا
وإن أسد شكا جُبناً أعار فؤاده الأسدا فضحك ثم قال : ألا قال : علم الجود الندى حتى إذا ما حكاه علم البأس الأسد
فله الجود مُقِرٌّ بالندى وله الليث مُقر بالجلد  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو الحسين عبدالله بن موسى السلامي بهراة قال : حدثنا محمد بن نصر الدمشقي سمعت أبا إسحاق الرملي يقول : كان عندنا رجل يشير إلى الحقائق، ويلحقه الوجد مع كل لحظة ولفظة . ثم غلب على عقله وخولط، فجعل يدور في المقابر ثم يدخل إلى المدينة فيأخذ القوت ثم يخرج هارباً بين المقابر ويردد هذه الأبيات: قد ضل عقلي وذاب جسمي وصنت عهدي وخُنتُ عهدك
لو قلت للنار: عَذَبِيهِ إذ لبلائي خـفـرتُ وَعدك
