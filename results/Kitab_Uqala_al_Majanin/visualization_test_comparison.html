فصرتُ في قعرها أنادي إياك أبغي إياك وحدك  حدثنا محمد قال : حدثنا الحسن قال : أخبرنا أبو الحسن محمد بن محمد الكارزي قراءةً عليه في داره قال : سمعت أبا عبد الله محمد بن الرومي قال : سمعت حيان بن علي القومسي يقول : ركبت بحر الصين فوقعت إلى جزيرة، فدخلتُ بعض سككها فقيل لي : احذر فإن هناك فتى مجنوناً. فبينا أنا واقف إذ خرج علي فتى مدهوش مرتد بأشجانه مؤتزر بأحزانه وهو يقول : لك هطلت الأماق، ولك بكت الأحداق، وذكرك مشهور في الآفاق، يا من ينعم بحبه أهل الإشفاق، يا من يداوي جراحات أهل الوجد والاحتراق. فسلمت عليه فرد علي ثم ولّى وأنشأ يقول : وكن لربك ذا حب لتخدمه إن المحبين للأحباب خدام
قوم يبيتون من وجد ومن قلقٍ ومن محبته في الليل قوام
قد قطعوا الليل دهراً في محبته ما إن يرونهم بالليل نوّام فقلت لأهل الجزيرة: ويلكم ما هذا مجنون قالوا: إنه يصحو في الأوقات ويجن في الأوقات.  حدثنا محمد قال: أخبرنا الحسن قال: سمعت محمد بن سليمان بن منصور يقول: سمعت علي بن مشكان بن جبلة الساوي بساوة يقول: رأيت بالكوفة مجنوناً قد تمنطق بمنطقة عريضة عليها مكتوب: حب ذي العرش سناء وشرف
وهدايا وعطايا وتُحَفْ
فَتَهجَّد في دجى الليل له لترى منه أعاجيب الطرف  حدثنا محمد قال: حدثنا الحسن قال: حدثنا أبو إسحاق إبراهيم بن أحمد بن سليمان بن عبدالله البصري ببغداد قال: حدثنا الحسن بن علي بن جعفر الخياط بالكوفة قال: سمعت أبي يقول: رأيتُ في مجنوناً في سوق دمشق يرقص ويقول: يا غافلاً مقبلاً على أمله وجاهلاً بالفناء في عملة
كم نظرة لامرىءٍ يُسَرُّ بها لعلّها منه منتهى أجله  حدثنا محمد قال : حدثنا الحسن قال : سمعت أبا الحسن علي بن عبدالرحيم القناد بمرو الروذ يقول : دخلت دار المرضى بالشام فرأيت شابا مسلسلا مغلولاً مستوفزا فقال لي : يا شيخ إن رويت لك أبياتاً تحفظها؟ قلت : نعم . فقال : يا نفسُ قومي بـي فقد نام الورى إن تفعلي خيراً فذو العرش يرى
وأنتِ يا عَيْنُ دَعي عنكِ الكرى عند الصباح يحمد القوم السُّرى  حدثنا محمد قال : حدثنا الحسن قال : حدثنا أبو عمرو المعتز بن محمد بن الفضل القاضي بزم قال : حدثنا أحمد بن الحسن الفريابي قال : حدثنا سهل بن علي الأنباري قال: اجتمع قوم إلى منصور فقالوا له : يا أبا السري . في جوارنا رجل مدهوش ذاهب العقل لا نرى له صورة فقال : أوقفوني عليه . فأتوا به بابه ليلا، فلما غارت النجوم وهدأت العيون سمعوه يقول: طال القيام لهجعة النوام أتراك مطلعاً لطول مقامي
يا سيدي ومؤملي وموفقي من أجل حبك قد هجرت منامي فأجابه منصور : يا ذا الذي ترك الرقاد لربه أَبشر بدار تحية وسلام
يوم القدوم عليه في دار البقا يوم تُزَفُّ إليه بالخدام  ٥٣٧ حدثنا محمد قال : حدثنا الحسن قال: سمعت أبا عبدالله بن محمد بن جعفر الطبيب الخاقاني بطبرستان يقول : دخلت دار الزمني ببغداد فإذا شيخ مقيد يبكي وقد خَنَقَتْه العبرة، فقلتُ له : ما لك؟ فقال : من كان أذنب ذنباً فَلْيَدْنُ منّي قليلا
لعلنا نتباكى على الذنوب طويلا  حدثنا محمد قال : حدثنا الحسن قال : سمعت أبا منصور مهلهل بن علي العنزي يقول : كان عندنا في عنزة مجنون يرمي ويضرب، فقيل له : إنك تقيد وتُشَدُّ فقال : ليس على فَوْت فائتٍ أَسَفُ
ولا تراني عليه التَهفُ
ما قدر الله لي فليس له عني إلى ما سواي مُنْصَرَفُ
ومانع ما لديه قلت له: لا ضير، في الله منك لي خَلَفُ  ٥٣٩ = حدثنا محمد قال : حدثنا الحسن قال : سمعت أبا محمد الحسن بن صالح بن عُجيف البغدادي بمرو يقول : مر بي مجنون بواسط فقلت له : يا مجنون . فقال لي : وأنت عاقل ؟ قلت: نعم. قال : كلانا مجنون . قلت : وكيف؟ قال : جنوني مقشر وجنونك مجلد. قلت : فسر لي . قال : أنا أخرق الثياب وأرمي وأُسْمِعُ ، وأنت تَعْمُر داراً لا بقاء لها والله يريد تخريبها، وتطوّل أملك وليس حياتك بيدك، وتعصي الرحمن وهو وليك، وتطيع الشيطان وهو عدوك . ثم مر.  حدثنا محمد قال : حدثنا الحسن قال : سمعت أبا نصر أحمد بن محمد بن ملحان البصري يقول : سمعت بشر بن موسى الأسدي يقول: سمعت الأصمعي يقول : مررت ذات يوم بمجنون في سكك الكوفة وقد جمع إلى نفسه الخرق من كل لون، راكباً قصبةً، فتأملته فإذا هو بعض من أختلف إليه. فتعرفت إليه فعرفني وتنفس في وجهي تنفس كئيب. فقلت : ما الذي أوجب هذه الحال؟ فقال: كن جاهلاً أو فتجاهَلْ تُعِدُ للجهل في ذا الوقت جاهاً عريضا  حدثنا محمد قال : حدثنا الحسن قال : سمعت أبا موسی عمران بن موسى بن الحصين يقول : سمعت إبراهيم بن محمد بن الحارث الكرماني يقول : سمعت جعفر بن عبدالباقي بالبصرة يقول : دخلت يوماً بعد العصر مع صاحب لي دار المجانين بالبصرة، وعلي شارة حسنة وثياب فاخرة وإذا شيخ في قيد وسلسلة، فجعلت أنظر إليه متعجباً فقال : أتعجب مني في قيودي وأغلالي وأنت رخي البال في العز والمال
فلا أنت تبقى بعد مالٍ كَسَبْتَهُ ولا أنا أبقى في قيودي وأغلالي  حدثنا محمد قال : حدثنا الحسن قال : سمعت أبا الفوارس حنتف بن أحمد بن أحمد بن حنتف الطبري بسارية قال : سمعت أبا الحسن العبسي المؤدب يقول : انحدرت من بالس أريد العراق، فدخلت الموصل وأقمتُ بها أياماً. فبينا أنا مار في بعض أزقتها إذا صياح وجَلَبة، فسألت عنها فقيل : ها هنا دار المجانين وهذا أصوات بعضهم . فدخلت فإذا بشاب مشدود متشحط في الدم . فسلمت فرد فقال : من أين تجيء؟ قلت: من بالس. قال : وأين تريد؟ قلت : العراق. قال: أتعرف بني فلان؟ وأشار إلى أهل بيت . قلت : نعم . قال : لا صنع الله لهم ولا أجار، هم الذين أدهشوني وتيموني وأحلُّوني هذا المحل . قلت : وما فعلوا ؟ قال : زموا المطايا واستقلُّوا ضحى ولم يُبالُوا قلب مَن تَيَّمُوا
ما ضرهم، والله يرعاهم، لو ودعوا بالطرف أو سلموا
ما زلت أذري الدمع في إثرهم حتى جرى من بعد دمعي دم
ما أنصفوني يوم بانوا ضُحًى ولم يفوا عهدي ولم يرحموا  حدثنا محمد قال: حدثنا الحسن قال: سمعت أبا جعفر محمد بن علي بن الطيان القمي يقول: سمعت سهل بن حازم الصيمري يقول: كان عندنا بصيمرة جارية مجنونة مقيدة لا تستقر على حال. فإذا قرىء القرآن بين يديها أفاقت وكانت كأعقل الناس، فإذا أمسك القارىء عادت إلى جنونها.  حدثنا محمد قال : حدثنا الحسن قال : حدثنا ثمل بن عبدالله بن محمد الطرسوسي المعروف بالفوطي بمرو قال : سمعت أبا علي الصوفي الحلواني يقول : سمعت شاه بن شجاع الكرماني يقول : دخلت البادية ذات سنة فإذا غلام أمرد موسوس بلا غطاء ولا وطاء ولا زاد، يسير من القافلة حجرة، فساعةً يعدو ويصيح، وساعة يرقص، وساعةً يشير إلى السماء، ولا يألف أهل القافلة. فقلت في نفسي : لأنظرن في شأن هذا الغلام من أين معاشه. فترقبته ذات يوم فدخل وسط أشجار أم غيلان فتبعته، فإذا هو يجني من شجرة شيئاً ويأكله، فتنحنحت، فلما بصُر بي قال : باعتزالي عنكم في الخلوات صار طعمي التمر جوف الفلوات  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو الفضل نصر بن أبي نصر العطار بطوس قال : حدثنا أبو العباس الفضل بن سليمان الرافقي بالرافقة قال : حدثنا سهل بن نصر البزاز قال : أصابنا سنة جدبة فخرجنا نستسقي وفيما بيننا مجنون يلعب ويهذي ويشغل الناس عن الاستسقاء . فقيل له : لم لا تسكت؟ فقال : إن رب الأرباب يعلم الغيوب وضمائر القلوب، وإنه عليم فيم جئتم ولم خرجتم، وإنه لا يخيب دعاءكم ولا يقطع رجاءكم، فاقصدوه بهمومكم فإنه يراكم . ولو أخلصتم في دعائكم لشغلكم ذلك عني وعن لعبي . قال : فأبكى ــ والله ــ الناس، فلما رأى ذلك قال : اللهم اسقهم ولا تردّهم خائبين يا أرحم الراحمين. فأغامت السماء وأغيث الناس .  ٥٤٦ أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا عبدالله محمد بن عاد البغدادي يقول : كان في جوار الجنيد شيخ مجنون . فلما مات الجنيد ورفعت جنازته حضر الجنازة، فلما فرغ من الصلاة صعد تلا وقال : كيف أعيش بعد ذلك السيد، ثم أنشأ يقول : واحسرتي من فراق قوم هم المصابيح والحصون والمُزْنُ والمُدْنُ والرواسي والخير والأمن والسكون
لم تتغيـر لنا الليالي حتى توفتهم المنون
فكلُّ جَمْرٍ لنا قلوب وكل ماءٍ لنا عيونُ  ٥٤٧ أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا يعلى محمد بن أحمد بن حمدان النسوي الفقيه بها يقول : سمعت أبا بكر الأنباري يقول : كان ببغداد صاحب شرطة، وكان له بساط حسن نظيف. فأخذوا شيخاً موسوساً قد شَجَّ بعض الناس فأدخلوه عليه ، فقال : ابطحوه ، يريد ضربه . فقال : نصيحة أيها الأمير قال : وما هي؟ قال : إن بساطك هذا نظيف، وإنك إن ضربتني والله سوطاً واحداً أحدثت عليه . فقال الوالي : هذه والله نصيحة، خَلُّوا سبيله . فَخَلَّوا عنه .  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا العباس عبدالله بن محمد الحياني ببوشنج يقول : سمعت أبا الحسين رضوان بن أحمد الصيدلاني ببغداد يقول : سمعت أبي يقول : دخلت دار المرضى بالبصرة، فرأيت شابا من أحسن الناس وجهاً وقد جعل في قيد وسلسلة . وكنتُ رأيته قبل ذلك في سوق البزازين بالبصرة في نعمة وهيئة حسنة، فقلت : ما الذي دهاك؟ فقال : تمطى علينا الدهر في متن قوسه ففرقنا منه بسهم شَتاتِ
فيا زمناً ولى على رغم أهله ألا عُدْ كما قد كنتَ مُذ سنوات  أخبرنا محمد قال : أخبرنا الحسن قال: سمعت أبا القاسم عبيد الله بن المأمون بن أحمد السلمي بهراة يقول : سمعت أبا ياسر عمار بن عبدالمجيد يقول : كان بباب خشك مجنون يجنّ يوماً ويفيق يوماً. فإذا كان يوم إفاقته قرأ القرآن وأكثر قراءة «بسم الله الرحمن الرحيم وحضر المجالس. وإذا كان يوم جنونه أسمع الناس وآذاهم فرأى رسول الله صلى الله عليه وسلم في المنام وهو يقول له : قد شفاك الله من جنونك بكثرة قراءتك بسم الله الرحمن الرحيم». ثم عاد صحيحاً كما كان.  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو موسى عمران بن موسى بن الحصين قال : أخبرنا محمد بن المسيب بن إسحاق الأرغياني قال : أخبرنا بكار بن عبدالله النصيبي قال: رأيت مجنوناً مدهوشاً في سوق أنطاكية والصبيان يرمونه وهو يقول : يا أولاد الطوامث يا أبناء الأخابث . فقال له بعض الناس : ولم تقذف أمهات الناس ؟ فقال : على رغمك من جرّ ذيل الناس جروا ذيوله.  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا منصور مهلهل بن علي العنزي يقول: سمعت أبي يقول : تشاجر رجلان في رجل ادعياه، فقال أحدهما : هو طفاوي وقال الآخر : هو من بني راسب فتحاكما إلى مجنون معروف بالجنون، فقصا عليه القصة فقال: الأمر في هذا هين، تُشَدُّ يداه ورجلاه ويطرح في دجلة فإن طفا فوق الماء فهو من طفاوة وإن رسب في الماء فهو من بني راسب.  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت علي بن أحمد النسوي يقول : سمعت أبا بكر الشبلي يقول دخلت دار المجانين ذات يوم فإذا أنا بشاب مصفود، فلما نظر إلي من بعيد عرفني فقال : يا أبا بكر إلي إلي. فدنوت منه فإذا هو بعض من كان يختلف معنا إلى الجنيد. فقلت له : حاجتك فأشار إلى قرطاس ودواة، فناولته فكتب: بسم الله الرحمن الرحيم يا أبا القاسم ما تقول في حال علا فظهر وظهر فقهر وقهر فيهر واستناخ واستقر، والشواهد منطمسة والأوهام خنسة والألسن خرسة والأوصاف مندرسة ولو اطلع الخلق على من هذا وَصْفُه لم يزده ذلك إلا توحشاً، ولو أقبل الخلق عليه تعطفاً لم يزده ذلك إلا بعداً. وقال لي : احتسب في إيصالها إليه. فأوصلتها إليه، فلما نظر في الرقعة بكى وجعل يكرر القراءة فقلت: أيها الشيخ إن الفتى ينتظرني. فكتب على ظهرها الحاصل فيما وصفته في رقعتك أن يُصفد صاحبها بالأغلال، ويُنكل به كل النكال، ويُغلب على عقله فيحال، ويجود الحق عليه بالحق ليصير عنده الخلق كالعيال. فحملتها إليه فقرأها وجعل يصيح ويزعق ويضطرب حتى غشي عليه. فقال لي صاحب المجانين: إياك أن تعود إلينا فإنك تزيد في جنون المجانين.  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا بكر محمد بن المنذر الضرير يقول : سمعت أبا الحسن علي بن سعيد الغازي يقول : سمعت علي بن عبدان الهيتي يقول : كان عندنا مجنون يُجنّ بالنهار ويفيق بالليل، فيصلي ويناجي ربه إلى الصباح. فقلت له يوماً : مُذ كم جننت ؟ فقال : مذ عرفه . ثم أنشأ يقول : جُنتُ وحق الله عما سواه
فإني وحق الله أبغي رضاه  أخبرنا محمد قال: أخبرنا الحسن قال: سمعت أبا محمد بن سعيد بن علي الفارسي ببخارى يقول: سمعت بكر بن علي بطرخان يقول: سمعت الوليد بن عبدالله السقاء بالرملة يقول: بينا أنا في منزلي ذات ليلة إذ قرع الباب عليّ قارع فقلت: من بالباب؟ فأنشأ يقول: أنا الذي ألبسني سيدي لما تَعرَّيتُ لِباس الوداد
فصرتُ لا أوي إلى مؤنس إلا إلى مالك رق العباد فخرجت فإذا أنا بغلام هائم ذاهب العقل مجنون مستوفز، فدخل الدار فقال: آتنا غداءنا لقد لَقِينَا مِن سَفَرِنا هذا نَصَباً. فعلمت أنه جائع، فقدمت له شيئاً فأكل وشرب، ووثب إلى الباب وأنشأ يقول: عليك اتكالي لا على الناس كلهم وأنت بحالي عالم لا تُعلَّمُ
فأقسم أني كلّما جُعْتُ سيدي ستفتح لي باباً فأُسقَى وأُطْعَمُ قال الوليد فقلت: توصيني بوصية فقال: الزم الخوف مع الحزن وتقوى الله فاربح
وَزِنِ الدنيا مع الأخرى فتقوى الله أرجح
واجتهد في ظلمة الليل إذا ما الليل أجنح
وَسَلِ اللَّهَ لعلّ الله عن ذنبك يَصفَح  وحكي عن مالك بن دينار قال: مررت يوماً ببعض سكك البصرة فإذا بصبيان يرمون رجلاً بالحجارة فقلت: ما هذا؟ فقالوا: مجنون يزعم أنه يرى ربه عز وجل على الدوام. فزَحزحت عنه الصبيان فإذا شاب بهي قد أسند ظهره إلى الحائط، فقلت: ما هذا الذي يزعم هؤلاء؟ قال: وما يزعمون؟ قلت: يقولون إنك ترى ربك على الدوام. فبكى وقال: والله ما فقدته مذ عرفته، ولو فقدته ما أطعتُه. ثم أنشأ يقول: على بعدك لا يَصْبِ رُ من عادته القُرْبُ

ولا يقوى على هَجْرِ ك من تيمه الحب

لئن لم تَرَكَ العين لقد أَبْصَرَك القلب  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا زكريا يحيى بن محمد بن عبد الله العنبري يقول : سمعت أبا منصور أحمد بن محمد الأحول المروزي يقول : سمعت علي بن حشرم يقول : وقف شيخ مجنون على مجلس هناد بن السري وهو غاص بأهله، وبيده حجر فقال له هناد: ما وراءك؟ فقال: احذر الأقارب فإنهم العقارب . ثم قال : وأخبت العقارب أقرب الأقارب. قال هناد لأصحابه : ويحكم اكتبوه .  أخبرنا محمد قال: أخبرنا الحسن قال: أخبرنا أبو بكر محمد بن عبدالله بن محمد قال: سمعت أبا عبد الله محمد بن زكريا بن دينار الغلابي يقول: سمعت العباس بن الفرج الرياشي يقول: عن العتبي قال: قال زياد: ما من كلام إلا له عندي جواب. فمر به مجنون وسمع ذلك منه فقال: أيسرك أنك من الحور العين؟ فتحير وبهت، ثم قال: إن من السكوت جواباً وإن جواب هذا الكلام السكوت.  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا الحسن علي بن عبد الملك بن درهم القاضي الطرسوسي يقول : سمعت علي بن شيبان الحلبي يقول : حدثنا مشايخ همدان قالوا : كان عندنا مجنون تجتمع عليه الناس، فإذا اجتمعوا عليه قال لهم : ترون ما أنتم فيه من حيرتكم وغفلتكم شيئاً هو إلا محنة العبودية ووطأة الشريعة في الدنيا، والحبس والحساب والسؤال والعذاب في الآخرة. وإنما الراحة ما أنا فيه : لا حرج في الدنيا ولا حساب في الآخرة.  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا الطيب محمد بن أحمد بن حمدون المذكر يقول : سمعت الحسين بن إسماعيل الفارسي يقول: سمعت عجيف بن آدم يقول : سمع الدارمي يقول : سمعت محمد بن عبدالله الرقاشي يقول : كنت في المسجد بعد العصر عند مغيب الشمس، ومعي مجنون جالس، فدخل رجل فنقر الصلاة أربعاً. فقال له المجنون : حبستها ما حبستها ثم أديتها زيوفاً ! والله لا تتقبل.  ٥٦٠ أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبدالله محمد بن عبد الله بن أحمد بن شبيب قال : حدثنا أحمد بن لقمان قال : حدثنا محمد بن المؤقل العبدوي قال : قيل لبعض المجانين وقد أفاق من صرعته : ما حالك ؟ فقال : يَلَذُّ الناس ما عمروا وعاشوا وما لي لذة في طول عمري
وما يغني الجمال وحسن ثوبي إذا ما كنت أُصْرَعُ كل شهر
فأبقى قد تلطخ حسن وجهي ببولي في الثياب ولست أدري
فليت الله عاجلني بموت ليكم سوء حالي لحد قبري  قال وقيل لآخر وقد بال في قميصه والناس يبكون: ما حالك؟ أيبكي الناظرون لسوء حالي
ولا يبكون عاقبة الليالي
وكم وجه جميل صار مثلي
ولم يك قبل ذلك في مثالي
إذا عوفيت يا هذا فشكراً
وعذ مما ترى من سوء حالي  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبدالله محمد بن عبدالله بن شبيب قال : أخبرنا أحمد بن لقمان قال : حدثنا أبو عبد الله بن القومسي قال : كان بالبصرة مجنون إذا أمسك الصبيان عن العبث به قال: يا أولاد الطوامث ما للسوق كاسدًا؟  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا الفرج أحمد بن محمد بن بنان النهاوندي يقول : سمعت بعض السياح يقول : دخلت دار المجانين بالبصرة، فرأيتُ فتى حسن الوجه مقيّداً مشدوداً إلى خشبة . فقلت له : كيف أنت؟ فأشار إلى الخشبة وقال : وقائل كيف أنت؟ قلتُ له: هذا جليسي فما تُرى حالي؟  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أحمد بن عمران السوادي يقول : سمعت أبا يعقوب الأبنوسي يقول : حكي لي عن ذي النون المصري أنه قال : رأيت شيخاً مجنوناً بدمشق مصفاراً بيده ركوة وعكازة، وقد كتب على جبته من ورائه : حتى متى يا شيخ ما تستحي يراك مولاك مع الغافلين
ما تستحي منه وما ترعوي غطى خطاياك عن العالمين
مَشَاكَ بين الناس في ستره وأنت معكوف مع الفاسقين وعلى كمه الأيمن مكتوب : عجبت لمن ينام وذو المعالي ينادي يا عباد أنا البذول
وهل يجد الخلائق مثل ربي وكلُّ فعاله حسن جميل وعلى كمه الأيسر مكتوب : إن الله عباداً كشفوا فيه القناعا
هل رأيتم خادماً عامَلَ مولاه فضاعا؟!
سوف أرويكم حديثاً قد سمعناه سماعا:
من دنا من ربِّه شِبْراً دنا منه ذراعا  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو الفضل جعفر بن محمد بن الصديق بنسف قال : حدثنا أبو يعلى محمد بن مالك الرقي قال : حدثنا عبدالله بن عبدالعزيز السامري قال : مررتُ بدَيْر هِزْقل أنا وصديق لي، فقال: هل لك أن تدخل فترى فيه ملاح المجانين؟ قلت : ذلك إليك . فدخلنا فإذا بشاب حسن الوجه مرجل الشعر مكحول العين أزج الحاجب، كأن شعر أجفانه مقاديم النسور، وعليه طراوة تعلوه حلاوة مشدود بسلسلة إلى جدار . فلما بَصر بنا قال : مرحباً بالوفد قرب الله ما نأى منكم بأبي أنتم . قلنا : وأنت فأمتع الله الخاصة والعامة بقربك، و آنس جماعة ذوي المروءة بشخصك، وجعلنا وسائر من يحبك فداك. فقال: أحسن الله عن جميل القول جزاء كما وتولى عني مكافأتكما قلنا : فما تصنع في هذا المكان الذي أنت لغيره أهل؟ فقال : الله يعلم أنني كَمِدُ لا أستطيع أبتُ ما أجد
نَفْسانِ لي : نَفْسٌ تضمَّنها بلد وأخرى حازها بلد
فإذا المقيمة ليست ينفعها صبر وليس يُقرّها جَلَد
وأظن غائبتي كشـاهـدتـي بمكانها تجد الذي أجد ثم التفت إلينا فقال : أحسنت؟ قلنا : نعم ما أقصرت ، وولينا . فقال : بأبي أنت ما أسرع مَلَلَكُم ! بالله أعيروني أفهامكم وأذهانكم . قلنا : هات! فقال : لما أناخوا قبيل الصبح عيسهم ورحلوها فسارت بالهوى الإبل
وقلبت من خلال السجف ناظرها ترنو إلي ودمع العين منهمل
وودعت ببنان عقده غَنَم ناديت : لا حملت رِجْلاكَ يا جَمَل
وَيْلي من البين ما ذا حلَّ بي وبهم يا نازح الدار حل البين وارتحلوا
يا راحل العيس عرج كي أُودعها يا راحل العيس في ترحالك الأجَلُ
إني على العهد لم أَنْقُضُ مودتهم يا ليت شعري وطال العهد ــ ما فعلوا؟ فقلنا ـ ولم نعلم بحقيقة ما وصف بجوناً منا - : ماتوا . فقال : أقسمت عليكم ماتوا ؟ فقلنا لننظر ما يصنع : ماتوا . قال : إني والله ميت في أثرهم. ثم جذب نفسه في السلسلة جذبةً دلع منها لسانه وندرت لها عيناه وانثعبت شفتاه بالدم، فتلبط ساعةً ثم مات . فلا ننسى ندامتنا على ما صَنَعْنَا.  ٥٦٦ أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبدالله بن شبيب قال : حدثنا أحمد بن لقمان حدثنا ابن القومسي قال : حدثنا يعقوب بن نعيم البغدادي ويعرف بابن قرقارة قال : حدثني أبو عمر البصري كنت ببغداد فأردت الانحدار إلى واسط ، فلما حاذينا دير هزقل دخلنا، وذكر الحديث.  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا الحاكم أبو الحسن محمد بن الحسين الجرجاني قال : أخبرنا الحسين بن دينار بنهاوند قال : أخبرنا بشر بن سعيد الصواف قال : كان عندنا مجنون أصيب بعقله وكان هجيراه أن يقول ليلا ونهاراً : أين قلبي أين قلبي ؟ فهرب ذات يوم من الصبيان ودخل بعض السكك، فسمع صراخ صبي ضربته أمه وأخرجته من الدار، وأغلقت دونه الباب . فبقي الصبي متحيراً لا يدري أين يمر، فعاد إلى باب والدته فوضع رأسه على عتبة الباب فنام، ثم انتبه فجعل يبكي ويقول : يا أماه إلى من أقصد؟ ومن أستفتح عليه الباب إذا أنتِ أغلقت الباب دوني ؟ ومن يُؤويني إن طردتني ؟ فَرَحمته أمه وأذنته وجعلت تقبله وتقول : يا قرة عيني أنت الذي ألجأت نفسك إلى ما حلّ بك، ولو أطعتني لم تلقَ مكروهاً. فتواجد الفتى وقام وصاح وقال : وجدتُ قلبي وجدتُ قلبي . فمر به بعض المريدين فقال : ما لك؟ قال : وجدتُ قلبي في سكة كذا عند فلانة، وأنشأ يقول : أحن إلى عطف جميل رأيته كطفل إلى أم تُـربيــه بـالـدر
أَحِنُّ كأفراخ صغار تجوّعَتْ إلى عطف أم حين غبن عن الوكر
فيا أمتا أن لو رأيت عذابها ويا أمتا أن لو دريت ولم تدري  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو صابر المعلى بن أسد الواسطي قال : حدثنا يحيى بن كامل بن عبد الكريم قال : سمعت الريان بن علي الأديب يقول : عَشِق فتى من أبناء بعض أصدقائي جارية لبعض الأشراف، فأَنحَله العِشق وبراه وتيمه وأضناه، حتى زال عقله ونفي عنه الطعام والشراب والمنام، وأخذ في الهجر والهذيان. فمررت به ذات يوم في بعض الخرابات فقلت له : يا فلان ما حالك ؟ قال : أسوأ حال؛ عقل هائم وعمر لازم وفكر دائم ثم أنشأ يقول : تَيَّمني حبُّها وأضناني وفي بحـار الـهـمــوم الــقـانـي

كيف احتيالي وليس لي جَلَدٌ في دفع ما بي وكشف أجزاني

يا ربّ فاعطف بقلبها فعسى ترحم ضعفي وطول أشجاني ثم مررت به بعد ذلك بأيام وهو يبكي ويتمرغ في التراب. فلما بصر بي قال : يا عم إني ميت الليلة. فقلت : الله يشفيك. فقبض تلك الليلة رحمه الله .  وقال يحيى بن سعيد : مر حوشب بمجنون من بني أسد وهو راكب قصبة والصبيان معه . فقال حوشب : قبحك الله ، تصنع هذا وأنت امرؤ من العرب؟ نجى ولـيـدتـه وأسلم شخصه
بئس الفتى عند الحفيظة حوشب قال : فأتبعه الصبيان يصيحون : بئس الفتى عند الحفيظة حوشب وهو يركض هارباً منهم .  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا علي الحسن بن أحمد بن علي الزنجاني الصوفي بأسفراين يقول : سمعت عبدالعزيز بن سعيد المنجوري يقول : سمعت سهلان القاضي يقول : بينا أنا مار في طرقات جبل وقد مرت علي قافلة عظيمة وإذا بفتى شاب على الطريق ذاهب العقل مدهوش عُريان، وبين يديه خُلقات متمزقة فقال لي : أين رأيت القافله ؟ قلت: في موضع كذا. قال: آه من البين آه من البين آه من دواعي الحين . قلت : وما دهاك ؟ فقال : شيعتهم من حيثُ لم يعلموا ورُحْتُ والقلب بهـم مـغـرم
سألتُهمْ تسليمةً منهم علي إذ بانوا فما سلموا
ساروا ولم يَرْثُوا المستهتر ولم يبالوا قلب من تيمـوا
واستحسنوا ظُلْمي فمن أجلهم يحبّ قلبي كلَّ من يَظْلِمُ  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا حمد محمد بن محمد بن بجيد بن أحمد يقول : سمعت عمي يقول : سمعت محمد بن قطن يقول: سمعت ذا النون يقول : بينا أنا أسير في بلاد الشام إذ أدركني المطر فأتيت قرية فإذا أنا بأهلها يصيحون بي ويقولون : احذر ذلك المجنون . فنظرت فإذا أنا بأسود، فدنوت منه فرفع رأسه إلي وقال : يا ذا النون؛ اعرف قدر الله يكن لك يداً ومؤيداً وسمعاً وبصراً. ثم قال : إلهي وسيدي ومولاي إن عرفتك فبمواهبك، وإن شكرتك فبعطيتك ثم قال: يا مأوى همم العارفين، رُدَّ قلبي إلى الإقبال عليك، واجعل بدني ممن ينتصب بين يديك .  ٥٧٢ أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبدالله محمد بن عبدالله بن أحمد الصفار الأصبهاني قال : حدثنا أبو بكر عبد الله بن محمد بن عبيد القرشي المعروف بابن أبي الدنيا قال : حدثنا عمر بن محمد الناقدي قال: حدثنا علي النسائي قال : قدم علينا عيسى بن يونس وأبو إسحاق الفزاري الرقة. فقام رجل إلى أبي إسحاق فقال : يا أبا إسحاق ما تقول في النبيذ؟ فسكت عنه ساعة ثم قال : ما تقول في النبيذ ؟ فسكت ثم قال : يا أبا إسحاق أَجِبْنا ما تقول في النبيذ؟ فقال: ما أدري ما أقول إلا أنني رأيتُ مجنوناً يصرع يسوي رأس سكران ! .  ٥٧٣ أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا الحسن علي بن عبد الرحيم القناد يقول : كنت بمصر فوصف لي مجنون حسن البديهة جيد الكلام، فطلبته حتى ظفرت به، فإذا شيخ عليه مهابة، فكلمته مليا فما أحار جواباً. ثم نظرت إلى فروته فإذا عليها مكتوب : عشرون ألف فتى ما منهم رجل إلا كألف فتى مقدامةٍ بَطَلِ
أضحَتْ مَزاودهم مملوءةً أملاً ففرغوها وأَوْكَوْها من الأجل  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا الحسن محمد بن أحمد بن الحسين الميزباني، بمرو يقول : سمعت خالد بن الحسين بواب الحسين بن عيسى يقول: قرع مجنون باب الحسين في نصف الليل، ففتح له فَزَبَره المجنون وقال له : لم فَتَحْتَ الباب في هذا الوقت؟ فإن قتلتك بسكيني هذه فمن ذا الذي يمنعك مني؟ قال الحسين : فإني لا أعود. فخلى عنه ومر.  ٥٧٥ أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا الفرج أحمد بن محمد بن بنان النهاوندي يقول : سمعتُ بعض السياح يقول: دخلت ببغداد دار المجانين فرأيتُ شيخاً ذا هيبة، مقيدا وهو يقرأ قراءة أبي عمرو بالإدغام الكبير ويجيد القراءة فقلت له : أيها الشيخ ما أحسن قراءتك للقرآن فيها أنت فيه ! . فتنفس وأنشأ يقول : مِحَنُ الزمان سحائب متراكمة
هي بالقوادح والفواجع ساجمة
فإذا أُصِبْتَ بنكبةٍ تَشْجَى بها فاذكر مُصابك بالنبي وفاطمة  وقال سالم خادم ذي النون المصري: قال ذو النون: رأيت مجنوناً أسود في بعض البوادي، كلما ذكر الله ابيض. فسمعته يقول وقد سألته: لم لا تأنس بالناس؟ أَنِسْتُ به فما أبغي سواه مخافة أن أَضِلَّ فلا أراه
وَحَسْبُك حسرةً وضنى وسقماً بصادر عن موارد أولياه  أخبرنا محمد قال : أخبرنا الحسن قال : حدثنا أبو موسى عمران بن موسى بن الحصين قال : حدثنا أبو عوانة يعقوب بن إسحاق قال: حدثنا أبو علي سهل بن علي قال : حدثني محمد بن إسماعيل الضبي قال : أخبرنا شعيب بن خالد الثقفي : حدثني أبو هذيل العلاف قال : دخلت من البصرة أريد العسكر فمررت بدير هرقل فقلت لأدخلن هذا الدير فأنظر إلى ما فيه. فدخلت فرأيت رجلاً حسن اللحية، فلم أزل أنظر إليه وأتأمله. فلما رآني لا أرد بصري عنه قال : معتزلي أنت؟ قلت : نعم. قال : إمامي أنت؟ قلت : نعم. قال: تقول القرآن مخلوق؟ قلت : نعم. قال : كن أبا الهذيل العلاف. قلت: أنا أبو الهذيل العلاف. قال : أسألك؟ قلت : سل. قال : أخبرني عن الرسول صلى الله عليه وسلم، أليس هو أمين في السماء وفي الأرض؟ قلت: بلى. قال : فأخبرني عنه، هل يدخله قيل أو حيف أو هوى؟ قلت : لا. قال : فأخبرني عن رأيه، أليس هو الذي لا يدخله زلل وشبهة من الشبه؟ قلت : بلى. قال: فأخبرني عمن هو دونه من الخلق، أليس يدخلهم في رأيهم الفساد والعلة والهوى وأنهم أضداد في كل شيء وإن كانوا أخياراً؟ قلت : بلى. قال : فلأية علة لم يقم لهم علم ينصبه يقول : هذا خليفتكم بعدي فلا تقتتلوا. لم يفعل هذا إلا أن يكون الاختلاف والفساد في أمته. قلت : معاذ الله أن يكون ذلك. قال : فلم تركهم وألجأهم إلى رأي من هو دونه في الصفة إذ لم يحب الاختلاف والتشتيت؟ فسكت فلم أدر ما أقول له فقال : مالك لا تجيب؟ لا تحسن؟ ثم تركته وخرجت. فلما رآني مولياً ناداني : يا شيخ ارجع إلينا. فرجعت إليه فقال: أحسبك تريد الخليفة. قلت: نعم. قال: فإذا صرت إليه فاذكرني له. قلت : نعم. فقال : إلى أن تصير إلى الخليفة اقض لي حاجة. قلت : وما هي؟ قال : تكلم هذه الفاعلة امرأة صاحب الدير تطلقني. فكلمتها فقالت : علينا في هذا ضرر. فلما رآها غير مجيبة قال : فسلها ألا تسعطني يومي. فسألتها فأجابت. ثم انصرفت عنه متعجباً، فلما صرت إلى سر من رأى ودخلت على الواثق قال لي : ما كان حالك في سفرك؟ قلت: أعجوبة يا أمير المؤمنين لم أسمع بمثلها. قال : وما هي؟ فقصصت عليه حديث المجنون. فقال : يحضر المجنون. فأحضر وأصلح من شأنه وأدخل عليه. فلما رآني قال : صاحبنا؟ قلت : نعم. قال الواثق : يا محمد بن مكحول كلمه. فقال المجنون : يا أمير المؤمنين هذا لا يحسن شيئاً، فإن كان عندك من يحسن. قال الواثق : فسل فإن المجلس مشترك، فمن كان يحسن أجابك. فسأل عن المسألة المذكورة، فأحجم القوم عن الجواب فالتفت إليه الواثق فقال: ليس ها هنا من يجيب فأجب. فقال : يا سخين العين أكون سائلاً ومجيباً في وقت؟! فقال الواثق : وما عليك أن تعلمنا. قال : أما إذا كان كذا فنعم. إن الله تبارك وتعالى حكم بحكم في خلقه لم يكن بد من أن يتعبدهم، وكان الاختلاف بينهم حكمه في خلقه إذ كان قد حكم عليهم بذلك الاختلاف قبل خلقهم. فأحجم القوم، ثم قام الواثق ليدخل الدار فقال المجنون : يا بن الفاعلة أخذت مرفوعنا وفررت؟ فأمر بالإحسان إليه.  ٥٧٨ أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أحمد بن عمران السوادي يقول : قال الفضيل بن عياض : الدنيا دار مرضى وللمجانين في دار المرضى شيئان : غُل وقيد، ولنا غُل الهوى وقيد المعصية .  ٥٧٩ أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا سليمان الفارسي يقول : بلغني عن سعيد بن سعد القرشي قال : رأيت مجنوناً على شاطىء الفرات يقول : أُجِلّ ما منك يبدو
لأنه منك جلا
وأنت يا سُؤلَ قلبي أَجَلُّ من أن تُجَلًا

أَفْنَيْتَني عن جميعي فصرتُ أرعى المحلا  ٥٨٠ أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو موسى عمران بن موسى قال : حدثنا أبو عوانة قال : حدثنا أبو علي قال : حدثنا عبدالرحمن بن عبدالله بن أخي الأصمعي قال : سمعت عمي الأصمعي يقول : ركب جعفر بن سليمان أمير البصرة في زي عجيب من الناس والدواب والغلمان والصقور والفهود . وكان عندنا بالبصرة رجل يتفقه، وكان في حداثة سنه يجالس العباد، فَغُلِبَ على عقله فخرج إلى طريق جعفر فوقف، فلما أبصره قال : يا جعفر بن سليمان انظر أي رجل تكون إذا خرجت من قبرك وحملت على الصراط، فهذا الجمع والزي لا يسوى غداً حبّة، ولا يُغنون عنك من الله شيئاً . يا جعفر إنك تموت وحدك وتقف بين يدي الله وحدك، وتدخل قبرك وحدك، وتجوز الصراط وحدك، ويحاسبك الله وحدك فانظر لنفسك فقد نصحت لك . فرجع جعفر من نزهته تلك وسأل عن الرجل فقيل : هو مغلوب على عقله .  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو موسى قال : حدثنا أبو عوانة قال : حدثنا أبو علي عن أبي يوسف الغسولي قال : قَبَضَ معتوه على ابن المبارك فقال له : اسمع . إن الأبرار مع العمال مع الأخيار من الزهّاد شَغَلهم ذِكْرُ الوقوف وهم الجواب عن ذكر الجنان وذكر الثواب . ثم أطرق إلى الأرض فقال له ابن المبارك : زدني . قال : أستغفر الله من شهوة الكلام.  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو موسى قال : حدثنا أبو عوانة قال : حدثنا أبو علي : سمعت أبا موسى الهلالي يقول: سمعت داود الطائي يقول : بينا قاعد إذ وقف علي مجنون فقال : يا داود، من زهد في الدنيا ملكها ومن رغب فيها عبدها .  أخبرنا محمد قال: أخبرنا الحسن قال: أخبرنا أبو موسى قال: حدثنا أبو عوانة قال: حدثنا أبو علي: حدثنا أبو موسى الهلالي عن ضمرة بن ربيعة وقف علي معتوه فخنقني وقال: تعلم. قلت: خلص عن حلقي. فخلى ثم قال: الشر نذالة، والعفو كرم، والاستقصاء غمّ، وشفاء الغيظ بليّة.  أخبرنا محمد قال: أخبرنا الحسن قال: أخبرنا أبو موسى قال: حدثنا أبو عوانة قال: حدثنا أبو علي حدثنا محمد بن يحيى الواسطي عن محمد بن الحسين قال: إني لقاعد في المسجد الحرام إذ مر بي معتوه، وغلمان يجرون خلفه، فالجؤوه إلى زنقة، فأخذ حجراً ثم شدّ عليهم وقال: إذا تضايق أمر فانتظِرْ فَرَجاً فأَضْيَقُ الأمر أدناه من الفرج  ٥٨٥ أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو موسى قال : حدثنا أبو عوانة : حدثني سهل بن علي، حدثني عبد الله بن محمد الأسدي قال: سمعتُ عبيد الله بن القرشي يقول: كان عِتْقُ أبي عوانة عجباً. كان أبو عوانة غلام يزيد بن عطاء الواسطي، فجاءه مجنون فقال : يا أبا عوانة، هب لي شيئاً حتى أنفعك، فوهب له شيئاً . فوقف يوم الجمعة على باب مسجد الجامع وهو يقول : يا أيها الناس ادْعُوا الله ليزيد فإنه أعتق أبا عوانة . فجعل الناس يأتون يزيد ويدعون له ويشكرونه عليه . فلما أكثروا عليه دعاه فقال : اذهب فإنك حر لوجه الله ! .  ٥٨٦ أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا الفرج أحمد بن محمد بن بنان النهاوندي يقول : مررت بدير أبي خلف فإذا جماعة وقوف على مجنون، فوقفت فهش إلى وقال : سقني قبل تباريح العطش إن يومي يومُ طَشَ بعد رش
حُبُّ من أهواه قد أدهشني لا خَلَوْتُ الدهر من ذاك الدهش  ٥٨٧ وروي عن ثمامة بن الأشرس قال : دخلت دير هرقل فرأيتُ شابًا مشدوداً إلى سارية . فقال : من أنت؟ قلت : ثمامة . قال : المتكلم؟ قلت : نعم . قال : فعمد إلى كوز فيه ماء فصبه ثم قال: أين ذهب هذا الماء؟ قلت: اجتذبته الأرض للحرارة. قال: فينبغي أن تفور الأرض في الشتاء عيوناً . قال : فأفحمني . قلت له : فما تقول : فقال : كل شيء يذهب إلى شكله ، الماء الذي تحت الأرض اجتذبه إلى نفسه . ثم قال : يا ثمامة، هل للنوم لذة؟ قلت : نعم. قال : متى يجدها صاحبها؟ إن قلت قبل النوم أحلت، وإن قلت مع النوم أخطأت ؛ لأنه ذاهب العقل. وإن قلت بعد النوم أخطأت لأنه قد انقضى . قلت : فما تقول أنت؟ قال: إن النعاس داء يحل بالبدن دواؤه النوم .  ٥٨٨ أخبرنا محمد قال: أخبرنا الحسن قال : سمعت أبا الفضل جعفر بن أحمد بن الحسين يقول : دخل الأمير السعيد مع أبي الفضل البلعمي بنيسابور دار المرضى فإذا شاب مقيد، فلما رأى الأمير قال : أيها الأمير، هذا وزيرك؟ قال : نعم . قال : يزعم أنه أعقل الناس فإن سألته مسألة . قال : سل. قال : ما أكثر الأشياء؟ قال : ذوات الأربع . قال : ليس كذلك. قال : فالهوام . قال : ليس كذلك. قال : فما هو ؟ قال : لا أقول حتى تُقرَّ بالعجز . قال : قد أقررت بالعجز . قال : أكثر الأشياء الهموم . قال : ولم؟ قال : لأن نصيبي منها أوفر الأنصباء . قال الأمير سل حاجتك. قال: مسكة عقل أعيش بها وأنجو من هذا القيد . قال : ليس ذلك إلي. قال : فلا حاجة لي في سواه ! .  ٥٨٩ أخبرنا محمد قال : أخبرنا الحسن قال : كتب إلي جعفر بن محمد بن نصير الخلدي أن جنيد بن محمد رحمه الله حدثهم قال : دخلت دار المرضى بمصر، فرأيتُ شيخاً مقيداً فسلمت عليه فرد ثم قال : ما اسمك؟ قلت: جنيد . قال : عراقي ؟ قلت : نعم . قال : ومن أهل المحبة؟ قلت : نعم . قال : فما الحب؟ قلت: إيثار المحبوب على سواه. فقال : الحب حبان : حب لعلة وحب لغير علة. فأما الذي لعلة فرؤيه الإحسان وأما الذي لغير علة فلأنه أهل أن يُحبّ. ثم أنشد : أحبك حبيْنِ: حُبَّ الهوى وحُبًا لأنك أهل لذاكا
فأما الذي أنت أهل له فليس أرى العيش حتى أراكا
وأما الذي هو حبُّ الهوى فحبُّ شُغِلْتُ به عن سواكا
وأما الذي لي فلا حمد لي ولكن لك الحمد في ذا وذاكا  وقال أبو غسان الإسماعيلي : دخلت البصرة فرأيتُ مجنوناً قد أحدق به الناس، فتأملتُ فإذا شيخ مغلولة يداه فَرَحِمتُه وأزحْتُ الناس عنه فتنفس الصعداء واستعبر، ثم قال : لقد صبرت على المكروه أسمعه من معشر فيك لولا أنت ما نطقوا
وفيك داريت أقواماً أُجاملهم لولاك ما كنتُ أدري أنهم خُلقوا
الحمد لله حمداً لا شريك له كأنني بدعة من بين من عشقوا  وقال بعض السياح: دخلت مسجد البصرة يوماً، فرأيتُ فقيراً عليه أثر البؤس وهو يترنّم في نفسه . فلما أحس بي سكت، فدنوت منه فإذا هو مجنون زائل العقل . فقلت : أَعِدْ عليَّ ما كنت تقول . فقال: أشار قلبي إليك كيما يرى الذي لا تراه عيني
وأنت تلقي على ضميري
حلاوة السؤل والـتـمــنـي
تريد مني اختبار سري وقد علمت المراد مني
وليس لي في سواك حظ فكيفما شئت فاختبرني  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبدالله محمد بن عاد البغدادي بأبيورد حدثنا محمد بن موسى بن حماد، حدثني حماد بن إسحاق بن إبراهيم الموصلي عن أبيه قال: رأيتُ بالموصل مجنوناً يطوف في الأسواق سوقاً سوقاً ويقول : ألا تلك المسرة لا تدوم ولا يبقى على الدهر النعيم
ولا يبقى على الحَدَثان غُفْرٌ بشاهقة له أم رؤوم فسألت عنه فقيل هو مجنون من أبناء أهل الشَّرَفِ ، ماتت زوجته وكان مشغوفاً بها فخولط .  ٥٩٣ أخبرنا محمد قال : أخبرنا الحسن قال : أنشدني أبو بكر أحمد بن عمر السوادي السياح قال : أنشدنا بعض الأدباء من شيبان : ولستُ بقَوّال لذي الزّادِ أَبْقِهِ فَإِنَّكَ إِن لَم تُبق زادَكَ يَنْفَدِ
ولا ناظر في وجهه ثم قائل ألا لا تصاحبنا إذا لم تَزَوَّدِ  وقال عمرو بن عثمان الصير في شَعْرَةُ : دخلت جبال فإذا أنا برجل في كوخ . فأقمت عليه يوماً وليلة لا أسمع كلامه ، فخرج من كوخه فرفع طرفه إلى السماء وقال : إلهي شهد قلبي لك في النوازل بسعة روح التفضّل، وكيف لا يشهد لك قلبي بذلك ؟ أَفَأَجْسْرُ أن يألف قلبي غيرك؟! هيهات! لقد خاب لديك المقصرون . ثم قال : إلهي ما أحلى ذكرك . ألست الذي قصدك المؤملون فنالوا منك ما طلبوا ؟ فقلت : أصلحك الله إني منتظرك منذ يوم وليلة أريد أن أسمع كلامك . فقال : قد رأيتك حين أقبلت ولم يذهب رَوْعُك من قلبي . قلت : وما راعك مني ؟ قال : فراغك في يوم عملك وبطالتك في يوم شغلك ، وتَرْكُك الزاد ليوم معادك، ومقامك على الظنون. فقلت : إن الله كريم وما ظَنَّ عبده به شيئاً إلا أعطاه . قال : نعم إذا وافقته السعادة والعمل الصالح قلت: أهاهنا فتية يُستراح إليهم؟ قال: نعم. قلت: فهل عندهم دواء يتعالجون به؟ قال : نعم إذا كَلُّوا دَاوُوُا الكَلالَ بالكَلالِ ، وحَثُوا الحث بالارتحال فتسكن العروق وتهدأ الآلام ! .  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا الحسن عيسى بن زيد العقيلي يقول : سمعت عبد الله بن حسان المزني يقول : مررت بمجنون مقيد والصبيان يؤذونه. فلما بصر بي قال : نَح عني هؤلاء الأنذال أُفِدْكَ أبياتاً تُسَرُّ بها. فَنَحيْتُهم عنه وقلت : هات . قال : أنا جائع . فجئته بشيء حتى أكله، ثم قلت له : هات . فقال : اصبر إذا عضك الزمان ومَن أَصْبَرُ عند الزمان من رَجُله
ولا تُهن للصديق تكرمةً نفسك كي لا تُعَدَّ من خَوَلِه
يحمل أثقاله عليك كما يحمل أثقاله على جَمَلِه
ولست مستبقياً أخاً لك لا تصفح عما يكون من زلله  وقال زياد النميري : دخلت دار المجانين، فإذا شاب حسن الوجه في زاوية، مشدود إلى جدار. فقال لي : أتقرأ القرآن؟ قلت : نعم. قال : فاقرأ. فقرأت اللَّهُ لَطيفٌ بعبادِهِ يَرْزُقُ مَن يشاء وهو القويُّ العزيز) قال : فأخبرني : ما معنى اللطيف؟ قلت : البار الرفيق. قال : هذا في وصف الناس. قلت : فما اللطيف؟ قال : الذي يُعرَفُ بلا كيف!  وقال سُكَينُ بن موسى : كنت مجاوراً بمكة، وكان بها مجنون ينطق بالحكمة. فقلت له : أين تأوي بالليل؟ فقال : إلى دار الغرباء . قلت : وما أعرف بمكة دار الغرباء . قال : يا سكين تلك المقابر. قلت: أما تستوحش في الليل وظلمته؟ قال : إذا ذكرت القبر ووحشته هان علي الليل وظلمته .  وقال علي بن المرداس الهاشمي : أتيتُ بغداد في تجارة، فدخلتُ دار المرضى فإذا مجانين مشدودون، وإذا شيخ له قِشْرٌ ورُواء، مقيد مسلسل منكس رأسه، فلما سمع حسي رفع رأسه وقال: من أين أقبلت؟ قلت : من الكوفة . قال : حياك الله . قلت : وأنت فنجاك الله مما أنت فيه . قال : لعل ما أنا فيه خير لي . قلت : وما ألجأك إلى ما أرى؟ قال : القَدَرُ المتاح من الخالق بين الورى. ولم أنكر منه شيئاً، فسألت عنه صاحب المجانين فقال : ليس فيهم إذا هاج أكثر اضطراباً منه .  وقال ذو النون: قلت لعليم: لم سُمِّيت مجنوناً؟ قال: أنا مجنون عن معصيته لا عن معرفته.  قال الأستاذ أبو القاسم رحمه الله: قد ذكرنا في هذا الكتاب ما حضر على الشرط الذي شرطناه . وأنا الآن أذكر ما شاهدته من المجانين في الآفاق؛ فإني لولوعي بهذا الشأن كنت كثير الاختلاف إلى دور المرضى وتأمل أحوالهم. ولقد دخلت بمرو دار المرضى وهي في الجبانة، فسمعت جلبة وصياحاً، فإذا شيخ مشدود وبجانبه شاب مقيد، وهما يتناظران في الثلج والجمد وتفضيل أحدهما على الآخر. فلما بصرا بي قالا: قد جاء من يتوسط بيننا . فقال الشيخ: أنا أقول إن الثلج أفضل من الجمد لأن الثلج من فعل الله ولا عمل للعباد فيه، والجمد من فعل المخلوقين. وقال الشاب: إن في الثلج يبوسة ليست في الجمد، والجمد ما استحال فصار جمداً فقلت: كلاكما على الصواب، لأني إن رجحت قول أحدهما على الآخر أسمعني الآخر بجنونه.  ٦٠١ قال : ودخلت بهراة دار المرضى فإذا شيخ مسلسل، فقلت له : يا شيخ أتريد النجاة مما أنت فيه ؟ قال : لا . قلت : ولم؟ قال: لأن القلم مرفوع عني فيها أتعاطاه، فإذا نجوت من هذه البلية أُجري القلم علي، فقد حُبِسْتُ وأُطلق عنك وستُحبَس ويُطلق عني .  قال: وقلت لمجنون: ما اسمك؟ قال: خليل الرحمن. قلت: فما لك ها هنا؟ قال: كان حظ إبراهيم الخُلَّةَ والفتوة، وحظي الجنون، والمولى حَكَمٌ عدل!.  ٦٠٣ قال: وقلت لآخر: أنت مجنون؟ قال: وأنت عاقل؟ الناس كلهم مجانين ولكن حظي صار أوفر.  وقلت لآخر: ما تصنع ها هنا ولست له بأهل؟ قال: خلق لي وخلقت له.  ٦٠٥ قال : وقلت لآخر : لم أر مجنوناً أعقل منك . قال : الجنون ما أنت فيه؛ تأكل رزق الله وتطيع عدوه. القضاء .  ٦٠٦ - قال : وقلت لآخر : ما الذي أصارك إلى ما أرى؟ . فقال : محتوم  ٦٠٧ قال: وقلت لآخر: أنت مجنون؟ قال: وأنت فسترد قبري.  ٦٠٨ قال : ودخلت دار المرضى بنيسابور، فرأيت شابا من أبناء النعم يقال له أبو صادق السكري، مشدوداً وهو يُجلب ويصيح . فلما بَصر بي قال : تروي من الشعر؟ . قلت : نعم . قال : مِن شِعْر مَن؟ قلت: من شئت. قال: من شعر البحتري . قلت : أي قصيدة تريد؟ فقال : أَلْمَعُ برق سرى أم ضوء مصباح أم ابتسامتها بالمنظر الضاحي فأنشدته القصيدة. فقال : أَفَأَنْشِدُك قصيدة؟ قلت: نعم. فأخذ في إنشاد قصيدة : أَقْصِرًا ليس ينفع الإقصار وأقلا لا ينفع الإكثار حتى بلغ قوله : إن جرى بيننا وبينك بُعْدُ وتناءت منا ومنك الديار

فالغليلُ الذي عهدت مقيم والدموع التي عهدت غزار فقفز وجعل يرقص في قيده إلى أن سقط مغشيا عليه.  قال : وقلت لآخر : ما تشتهي؟ قال: ما يقضى لي.  قال وقلت لآخر: غريب أنت؟ قال: أما عن عقلي فنعم، وأما عن البلد فلا.  وقال : وقلت لآخر ما تشتهي ؟ قال : موت الجازي . وكان الجازي صاحب المجانين يسقيهم الدواء ويضربهم.  وقال عبدان بن أحمد الهيتي : كان بباب خراسان إنسان موسوس، وكان يجالس الحسين بن منصور، وكان يدور في المقابر ويأتي الحسين بن منصور في أوقات، فرأيته ذات يوم وقد وقف على الحسين بن منصور وعلى رأسه دوخلة، والصبيان يصيحون خلفه . فقال للحسين : متى أخرج من نفسي متى آيس من نفسي
متى آنسُ بالإنس وأستأنس بالوحش
واستَوْحِشُ من جنسي فقال له الحسين : إذا خُلّيتَ في الوقت من المأتم والعُرس
شهدت النار والجنّة والأملاك والكرسي  تم الكتاب بحمد الله ومنه وطوله ، وصلى الله على سيدنا ونبينا محمد، وآله وصحبه وسلم. حسبنا الله ونعم الوكيل. نسخه لنفسه ولمن شاء الله من بعده الفقير إلى رحمة ربه، المعترف بزلله وذنبه، أبو بكر إسماعيل بن إبراهيم بن درع اللخمي، عفا الله عنه ولطف به وغفر له ولوالديه ولسائر المسلمين إنه جواد كريم . وكان الفراغ من نسخه يوم السبت رابع شهر ربيع الأول سنة وسبعين وست مئة أحسن الله تعالى عاقبتها ونفع قارئه به وكاتبه والناظر فيه، إنه ولي ذلك.`;

        function togglePipeline(pipeline) {
            const btn = event.target;
            btn.classList.toggle('active');

            const segments = document.querySelectorAll(`.segment.${pipeline}`);
            segments.forEach(seg => {
                if (btn.classList.contains('active')) {
                    seg.classList.remove('hidden');
                } else {
                    seg.classList.add('hidden');
                }
            });
        }

        function renderSegments() {
            const container = document.getElementById('text-container');
            container.innerHTML = '';

            let lastEnd = 0;
            const segments = allSegments;

            // Group overlapping segments
            const sorted = segments.sort((a, b) => a[0] - b[0]);

            for (let i = 0; i < sorted.length; i++) {
                const [start, end, pipeline, unit] = sorted[i];

                // Add text before this segment
                if (start > lastEnd) {
                    const text = textContent.substring(lastEnd, start);
                    container.appendChild(document.createTextNode(text));
                }

                // Add highlighted segment
                const seg = document.createElement('span');
                seg.className = `segment ${pipeline}`;
                seg.textContent = textContent.substring(start, end);

                const tooltip = document.createElement('div');
                tooltip.className = 'tooltip';
                tooltip.textContent = `${pipeline}: chars ${start}-${end}`;
                seg.appendChild(tooltip);

                container.appendChild(seg);
                lastEnd = Math.max(lastEnd, end);
            }

            // Add remaining text
            if (lastEnd < textContent.length) {
                const text = textContent.substring(lastEnd);
                container.appendChild(document.createTextNode(text));
            }
        }

        // Initialize
        renderSegments();
    </script>
