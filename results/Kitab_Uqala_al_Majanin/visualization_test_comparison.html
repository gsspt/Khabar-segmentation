وبيميـن صـب بـالـتـحـرج غـلهـا  أخبرنا محمد قال: أخبرنا الحسن قال: سمعت منصور بن العباس يقول: سمعت محمد بن إبراهيم بن خالد الهروي يقول: سمعت عبدالعزيز بن منصور يقول: سمعت الفتح بن سالم يقول: كان سعدون سياحاً لهجاً بالقول، فرأيته يوماً بالفسطاط قائماً على حلقة ذي النون وهو يقول: يا ذا النون متى يكون القلب أميراً بعد أن كان أسيراً؟ فقال ذو النون: إذا اطلع الخبير على الضمير فلم ير في الضمير سوى الخبير قال: فصرخ سعدون وخر مغشياً عليه ثم أفاق فقال: ولا خير في شكوى إلى غير مشتكى
ولا بد من شكوى إذا لم يكن صَبْرُ ثم قال: استغفر الله ولا حول ولا قوة إلا بالله. ثم قال: يا أبا الفيض: إن من القلوب قلوباً تستغفر قبل أن تذنب. قال: نعم، تلك قلوب تثاب قبل أن تطيع، أولئك قوم أشرقت قلوبهم بضياء روح اليقين. ثم قال: أوحى الله إلى نبي من الأنبياء: كن لي بكليتك أكن لك، وقل للمطيعين إن لم يطيعوني فلا يهربوا مني.  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبدالله محمد بن الطيب قال : حدثنا حفص بن عمر بن حفص قال : حدثنا علي بن عبد الحميد قال : حدثنا إبراهيم بن الجنيد عن عبيد الله الكاتب الهاشمي وكان ظريفاً أديباً قال : دخلت الحمام بلا مئزر وسعدون المجنون قاعد في زاوية فلما بَصر بي قال: يا غبي أين ذهب حياؤك وأدبك؟ ثم أنشأ يقول : أقول وفي قولي بلاغ وحكمة
وما قلت قولاً جئتُ فيه بمنكر
ألا يا عباد الله خافوا إلهكم
ولا تدخلوا الحمام إلا بمئزر  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا عبدالله محمد بن عبيد الله الشاشي يقول : سمعت أبا سعيد الهيثم بن كليب يقول: سمعت سعيد بن عثمان الحمصي يقول : سمعت إسماعيل بن أوفى يقول : قعدنا في جزيرة بني فلان نتشارب المزر وشيخ فينا يغني ويقول : أما النبيذ فلا يَذْعَرْك شاربه
واحفظ ثيابك ممن شُرْبُه الماء فإذا هاتف يهتف : كذبت يا شيخ . أما النبيذ فقد يزري بصاحبه
ولا أرى شارباً أزرى به الماء فالتفتنا إليه فإذا هو سعدون المجنون .  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبدالله محمد بن الطيب قال : حدثنا حفص بن عمر بن حفص قال : حدثنا علي بن عبدالحميد عن إبراهيم بن الجنيد عن أبي عطاء البناء قال : كنت أبني قصراً فأشرفت من بعض الجدران فإذا أنا بسعدون يكتب بقطعة فحم على جدار: ما حال من سكن الثرى ما حاله
أمسى وقد رثت هناك حباله
أمسى فلا روح الحياة تصيبه
أبداً ولا لُطف الحبيب يناله
أمسى وقد درست محاسن وجهه
وتفرقت في قبره أوصاله
واستبدلت منه المجالس غيره
وتُقُسِمت من بعده أمواله
ما زالت الأيام تلعب بالفتي
والمال يذهب صفوه وحلاله  أخبرنا أبو بكر قال : أخبرنا الحسن قال : سمعت الحاكم أبا الحسن محمد بن الحسين الجرجاني ببوشنج يقول : سمعت إبراهيم بن فاتك يقول : سمعت يوسف بن الحسين يقول : سمعت ذا النون المصري يقول : رأيت سعدون في مقابر البصرة وهو يناجي ربه عز وجل ويقول بصوت عال: أحد أحد، فسلمت عليه فرد علي فقلت : بحق من تناجيه إلا وقفت، فوقف ثم قال: قل. فقلت: توصيني بوصية أحفظها عنك أو بدعوة تدعو بها؟ فأنشأ يقول : يا طالب العلم هاهنا وهنا ومعدن العلم بين جنبيكا
إن كنت تبغي الجنان تسكنها فأسبل الدمع فوق خديكا
وقم إذا قام كل مجتهد وادع إلى أن يقول لبيكا قال : ثم مضى وهو يقول : يا غياث المستغيثين أغثني فقلت: ارفق بنفسك فلعله ينظر إليك برحمته، فنزع يده من يدي وعدا وأنشأ يقول : سلام على طيب المقام سلام فليس لعين المستهام منام
ولو نزل الإغماض يوما بجفنه لأيقظه مما يُجِنُّ ضرام ثم مضى وتركني .  ۲۰۷ أخبرنا محمد قال: أخبرنا الحسن قال : سمعت أبا عبدالله محمد بن عبيد الله الشاشي يقول : سمعت محمد بن حيان بن تميم بالرملة يقول : سمعت أحمد بن أبي الحواري يقول : سمعت رياح القيسي يقول : سمعت مالك بن دينار يقول : أصاب الناس بالبصرة قحط شديد فخرجنا نستسقي وما تزداد السماء إلا صحواً، فإذا أنا بسعدون في بعض تلك الخرابات فقلت له : بالذي خلقك أن تستسقي لنا. فرفع رأسه إلى السماء وقال : يا فاطر الأشباح والأرواح ومنشىء السحاب والأرياح وفالق الإصباح، بحق ما جرى البارحة أن ترحم عبادك وبلادك ولا تهلك بلادك بذنوب عبادك . قال مالك : فما استتم كلامه حتى أرخت السماء عزاليها وجادت بوابلها فخرج يخوض الماء وهو يقول : قل لدنياي أبعدي وتولي إن تريني فإنني لا أراك
وصلي واملكي وداد سوائي إنني مغرم بحب سواك
إن تكوني أَسَرْتِ بالذنب قوماً فاذهبي أنت لست من أسراكِ
إنني مكتفٍ بعرفان ربي فكفاني ما قلته وكفاك  ۲۰۸ حدثنا محمد بن الصباح قال: خرجنا من البصرة نستسقي، فلما أصحرنا إذ أنا بسعدون يفلي جبة صوف، فلما رآنا قام وقال: إلى أين؟ قلنا: نستسقي القطر. قال: بقلوب سماوية أم بقلوب خالية؟ قلنا: بقلوب سماوية. قال: فاجلسوا ها هنا واستسقوا. قال: فجلسنا حتى ارتفع النهار وما تزداد السماء إلا صحواً ولا الشمس إلا حراً، فنظر إلينا وقال: يا بطالين لو كانت قلوبكم سماويةً لسقيتُم، ثم توضأ وصلى ركعتين ولحظ السماء بطرفه وتكلم بكلام لم أسمعه، فوالله ما استتم كلامه حتى رعدت وبرقت ومطرنا مطراً جَوْداً. فسألته عن الكلام الذي تكلم به فقال: إليكم عني إنما هي قلوب حنّت فَزَنْت فعاينت فعلمت وعَمِلَتْ وعلى ربها توكَّلَتْ. ثم أنشأ يقول: أَعْرِضْ عن الهجــر والـتـمـادي وارحل إلى سيد جواد
ما العيش إلا جوار قوم
قد شربوا صالح الوداد  ۲۰۹ قال : وقرأت على جبته مكتوباً : يا ذنوبي عليكِ طال بكائي صرت لي مأتماً فقل عزائي
في كتابي عجائب مثبتات ليتني ما لقيتها في بقائي
نظر العـيـن قـادنـي للخطايا
لِمْ أدَمْتُ اللحوظ للأهواء
تالياً للقران يتلو المعاصي اسمه في السماء عبد مُرائي  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت الحاكم أبا الحسن محمد بن الحسين يقول : سمعت إبراهيم بن فاتك يقول : سمعت يوسف بن الحسين يقول : سمعت ذا النون المصري يقول : خرجت يوماً بكرة إلى مقابر عبدالله بن مالك فرأيت شخصاً كلما رأى قبراً منخسفاً وقف عليه، فقصدته فإذا سعدون فقلت : سعدون؟ قال: سعدون . قلت : أي شيء تصنع ها هنا؟ قال : إنما يسأل عما أصنع من أنكر ما أصنع ، فأما من عرف ما أصنع فما معنى سؤاله؟ فقلت : يا سعدون تعال نبكِ على هذه الأبدان قبل أن تبلى ، فتأوه ثم قال : البكاء على القدوم على الله تعالى أولى بنا من البكاء على الأبدان، فإن يكن عندها خير فخيرها عند ربها أكثر من بلاها . وإن يكن عندها شر فشرها عند ربها شر من بلاها في القبور، فليتها تُرِكَتْ تبلى في القبور ولم تبعث للحساب. يا ذا النون إنك إن تدخل النار فلا ينفعك دخول غيرك الجنة، وإن تدخل الجنة لا يضرك دخول غيرك النار ثم قال : يا ذا النون وإذا الصحفُ نُشِرَتْ . ثم صاح واغوثاه بالله ماذا يقابلني في الصحف! قال: فغشي علي فلما أفقت إذا هو يمسح وجهي بكمه ويقول : يا ذا النون: من أشرف منك إن مت مكانك هذا ؟ .  قال محمد بن الصباح وقرأت على قميص لسعدون : عين فابكي عليّ قبل انطلاقي
بدموع تمل منها المآقي
واندبي مصرعي فقد قُضِيَ الأمرُ
وَنُوحي علي قبل الفراق  وقال مالك بن دينار دخلت جبانة البصرة فإذا أنا بسعدون فقلت له : كيف حالك؟ وكيف أنت؟ فقال : يا مالك كيف يكون حال من أمسى وأصبح يريد سفراً بعيداً بلا أهبة ولا زاد ويقدم على ربّ عدل ؟ ثم بكى بكاء شديداً فقلت : ما يبكيك؟ قال : والله ما بكيتُ حرصاً على الدنيا ولا جزعاً من الموت لكني بكيت ليوم مضى من عمري لم يحسن فيه عملي، أبكاني والله قلة الزاد وبعد المفازة والعقبة الكؤود، ولا أدري بعد ذلك أصير إلى الجنة أم إلى النار. فسمعت منه كلام حكيم فقلت له : إن الناس يزعمون أنك مجنون فقال : وأنت قد اغتررت بما اغتر به بنو الدنيا، زعم الناس أنني مجنون وما بي جنة، ولكن حب مولاي خالط قلبي وأحشائي وجرى بين لحمي ودمي وعظمي، فأنا والله من حبه مشغوف. فقلت يا سعدون، فلم لا تجالس الناس وتخالطهم؟ فأنشأ يقول : جد عن الناس جانبا كي يظنوك راهبا
لا تودن مؤاخيا وصديقاً وصاحبا
قلب الناس كيف شئت تجدهم عقاربا  ٢١٣ أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا محمد بن الطيب قال : حدثنا حفص بن عمر قال : حدثنا علي بن عبد الحميد عن إبراهيم بن الجنيد عن عبدالقدوس بن عبدالوارث العقيلي قال : دخلت البصرة لحاجة فإذا أنا بسعدون يقف في مربعة مربعة يقرأ : يا أيها الناس اتقوا ربكم إن زلزلة الساعة شيء عظيم إلى قوله شديد . فلم يزل يرددها إلى آخر النهار ثم رمى بطرفه نحو السماء وهو يقول : عَزَّ علي أن يشغلوا بتجارات الدنيا عن تجارات ربحها بين يديك ثم أنشأ يقول : ولو لم يكن شيء سوى الموت والبلى وتفريق أعـضـاء ولـحـم مـبـدد
لكنت حقيقاً يا بن آدم بالبكا على نائبات الدهر مع كل مُسعِدِ  ٢١٤ أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبدالله محمد بن عبدالله بن أحمد الصفار قال : حدثنا ابن أبي الدنيا قال : حدثنا محمد بن الحسين عن عبدالله بن خالد الطوسي قال : لما خرج هارون الرشيد إلى مكة فُرش له من جوف العراق إلى الحرم لبود مرعزي، وكان حلف ألا يحج إلا راجلاً، فاستند يوماً إلى ميل وقد تعب فإذا بسعدون قد عارضه وهو يقول : هب الدنيا تواتيكا أليس الموت يأتيكا؟
فما تصنع بالدنيا وظل الميل يكفيكا؟
ألا يا طالب الدنيا دع الدنيا لشانيكا
كما أضحكك الدهر كذاك الدهر يبكيكا فشهق الرشيد شهقة فخر مغشيا عليه حتى فاتته ثلاث صلوات .  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا بكر محمد بن عبدالله حفيد العباس يقول : سمعت جدي العباس بن حمزة يقول : سمعت ذا النون المصري يقول : بينا أنا في بعض أزقة مصر إذا أنا بسعدون المجنون وعليه جبة صوف جديد مكتوب عليها خطوط قد أدخل رأسه فيها، فسلمت عليه فرد السلام فقلت : قف يا سعيد حتى أنظر ما على جبتك فوقف، فقرأت على كمه [الأيمن] سطر : عصیت مولاك يا سعيد ما هكذا تفعل العبيد وعلى كمّه الأيسر سطران : تبّاً لمن قُوته رغيفُ يأتي به الـسـيـد اللطيف

يعصي إلهاً له جَلالُ راحم رؤوف ومن خلفه سطران : كلُّ يوم يمر يأخذ بعضي يُذهب الأطيبين منـي ويـمـضـي

نفسُ كُفّي عن المعاصي وتوبي ما المعاصي على العباد بفرض وبين يديه سطران: أيها الشامخ الذي لا يُرام نحن من طينة عليك السلام

إنما هذه الحياة متاع ومع الموتِ تستوي الأقدامُ وعلى عكازته مكتوب : اعمل وأنت من الدنيا على وجل واعلم بأنك بعد الموت مبعوث

واعلم بأنك ما قدمت من عمل يُحصى عليك، وما خلفت موروث قال : فقلت له : أنت حكيم ولست بمجنون قال: أنا مجنون الجوارح ولست بمجنون القلب. ثم ولى هارباً.  قال : وسمعت أبا عبدالله النشاشي يحكي عن ذي النون المصري أنه قال : بينا أنا أطوف ببيت الله ذات ليلة وقد هَدَأَتِ العيون، إذا أنا بشخص قد حاذى البيت وهو يقول : ربِّ عبدك المسكين الطريد الشريد من بين خلقك، أسألك من الأمور أقربها إليك، وأسألك باصطفائك الكرام من الأنبياء إلا سقيتني بكأس محبتك، وكشفت عن قلبي أغطية الجهل حتى أرقى بأجنحة الشوق إليك فأناجيك في أركان الحق بين رياض بهائك . ثم بكى حتى سمعت معت وقع دموعه على الصفا، ثم ضحك وانصرف فتبعته وقلت في نفسي : إما عارف وإما مخذول، حتى خرج من المسجد وأخذ خرابات مكة فالتفت إلي : مالك ارجع أما لك رواح؟ أما لك شغل؟ قلت : ما اسمك رحمك الله ؟ قال : عبد الله . قلت : ابن من؟ قال : ابن عبدالله . قلت : قد علمت أن الخلق كلهم عبيد الله وبنو عبد الله فما اسمك؟ قال: سماني أبي سعدون. قلت: المعروف بالمجنون؟ قال : نعم . قلت : فمن القوم الذين سألت الله تعالى بهم وبحرمتهم؟ قال : أولئك قوم ساروا إلى الله تعالى سير من قد نَصَبَ المحبة بين أعينهم، وتجرد تجرد من أخذت الربانية بقلبه . ثم التفت إلي وقال : ذو النون؟ قلت : نعم . قال : يا ذا النون، بلغني أنك تقول فقل شيئاً أسمع في أسباب المعرفة . فقلت: أنت الذي يقتبس من علمك . قال : حق السائل الجواب، ثم أنشأ يقول : قلوب العارفين تحن حتى تحل بقربه في كل راح
صَفَتْ في ود مولاها فما إن لها من وده أبداً براح  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو يوسف أحمد بن محمد بن قيس السجزي قال : حدثنا أبو الحسين محمد بن حامد بن هارون التاجر السجزي قال : سمعت موسى بن بحر يقول : كان سعدون المجنون إذا اشتد به الجوع رمى بطرفه نحو السماء وقال : أتتركني وقد آليتَ حَلْفاً بأنك لا تضيع من خَلَقْتا
وأنك ضامن للرزق حتى تؤدي ما ضمنت كما قسمتا
وإني واثق بك يا إلهي ولكن القلوب كـمـا عـلمـتـا  وقال عيسى بن علي : رأيت سعدون ذات يوم والصبيان يؤذونه، فطردت عنه الصبيان فقال لي بعض الصبيان إنه يزعم أنه يرى ربه . فقلت له : أما تسمع مقالة الصبيان؟ قال: وما يقولون؟ قلت: يقولون إنك ترى الله، فقال : يا أخي مذ عرفت الله ما فقدته . ثم أنشأ يقول : زعم الناس أنـنـي مـجـنـون
كيف أسلو ولي فؤاد مـصـون
عَلِقَ القلب بالبكا في الدياجي
وهو بالله مغرم محزون  قال : وقرأت على فروة له : نغص الموت ويحـه كلَّ طِيبِ ودهاني بفقد كلّ حبيب
كم وكم قد رأيتُ من حَدَثِ السن غرير كغصن بانٍ رطيب
حَسَّ بالموت فانثنى بانكسار واضعاً خـده بـذل عـجـيـب
قائلاً: إخوتي سلام عليكم
آذنت شمس مدتي بالمغيب  وقال مالك بن دينار كنت حاجا فغلبتني عيناي فرقدتُ عند الكعبة فوقف سعدون على رأسي وقال يا أيها الراقد كم ترقد قم يا حبيبي قد دنا الموعد
وخذ من الليل وساعاته واسجد إذا ما سجد السجدُ كتب سعدون إلى الخلفاء والأمراء  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا محمد بن الطيب قال : حدثنا حفص بن عمر قال : أخبرنا علي بن عبد الحميد قال : أخبرنا إبراهيم بن الجنيد عن سلمة بن نعيم قال : كتب سعدون إلى جعفر المتوكل : يا أخي أما بعد فإنك قد طمعت في الحياة ونسيت تراصف الأقدام وتطاير الصحف في الشمائل والأيمان. فاذكر حسرتك عند انكشاف الغطاء واقرأ : فلا أنساب بينهم يومئذ ولا يتساءلون.  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا محمد قال : حدثنا حفص قال : أخبرنا علي قال : حدثنا إبراهيم عن عطية بن إسماعيل قال : كتب سعدون إلى المأمون في زمانه وقد بنى قصراً : يا من بنى القصر في الدنيا وشيـده أسست قصرك حيث السيل والغرقُ
لو كنت تُعنى بذخر أنت داخـره أسسته حيث لا سوس ولا خَرَقُ
والموت مصطبح فيكم ومغتبق فاحتل لنفسك قبل الورد يا حَمِقُ
واذكر ثموداً وعاداً أين أين هم فلو بقي أحد من بعدهم لَبَقُوا وكتب عنوان الكتاب لم يلد ولم يُولَدْ ولم يكُنْ له كُفُواً أَحَدٌ.  ۲۲۳ أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا محمد قال: حدثنا حفص قال : حدثنا علي قال أخبرنا إبراهيم عن عطاء بن سعيد قال : كتب سعدون إلى والينا وكان قد آذانا : أما بعد يا هذا فإنك إن لم تستحي من نفسك فاستحي من ربك، ولا يغرنك بسطه عليك فإنه إن عَافَصَك أهلكك وهتكك . ثم كتب عنوانه إِنَّ السَّمْعَ والبَصَرَ والفؤادَ كُلُّ أولئك كان عنه مسؤولاً .  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا محمد قال : حدثنا حفص قال : حدثنا إبراهيم عن عبد الله بن سهل قال: كتب سعدون إلى بعض الخلفاء : أما بعد فإن الله أخذ على السماوات والأرض والجبال عهداً فأودعه إياهن ؛ فأما السماوات فتناثر نجومها وانطمس شمسها واضمحل قمرها وتراصدت أقدام سكانها وارتعدت أكنافها. وأما الأرض فانزوى أطرافها واكدودر ماؤها وتناثر أوراق شجرها وأغصانها وثمارها. وأما الجبال فتجلمدت شوافحها وسالت أوديتها ارتعاداً وانتفاضاً من شدة الأمانة التي كلفتها. وأنت في ضعف حيلتك وبلادة خواطرك وعجزك قد كلفت الأمانة فما تحرك عليك عضو ولا تزعزع منك مفصل. قد ركنت بجانب مخادعك وجعلت الدنيا نزهة بطالتك، فانتبه من رقدة الوسن قبل أن يكتنفك الحزن والسلام . كتبه إلى إخوانه :  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا محمد بن الطيب قال : أخبرنا حفص قال : حدثنا علي قال : حدثنا إبراهيم عن عبدالصمد بن إسرائيل قال : كتب سعدون إلى بعض إخوانه : أما بعد يا أخي جَعَلَنا الله وإياك من الذين غاصوا في بحر الشوق فاستخرجوا صدف اللطف فسقط عنهم الأذى والأسف. ثم كتب عنوانه : من تعب راح، ومن راح استراح.  أخبرنا محمد قال : أخبرنا الحسن قال : حدثنا حفص قال : حدثنا علي قال : أخبرنا إبراهيم عن نصر بن خالد قال : كتب سعدون إلى بعض إخوانه : أما بعد يا أخي، جعل الله قلبك سماوياً معلقاً بجلال مودته حتى ينصب إليك ينابيع الدلائل فتشمو إليه بمواريث الطاعة . ثم كتب عنوانه : ميراث صفاء القلوب الجوع ودوام الشره يميت القلوب .  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا محمد قال : أخبرنا حفص قال : حدثنا علي قال : حدثنا إبراهيم عن وديعة الواسطي قال : كتب سعدون إلى بعض إخوانه أما بعد يا أخي فارحل قبل أن يُرحل بك وتزود قبل المسير إلى ربك فإنك تريد قطع مفاوز لا يقطعها البطالون، قطع الله عنك الطمع وجعلك ممن وصف في كتابه ولا يمسهم فيها نَصَبٌ وما هم منها بمخرجين  أخبرنا محمد قال: أخبرنا الحسن قال: حدثنا محمد قال: حدثنا حفص قال: حدثنا علي قال: حدثنا إبراهيم عن سعيد بن عبدالله الأجري قال: كتب سعدون إلى بعض إخوانه أما بعد فقد بلغني أنك تركت الآخرة وأقبلت على الدنيا، وإذا كان العبد من الله تعالى في كفاية ومال إلى الدنيا سلبه الله تعالى حلاوة الطاعة فيظل حيران فيقبل بعد ذلك عليه فيقول: عبدي ارجع إلى ما كنت عليه.  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا محمد قال : حدثنا حفص قال : حدثنا علي قال : حدثنا إبراهيم عن إسماعيل بن عبدالله قال : كتب سعدون إلى بعض إخوانه أما بعد، من استعمل مِعْوَل الفهم قوي على حفر خنادق الكد، ومن أتى جُبَّ المعرفة استقى بدلو الجد، ومن نظر في مرآة الفكر سقطت عنه لذة الكرى . يا ذا الذي طلب الظلام لنفسه لا تَرْقُدَنَّ فإنّه يرعاكا  ۲۳۰ أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا محمد قال : حدثنا حفص قال : حدثنا علي قال : حدثنا إبراهيم عن إسماعيل بن عبدالله قال : كتب سعدون إلى بعض إخوانه أما بعد يا أخي كن حيياً تسلم. واقطع كل قاطع يقطعك عن الله عز وجل، فإن قبلت ذلك وإلا هلكت. ثم كتب فيه : ومن الناس من يعيش سفيها جاهل القلب غافل اليقظة
فإذا كان ذا وفاء ورأي حفظ الوقت واتقى الحَفَظَة
ومن الناس راحل ومقيم فالذي بان للمقيم عِظَة  أخبرنا أبو بكر قال : أخبرنا الحسن قال : أخرنا محمد قال : حدثنا حفص قال : حدثنا علي قال : حدثنا إبراهيم عن عبدالله بن سهل قال كتب سعدون إلى بعض إخوانه أما بعد يا أخي، فإنه من تَعَرَّض لعقوبة الله هَوَى وشَقِي، ومن تعرّض لرضى الله كُفِي ووقي . فأجعل حظك من دنياك الاشتغال بطاعة مولاك والسلام .  وبهذا قال: كتب إلى بعض إخوانه: تُحبُّ الصالحين بزعم قلبـك وتخلو إن فقدتهم بذنبك
فمن حبّ الخليل يفر منه؟ فهذا كله من كذب حبك
ستندم حين لا ندم بِمُجْدٍ وتعلم ما يحل غداً بجنبك  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبدالله محمد بن عبيدالله الشاشي قال : حدثنا محمد بن حيان بن تميم بالرملة قال : حدثنا أحمد بن رباح قال : قال مالك بن دينار : مات بعض قراء البصرة فخرجنا في جنازته، فلما انصرفنا من دفنه صعد سعدون تلا ونادي المنصرفين: ألا يا عـسـكـر الأحـيـاء هذا عكسر الموتى
أجابوا الدعوة الصغرى وهُـم مـنـتـظـر والكبرى
يَحُثون على الزاد وما الزاد سوى التقوى
يقولون لكم جِدُّوا فهذا غاية الدنيا  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا محمد بن الطيب قال : حدثنا حفص بن عمر قال: حدثنا علي بن عبد الحميد قال : حدثنا إبراهيم بن الجنيد عن سلمة بن عقيل قال : كتب سعدون إلى بعض إخوانه : جعلنا الله وإياك من الذين أدبوا نفوسهم بدرة الجوع وردموا خنادق الأحزان، وجاوزوا عقاب الشدائد، وقطعوا جسر الأهوال . ثم كتب عنوانه ﴿وَمَنْ يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ ﴾  حكاية سعدون والمتوكل -

أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبدالله محمد بن الطيب قال : حدثنا حفص بن عمر قال : حدثنا علي بن محمد قال : حدثنا إبراهيم بن سعيد النيبختي قال: كتب المتوكل إلى عامله بالبصرة : بلغني أن قبلك رجلا أديباً ظريفاً ذا حكمة فوجه به إلي على أحسن حال غير مروّع . فحمله إليه، فلما ورد الباب قال الحاجب له : سَلم على الخليفة سلام الخلفاء. فدخل ثم سلم عليه وقال : أنت المتوكل؟ قال : نعم . قال : فَلِمَ تسميت بالمتوكل ولم تتسم بالمتواضع؟ ثم قال : السلام عليك أيها الشارب بكأس التجبر والمتكىء على نمارق البلوى السلام عليك يا من استوى على أسرة الفناء وتقمص بقميص الخيانة متبعاً للهوى. كأني بك وقد أتاك فظ غليظ فجذبك عن سرير بهائك وأخرجك عن مقاصير علائك ، فلم يستأذن عليك حاجباً ولا قهرماناً حتى أخرجك إلى ضيق اللحد وفراق الأهل والولد. فلو نظرت في صحيفة بطالتك يا من احتوى على أموال الضّعَفَة بظلمه غداً تُبلى سرائرك بين يدي من لا تخفى عليه السرائر، فتحمل على دقيق المسألة جواباً وعلى الصراط جوازاً فستعلم وستقرأ ما قد أُحصي عليك بالتحقيق . قال : فغاظه ذلك وأمر به حتى حبس. فلما كان اليوم الثاني أمر بإخراجه فلما وقف بين يديه قال : يا سعدون بلغني أنك قدري تقايس في العظمة وتداخل في التكوين . فقال : يا متوكل ما لمن له عقل موجود وفهم غير مفقود أن يتكلم في القدر قال : فنظر إليه مُغضَباً وردّه إلى الحيس . فلما كان في اليوم الثالث أخرجه فوقف بين يديه فقال له : يا سعدون بلغني أنك ثنوي تقول السماء خالية بلا مدبر . فقال له : يا متوكل أسألك عن شيء تخبرني به؟ قال: نعم. قال: من جعل سطح الهامة منبت الشعر وسقاها من حرارات الدماغ ؟ قال : الله . قال : فأخبرني من مد حاجبيك فأنبت عليها الشعر؟ قال: الله . قال : فأخبرني من خرق السمعين خرقاً فجعل فيهما سمعاً؟ قال : الله . قال : فأخبرني من فتق العينين وجعل الحدقة بياضاً وجعل وسطها سواداً؟ قال : الله . قال : فمن جعل فيهما ماءً عذباً وملحاً ؟ قال : الله . قال : فمن جعل العذب في البياض والملح في السواد ؟ قال : الله . قال : فمن ألزم القدمين الساقين فجعلهما أسطوانة الركبتين؟ قال : الله . قال : فمن شدَّ الحقوين بالوركين؟ قال : الله . قال : فمن عرفك أن تقول الله ؟ قال : الله . قال فكيف أقول : السماء بلا إله ؟ قال المتوكل : بلغني أنك تقول : القرآن مخلوق . قال : يا متوكل: الله
وكل شيء بقضاء
ولا يفوت الخلق رزق الله
ارْضِ عن الله وثق بالله
ماتبلغ الفطنة كنه الله
يا أيها الكاشف وصف الله
الله لا يشبه خَلْقَ الله
القبض والبسط فعالُ الله
والجود والفخر أيادي الله
يا أيها القائل قل في الله بالصدق والحق عرفت الله
فلا تكن مبتدعاً في الله
ارْضَ بدين الله عند الله
لا شيء أحلى من كلام الله يكون مخلوقاً كلام الله ؟
يقولها مبتدع والله ! قال : فأمر به إلى الحبس ، ثم اتخذ مقصورة وأمر بفرش الزرابي من الحرير الأخضر والخز والديباج، ثم دعا به . فلما نظر إليها ضحك ثم قال : يا متوكل هذا ملك الدني الحقير الفاني. قال المتوكل : بلغني أنك حروري تقع في السلطان . قال : إني لست كذلك ولكن أصفُ لك مرجاً أحسن من مرجك وقصراً أبهى من قصرك . قال : هات . قال : إن في الجنة مرجاً من ورق الأس في وسط المرج قصر من درّ وشقائق وفي وسط القصر قبة من ورق السوسن والقصر والقبة مبنيان على نبات القرنفل لها حدود أربعة؛ فالحد الأول ينتهي إلى راحة الوجلين، والحد الثاني ينتهي إلى نعيم المشتاقين، والحد الثالث ينتهي إلى طريق المريدين والحد الرابع ينتهي إلى سرور المحزونين. ولها شارع ينتهي إلى غرف مملوءة بتحف ووصائف ورفارف، وإلى خيام وخدام وإلى ميدان يطوف في ساحتها الولدان، أرضها من الفضة ورمالها من اللؤلؤ وقضبانها من العنبر وشُرَفُها من الياقوت الأحمر العرش سقفها، والرحمة حشوها، والأنبياء سكانها، والملائكة عُمارها، والولدان خُدامها، وعلى البقاء أساسها، ولدوام الأبد نعيمها، ومن الذهب مقاصيرها، ومن الاستبرق سررها عالية مساكنها، الزعفران حشيشها، والقرنفل نباتها، والسندس ثيابها . مُطَّردةً أنهارها . دائمة ظلالها دانية قطوفها. مطهرة أزواجها، خضر رياضها، لذيذ عيشها، ذكي مسكها وكافورها. فهي دار العيش والنعيم المقيم في قصور وأنهار وأشجار وظل ممدود وماء مسكوب وطلح منضود . فساكن هذه الدار في نعيم لا يزول ولا غل في صدور سكانها قد رُفِعَتْ منهم الأسقام وزالت عنهم الآلام. وصاحب هذه الدار أبداً معانق الأبكار في مرافقة الأخيار وجوار الملك الجبار. ثم رفع جبته وقام يخطر في مشيته ويقول: قبة من جواهر الـخُلْدِ بالنور رَضِعَتْ
جوفُ قصر من الزَبَرْ جَدِ بالنور رُفَعَتْ
مذ بناها الجليل في داره ما تزعزعت
لو عليها تساقطت أرضها ما تصدّعت
حُجِبتْ كاعب من الـحُور فيها وأبدِعَتْ
عجب الحسن والجــمــا لُ إذا ما تطلعت
مُتعَ الحِبُّ بـالـحـبـيـب كما قد تمتعت فقال المتوكل : أحسنت بارك الله فيك، من زعم أنك مجنون؟ ثم أمر له بجائزة فردها وقال : حسبي الله الذي جعل خزائن عطائه مفتوحة المؤمليه، وحسبي من جعل مفاتيحها صحة الطمع فيه. أبو وهيب بهلول بن عمرو بن المغيرة المجنون  ٢٣٦ كوفي . أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا الفضل أحمد بن محمد بن حمدون الفقيه النسوي بها يقول : سمعت محمد بن إسماعيل بن سالم القزويني يقول : سمعت أبي يقول : سمعت محمد بن إسماعيل بن أبي فُدَيْكِ يقول : رأيت بهلولاً في بعض المقابر قد دلّى رِجْلَه في قبر وهو يلعب بالتراب فقلت له : ما تصنع ها هنا؟ قال : أجالس أقواماً لا يؤذونني وإن غبت عنهم لا يغتابونني . فقلت : قد غلا السعر فهل تدعو الله فيكشف ؟ فقال : والله ما أبالي ولو حبة بدينار. إن الله أخذ علينا أن نعبده كما أمرنا وعليه أن يرزقنا كما وعدنا . ثم صفّق يديه وأنشأ يقول : يا من تمتع بالدنيا وزينتها ولا تنام عن اللذات عيناه
شغلت نفسك فيما لست تدركه تقول الله ماذا حين تلقاه؟  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا علي الحسن بن أحمد الحناط النسوي يقول : سمعت عمار بن هاشم يقول : سمعت علي بن سعيد بن علي الكندي يقول : خرج الرشيد إلى الحج ، فلما كان بظهر الكوفة إذا هو ببهلول المجنون على قصبة وخلفه صبيان وهو يعدو فقال : من ذا؟ قالوا : بهلول المجنون قال : كنت أشتهي أن أراه فادعوه غير مروّع . فقالوا له : أجب أمير المؤمنين. فعدا على قصبته . فقال الرشيد : السلام عليك يا بهلول . فقال : وعليك السلام يا أمير المؤمنين . قال : كنت إليك بالأشواق . قال : ولكني لم أشتق إليك . قال : عظني يا بهلول . قال : وبم أعظك؟ هذه قصورهم وهذه قبورهم . قال : زدني فقد أحسنت. قال : يا أمير المؤمنين، من رزقه الله مالاً وجمالاً فعف في جماله وواسى من ماله كتب في ديوان الأبرار . فظن الرشيد أنه يريد شيئاً فقال : قد أمرنا أن يقضى دينك . قال : كلا لا يُقضى دَيْنٌ بِدَيْن . أردد الحق على أهله واقض دين نفسك من نفسك. هذه نفس واحدة إن هلكت ما انجبرت . قال الرشيد : فإنا قد أمرنا أن يُجرى عليك . فقال : يا أمير المؤمنين إن الله لا يعطيك وينساني . ثم ولى هارباً .  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا إسحاق إبراهيم بن عبدالله بن موسى الشاشي قدم علينا حاجاً قال : سمعت علي بن محمد بن سعيد الكوفي يقول : سمعت أحمد بن عبد الله القرشي يقول : سمعت الفضل بن الربيع يقول : حججنا مع الرشيد فمر بالكوفة في طاق المحامل إذا ببهلول قاعد يهذي ويلعب بالتراب، فابتدر إليه الخدم ليطردوه ، فقام وقال للرشيد : فكيف ولو أقامك الله بين يديه، فسألك عن النقير والقطمير والفتيل ؟ . قال : فخنقته العبرة. فقال الحاجب : حَسْبُك يا بهلول فقد أوجعت أمير المؤمنين . فقال الرشيد : دعه . فقال بهلول : إنما أفسده أنت وأضرابك. فقال الرشيد : إني أريد أن أصلك بصلة . فقال بهلول : رُدَّها على من أخذتها منه . فقال الرشيد : فحاجة ؟ قال : ألا تراني ولا أراك . ثم قال : يا أمير المؤمنين حدثنا أيمن بن نائل عن قدامة بن عبد الله الكلابي قال : رأيت رسول الله صلى الله عليه وسلم يرمي جمرة العقبة على ناقة صهباء لا ضَرَب ولا طَرَد ولا إليك إليك . ثم ولى بقصبته وأنشأ يقول : فَعُدَّكَ قد ملكت الأرض طرّاً ودان لك العباد فكان ماذا
ألست تصير في قبـر ويحوي تراتك بعد هذا ثم هذا؟!  أخبرنا محمد قال : أخبرنا الحسن قال : حدثنا أبو موسى عمران بن الحصين قال : حدثنا أبو عوانة يعقوب بن إسحاق المهرجاني قال : حدثنا أبو علي سهل بن علي ببغداد قال : حدثنا محمد بن الحسين عن أبي عبدالرحمن الأشهلي قال : قال أبي : قلت لبهلول المعتوه : أي شيء أولى بك؟ قال : العمل الصالح.  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو موسى قال : حدثنا أبو عوانة قال : حدثنا أبو علي قال : حدثنا محمد بن الحسين قال : حدثنا أبو عبد الرحمن قال : قال أبي : قدم علينا هارون أمير المؤمنين يريد الحج فنزل الحيرة وكنت بها . فغدوتُ يوماً فرأيت بهلولاً في جبانة كندة فقلت: يا بهلول إن لي حاجةً فادع الله لي . فاستقبل القبلة ورفع يديه ثم قال: يا من لا تحترك الجوارح دونه أقض لعزيز حوائج الدنيا والآخرة. قال أبو عبد الرحمن : قال أبي : فوجدت لدعائه برداً على قلبي، فحللت من خرقة كانت معي در همين فقلت : هاكهما . فقال : يا أبا محمد إنك تعلم أني أخذ الرغيف وأشباهه ولا أخذ على الدعاء أجراً. قال أبو عبد الرحمن : قال أبي : فما رجعت حتى قُضِيَتْ حاجتي .  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو موسى قال : حدثنا أبو عوانة قال : حدثنا أبو علي قال : حدثنا عمر بن شبة النميري قال : حدثنا الفضل بن سليمان مولى أبي جعفر قال : كان بهلول يأتي سليمان بن علي فيضحك منه ساعة ثم ينصرف . فجاءه يوماً فلما أراد الانصراف قال : هل عندك شيء نأكل؟ فقال سليمان يا غلام هات خبزاً وجبناً، فجيء به فأكل وانصرف . ثم عاد بعد أيام وقال : هل عندك شيء نأكل؟ فقال : يا غلام هات خبزاً وزيتوناً، فجاء به فأكل . فلما قام لينصرف قال لسليمان : ترانا نجد لحماً إن جئنا بيتكم يوم العيد؟  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو موسى قال : حدثنا أبو عوانة قال : حدثنا أبو علي قال : حدثنا عمر بن شبة قال : أخبرني بعض الكوفيين قال : حج الرشيد فذكر بهلولاً حين دخل الكوفة، فأمر بإحضاره وقال : ألبسوه سواداً وضعوا على رأسه طويلةً وقِفُوه في موضع كذا. ففعلوا به ذلك وقالوا له : إذا دنا أمير المؤمنين فادع له . فلما حاذاه الرشيد رفع بهلول صوته وقال : يا أمير المؤمنين . نسأل الله أن يرزقك ويوسع عليك من فضله . فضحك الرشيد وقال : آمين . فلما جازه الرشيد دفع صاحب الكوفة في قفاه وقال : هكذا تدعو لأمير المؤمنين يا مجنون؟ قال : ويلك اسكت فما في الدنيا أحب إلى أمير المؤمنين من الدراهم. فبلغ ذلك الرشيد فضحك وقال : والله ما كذب .  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا نصر منصور بن محمد المطرفي بهراة يقول : سمعت أبا تراب الأعمشي يقول : سمعت أبا المعافي الشيرازي يقول : سمعت الحسن بن سهل بن منصور يقول : رأيت الصبيان يرمون بهلولاً بالحصى فأدمته حصاة فقال: حسبي الله توكلت عليه
من نواصي الخلق طراً بيديه
ليس للهارب في مهربه
أبداً من راحة إلا إليه
رب رام لي بأحجار الأذى لم أجد بداً من العطف عليه قلت له : تعطف عليهم وهم يرمونك ؟ فقال : اسكت لعل الله يطلع على غمي ووجعي وشدة فرح هؤلاء فيهب بعضنا من بعض.  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا محمد بن الطيب قال : حدثنا حفص بن عمر قال : حدثنا علي بن عبد الحميد عن إبراهيم بن الجنيد عن صباح بن حيان عن الحسن بن سهل بن منصور به سواء.  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو بكر محمد بن عبدالله بن محمد قال : سمعت جدي العباس بن حمزة يقول: سمعت أحمد بن أبي الحواري يقول : دخلت الكناسة بالكوفة فرأيت مجنوناً واقفاً قد حجز الناس عن الطريق، فلما رآني قال : مر يا أحمد أنا بهلول أعرفك بعرفان . ثم أنشأ يقول : حقيق بالتواضع من يموتُ وحَسْبُ المرء من دنياه قـوتُ
فما للمرء يصبح ذا اهتمام وشغل لا تقوم له النعـوتُ
صنيع مليكنا حسن جميل وما أرزاقنا مما تفوت
فيا هذا سترحل عن قريب إلى قوم كلامهم السكوت  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا الحسن بن سهل بن نفيس السجزي بهراة قال : حدثنا علي بن محمد بن أيوب المروزي قال: حدثنا أحمد بن أبي الحواري قال : اشتهى بهلول عسلاً فجاء إلى بعض أشراف الكوفة فقال : أريد أن آكل عسلاً بسرقين قال : نعم . قال : فادع بهما . فدعا بهما فأمعن في أكل العسل وحده فقال الرجل : قد نقضت الشرط مالك لا تأكل السّرقين؟ قال : هو وحده أطيب.  أخبرنا محمد قال: أخبرنا الحسن قال: أخبرنا محمد بن عبدالله بن محمد قال: أخبرنا محمد بن زكريا بن دينار الغلابي قال: حدثني عبد الله بن عبدالكريم قال: كان لبهلول قبل أن يُجنِّ صديق، فلما أصيب بعقله فارقه صديقه . فبينما بهلول يمشي في بعض طرقات البصرة إذا بصديقه، فلما رآه صديقه عدل عنه، فقال بهلول: اُدْنُ منّي ولا تخافن غدري ليس يخشى الخليل غَدْر الخليل
إن أدنى الذين ينالك مني سَتْرُ ما يتقى وبث الجميل  أخبرنا أبو جعفر محمد بن إبراهيم بن عبدان بن جبلة القايني قال : حدثنا محمد بن نصر القايني قال : حدثنا أبو الربيع سليمان بن الربيع الحلواني قال : حدثني أبو الخزرج من آل أبي الدرداء قال : اجتمع قوم فقالوا لبهلول: هل لك في درهم؟ قال : نعم . فأخرجوا إليه درهماً أبيض، فقال: ما أحسنه، هذا لي؟ قالوا : نعم على أن تشتم فاطمة! ففزع وقال : من فاطمة ؟ قالوا : بنت رسول الله صلى الله عليه وسلم . قال : يا أولاد الطوامث؛ أنا أشتم فاطمة بنت رسول الله صلى الله عليه وسلم؟ فقاموا، فلما رآهم قياماً وخاف ذهاب الدرهم قال : هل لكم أن أشتم عائشة بنصف درهم؟ قالوا : لا . ثم ضرب جبهته بكفه وقال: أستغفر الله، رحم الله عائشة، أشهد أنها زوجة رسول الله في الجنة.  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو موسى قال : حدثنا أبو عوانة قال : حدثنا أبو يحيى الفرغاني قال : سمعت الحسن الرازي يقول : مر بهلول بقوم في أصل شجرة وكانوا عشرة نفر . فقال بعضهم لبعض : تعالوا حتى نسخر ببهلول . وسمع بهلول ما قالوا فجاءهم، فقالوا : يا بهلول: تصعد لنا رأس هذه الشجرة وتأخذ عشرة دراهم؟ قال : نعم . فأعطوه عشرة دراهم فصرها في كمه ثم التفت إليهم وقال : هاتوا سلماً . فقالوا : لم يكن هذا في الشرط. فقال: كان في شرطي دون شرطكم .  ٢٥٠ أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا محمد بن الطيب قال: حدثنا حفص بن عمر قال : حدثنا علي بن عبد الحميد قال : حدثنا إبراهيم بن الجنيد قال : حدثنا إسماعيل بن عبد الرحمن الكوفي قال : لقيني بهلول المجنون فقال : أسألك . قلت : سل. قال: أي شيء السخاء؟ قلت : البذل والعطاء. قال: هذا السخاء في الدنيا، فما السخاء في الدين؟ قلت : المسارعة إلى طاعة الله . قال فتريدون منه الجزاء؟ قلت: نعم بالواحدة عشراً . قال : ليس هذا سخاء، هذا متاجرة ومرابحة . قلت : فما هو عندك ؟ قال : لا يطلع على قلبك وأنت تريد منه شيئاً بشيء .  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو موسى قال : حدثنا أبو عوانة قال : حدثنا أبو علي قال : حدثنا أحمد بن سهل الكوفي قال : حدثني علي بن الفضل الوشاء قال : كان بهلول إذا نظر إلى الصبيان الأطفال ليس معهم آباؤهم قرص هذا ولطم هذا وعض هذا، فقيل له : أيحل لك هذا ؟ تعذب هؤلاء الأطفال؟ فيقول : ليس في هؤلاء إلا من خرج شراً من أبيه فأضربهم الساعة فإنهم إذا كبروا ضربوني واقتصوا مني !  وبهذا قال أحمد بن سهل : أخبرني بعض أصحابنا قال : قيل في مجلس شريك لرجل : أي الفاكهة الرطبة أحب إليك؟ قال : اللحم. قيل فاليابسة؟ قال: القديس. فقال بهلول وهو في ناحية المسجد : أخطأت والله . فقال له شريك : فهات ما عندك . قال : إن أصبت تأمر مهْرَكَ جاريتك أن تطعمني قوصرة تمر؟ قال : نعم . قال سل عما شئت. قال: أي الفاكهة الرطبة أحب إليك؟ قال: بالغداة الروس والهريسة، وبالعشي الشواء والجوذاب. ثم قال لشريك بالله عليك من أعقل أنا أم هو؟ يقول ابن الحمقاء : اللحم. من يطبخ له، من يقطعه، من يشتري له الأبزار ؟ .  وبهذا قال أحمد بن سهل قال: قال رجل لبهلول: أما تستحي تأكل في السوق؟ قال: ويلك تطعن على الله وتردّ عليه! هو لم يستحي أن يجيعني في السوق، أأستحي أن آكل فيها؟  ٢٥٤ قال أحمد : وقال له إسحاق بن الصباح الكندي : أكثر الله في الشيعة مثلك يا بهلول . قال بل أكثر الله في المرجئة مثلي وأكثر في الشيعة مثلك].  أخبرنا محمد قال: أخبرنا الحسن قال: أخبرنا أبو موسى قال: حدثنا أبو عوانة قال: حدثنا أبو علي قال: حدثنا محمد بن أحمد الكوفي قال: خرج أناس من ولد عيسى بن موسى الهاشمي بالكوفة، فلقيهم بهلول وكان كلامه حكمة فقالوا: عِظنا يا بهلول. قال: بم أعظكم؟ هذه قصوركم وهذه قبوركم.  ٢٥٦ أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا محمد بن الطيب قال : حدثنا حفص بن عمر قال : حدثنا علي بن عبد الحميد قال : حدثنا إبراهيم بن الجنيد عن عمرو بن جابر الكوفي قال : مر بهلول بصبيان الكتاب فجعلوا يضربونه، فدنوت منه وقلت : ألا تشكوهم إلى آبائهم؟ فقال لي: اسكت فلعلي إذا مت يذكرون هذا الفرح فيقولون : رحم الله ذلك المجنون.  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا محمد قال: حدثنا حفص قال : حدثنا علي قال : حدثنا إبراهيم قال: قال صباح الوزان الكوفي : لقيتُ بهلولاً يوماً فقال لي : أنت الذي يزعم أهل الكوفة أنك تشتم أبا بكر وعمر؟ قلت : معاذ الله أن أكون من الجاهلين . قال : إياك يا صباح فإنهما جبلا الإسلام وكهفاه، ومصباحا الخلد وقنديلاه وحبيبا محمد صلى الله عليه وسلم وضجيعاه، وشيخا المهاجرين وسيداهم . ثم قال : جعلنا الله من الذين على الأرائك يسمعون كلام الله إذا زف القوم إلى سيدهم .  ٢٥٨ أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو موسى قال : حدثنا أبو عوانة قال : حدثنا أبو علي قال : حدثنا زكريا بن يحيى عن علي بن الحسين الرازي قال لما مات أبو بهلول خلف ست مئة درهم، فأخذها القاضي وحجر عليه، فأتاه بهلول فقال : أصلح الله القاضي ! قد حجرت علي وتزعم أني مصاب في عقلي، وأنا جائع فادفع لي مئتي درهم حتى أقعد في أصحاب الخلقان أبيع وأشتري، فإن رأيت مني رشداً ضممت إليها الباقي، وإن تلفَتْ فالذي أتلفت أقل مما بقي . فأتى بالكيس فوزن له مئتي درهم فأخذها بهلول ولزم الحيرة حتى أنفدها . ثم جاء إلى القاضي وهو في مجلس القضاء فقال : يا بهلول ما صنعت؟ قال: أعز الله القاضي، أنفقتها، فإن رأى القاضي أن يزن من ماله مئتي درهم ويردها إلى الكيس حتى يرجع المال إلى ما كان! قال القاضي : فتجحدني ما أخذت مني ؟ قال : كلا ولكني أقمت عندك شاهدين أني موضع لها . قال : صدقت، فدعا بمئتي درهم وردها إلى الكيس.  ٢٥٩ أخبرنا محمد قال : أخبرنا الحسن قال : حدثنا محمد بن الطيب قال : حدثنا حفص بن عمر قال : حدثنا علي بن عبد الحميد عن إبراهيم بن الجنيد قال : حدثني عباس البناء قال : نظر إلى بهلول وأنا أبني داراً فقال : لمن هذه؟ قلت : الرجل من نبلاء الكوفة . قال : أرنيه . فأريته إياه، فناداه : يا هذا لقد تعجلت الجناية قبل العناية ! اسمع إلى صفة دار كونها العزيز، أساسها المسك وملاطها العنبر، اشتراها عبد قد أزعج للرحيل، كتب على نفسه كتاباً وأشهد على عقده ضمائره شهوداً : هذا ما اشترى العبد الجافي من الرب الوافي اشترى منه هذه الدار بالخروج من ذل الطمع إلى عزّ الورع، فما أدرك المستحق فيما اشتراه من درك فعلى المولى خلاص ذلك وتضمينه . إياه . شهد على ذلك العقل وهو الأمين والخواطر، وذلك في إدبار الدنيا وإقبال الآخرة . أحد حدودها ينتهي إلى ميادين الصفاء، والثاني ينتهي إلى ترك الجفاء، والحد الثالث ينتهي إلى لزوم الوفاء، والحد الرابع ينتهي إلى سكون الرضى في جوار من على العرش استوى. لها شارع ينتهي إلى دار السلام، وخيام قد ملئت بالخدام في انتقال الأسقام وزوال الضر والآلام . يا لها داراً لا ينقص نعيمها ولا يبيد، دارا أسست فَجُعِل من الدرّ والياقوت شُرَف تلك الحدود، وجعل ملاطها من البهاء والنور وملىء خيامها من ملهيات هنّ كمال السرور من العين الحور، ليس لهن سوى الدين والتقوى مهور. قال : فترك الرجل قصره وهام على وجهه وأنشأ بهلول يصيح خلفه : يا ذا الذي طلب الجنان لنفسه لا تهربن فإنه يعطيكا  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا محمد بن الطيب قال : حدثنا حفص بن عمر قال : حدثنا علي قال : حدثنا إبراهيم عن عبدالله بن خالد قال : غزا معنا بهلول في الصائفة وعلى عنقه قربة ماء، فلما حمي وطيس الحرب ألقى القربة بين الصفين وهو يقول معاتباً لها : ويلك يا قربة حتى متى وإلى متى لا تفارقيني؟ وكم بالمنى تخدعيني ! هذا يوم فراقكِ إن شاء الله . ثم رمى بطرفه نحو السماء وهو يقول : وعزتك ما قتالي أعداءك شوقاً إلى نعيم الجنة وإن كان مقيماً، ولا هرباً من النار وإن كان عذابها أليماً، ولكني بحبي إياك يا حبيب أوليائه . ثم أنشأ يقول : ما قَدْرُ نفسي في رضى مولاها إن قُتِلَتْ أو قاتلت أعـداهـا
ما رغبتي الجنة أن أراها ورهبتي النار بأن أصـلاهـا
لكنني عبد أحبُّ الله
قالت لمولاها ومن مولاها ومن إلى جنته هداها ثم رجع فضحك وهو يقول : ما لكِ جئنا فابعدي يا خاسره عني إلى دار الخلود الـزاهــرة
الله جئنا فاغربي يا قاصره ثم غاب عني فلحقته و به ضربات مثخنة فقلت : أبشر يا أبا وُهَيْب بالجنة . قال : اسكت ما من أجلها قاتلت ولكن لأؤدي بعض حقه .  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا محمد قال: حدثنا حفص قال : حدثنا علي قال : حدثنا إبراهيم عن يزيد بن عبد الخالق قال: سمعت أبي يقول: سمعت بهلول المجنون يقول من كانت الآخرة أكبر همه أنته الدنيا وهي راغمة. ثم أنشأ يقول : یا خاطب الدنيا إلى نفسه
تنع عن خطبتها تسلم
إن التي تخطب غدارة قريبة العرس من المأتم  ٢٦٢ أخبرنا محمد قال : أخبرنا الحسن قال : حدثنا حفص قال : حدثنا علي قال : حدثنا إبراهيم عن كثير بن روح قال : رأيت بهلولاً ذات يوم يتمثل ويقول : يا طالب الرزق في الآفاق مجتهداً أتعبت نفسك حتى شفك الطلب
تسعى لرزق كفاك الله بُغْيَتَه أَقْعُدْ فرزقك قد يأتي به السبب
كم من دني ضعيف العقل تعرفه له الولاية والأرزاق والذهب
ومن حسيب له عقل يزينه بادي الخصاصة لا يُدرى له نَشَبُ
فاسترزق الله مما في خزائنه
فالله يرزق لا عقل ولا حسب  أخبرنا محمد قال: أخبرنا الحسن قال : أخبرنا أبو إبراهيم إسماعيل بن عبد الله الراوية البصري قال : أخبرنا صالح بن عبدالرحيم الكوفي عن أبيه قال مات لنا جار فاختلفوا في قبره فقال بعضهم : نستمه وقال بعضهم : نسطحه . فبينا هم في ذلك مرّ بهم بهلول فتحاكموا إليه، فقال: إن جعلتموني قاضياً فاجلسوا مجلس الخصوم بين يدي الحاكم ففعلوا . فقال : إن كنتم صليتم عليه صلاة الشيعة فسطحوا قبره، وإن كنتم صليتم عليه صلاة المرجئة فسنموا قبره.  أخبرنا محمد قال: أخبرنا الحسن قال : أخبرنا أبو عبدالله محمد بن عبدالله بن محمد بن شبيب الفارسي ساكن بلخ ـ قدم علينا حاجا وكان جماعاً - قال : أخبرنا بكار بن عامر البصري قال : أخبرني بعض أهل الكوفة أنه ولد لبعض أمراء الكوفة ابنة، فساءه ذلك وامتنع من الطعام وحجب الناس عنه فأتى بهلول حاجبه فقال : ائذن لي على الأمير. قال : ويحك إن الأمير محزون . قال : وما سبب ذلك؟ قال : ولدت له ابنة . قال : فهو وقت دخولي عليه. فأدخله فلما وقف بين يديه قال: أيها الأمير، ما هذا الحزن؟ أجزعت لذات خَلْقٍ سوي هبة رب العالمين؟ أيسرك أن مكانها ابناً مثلي ؟ قال : ويحك فرّجت عني. فدعا بالطعام وأذن للناس.  أخبرنا محمد قال: أخبرنا الحسن قال: سمعت أبا يعلى محمد بن أحمد بن حمدان الفقيه النسوي يقول: سمعت ابن الأنباري يقول: بلغني أن بهلولاً عبث به الصبيان ذات يوم ففر منهم والتجأ إلى دار وجد بابها مفتوحاً، فدخلها وصاحب الدار قائم له ضفيرتان، فصاح: ما أدخلك داري؟ فقال: «يا ذا القرنين إن يأجوج ومأجوج مفسدون في الأرض».  ٢٦٦ قال وقالت له أمه ذات يوم : يا بني، عُدَّ لي المجانين . فقال : اسكتي ابنك منهم .  أخبرنا محمد قال: أخبرنا الحسن قال: أخبرنا أبو سعيد أحمد الزيدي قال: حدثنا محمد بن الفرخاني الأصبهاني قال: حدثني أبي قال: قال عبدالواحد بن زيد مررت ببهلول المجنون وقد وقف بحذاء رجل يكلم امرأة فأنشأ يقول: كن حييا إذا خلوت بذنب دون ذي العرش من حكيم مجيد
أتهاونت بالإله بَدِياً وتواريت عن عيون العبيد
أقرأت القرآن أم لست تقرا أن ذا العرش دون حبل الوريد قال: ثم ولى وهو يقول: من نوقش الحساب غُفر له. قلتُ: من نوقش الحساب عذب. قال: اسكت يا بطال إن الكريم إذا قدر غفر.  أخبرنا محمد قال: أخبرنا الحسن قال: سمعت محمد محمد بن أحمد بن حمدان يقول: سمعت جعفر بن علي بن شيبان الطحان بالبصرة يقول: سمعت محمد بن جنيد يقول: بلغني أن بهلول المجنون كتب على كفه: وعلى جبته: يا رب حقق حسن ظني بكا وعلى جبّته : إن كنت عبداً فكن تقياً واعمل لمولاك ما يريد  ٢٦٩ أخبرنا محمد قال : أخبرنا الحسن قال : سمعت ابن أبي نصر يقول : كنت كثيراً ما أسمع بهلولاً يقول : إذا خان الأمير وكاتباه
وقاضي الأرض داهن في القضاء
فويل ثم ويل ثم ويل لقاضي الأرض من قاضي السماء  أخبرنا محمد قال: أخبرنا الحسن قال: سمعت أبا موسى عمران بن موسى بن الحصين يقول: سمعت أبا علي يقول: بلغني أن بهلولاً أصابه الجوع ثلاثة أيام، فوسوس له الشيطان أن في جوارك رجلا له مال كثير فتسلّق عليه داره وخذ بذرة ثم تب إلى الله . ترى الله لا يغفر لك ؟ فقام وتسلق داره ودخل بيته وأخذ كيساً وحمله ثم ثابت إليه نفسه فأخذ بلحيته وقال : سوأةً لك ونادي: خذوا اللص يا أهل الدار فوثب أهل الدار وقالوا : أين اللص فقال : ها أنا ذا . فجاؤوا بالسراج فإذا بهلول فقال : اذهبوا بي إلى السلطان . فقال صاحب الدار : معاذ الله فما الذي حملك على هذا؟ وألح عليه فقال : جوع ثلاثة أيام ووسوسة الشيطان . فقال صاحب الدار : يعزّ علي أن يصيب مثلك الجوع وأنت جاري . ثم أجرى عليه جراية .  وقال علي بن سعدان : رأيت بهلولاً في بعض المقابر يكلم قبراً، فقلت له : ما تصنع ها هنا؟ أجائع أنت ؟ فقال : تنع عني يا بطال ثم أنشأ يقول : تجوع فإن الجوع من علم التقى
وإن طويل الجوع يوماً سيشبع اجتماع سعدون وبهلول :  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا محمد بن الطيب قال : حدثنا حفص بن عمر قال : حدثنا علي بن عبد الحميد قال : حدثنا إبراهيم بن الجنيد عن الحسين الصيقل قال : زار سعدون بهلولاً فنظرتُ إليهما فسمعت سعدوناً يقول لبهلول : أوصني وإلا أوصيك فناداه بهلول : أوصني يا أخي فقال: أوصيك بحفظ نفسك من نفسك وفكها من حبسك ، فإن هذه الدنيا ليست لك بدار. فقال له بهلول: وأنا أوصيك يا أخي قال : قل . فقال : اجعل جوارحك مطيتك، واحمل عليها زاد معرفتك، واسلك بها طريق تلفك فإن ذكّركَ ثقل الحمل فذكرها عاقبة البلوغ، فلم يزالا يبكيان جميعاً حتى خشيت عليهما الفناء.  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبدالله محمد بن عبد الله بن شبيب الفارسي قال : حدثنا أبو بكر أحمد بن لقمان قال : حدثنا عبدالله بن المنذر بن علي السيرافي قال : حمل الصبيان يوماً على بهلول فهرب منهم فدخل داراً لبعض القرشيين مفتوحة الباب ورد الباب . وخرج صاحب الدار فرآه فدعا بطبق عليه طعام، فجعل الصبيان يصيحون على الباب وهو يأكل ويقول فضُرب بينهم بسور له باب باطنه فيه الرحمة وظاهره من قبله العذاب .  ٢٧٤ قال عبد الله بن المنذر وحمل عليه الصبيان ذات يوم فألجؤوه إلى مضيق، فشد عليهم بقبضته وهو يقول: إذا تضايق أمر فانتظر فَرَجاً فأضيقُ الأمر أدناه من الفرج  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا محمد بكار بن علي الساوي الراحل إلى الأصم يقول : سمعت أمير بن الجارود يقول: سمعت بشر بن موسى يقول: سمعت الأصمعي يقول : دخلت مقابر البصرة فإذا أنا ببهلول قاعد قد دلى رجله في قبر فقلت : يا بهلول ما تصنع ها هنا؟ فقال : أُقاعِدُ من لا يغتابني إن قمتُ ولا أتأذى بهم إن قعدت. فقلت له : قد غلا السعر قال: والله ما أبالي ولو بلغ وزن درهم بمثقال، علينا أن نطيع الله وعليه أن يرزقنا ثم قال: أفّ للدنيا وتفّ كل من فيها يَلُف  كتب بهلول إلى الخلفاء والأمراء: أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبدالله محمد بن الطيب ببوشنج قال : حدثنا حفص بن عمر قال : حدثني علي بن عبد الحميد قال : حدثنا إبراهيم بن الجنيد عن نعيم الخشاب قال : كتب بهلول إلى الواثق : أما بعد، فإن المراء قد لعب بدينك، والأهواء قد أحاطت بك، ومقالات أهل البدع قد سَلَخت عليك عقلك، وابن أبي دؤاد المشؤوم قد بدل عليك كلام ربك. اقرأ: فاخلع نعليك إنك بالواد المقدس طوى، إلى قوله : فاعبدني . أفيكون هذا الكلام مخلوقاً فرماك الله بحجارة من سجيل منضود مسومة عند ربّك وما هي من الظالمين ببعيد). ثم كتب عنوانه : من الخائف الذليل إلى المخالف لكلام الله الجليل.  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا محمد قال : حدثنا حفص قال : حدثنا علي قال : حدثنا إبراهيم سالم بن عطية قال : كتب بهلول إلى ابن أبي دؤاد : أما بعد فإنك قد ميّزت كلام الله عزّ وجلّ من الله وزعمت أنه مخلوق. فإن يكن ما ذكرت باطلاً فرماك الله بقارعة من عنده . ويلك أكنت معه حين كلم موسى فإن كنت راداً عليه فاقرأ : عَلَيْها غَبَرَةٌ تَرْهَقُهَا قَتَرَةُ أولئك هم الكَفَرَةُ الفَجَرَةُ . ثم كتب عنوانه : من الصادق المتواضع إلى الكاذب المتجبر.  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا محمد قال : حدثنا حفص قال : حدثنا علي قال : حدثنا إبراهيم عن عبد الرحمن الخرقي الهاشمي قال : لما ولي الخلعي على شرطة الشرقية ببغداد وكان يرى رأي ابن أبي دؤاد كتب إليه بهلول : أما بعد فإن السماء بأكنافها ونور كواكبها وضياء شمسها وقمرها وصفوف ملائكتها، والعرش والملائكة المقربين والحجب المزدلفة بقدرة خالقها والنار وزبانيتها، والجنة وسدنتها، والأرضين وجبالها والجبال وكهوفها والحيتان في بحارها، والوحش في قفارها، والجن في أقطارها، والطير في أوكارها، والسباع في وجارها، والأشجار في ثمارها، والنمل في أجحارها تلعنك وتلعن ابن أبي دؤاد لما بدلتها كلام خالقكما . ثم كتب عنوانه : من الخائف الوجل إلى الكافر المبدل.  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا محمد قال : أخبرنا حفص قال : حدثنا علي قال : حدثنا إبراهيم عن علقمة الكلابي قال : كتب بهلول إلى بشر المريسي : أما بعد فإنك قد بعت الكثير الجليل بالمهين القليل، وبدلت كلام الله وحرفته، فلعنك الله سائر دهرك، ولعن من قالوا بقولك وسلّط عليك عذابه وجعلك كرماد اشتدت به الريح في يوم عاصف . ثم كتب عنوانه : من المجنون الوجل إلى الملعون الفشل.  ۲۸۰ قال أبو القاسم بن حبيب وبهلول هذا يقال له الصيرفي وقد روي عنه أحاديث؛ فمنها حديثه عن أيمن بن نائل وقد مضى ذكره. ومنها ما حدثني علي بن محمد بن جنيد قال : حدثنا أبو عبد الله الحسين بن أحمد بن بكير الحافظ أن عبدالله بن الحسين الفارسي حدثهم عن أحمد بن محمد بن عجلان من حفظه عن عبدالله بن إبراهيم بن قتيبة حدثني عمي إسماعيل بن قتيبة حدثني بهلول الصيرفي عن عاصم عن ذر عن عبد الله قال : قال رسول الله صلى الله عليه وسلم : لو لم يبق من الدنيا إلا يوم لطوله الله حتى يلي أمر أمتي رجل من أهل بيتي .  ۲۸۱ أخبرنا محمد قال : أخبرنا الحسن قال : وحدثني علي بن محمد قال : حدثني ابن بكير قال : حدثني محمد بن أحمد الوراق عن أبي محمد الحسن بن عثمان بن أحمد بن علي بن عبد الرزاق التمتامي البغدادي عن الحسن بن أحمد بن المبارك القشيري عن عمرو بن الأنصاري قال : قال بهلول ورآني أصلي الركعتين والمؤذن يقيم : أما علمت أن عمرو بن دينار حدثني عن عطاء بن يسار عن أبي هريرة قال: قال رسول الله صلى الله عليه وسلم : «إذا أقيمت الصلاة فلا صلاة إلا المكتوبة» ! .  وله مزية على أضرابه من المجانين بتحبير الشعر وتدقيق المعنى في كل ضرب منه. فمن ذلك ما حدثنا أبو الحسن العلوي بهراة : سمعت الحسين بن أحمد البغدادي قال : سمعت علي بن عبد الصمد الكوفي يقول : خدمت بهلولاً عشر سنين أطوف معه حيث طاف، أتسقط من نوادره وأتلقف من أشعاره وأذب عنه من يؤذيه. وافتقدته ذات مرة أياماً فلم أره على شدة طلبي له واقتفائي أثره، إلى أن صادفته يوماً في بعض أزقة الكوفة، والصبيان حوله يؤذونه بالحصى. فلما رأيته قصدت نحوه فسلّمتُ عليه فلم يرد علي إلا أن قال : نَح عني أولاد الطوامث! ففعلت. وجعلتُ أسأله عن حاله إلى أن قلت له : ما تشتهي؟ قال : ثريد الباقلاء بدهن شيرج أو بدهن الجوز. فهيأتها له وأدخلته مسجداً ووضعتُ القصعة بين يديه فأقبل يأكل أكلاً دلّني على أنه جائع فأمهلته إلى أن أتى على بعض ما في القصعة فقلت له : أيها الأستاذ هل أحدثت في رقة البشرة شيئاً؟ فضرب بيده إلى القصعة وهم أن يضرب بها رأسي، فتغافلتُ عنه إلى أن سكن وشبع وطابت نفسه فقلت : حاجتي أيها الأستاذ فقال : اكتب: أضمر أن أضمر حبي له رَقَّ فلو مرَّت به
فيشتكي إضمار إضماري ذرِّةٌ لَخَضَّبَتْه بدم جارِ فقلت : أريد أرق من ذا فقال : اكتب: أضمر أن يأخذ المراة لكي ينظر تمثاله فأدناها
فجازَ وَهُمُ الضمير منه إلى وجنته في الهوى فأدماها فقلت: أرق من ذا أيها الأستاذ فقال: نعم وما أظنه، اكتب: شبهته قمراً إذ مر مبتسماً فكاد يجرحه التشبيه أو كلما
ومر في خاطري تقبيل وجنته فسيلت فكرتي من عارضيه دما فقلت: أرق من ذا أيها الأستاذ فقال : يا ابن الفاعلة ! أرق من ذا كيف يكون؟ رويداً لأنظر فعسى طبخ في المنزل حريرة أرق من ذا.  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو موسى قال : حدثنا أبو عوانة قال : حدثنا أبو علي قال : حدثنا محمد بن عبدالله قال : بينا أنا في مسجد الكوفة والإمام يخطب يوم الجمعة، إذ قام رجل به لمم وجنون، وكان يتكلم بالحكمة فقال : يا أيها الناس إني رسول الله إليكم جميعاً. فقام بهلول فقال : اسكت ولا تَعْجَلْ بالقرآن من قبل أن يُقْضَى إليك وَحْيُه وقل رب زدني علما.  وقال علي بن خالد : بت ليلة على سور طرسوس، وكان بها بهلول، فركلني برجله ثم أنشأ يقول: يا طالب الحور أما تستحي يحملك النوم على السور
وخاطب الحور طويل البكا مقيَّدُ الأعضاء محصور
لا يَطْعَمُ الغَمْضَ فما إِنْ له راحة جسم أو يرى الـحـورا
في جنةٍ زَخْرَفها ذو العُلا يَنْعَمُ فيها كل محبور قال : فانتبهت فزعاً وما نمتُ في المحرس بعد ذلك .  وسئل بهلول عن رجل مات وخلف ابناً وابنة وزوجة ولم يترك من المال شيئاً، فقال: للابن اليتم وللابنة الشكل وللمرأة خراب البيت وما بقي فللعصبة.  ٢٨٦ - أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا عمران موسى بن عبد الرحمن السندي يقول : سمعت عبد الله بن محمد الجيزي يقول : سمعت محمد بن مخلد الواسطي يقول : أنشدني بهلول المجنون : دع الحرص على الـدنـيـا وفي العيش فلا تطمع
ولا تجمع من المال فما تدري لمن تجمع
فإن الرزق مقسوم
فقير كل ذي حرص
وسوء الظن لا ينفع
غني كل من يقنع أبو الحسن عليان بن بدر المجنون  ۲۸۷ كوفي. أخبرنا محمد قال: أخبرنا الحسن قال : أخبرنا أبو موسى عمران بن موسى بن الحصين قراءةً عليه قال : حدثنا أبو عوانة يعقوب بن إسحاق المهرجاني قال : حدثنا أبو علي سهل بن علي ببغداد في الدور قال : حدثنا محمد بن الحسين قال : حدثنا محمد بن عبد الرحمن الأشهلي قال : سمعت عبدالرحمن بن عبدالملك بن أبجر يحدث أبي وأنا جالس لقيت عليان المعتوه، وكان اسمه عندي عليان فقلت : يا عليان فقال : لا إله إلا الله قل خيراً يا ابن أبجر ، ولد لأبي مولود قبلي فسماه محمداً تبركاً برسول الله صلى الله عليه وسلم ثم ولدت فسماني عليّاً تبركاً بوصي رسول الله صلى الله عليه وسلم فمن صغرني فإنما يصغر وصي رسول الله صلى الله عليه وسلم ، ومن ظننت به التصغير بي فما ظننتُ بك يا ابن أبجر . قال : فجعلتُ على ألا أسميه إلا علياً أو أكنيه.  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت الحسن بن عمران الحنظلي بهراة يقول : سمعت محمد بن عبدالرحمن الأشهلي بالحكاية .  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو موسى قال : حدثنا أبو عوانة قال : حدثنا أبو علي قال : حدثنا محمد بن الحسين عن محمد بن عبدالرحمن قال : سمعت حفص بن غياث يقول : مررت في طاقة السراجين فإذا عليان جالس فلما جزته سمعته يقول : من أراد سرور الدنيا وحزن الآخرة فليتمن ما هذا فيه . قال : فوالله يا أبا محمد لتمنيت أني من قبل أن ألقى القضاء .  أخبرنا محمد قال: أخبرنا الحسن قال: سمعت أبا الحسن علي بن محمد بن عبدالله الصفار بسرخس يقول: سمعت محمد بن جعفر البغدادي يقول: سمعت محمد بن علي بن الحسن الكوفي يقول: قال رجل لعليان المجنون: أجننت؟ قال: أما عن الغفلة فنعم، وعن المعرفة فلا. قلت: كيف حالك مع المولى؟ قال: ما جفوته مذ عرفته. قال: قلت: ومذ كم عرفته؟ قال: من جعل اسمي في المجانين.  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو موسى قال : حدثنا أبو عوانة قال : حدثنا أبو علي قال : حدثنا محمد بن الحسين عن علي بن الحسن الشيباني عن السري مولى ثوبان بن علي قال : أدركتُ بالكوفة مجنوناً يقال له عُليان، وكان يأوي إلى دكان طحان وكانت معه عصاً لا تفارقه . وكان الصبيان عرفوا الوقت الذي يصير فيه إلى الدكان فيجتمعون ويعبثون به، فإذا بلغ أذاهم منه قال للطحان : حمي الوطيس وطاب اللقاء وأنا على بصيرة من أمري، فما ترى؟ فيقول : شأنك. فيشب وهو يقول : إذا هم ألقى بين عينيه عزمه وأعرض عن ذكر العواقب جانبا ثم يشد مئزره ويقول : قوم إذا حاربوا شدّوا مآزرهم دون النساء ولو باتت بأطهار ثم يتناول العصا فيشد عليهم ويقول : أشدُّ على الكتيبة لا أبالي أحتفي كان فيها أم ســواهـا والصبيان يهربون . فإذا رهقهم طرح الصبيان أنفسهم وتكشفوا فيعرض بوجهه عنهم ويقول: عورة المؤمن حمى ، لولا ذلك لتلف عمرو بن العاص يوم صفين، والأخذ بأدب على رحمة الله عليه أولى بنا ، أمرنا أن لا نتبع مولياً ولا تُذفِّف على جريح . يرجع ويقول : أنا الرجل الضَّرْبُ الذي تعرفونه خشاش كرأس الحيّة المتوقد ثم يعود إلى دكان الطحان ويلقي عصاه ويتمثل : فألقت عصاها واستقر بها النوى
كما قر عيناً بالإياب المسافر  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو سعيد أحمد بن محمد بن رميح الزيدي قال : أخبرنا سهل بن علي العسكري قال: حدثنا أبي عن علي بن ظبيان قال : خرجتُ يوماً بالكوفة لبعض حوائجي فلما صرت في سِكَكِ همدان إذا أنا بعليان المجنون وفي يده قصبة فارسية مثل القناة في رأسها كبة قطن وعليها خرقة، وإذا هو يشد على الصبيان فإذا أدركهم قال : القصاص يا علي، ثم يلقي القصبة من يده . فلما رأيته تهيبت أن أمر بين يديه، فقال لي : مر يا علي فلست من هؤلاء، فمررتُ فلما جاوزته . قال : كلا يا علي، ربنا أكرم من ذلك، إذا قدر عفا . قلت له : من العاقل؟ قال: من حاسب نفسه وخاف ربه .  وكان عليان مليح التشيع، فمررت به يوماً فقلت: أيهما خير أبو بكر أم علي؟ فقال: ما دمت في ضبة فأبو بكر!  ٢٩٤ - قال علي بن محمد الكناني : كان عليان المجنون بمكة فضربه الصبيان وضربه بعض الفساق بسكين فقطر منه الدم، فكنت أنظر إلى الدم يقطر على الأرض ويتصور كتابةً «الله»، فنظرت في ذلك تسعة عشر موضعاً.  وقال : مررت به ذات يوم فقلت له : ألا تصير إلى المنزل؟ قال : بلى . فقلت : أتعرفه ؟ قال : نعم . فبينما أنا جالس ذات يوم على الباب إذ طلع والصبيان يرمونه بالحجارة وفي يده قصبة ، فجاء فجلس إلى جنبي ثم ألقى القصبة من يده وقال : الموعد، وصادف ذلك اليوم وليمة فأرسلت فجيء بطبق عليه طعام فوضع بين يديه فقلت : كل . فقال : أَوَأَحْملُهُ إلى العيال؟ وجعل يتقلب فعلمت أنه يريد شيئاً يحمله فيه فأمرت الجارية فجاءت يقطعة كرباس فوضعه فيها وقال : أسأل الله نعيم الآخرة. ثم قال : إني إذا أكلته كان في بطني وإذا حملته إلى العيال كان في ميزاني ثم قال : لا يفطنون لعيب جارهم وهم بحفظ جوارهم فطن قال : فقلت له : يا أبا الحسن ألا تعود ؟ قال : الطمع لؤم .  قال : وقال أبي : لقيت عليان يوماً ومعي قَسْبُ عَنبر قد اشتريته لأمي فقلت: يا أبا الحسن هل لك في بعض هذا القسب؟ فإني اشتريته لأمي . فقال لي : بر أمك أولى بك . فقلت له : إنه لي بعد . فسكت فأخذت منه شيئاً ووضعته بين يديه . فجعل ينظر إليه وإلى حسنه والصبيان يؤذونه ويرمونه ثم أخذ كفاً ونظر إلي وقال : هذا من رحمة الله - وأشار إلى الصبيان : وهؤلاء من عذاب الله .  أخبرنا محمد قال: أخبرنا الحسن قال: أخبرنا أبو موسى قال: حدثنا أبو عوانة قال: أخبرنا أبو علي قال: حدثنا محمد بن الحسين قال: قال أبو عبدالرحمن الأشهلي: وقلت له ذات يوم: كيف أصبحت يا أبا الحسن؟ قال: بخير. قلت: من العاقل؟ قال: من حاسب نفسه وخاف ربه.  أخبرنا محمد قال: أخبرنا الحسن قال : سمعت ميمون بن سهل أبا طاهر الفقيه الواسطي يقول : حُكِيَ لي عن أبي يوسف القاضي أنه قال : كنت ماراً في طرقات الكوفة إذا أنا بعليان المجنون فلما بَصر بي سلّم علي وقال : أيها القاضي مسألة . قلت : هات. قال : أليس قال الله في كتابه وما من دابة في الأرض ولا طائر يطير بجناحيه إلا أمم أمثالكم ؟ قلت: بلى قال : أليس ـ جل ذكره ـ قال : وَإِنْ مِنْ أُمَّةٍ إِلَّا خَلا فيها نَذِيرٌ ؟ قلت: بلى . قال : فما نذير الكلاب؟ قلت: لا أدري فأخبرني . قال : لا والله لا أقول إلا بمن رقاق ونصف من شواء ونصف من فالوذج . فأمرت من جاء بها ودخلتُ معه مسجداً حتى أتى على آخره. فقلت : هات الجواب فأخرج من كمه حجراً وقال: هذا نذير الكلاب! .  وقال علي بن يحيى الطائي: رأيت عليان المجنون يعدو والصبيان خلفه فقال له رجل: يا مجنون. فقال: مهلا إنما المجنون من عرفه ثم عصاه.  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو جعفر محمد بن صالح الأروذي قال: حدثنا علي بن سهل بن بكر الصيدلاني ببيروت قال : أخبرنا محمد بن السري الرملي عن أبيه عن عطاء السلمي قال : مررت ذات يوم في أزقة الكوفة، فرأيت عليان المجنون واقفاً على طبيب يضحك منه وما كان لي عهد بضحكه فقلت: ما يضحكك؟ قال: هذا العليل السقيم الذي يداوي غيره وهو مسقام. قلت : فهل تعرف له دواءً ينجيه مما هو فيه ؟ قال : نعم شربة إن هو شربها رجوت برأه فيها. قلت: صفها . قال : خذ ورق الفقر وعرق الصبر وهليلج التواضع وبليلج المعرفة وغاريقون الفكر، ودقها دقاً ناعما بهاون الندم ، واجعلها في طنجير التقى وصُبَّ عليها ماء الحياء وأوقد تحتها حطب المحبة حتى يرغو الزبد، ثم أفرغها في جام الرضى وروحها بمروحة الحمد، واجعلها في قدح الفكرة وذُقها بملعقة الاستغفار فلن تعود إلى المعصية أبداً. قال: فشهق الطبيب شهقة وخر مغشياً عليه ثم فارق الدنيا. قال عطاء: ثم رأيت عليان بعد حولين في الطواف فقلت له : وعظت رجلا فقتلته . قال : بل أحييته . قلت : وكيف؟ قال : رأيته في منامي بعد ثلاثة من وفاته، عليه قميص أخضر ورداء وبيده قضيب من قضبان الجنة فقلت له حبيبي فما فعل الله بك؟ قال: يا عليان وردت على رب كريم رحيم غفر ذنوبي وقبل توبتي وأقالني عثرتي برحمته لا بعملي، وها أنا ذا في جوار المصطفى صلى الله عليه وسلم. رؤيا ذي النون عليان المجنون  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا الحسن محمد بن الحسن الحاكم ببوشنج يقول : سمعت إبراهيم بن فاتك يقول : سمعت يوسف بن الحسين يقول : سمعت ذا النون المصري يقول : رأيت في منامي كان قائلاً قال لي : إن في دير هرقل حكيماً من الحكماء أفلا تقصده؟ قلت : شأنك . قال : أفلا أكتري لك حماراً أو بغلا؟ قلت: لا مش معي فإن الله يقوينا على ذلك. وكان بيننا وبين الدير عشرون فرسخاً فمشيت معه نتحدث وجنّ الليل فأصبحنا ونحن على باب الدير كأنا لم نمش إلا شيئاً يسيراً. فدخلنا الدير فسألنا عنه فقالوا : لا نعرف ها هنا إلا معتوهاً أو ممروراً أو مريضاً . قال ذو النون : قلت : إنه وصف لي هاهنا حكيم. قال صاحب الدير: إنكما أحق بالحبس وبسقي الدواء من هؤلاء ! ما يصنع الحكيم في دير هزقل؟ قلنا : فائذن لنا في النظر إليهم . فقال : شأنكما . فما من مجنون إلا تعرضنا له فما سمعنا إلا ما دلّ على عزوبة عقولهم حتى بلغنا إلى أقصى مقصورة فيه، فرأينا رجلاً مغلولاً مقيداً قد شُدَّ بسلسلة إلى حجر كبير. قال ذو النون : إن كان فهذا. فتعرضت له فقال : قل خيراً تغنم أو اسكت تسلم. فسلّمتُ عليه فرد فقلت له : ما اسمك؟ قال: اسمي علي وأعرف بعليان . قلت : فأنت عليان الكوفي ؟ قال : نعم . قلت : فمن حبسك هاهنا؟ قال: الحب ينطق، والحياء يُسكت والخوف يُقلق. فتغير لوني وارتعدت فرائصي فقلت: يا علي ما أطيب العيش ؟ قال : إذا قُذف بك في عين الأنس فكأنك معه في الجنة تكلمه بكلام السرور، قلت: يا علي فما بلغ بك ما أرى؟ قال: كنت عاقلا ظريفاً وكان المدبّر والسائس غيري، وأنا منبوذ بين كنفه وعطفه، فإن شاء عفا، وإن شاء عاقب، وإن شاء ابتلى ، وإن شاء عافى، وهو الفعال لما يريد، وإن الطبيعة النقية يكفيها من العظة اللمحة ومن الحكم الإشارة إليها . قلت : فإني أسترشدك . قال : إن كان همك طلب الدلالة فإن ذلك أمر لا نهاية له، وإن كان همك وجوده فهو موجود في أول خطوة ولو احتملت الزيادة لزدناك . قال ذو النون وكنت رأيت كثيراً من العباد فما هِبْتُ أحداً قط كهيبته .  أخبرنا محمد قال: أخبرنا الحسن قال: أخبرنا أبو سهل محمد بن محمد بن الأشعث الطالقاني بها قال: حدثنا فارس بن عمرو البلخي قال: حدثنا علي بن بكر قال: حدثنا علي بن ظبيان قال: أتاني عليان وأنا في داري ذات يوم، فقلت له: ما تشتهي؟ قال: فالوذج فأمرت أهل الدار حتى اتخذوا له فالوذجاً. وقدم إليه فأكله ثم قال: يا علي هذا فالوذ العالمين، فهل لك في فالوذ العارفين؟ قلت: نعم. قال: خذ عسل الصفا وسكر الوفا وسمن الرضى ونشاء اليقين ثم ألقها في طنجير التقى ثم صُبَّ عليها ماء الخوف وأوقد تحتها نار المحبة، ثم حركها بإسطام العصمة، ثم اجعلها على جام الفكرة، ثم روحها بمروحة الحمد حتى تبرد، ثم كلها بملعقة الاستغفار. أما إنك إن فعلت ذلك ضمنتُ لك ألا تعصي ربك أبداً. اجتماع بهلول وعليان:  أخبرنا محمد قال: أخبرنا الحسن قال: أخبرنا أبو موسى قال: حدثنا أبو عوانة قال: حدثنا أبو علي سهل بن علي قال: حدثنا عبيد بن محمد قال: سمعت أبا خيثمة زهير بن حرب قال: أمر موسى الخليفة بإحضار عليان وبهلول فأحضرا، فلما دخلا عليه قال لعليان: أيش معنى عُليان؟ قال عليان: فأيش معنى موسى أطبق؟ قال موسى: خذوا برجل ابن الفاعلة. فالتفت عليان إلى بهلول وقال: خذها إليك، كنا اثنين فصرنا ثلاثة!  وحكى أبو جعفر السياح القزويني قال: لقيت عليان يوم العيد على شدة شوقي إليه وقد قصد مقبرة، فلما توسطها رفع رأسه وقال: اللهم لك صام الصائمون ولك قام القائمون وقربوا قربانهم ودخلوا منازلهم وأنسوا بأهاليهم، وقد قربت قرباني فليت شعري ما صنعت بقرباني؟ اللهم أصبحت لا منزل لي ولا عندي طعام، فاجعل قراي منك المغفرة. فلما رآني أرمقه وثب وهام على وجهه.  وقال أبو علي السيرواني اشتقت إلى عليان لما كان يبلغني عنه فدخلت الكوفة في طلبه فقالوا : هو في المقبرة، فدخلت المقبرة فلما رآني هرب فدخل مسجداً ورد الباب، فدخلت عليه فإذا هو في صلاة فلما فرغ أقبل على مناجاته فقال : إليك توجه الطالبون وأرادوك، وإليك قصد المحبون واشتاقوا إليك وآثروك . فدنوت منه فقلت: أُحبّ أن تجيبني فقال : نعم. فجئت به إلى منزلي فقلت : ما تشتهي؟ قال: ما اشتهيت منذ أربعين سنة إلا المولى . قلت : ألا أتخذ لك عصيدة جيدة؟ قال: هذا إليك . فاتخذتُ له عصيدة بالسكر ووُضِعَتْ بين يديه فقال : لا أريد مثل هذا ولكني أريد على الصفة التي أصفها لك . قلت : صفها لي : قال خذ تمر الطاعات وأخرج منه نواة العُجب، وخذ دقيق جهد العبودية وزعفران الرضى وسمن المنة، واجعل ذلك في طنجير التواضع، وصُبَّ عليها ماء الصفاء، وأوقد تحتها نار الشوق بحطب التوفيق، وحركه بإسطام الحمد، واجعله على طبق الشكر، وضعه بين يدي. من أكل منه ثلاث لقم تكون شفاءً لصدره وشفاءً لبدنه . ثم قام ونفض ذيله وقال : أفلح الزاهدون والـعـابـدونـا إذ لمولاهم أجـاعـوا البطونا
أقرحوا الأعين العزيزة شوقاً فمضى ليلهم وهم ســاجــدونــا
حَيَّرَتْهم مخافة الله حتى زعم الناس أن فيهم جنــونــا  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبدالله محمد بن عبدالله بن شبيب الفارسي قال : حدثنا أحمد بن لقمان قال : حدثنا عبدالله بن علي بن المنذر السيرافي قال : سمعت عبد الملك بن محمد الفقيه يقول : أرسل إلي عمران بن إسحاق بن الصباح، فأتيته فإذا أبو الديك عنده ـــ وكان حسن البديهة جيد الجواب - وإذا هو يجلب ويشير إلى الحائط كأنه يكلم شيئاً. وكان ذلك لا يعتريه إلا عند الجوع. فقال عمران : علي بالمائدة. ثم قال له : هلم فقال : هذه التي قال الله في كتابه حكاية عن نبيه عليه السلام ربَّنا أنزل علينا مائدة من السماء ثم قال لي : يا عبد الملك هذه فطن العقلاء وأذهان الحكماء. ثم أقبل على عمران فقال : أيها الأمير ويُطعمون الطعام على حُبِّهِ مسكيناً ويتيماً وأسيراً فأنا مسكين يتيم أسير في حبس شيطان قد وكل بي أعاذني الله منه . ثم أقبل على الطعام فأكل.  ۳۰۷ أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبدالله قال : أخبرنا أحمد بن لقمان قال : حدثنا عبد الله بن علي قال: حدثنا عبدالملك قال : مر أبو الديك بمؤدب في جبانة كندة وصبي ينشد: إن الصنيعة لا تكون صنيعةً
حتى يصاب بها طريق المصنع فقال أبو الديك : كذب الشاعر لا يكون المعروف معروفاً حتى يُصرف في أهله وغير أهله . ولو كان لا ينصرف إلا في أهله كيف كان ينالني منه شيء وأنا معتوه وكنيتي أبو الديك؟  ۳۰۸ أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو موسى عمران بن موسى بن الحصين قال : أخبرنا أبو عوانة قال : حدثنا أبو علي سهل بن علي قال : حدثنا محمد بن عبدالرحمن قال : حدثنا أبو نعيم الفضل بن دكين، أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبدالله محمد بن عبدالله بن شبيب قال : حدثنا أحمد بن لقمان قال : حدثنا عبد الله بن المنذر قال : حدثنا أبو نعيم قال : كنت جالساً عند حفص بن غياث بعد أن ولي القضاء، فدخل أبو الديك وكان ذاهب العقل محتالاً للمعاش في يوم شديد البرد حافياً حاسراً، فرحمه القاضي فدعا بجاريته فسارها فأتته بعمامة وخفين وقال : ادفعيه إلى أبي الديك فدفعته إليه فقال: أيها القاضي جزاك الله عن الأطراف خيراً، وحرّك قميصه . فضحك القاضي ثم قام فدخل بيته ثم خرج وقد خلع الجبة التي كانت عليه وقميصه ولبس غيرهما، فدفعهما إلى أبي الديك فلبسهما ثم قال : أيها القاضي حكي لي عن عبد الملك بن مروان أنه قال لبعض ولده : أي الثياب أعجب إليك ؟ قال : ما رأيته على غيري . قال : فأي الرجال اخترته لنفسك؟ قال: أحسنهم اختياراً لنفسه . وقد اخترت أيها القاضي لنفسك حسن الثناء وسَرَرْت أبا الديك كل السرور إلا قطيرة . قال القاضي : وما القطيرة؟ قال : شيء أنصرف به إلى العيال . قال : حبا وكرامة والله ما في منزلي ذهب ولا فضة، ولكني أستقرض لك . يا غلام قل لفلان : أقرضنا ديناراً وأدفعه إلى أبي الديك . فقال أبو الديك : والله أيها القاضي ما أجد لك مثالاً إلا ما قاله الشاعر: يُعيرني بالدين قومي وإنما ديوني في أشياءَ تُكْسِبُهُمْ حمدا
وما كنت إلا كالأعز بن جعفر رأى المال لا يبقى فأحيا به حمدا  كوفي . أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو موسى قال : أخبرنا أبو عوانة قال : حدثنا أبو علي قال : حدثني محمد بن الحسين قال: حدثني أبو الموفق سيف بن جابر قاضي واسط قال : كان لنا جار يقال له عبدالرحمن بن الأشعث وكان جميلاً وسيماً ، وكان من أمثل أهل زمانه، وكان يقدم أبا بكر وعمر رضي الله عنهما، وكان أهله على غير ذلك، فغلبت عليه المرّة فأحرقته وطيرته . وكان إذا خرج من بيته أولع به الصبيان يؤذونه ويقولون : يا رحمويه فلا يجيبهم، فإذا قيل له : عبدالرحمن قال : لبيكم ، أنا عبد الرحمن فرأيته يوماً والصبيان يرمونه بالحجارة، فقلت له : ارمهم وكفهم عنك . قال : لا أفعل يمنعني من ذلك خصلتان : خوف الله وأن أكون مثلهم . قال : ثم مر بي ذات يوم وأنا جالس أقرأ كتاب الصلاة لمحمد بن الحسن وأخي إلى جنبي، وكان مكفوفاً أسنّ مني وكان أحد الصالحين، فقلت : يا عبدالرحمن، لو جلست فسمعت . فقال : وكيف يا بن جابر وإنما يصيد كل طائر قدره ! . ثم قال : يا بن جابر، لئن أُعجبت بحالك عند هؤلاء الذين حولك، ليعجَبَنَّ أخوك هذا يوم القيامة بمكانه من الله إن شاء الله . فبكى أخي حتى سقط على وجهه وهو واقف ينظر إليه . ثم قال : يا بن جابر، كأني أنظر إلى استبشار الملائكة بمكانك، فغشي على أخي فحمل، ثم قال : يا سيف بن جابر اخزن لسانك كما تخزن دراهمك، وإذا أعجبك الصمت فتكلم وإذا أعجبك الكلام فاصمت. قال: فقلت له : اجلس، وما أقول لك اجلس إلا لأنس بك . قال : قل اللهم غفرانك اسأل من أنت أحوج إلى رحمته من رحمتك إياي . ثم قال : أقول يا بن جابر ما قال نبيه أيوب عليه السلام مسني الضر وأنت أرحم الراحمين . فما بقي منا أحد إلا بكى فقال : ما يبكيكم؟ أليس بقي لي خيراً مما أخذ مني : حُبه وحبّ أنبيائه وصالحي عباده وتقدمة أبي بكر وعمر؟ ثم ولى وهو يقول : لئن ابتليت لقد عافيت، ولئن أخذت لقد أبقيت.  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو موسى قال : حدثنا أبو عوانة قال : حدثنا أبو علي محمد بن الحسين عن سيف بن جابر قال: خرجت يوماً إلى الجبان في جنازة، فلما دفن جعلت أدور في المقابر فإذا بعبد الرحمن بن الأشعث جالس بين قبرين واضع خده على ركبته وهو يقول : شردتني في البلاد وصيرتني في الجبابين وانستني بالقبور. ثم قال : أستغفر أما إني أعلم أنك مأمورة، ولو عصيت الله لسلط عليك من هو شر منك علي. قال: فقلت له : يا عبد الرحمن من تُكلّم؟ قال : هذه المسلطة علي قلت : ومن هي؟ قال: المرة. قلت: فلو دعوت الله رجوت أن يُذهبها عنك . قال : يا بن جابر ربما دعوت الله وربما أمسكت . فأما دعائي فاستغاثة بالله، وأما إمساكي فتسليم لأمر الله ورضى بقضائه . قلت له : أفلا أجلس معك أنسك؟ قال لي : لا ، قد جعل الله أنسي في الوحدة كما جعل أُنْسَك في حِلَقِ الفقه . ثم قال : يا سيف بن جابر، أليس يُروى أن مؤرق العجلي قال : إني لأسأل الله حاجة منذ عشرين سنة فما أعطانيها وما يئست منها . قلت : بلى. فقال لي وهو مغضب بأرفع صوته : يا سيف والله لو قطعني جُذاماً وبَرَصاً لعلمتُ أن ذلك له وأنه الحكم العدل يفعل ما يشاء .  ۳۱۱ أخبرنا محمد قال: أخبرنا الحسن قال: حدثنا أبو عبدالله بن شبيب قال: حدثنا أحمد بن لقمان عن أبيه عن سيف به سواء. فليت المجنون  كوفي أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو موسى قال : حدثنا أبو عوانة قال : حدثنا أبو علي قال : حدثنا محمد بن الحسين قال: حدثني محمد بن عبدالرحمن الكوفي قال : قال لي أبي : كان لنا جار يقال له فليت، وكان معتوهاً، وكانت له خالة عجوز كبيرة قد أدركت عجائز الحي وكنت أتحدث عندها وكان لها عقل ودين. فكنت عندها ذات يوم إذ دخل فليت فقلت له : يا فليت أيسرك أنك أمير المؤمنين ؟ فقال : لا . فقلت : ولم ؟ قال : يثقل ظهري ويكثر همي وينسيني النعيم ذكر ربي . قلت : وفي الأرض عاقل لا يتمنى أنه خليفة؟ قال : وفي الأرض عاقل يتمنى أنه خليفة؟ .  قال محمد بن عبدالرحمن قال أبي وقلت له يوماً : أما ترى عجوزك قد كبرت وضعفت وقرب أجلها؟ فنظر إلي وبكى، ثم أقبل علي وهو يبكي بكاءً عالياً وقال : فوالله ما أدري وإني لأوجل
على أينـا تـعــدو المنية أوّل قال محمد بن عبدالرحمن : قال أبي عاش فليت بعد هذا الكلام سنة ثم مرض في الشهر الذي تمثل فيه بهذا البيت . قال : فدخلت عليه أعوده وهو في دار قوراء خراب في أقصاها، فلما رآني دخلت من باب الدار قال : فوالله ما أدري وإني لأوجل
على أينا تعدو الـمـنـيــة أول يريد أن يذكرني تمثله بهذا البيت ويخبرني أن المنية قد غدت عليه قبلها. قال أبي : ولا أراه مات إلا في اليوم الذي تمثل فيه بهذا الشعر.  أخبرنا محمد قال: أخبرنا الحسن قال: حدثنا أبو موسى قال: حدثنا أبو عوانة قال: حدثنا أبو علي قال: حدثنا محمد بن الحسين قال: حدثنا محمد بن عبدالرحمن قال: قال أبي: كنت يوماً في شهر رمضان أتحدث مع خالة فليت، فرأيت فليتاً قد أخذ كوز ماء فشربه فقلت له: يا فليت أما تتقي الله، تفطر في شهر رمضان؟ قال: أستغفر الله، والله ما عقلت حين أخذته ولا حين شربته وقد قال الله تعالى (وليس على الأعمى حرج ولا على الأعرج حرج ولا على المريض حرج) وأنا مريض. ثم قال لخالته: يا سارة احفظي علي هذا اليوم فإن مت قبل أن أقضيه فاقضيه عني.  أخبرنا محمد قال: أخبرنا الحسن قال: أخبرنا أبو عبدالله محمد بن عبيد الله الجرجاني قال: سمعت حمزة بن محمد بن يوسف النسوي يقول: حدثنا محمد محمد بن ثابت الخراز قال: قلت لفليت ذات يوم: ما تشتهي؟ قال: عصيدة. فجئته بها وأدخلته بعض المساجد ووضعتها بين يديه فأتى على آخرها فظننت به جوعاً، فقلت له: أتريد الزيادة؟ قال: لا يا أخي هذا زادي إلى عشرة أيام.  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا القاسم عبيد الله بن المأمون بهراة يقول : سمعت إبراهيم بن محمد الكرماني السائح يقول : سمعت علي بن عمرو العسكري يقول : رأيت فليتاً والصبيان حوله يؤذونه ويرمونه بالحجارة وهو يقول : وَلَن صَبَر وغَفَر إن ذلك لمن عَزْمِ الْأُمورِ.  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبدالله محمد بن صالح المعافري قال : حدثني أيوب بن شجاع الأسدي عن أبيه قال كان لنا جار يقال له فليت، مجنون، فمر بي ذات يوم فقال : يا شجاع ، كم بقي في الشهر ؟ قلت : ثلاثة أيام . قال : واويلاه . قلت : وما ذاك ؟ قال : انقضى الشهر ولم أتزود المعادي . قديس المعتوه  أخبرنا محمد قال: أخبرنا الحسن قال: أخبرنا أبو عبد الله بن شبيب قال : أخبرني أحمد بن لقمان قال : أخبرني أبو عبد الله بن القومسي قال : بلغني أن رجلاً من الأنصار قال لقديس، وكان ذاهب العقل موسوساً : يا قديس أنت تعدو من الصباح إلى الرواح، أيوجعك جسدك إذا جاء الليل؟ فقال: إذا الليل ألبسني ثوبه تقلب فيه فتى موجع فقلت : أسألك عما تشتكي فتنشدني الشعر ؟ فقال : يا بن الفاعلة قد أجبتك . فقال الأنصاري : أتسبني وأنا سيد من سادات الأنصار؟ فقال: وإن بقوم سودوك لحاجة إلى سيد لو يظفرون بسيد ثم ضرط في يده وقال : هذا الجواب المقشر . قال الأستاذ رضي الله عنه : والشعر لبكر بن النطاح أنشدنيه أبو عوانة يحيى بن المتمم : إذا الليـل الـبـسـنـي ثـوبـه تَقَلَّبَ فيه فتى مُوجَعُ
رأيت التصـبـر ستـر الهـوى إذا اشتملت فوقه الأضلعُ
وكيف يطيقُ فتًى كَتْمَه وأجفانه أبداً تدمع  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو موسى قال : حدثنا أبو عوانة قال : أخبرنا أبو علي عن محمد بن الحسين قال: أخبرنا أبو عبدالرحمن الأشهلي قال : أخبرني أبو موسى بن قيس المازني ــ ولم أر في بني مازن أكمل منه قال : كان لنا جار يقال له قديس، وكان أبوه مولى للخيزران، من أهل البصرة له جلالة وأدب، وكان من أصحاب صالح بن عبد القدوس، وكان عارفاً بالشعر والأدب وكان ابنه قديس معتوهاً ذاهب العقل حتى يُكلّم فإذا كلّم لا يقدر عليه أحد. قال : فجلست يوماً على السور فمر بي فقلت : يا قديس أنت من حين تصبح إلى أن تمسي تشتد، فإذا جاء الليل يوجعك جسدك فقال: إذا الليل ألبسني ثوبه تقلب فيه فتى موجع فقلت: يا أحمق، أسألك عن تشكي جسدك فتنشدني الشعر، وقد علمت أنه قد أجابني . فقال : يا بن الزطية، أولست قد أجبتك ؟ فقلت له : يا قديس، تقول لي يا بن الزطية وأنا سيد من سادات الأنصار فقال : وإن بقوم سودوك لحاجة إلى سيد لـو يـظـفـرون بـسيـد ثم ضرط في يده ولطم جبهته وقال: هذا هو الجواب المقشر.  ۳۲۰ أخبرنا محمد قال : أخبرنا الحسن قال : حدثني أبي رحمه الله قال : حدثنا إبراهيم بن علي الذهلي قال : كتب إلي أبو حامد محمد بن إدريس الرازي قال : حدثنا عبد الرحمن بن بكر التريكي عن عثمان بن عمارة عن صالح المري قال : قدم علينا ابن السماك فقال : أروني عبادكم، فذهبت به إلى قديس وقرأت إذ الأغلال في أعناقهم والسلاسل يُسحبون . في الحميم ثم في النار يُسجرون فشهق شهقةً خر مغشياً عليه، فخرجنا من عنده وهو على تلك الحال . أبو سعيد الضبعي فقلت  ۳۲۱- بصري . أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو موسى قال : حدثنا أبو عوانة قال : حدثنا أبو علي قال : حدثنا محمد بن الحسين عن محمد بن عبدالرحمن قال : قال لي سعيد بن عامر مر بي أبو سعيد الضبعي ذات يوم له : ألا تجلس عندي ساعة ؟ قال : بلى، متزيناً بمجالستك . فجلس فقلت: يا أبا سعيد، ما أفضل الكلام؟ قال : شهادة ألا إله إلا الله وأن محمداً رسول الله . قلت: فأي الأعمال أفضل ؟ قال : إقام الصلاة وإيتاء الزكاة وصوم رمضان وحج البيت وبر الوالدين . قلت: فأي الرجال أحب إليك؟ قال : أحسنهم خُلقاً . قلت : فأي النساء أحب إليك؟ قال : المتحبّبة المتفننة وإن كانت قبيحة . ثم قال : يا بن عامر، مثلك يخبر مثلي في القباح، أشتهيها كما قال ابن الفريعة حسان : لو يدب الحولي من ولد الذر ـ عليها لأنديتها الكلوم  أخبرنا محمد قال: أخبرنا الحسن قال: أخبرنا أبو عبدالله شبيب قال: حدثنا لقمان قال: حدثنا بكار بن علي قال: قلت لأبي سعيد الضبعي ذات يوم: كيف أصبحت يا أبا سعيد؟ قال: أصبحت مؤمناً بالله لا أقول بقول القدرية ولا بقول المرجئة ولا بقول الجهمية والرافضة. فقلت في نفسي: قد خولط. ثم قلت: يا أبا سعيد، وما قول القدرية والمرجئة والجهمية والرافضة؟ فقال: أما القدرية فزعمت أن العبد لو لقي الله بمثل حبة خردل من المعاصي مصرا عليها كان في نار جهنم خالداً. وقالت المرجئة: من لقي الله بشهادة ألا إله إلا الله فهو في الجنة وإن زنى وإن سرق. وقالت الجهمية: عِلْمُ الله مخلوق فكفرت بالخالق. وقالت الرافضة: بعث الله جبريل إلى علي فغلط فأتى محمداً فكفرت بالله وجحدت بمحمد صلى الله عليه وسلم. قلت: فما تقول أنت؟ قال: أقول: خَلق الله الخلق لما شاء ليس لما يشاؤون، فمن عذب منهم عذبه غير ظالم، ومن رحمه فَرَحْمَتُه وَسِعت كل شيء، عزّ وجل أن يقال له لم وكيف، وقد قال الله في كتابه لا يُسأَلُ عما يفعل وهم يُسألون. ثم قال: يا بن عامر، هل أنكرت شيئاً؟ قلت: لا.  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو موسى قال : حدثنا أبو عوانة قال : حدثنا أبو علي عن محمد بن الحسين عن سعيد بن عامر قال : كان بالبصرة وال يقال له محمد بن سليمان فكان كلما صعد المنبر أمر بالعدل والإحسان، فاجتمع قوم من نساك البصرة فقالوا : أما ترون ما نحن فيه من هذا الظالم الجائر وما يأمر به . فأجمعوا على أنه ليس له إلا أبو سعيد الضبعي ، فلما كان يوم الجمعة احتوشوا أبا سعيد، وكان لا يتكلم حتى يُحرك . فلما تكلم محمد بن سليمان حركوه وقالوا : يا أبا سعيد، محمد بن سليمان يتكلم على المنبر يأمر بالعدل والإحسان . فقام فقال : يا محمد بن سليمان، إن الله يقول في كتابه يا أيها الذين آمنوا ما تفعلون . كَبُرَ مَقْتًاً عند الله أن تقولوا ما لا تفعلون . يا محمد بن سليمان، إنه ليس بينك وبين أن تتمنى أنك لم تخلق إلا أن يدخل ملك الموت بيتك . قال : فخنقت محمد بن سليمان العبرة ولم يقدر على الكلام ، فقام أخوه جعفر بن سليمان إلى جنب المنبر فتكلم عنه . فأحبه النساك حين خنقته العبرة وقالوا : مؤمن مذنب.  ٣٢٤ وقال محمد بن عبد الرحمن قال لي سعيد بن عامر : كان الجعفر بن سليمان جارية يقال لها خيزران، وكان مفتوناً بها واشتهر ذلك بالبصرة، فركب يوماً في جماعة من الموالي يريد الجمعة، فمر بأبي سعيد الضبعي، فلما حاذاه قيل لأبي سعيد : هذا جعفر، فرفع رأسه إليه وقال : يا جعفر تحب خيزران؟ قال : نعم يا أبا سعيد . قال أبو سعيد : وتحبك؟ قال: نعم. فقال أبو سعيد : نتها عَشِقَتْ حَشَّـا فقلت لها لا يعشق الحش إلا كل كناس فضرب جعفر وجه دابته ورجع حياءً من الناس.  ٣٢٥ بغدادي أخبرنا محمد قال: أخبرنا الحسن قال : أخبرنا أبو عبد الله بن شبيب قال : حدثنا أحمد بن لقمان قال : أخبرنا أبو عبدالله بن القومسي ، حدثنا عبد الله بن أبي القاسم عن محمد بن جعفر الدينوري قال: لقيت جعيفران وقد جاء إلى علي بن إسماعيل الهاشمي الملقب بالطارمة، وكان له هيئة فوقف بين يديه وقال : أعطني درهماً ، فَزَبَره الغلمان ونحوه فقال : قد زعم الناس ولم يَكْذِبوا أنك من غير بني هاشم فقال علي: فضحني والله ، وهم بقتله . ثم قال: يا جعيفران، ما تريد؟ قال : درهماً صحيحاً ورغيف حُوّارَى وفالوذجاً ، فجيء بها فقعد وأكله أجمع وأخذ الدرهم وقال : فكذب الله أحاديثهم یا هاشمي الأصل من آدم!  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا محمد بن عبدالله قال : حدثنا أحمد بن لقمان قال : حدثنا محمد بن المؤمل العدوي قال: أخبرنا محمد بن الحسين العقيلي قال : مر جعيفران بالمتوثي التاجر وكان من المياسير فقال : يا جعيفران، هل لك في جبة جديدة؟ يا أيها القائل لي أنـفـا هل لك يا جعفر في جبه فقال المتوثي : كنت أمزح . وهكذا كل فتّى أُمُّه باغية زانية قحبة
فاشرب هنيئاً قدحاً مترعاً بالصرف حييت به نُخبة قال : فلم يظهر للناس سنة حياءً من هذين البيتين.  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبد الله قال : حدثنا أحمد بن لقمان قال: حدثنا محمد بن المؤمل قال : سأل جعيفران عبدالعزيز الأنباري شيئاً، فأمر غلمانه بإعطائه وله غلامان زنجيان وغلامان روميان، فامتنع الزنجيان، فأعلمه فلم ينكر عليها، فقال: غلمانك الزنج لهم جرأة عليك ما فيها لهم من مزيد
والبيض من ضَرْبِكَ إياهمُ في فَرَقٍ منك وخوف شديد فقال عبدالعزيز: ما هذا يا بغيض ؟ ثم قال لغلمانه : أنتما حران إن بتما في بر داري بعد هذا، فبيعا على المكان.  أخبرنا محمد قال: أخبرنا الحسن قال: أخبرنا أبو إسحاق إبراهيم بن محمد بن بسام الطواويسي قال: حدثنا بشر بن علي الشاشي قال: حدثنا أبو الطيب محمد بن إسحاق الوشاء قال: حدثنا عبد الله بن عثمان عن أبيه قال: أبطأ جعيفران عنا يوماً، ثم عاد إلينا وهو عريان ينشد والصبيان حوله يرمونه، فسلم ثم قال: يا عبدالله: رأيت الناس يدعوني بمجنون على حال
ولو كنتُ كقارون وفرعون في الأقبال
رأوني حسن الوجه جميلاً حسن البال
وما ذاك على حق ولكن هيبةُ المالِ فقلت: أيحضرك شيء غير هذه القافية في هذا المعنى حتى نعلم أنك شاعر؟ رأيتُ الناس يدعوني بمجنون على عَمْدِ
وما بي اليوم من حُمْقٍ ولا لبس ولا عقد
ولكن قولهم ذاك الإدفاعي من الوجد
ولو كنتُ كقارون ووالي رحبـة الـجـنـد
رأوني راجح العقل جميلاً حسن القد
وما ذاك على حق ولكن هيبة النقد فقلت: أعندك مزيد على هذا؟ فإن جئت بالثالثة أقررتُ لك. فأطرق ثم قال: قم بنا إلى المنزل فقمنا فقال: رأيت الناس يرموني بوسواس في الأيام
وما كنتُ أخا مُوقٍ قديماً قبل تهيامي
ولكني أرى ذلك الإدفاعي وإعدامي
ولو كنت أخا مُلْكٍ وإسراج والجام
إذا أَكرمني الناس ولم أُرمَ بإلمام
وكانوا كل وقت يتباهون بإكرامي قال: فأدخلته منزلي وغديته وقعدت أشاربه أنا وقوم من أصحابنا، ثم عاتبناه على ما يصنع بنفسه فأنشأ يقول: رأيتُ الناس يرمون ي أحياناً بوسواس
ومن يضبط يا هذا مقال الناس في الناس؟
فَدَعْ ما قاله الناس وعجل صفوة الكاس
فإن الناس يُغرَونَ بأمثالي وأجناسي
ولو كنتُ أخا مُلْكٍ أَتوني بين جُلاسي
يقومون ويغدون على الرجلين والراس ثم قال: يا فتى، هذه أربعة، وقام قومة، فقال لي أصحابنا: لو جئنا بقينة. قلت: ومن يجيء بقينة بين يدي مجنون؟ دعونا اليوم نلهو. فدخل علينا فقال: ونـدامی أكلوني إن تغيبت قليلا
زعموا أني مجنون أرى العُرْيَ جـمـيـلا
كيف لا أعرى وما أب صرت في الناس منيلا
باسطاً للجود كفا قائلاً خيراً فعولا
إنني أهوى كرام النـاس لا أهــوى الـبـخـيـلا
إن أكن قد سُؤْتُكُمْ يو مي فخلوا لي السبيلا
وابْتَغُوا غيري نديماً لكم منّي بديلا
ثم جيئوا بغناءٍ يترك المولى ذليلا
وأتمّوا يومَكم أحياكم الله طويلا قال: فندمنا على ما كان منا فقلنا: بل معك نلذ ونفرح، فأتيناه بثوب فطرحناه عليه، وأتينا بقينة فلما دخلت دعا برطل فشربه وأمر بإدارته علينا، فلما صار في أيدينا أنشأ يقول: يا إخوتي كلّكم سيد 
حياكم الله وأحياكم
لا تحبسوا الإبريق عن صاحب قد طَرِبَ اليوم وسقاكم فشربناه ودعا برطل آخر فشربه، فلما صار في أيدينا قال: حياكم الرحمن إخوانا وزادكم فضلاً وإحسانا
لا تحبسوا الإبريق عن صاحب صيركم للراح ريحانا فشربناه وصلينا الظهر والعصر، فلما كان وقت المغرب دعا برطل ثالث فشربه، فلما صار في أيدينا قال: يا أوسط الكتاب أحسابا حياكم الـرحـمـن أصـحــابــا
لا تحبسوا الإبريق عن صاحب يودكم حقاً وإن غابا فشربناه وصلينا المغرب، ثم طلب رابعاً فشربه فلما صار في أيدينا قال: يا إخوتي يا سادة الكرماء حُيّيتم في غبطة ونماء
لا تحبسوا الإبريق عن صاحب يلقاكم بتحية الأمراء ثم دعا برطل خامس فأمْسَكَتِ القينة لتستريح فقال: يا أحسن الأمة تغريدا حُتّي بمضرابـك لـي العـودا
وأسعدي صبا أخا صبوة أصبح في اللذات مقصودا فغنته فشرب ثم اتكأ اتكاءة النائم وأنشأ يقول: سلام عليكم حان وقت مـبيـتنــا وقد أحدثت في الرأس كأسكُم وقرا
وما أنا بالفحاش ساعة نلتقي ولا أنا بالمؤذي ولا قائل هجرا ثم نام، فلما أصبح رمى بالثوب إلى الغلام وقال: هاكم ثوبكم فقد لبسناه مدة حاجتكم إلينا، وخرج.  أنشدني علي بن محمد بن عبد الله الصفار والسرخسي لجعيفران: ما خالد لأبيه ولا شبيه
أضحى لآباء شتى فكلهم أبيه يدعيه
فذا يقول بنيي وذا يخالف فيه
والأم تضحك منهم لعلمها بأبيه  وأنشدت له: لا تزوج فتهلكا حذرك اليوم حذركا

إن للعرس فرحة غبها يورث البكا

لا يغرنك سقف بيت وفرس ومتكا

عن قليل يشكى إليك فترثي لمن شكا  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو بكر أحمد بن إسحاق بن إبراهيم الأملي آمل جيحون قال : حدثنا محمد بن خلف البغدادي قال : حدثنا محمد بن الفياض بن بحر الكلابي قال : حدثنا محمد بن مهدي الكاتب قال : دخل جعيفران الموسوس دارنا فقام إلى مجلس لنا وكتب في صدره : يا قصر شَانَكَ بُخْلُ صاحبك الذي ما فيه مع إمساكه مُستَمْتَعُ
أنت العروس لها جمال فائق لكنها في كل يوم تُصرع  أخبرنا محمد قال: أخبرنا الحسن قال : أخبرنا أبو عبد الله بن شبّب قال : حدثنا أحمد بن لقمان قال : حدثنا هاشم بن محمد بن عبدالله بن هارون قال : حدثني أحمد بن يوسف قال: كنتُ عند أبي دلف القاسم بن عيسى إذ جاء آذنه فقال : جعيفران الموسوس بالباب. فقال: وما لنا وللمجانين، أوقد فرغنا من الأصحاء ؟ . قلت : إنّ له لساناً . قال : فليدخل إذاً . فدخل فوقف بين يديه وقال : أيا أعز الناس مفقودا وأكرم الأمة موجودا
لما سألت الناس عن واحد أصبح في الأمة محمودا
قالوا جميعاً إنّه قاسم أشبه آباء له صيدا فقال أبو دلف : أنت والله يا جعيفران شاعر يا قهرمان، أعطه مئة درهم واخلع عليه خلعةً واحدة. فقال جعيفران : أيها الأمير، أما الخلعة فأخذها، وأما المئة فليعطني القهرمان منها خمسة دراهم كلما أتيت . فقال : أعطه خمسة دراهم كلما جاء حتى يحول بيننا وبينه الموت . فأطرق جعيفران ثم رفع رأسه فقال له أحمد بن يوسف : ما لك؟ فقال : يموت هذا الفتى تراه وكلُّ شيءٍ له نفاد
لو كان شيء له خلود عمر ذا المفضل الجواد فقال أبو دلف لأحمد : أنت أبصر بصاحبك ! .  أخبرنا محمد قال: أخبرنا الحسن قال: حدثنا أبو محمد أحمد بن محمد بن إسحاق الجيرنجي بمرو قال: حدثنا ابن الأنباري قال: حدثنا عبدالله بن خلف الدلال قال: استأذن جعيفران على أبي دلف، وذكر الحكاية.  ٣٣٤ أخبرنا محمد قال : أخبرنا الحسن قال: أخبرنا أبو منصور مهلهل بن علي العنزي قال : سمعت أبي يقول: سمعت محمد بن جعفر الدينوري يقول : أخبرني بعض الكتاب أن جعيفران أتى بعض الولاة وهو يأكل، فدعاه إلى طعامه فأكل معه، فلما كان من الغد حُجب فقعد على الباب ثم كتب إليه: عليك إذن فإنا قد تغدينا لسنا نعود فقد كنا تسقينا
يا أكلةً سلفت أبقت حزازتها داءً بقلبك ما صمنا وصلَّينا  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا الفضل أحمد بن محمد بن حمدون الفقيه يقول : سمعت أبا بكر محمد بن الحسن الدريدي يقول : أنشدت لجعيفران في حماد عجرد : لحمادٍ إِذا فَتَشْتَ عنه أب من هاشم فيما يقولُ
وعم من ربيعة في ذُراها وخال بالسواد لـه نـخـيـل
فلستُ بقائل فيه مديحاً سوى أن الفرائض قد تعول  أخبرنا محمد قال: أخبرنا الحسن قال: أخبرنا أبو نصر أحمد بن محمد بن ملحان البصري قال: حدثنا أبو العباس الأسدي قال: حدثنا بعض أصحابنا قال لقيت جعيفران فقلت له: تجيز لي بيت شعر. قال: نعم، بدرهم صحيح. قلت: نعم. قال: هات فأعطيته الدرهم وأنشدته: وما الحب إلا لوعة قذفت بها عيون المها باللحظ بين الجوانح ففكر ساعة ثم قال: ونار الهوى يطغى عن القلب فِعْلُها كفعل الذي جادت به كف قادح  قال : وأُنشدت له : يا واعد الوعد ليس يُنجزه

صار أميراً إن ذا عبرة
وقدرة الله في الخَلْق  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو موسى قال : حدثنا أبو عوانة قال : حدثنا أبو علي قال: حدثنا زكريا بن أبي خالد قال : قال صاحب لنا : لقيت جعيفران فقلت له : إني قلت مصراع بيت فإن أتممته فلك درهم قال: هات، فقلت: ألا عجزت عن الصبر العقول
لأن سبيله مرّ ثقيل فقال : هات الدرهم ! . سهل بن أبي مالك الخزاعي  ٣٤١ كوفي . أخبرنا محمد قال: أخبرنا الحسن قال : حدثنا أبو موسى عمران بن موسى بن الحصين قال : حدثنا أبو عوانة قال: حدثنا أبو علي سهل بن علي ببغداد في الدور قال : حدثنا محمد بن الحسين قال : حدثنا عبد الرحمن الأشهلي قال : سمعت ابن إدريس يقول : مررت بابن أبي مالك وهو جالس بجمع فقلت : يا بن أبي مالك ، فقال : اسكت ـ وغضب وانقلبت عيناه ـ فإن أعمالك كلها بإجازات . قال : فوالله ما رجعت من الفرق منه . فلما كان يوم الجمعة حملت معي ثلاثة دراهم وأمرت إنساناً يطلبه فوجده فأتيته فدفعت إليه الدراهم، فتبسم بخير كأن الكلمة وقعت حيث أراد، ثم أقبل علي فقال : قل قلت له : يا بن أبي مالك، ما تقول في النبيذ؟ قال: حلال . قلت : تشربه؟ قال : إن شربته فقد شربه وكيع وهو قدوة. قلت: تقتدي بوكيع في تحليله ولا تقتدي بي في تحريمه وأنا أسن منه؟ فقال: إن قول وكيع مع اتفاق أهل البلد معه أحب إلي من مقالتك مع اختلاف أهل البلد عليك! . فقلت : ما تقول في الغناء : قال : قد غنى البراء بن مالك وعبد الله بن رواحة، وسمع الغناء عبدالله بن عمر، وكان عبدالله بن جعفر من التابعين، وأمسك. فقلت له : سميت جماعة من الصحابة وأمسكت عند عبد الله بن جعفر. قال: لأنك سألتني عن الغناء، ولم تسألني عن ضرب العيدان .  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا محمد بن عبدالله بن شبيب قال : حدثنا أحمد بن لقمان قال : حدثنا محمد بن إبراهيم المقرىء عن محمد بن عبد الرحمن الأشهلي عن ابن إدريس به سواء .  ٣٤٣ أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا عبدالله بن علي بن إسماعيل البغوي قال : حدثنا محمد بن إسحاق الوشاء قال: قال العباس بن محمد الهاشمي : سمعت ابن إدريس يقول بالحكاية سواء.  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا محمد بن عبدالله بن شبيب قال : أخبرني أحمد بن لقمان قال: حدثني بكار بن علي قال كان ابن أبي مالك عالماً بالشعر، فسأله رجل من أصحابنا : ما أجود الشعر؟ قال: ما لا يحجبه عن القلب حاجب مثل قول جميل : ألا أيها النوّام ويحكمُ هُبُوا أَسائِلُكُمُ : هل يقتل الرجل الحب  ٣٤٥ أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو موسى قال : حدثنا أبو عوانة قال : حدثنا أبو علي بن عبد الحميد بن محمد بن عبدالرحمن قال: حدثني عبدالله بن إدريس قال: خرجت يوماً من عند عيسى بن موسى وكان أرسل إلينا في شغل، حتى إذا كنتُ في طاق المحامل إذا أنا بابن أبي مالك جالس قد نكس رأسه كالمغشي عليه، فوقفت على رأسه فقلت : يا بن أبي مالك، فانتبه فزعاً فقال : ما تشاء؟ فقلت : أي شيء أعجب إليك؟ قال : مسألتك إياي من المحال، وما يدريني أي شيء أعجب لو قلت لي من النساء لقلتُ بيضاء شقراء مجدولة شهلاء. ولو قلت : أي الرجال أعجب إليك لقلتُ: أصحهم جواباً وأحسنهم مسألة. فغير مسألتي إياه ومدح إجابته إياي . فلما وليت سمعته يقول : انظروا إلى أبن ادريس ثم قال : أبا خالد قد كُنتَ سَاحَ غمرة صغيراً، فلما شبت خيمت بالشاطي
