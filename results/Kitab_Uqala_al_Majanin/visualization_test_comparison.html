<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipeline Comparison Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 6px;
        }

        .stat {
            padding: 10px;
            border-left: 4px solid #007bff;
        }

        .stat-label {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .toggle-btn {
            padding: 10px 15px;
            border: 2px solid;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        .toggle-btn.camelbert {
            border-color: #e74c3c;
            color: #e74c3c;
        }

        .toggle-btn.camelbert.active {
            background: #e74c3c;
            color: white;
        }

        .toggle-btn.baseline {
            border-color: #3498db;
            color: #3498db;
        }

        .toggle-btn.baseline.active {
            background: #3498db;
            color: white;
        }

        .toggle-btn.gold {
            border-color: #2ecc71;
            color: #2ecc71;
        }

        .toggle-btn.gold.active {
            background: #2ecc71;
            color: white;
        }

        .legend {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 6px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            opacity: 0.3;
        }

        .legend-color.camelbert {
            background: #e74c3c;
        }

        .legend-color.baseline {
            background: #3498db;
        }

        .legend-color.gold {
            background: #2ecc71;
        }

        .text-container {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 6px;
            line-height: 1.8;
            direction: rtl;
            text-align: right;
            word-break: break-word;
            white-space: pre-wrap;
            position: relative;
            font-family: 'Arabic Typesetting', 'Arial Unicode MS', Arial, sans-serif;
        }

        .segment {
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
            padding: 2px 4px;
            border-radius: 2px;
            margin: 0 2px;
        }

        .segment:hover {
            opacity: 1 !important;
        }

        .segment.camelbert {
            background-color: rgba(231, 76, 60, 0.3);
            border-bottom: 2px solid #e74c3c;
        }

        .segment.baseline {
            background-color: rgba(52, 152, 219, 0.3);
            border-bottom: 2px solid #3498db;
        }

        .segment.gold {
            background-color: rgba(46, 204, 113, 0.3);
            border-bottom: 2px solid #2ecc71;
        }

        .segment.hidden {
            display: none;
        }

        .tooltip {
            display: none;
            position: absolute;
            bottom: 100%;
            left: 0;
            background: #333;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            white-space: nowrap;
            font-size: 12px;
            z-index: 1000;
            margin-bottom: 5px;
            pointer-events: none;
        }

        .segment:hover .tooltip {
            display: block;
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            color: #666;
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .controls {
                flex-direction: column;
            }

            .toggle-btn {
                width: 100%;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

        </div>

        const textContent = `بسم الله الرحمن الرحيم وما توفيقي إلا بالله الحمد لله الذي لا يخيب لديه أمل الآملين، ولا يضيع عنده عمل العاملين، فهو جبار السماوات والأرضين، والصلاة والسلام على محمد وآله أجمعين. أما بعد، فإن الله تعالى خلق الدنيا دار زوال، ومحل قلق وانتقال، وجعل أهلها فيها غرضاً للفناء، ومقاساة الشدة والبلاء، فشاب حياتهم فيها بالموت، وبقاءهم بحسرة الفوت. وجعل أوصافهم فيها متضادة، فقرن قوتهم بالضعف، وقدرتهم بالعجز، وشبابهم بالمشيب، وعزّهم بالذل، وغناهم بالفقر، وصحتهم بالسقم. واستأثر بانفراد الصفات لنفسه : قوة بلا ضعف، وقدرة بلا عجز وحياة بلا موت، وعزّاً بلا ذلّ، وغنى بلا فقر، وكذلك سائر صفاته تعالى وعلا. ثم أقسم بها أجمع فقال عز وجل : والفَجْر، وليال عشر، والشفع والوتر. واختلف الناس فيها من ثلاثين وجهاً، وأشار أبو بكر محمد بن عمر الوراق إلى ما ذكرناه.  أخبرنا أبو بكر محمد بن عبدالله الأرديشائي في المسجد الحرام قراءة عليه قال : حدثنا أبو الحسن محمد بن حبيب بنيسابور قال : حدثنا أبو إسحاق إبراهيم بن محمد بن يزيد النسفي بمرو قال : حدثنا أبو عبيد الله ختن أبي بكر الوراق قال: سئل أبو بكر عن قوله تعالى : والشفع والوتر فقال : الشفع تضاد أوصاف المخلوقين، والوتر انفراد صفاته تعالى، ثم ذكر نحواً مما قلناه. وعلى هذا المثال قرن حبرتهم بالعبرة وفرحهم بالترح. وكذلك قالت الحكماء : كفاك بصحتك سقماً وبسلامتك داءً.  أخبرنا محمد بن أحمد قال : حدثنا الحسن بن محمد بن حبيب قال حدثنا أبو عبدالله محمد بن عبد الله بن أحمد الخطيب السيدابي بزوزن قال : حدثنا أبو قريش محمد بن جمعة بن خلف الحافظ قال : حدثنا محمد بن زنبور المكي قال : حدثنا حماد بن زيد عن ثابت عن أنس بن مالك قال : قال رسول الله صلى الله عليه وسلم: «كفى بالسلامة داء».  أخبرنا محمد قال : سمعت الحسن يقول : سمعت الفقيه أبا حامد أحمد بن محمد بن العباس البغوي بها يقول: سمعت أبا الحسن علي بن إبراهيم بن عبدالله قال : سمعت أبا داود سليمانَ بنَ مَعْبَدٍ السبخي يقول : أنشدني بعض الأدباء : كانت قناتي لا تلين لغامز
فألانها الإصـبـاح والإمساء
ودعوت ربي بالسلامة جاهداً
ليعيشني فإذا السلامة داء  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو بكر محمد بن عيسى بن علي بمرو الروذ قال : أخبرنا يوسف بن موسى قال : حدثنا بشر بن عبدالغفار الواسطي عن يحيى بن هشام السمسار قال: قال مسعر لعطية العوفي: كيف أصبحت؟ قال : في سلامة مشوبة بداء، وعافية داعية إلى فناء .  أخبرنا محمد قال : حدثنا الحسن قال : حدثنا أبو علي الحسين بن محمد بن هارون قال: حدثنا أبو حامد المستملي قال : أخبرنا محمد بن الحجاج قال : حدثنا جميل بن زيد عن وهب بن راشد عن فرقد السبخي قال : مكتوب في التوراة : يا بن آدم ، أنت في هدم عمرك مذ سقطت من بطن أمك . وقيل للحسن: إن فلاناً في النزع فقال : ما زال في النزع مذ خرج من بطن أمه، ولكنه الآن أشد . وهذا حميد بن ثور، وكان من فحول الشعراء يقول في بعض قصائده: أرى جسدي قد رابني بعد صحة
وحسبك داءً أن تصح وتسلما  أخبرنا محمد قال : أنشدنا ابن حبيب قال : أنشدنا أبو الحسن علي بن محمد بن عبدالله السرخسي قال : أنشدنا أبو العباس محمد بن عبدالرحمن الدعولي قال : أنشدنا أبو الحسن محمد بن حاتم المظفري : يحب الفتى طول البقاء وإنه
على ثقة أن البقاء فناء
زيادته في الجسم نقص حياته
وليس على نقص الحياة نماء
إذا ما طوى يوماً طوى اليوم بعضه
ويطويه إن جنّ المساء مساء
جديدان لا يبقى الجديد عليهما
ولا لهما بعد الجميع بقاء  وكما شاب صفات أهل الدنيا بأضدادها، كذلك شاب عقولهم بالجنون، فلا يخلو العاقل فيها من ضَرْب من الجنون. ولذلك أشار النبي صلى الله عليه وسلم إلى من أبلى شبابه في المعصية فسماه مجنوناً . أخبرنا محمد قال : حدثنا الحسن قال : حدثنا أبو زكريا يحيى بن محمد بن عبدالله العنبري قال : حدثنا أبو إسحاق حيان بن أحمد بن حيان البلخي قال : حدثنا محمد بن مدويه الكرابيسي الترمذي قال : حدثنا خالد بن خداش عن صالح المري عن جعفر بن زيد العبدي عن أنس بن مالك رضي الله عنه قال : بينما رسول الله صلى الله عليه وسلم في أصحابه إذ مر به رجل فقال بعض القوم : هذا مجنون . فقال رسول الله صلى الله عليه وسلم : «هذا رجل مُصاب، إنما المجنون المقيم على معصية الله عزّ وجل».  والمجنون عند الناس من يُسمع ويسبّ ويرمي ويخرق الثوب، أو من يخالفهم في عاداتهم فيجيء بما يُنكرون ؛ ولذلك دعت الأمم الرسل مجانين لأنهم شقوا عَصاهم فنابذوهم وأتوا بخلاف ما هم فيه. قال الله تعالى : كذبت قبلهم قوم نوح فكذبوا عبدنا وقالوا مجنون وازدجر، فدعا ربه أني مغلوب فانتصر. وقال: وفي موسى إذ أرسلناه إلى فرعون بسلطان مُبين، فتولّى بركنه وقال ساحر أو مجنون.  ١٠ أخبرنا محمد بن أحمد قال: أخبرنا الحسن قال : سمعت علي بن عبدالله السمرقندي يقول : سمعت أبا القاسم الحكيم يقول: من عرف نفسه كان عند الناس ذليلاً، ومن عرف ربه كان عند الناس مجنوناً. ولقد قال مشركو مكة الرسول الله صلى الله عليه وسلم حين تحداهم إلى الإيمان بالله إنه مجنون وساحر وشاعر وكاهن.  أخبرنا محمد قال: أخبرنا أبو القاسم بن حبيب قال: أخبرنا أبو علي الحسن بن محمد بن هارون قال: حدثنا أحمد بن محمد بن نصر اللباد قال: حدثنا يوسف بن بلال عن محمد بن مروان الكلبي عن أبي صالح عن ابن عباس أن الوليد بن المغيرة المخزومي قال حين حضر الموسم: يا معشر قريش إن محمداً رجل حلو الكلام، وقد أغار أمره في البلاد وأنجد، وإني لا آمَن أن يصدقه الناس، فابعثوا رهطاً من ذوي الرأي والحجى إلى أنقاب مكة على مسيرة ليلة أو ليلتين ليتلقوا الناس، فمن سأل عن محمد فليقل بعضهم إنه مجنون، وبعضهم إنه كاهن، وبعضهم إنه شاعر، إن لم تروه خير من أن تروه. فبعثوا ستة عشر رجلاً في أربعة من الطرق، في كل طريق أربعة نفر، وأقام الوليد بن المغيرة بمكة يقول لمن سأل عن محمد إنه كاهن ومجنون. ففعلوا ذلك وتصدع الناس عن قولهم، وشق ذلك على النبي صلى الله عليه وسلم، وكان يرجو أن يلقى الناس أيام الموسم فيعرض عليهم أمره فمنعه هؤلاء. وفرحت قريش وقالت للنبي صلى الله عليه وسلم: هذا دأبنا ودأبك ما عشنا! فنزل جبريل عليه السلام والنبي صلى الله عليه وسلم في الحجر، فمر به الوليد بن المغيرة، فقال جبريل للنبي صلى الله عليه وسلم: كيف تجد هذا؟ فقال: بئس عبدالله هو. فأهوى جبريل بيده إلى فوق كعبه وقال: كفيت أمره. فمر الوليد بحائط فيه نبل لبني المصطلق ـ وهم حي من خزاعة ـ وعليه بردان يتبختر فيهما فعلق سهم بإزاره، فمنعه الخيلاء أن ينزعه منه، فنفض السهم فأصاب أكحله فقتله. ومرّ به العاص بن وائل السهمي فقال جبريل: كيف تجده؟ فقال: عبد سوء. فأهوى جبريل بيده إلى باطن قدمه فقال: قد كفيت أمره. فركب حماراً يريد الطائف، فصرعه الحمار على شوك، فدخلت شوكة باطن قدمه فتقيحت وقتلته. ومر به الحارث بن قيس بن عمرو بن ربيعة بن سهم، فقال جبريل: كيف تجد هذا؟ قال: عبد سوء. فأهوى بيده إلى رأسه، وقال: قد كفيت أمره، فتقيح رأسه ومات. ومر به الأسود بن عبد يغوث بن وهب بن عبد مناف بن زهرة، فقال جبريل: كيف تجد هذا؟ قال: عبد سوء. فأهوى جبريل بيده إلى بطنه فقال: قد كفيت أمره. فعطش فجعل يشرب ولا يروى حتى مات. ومر به الأسود بن المطلب بن عبد العزى بن قصي، فقال جبريل: كيف تجده؟ فقال: بئس العبد هو. فضربه جبريل بجندل في وجهه وقال: كفيت أمره، فعمي ثم مات منها.  وأنزل الله على رسوله صلى الله عليه وسلم : فاصدع بما تؤمر وأعرض عن المشركين إنا كفيناك المستهزئين يعني الذين سميناهم . فلما آذى أهل مكة رسول الله صلى الله عليه وسلم أخبر الله عنهم فقال : ويقولون أثنا لتاركو الهتنا لشاعر مجنون . وقال عز وجل : (ثم تولّوا عنه وقالوا معلم مجنون) وقال : وإن يكاد الذين كفروا ليزلقونك بأبصارهم لما سمعوا الذكر ويقولون إنه لمجنون . وما هو إلا ذكر للعالمين . وعزاه فقال : ما يقال لك إلا ما قد قيل للرسل من قبلك وقال: كذلك ما أتى الذين من قبلهم من رسول إلا قالوا ساحر أو مجنون . ثم ناضل ونضح عن رسوله صلى الله عليه وسلم، فأجاب عنه جميع ما قيل فيه ولم يكلفه الإجابة عن نفسه كما كلّف غيره من الأنبياء عليهم السلام. ألا ترى أن نوحاً عليه السلام لما قيل له إنا لنراك في ضلال مبين . قال : يا قوم ليس بي ضلالة وكذلك هود عليه السلام لما قيل له إنا لنراك في سفاهة قال : يا قوم ليس بي سفاهة وقال فرعون الموسى إني لأظنك يا موسى مسحوراً فكلف موسى الإجابة عن نفسه فقال : لقد علمت ما أنزل هؤلاء إلا رب السماوات والأرض بصائر وإني لأظنك يا فرعون مثبوراً أي هالكاً . وفي هذا مزية للنبي صلى الله عليه وسلم على سائر الأنبياء؛ ألا ترى كيف أجاب جلّ ذكره عن جميع ما قيل فيه نحو قوله وما علمناه الشعر وما ينبغي له ، وما هو بقول شاعر ، ولا بقول كاهن، و ما أنت بنعمة ربك بمجنون و ما ضل صاحبكم وما غوى، وما ينطق عن الهوى حين قالوا إنه يقول ما يقول من تلقاء نفسه، و وما صاحبكم بمجنون وقوله أو لم يتفكروا ما بصاحبهم من جنة وقوله قل إنما أعظكم بواحدة أن تقوموا لله مثنى وفرادى ثم تتفكروا ما بصاحبكم من جنة وقوله فذكر فما أنت بنعمة ربك بكاهن ولا مجنون . وإلى الجنون أشار قوم هود في قولهم إن نقول إلا اعتراك بعض آلهتنا بسوء  ۱۳ أخبرنا محمد بن أحمد قال : أخبرنا الحسن قال : أخبرنا أبو الحسن علي بن محمد بن . . بنسا ، قال : أخبرنا أحمد بن محمد بن عمير ومحمد بن عمران بن عتبة بدمشق قال : حدثنا إبراهيم بن سعيد الجوهري، قال: حدثنا يحيى بن سعيد الأموي عن داود بن هند عن عمرو بن سعيد عن سعيد بن جبير عن ابن عباس رضي الله عنهما قال : كان رجل من أزد شنوءة يسمى ضماداً وكان راقياً، فقدم مكة فسمع أهلها يُسمون رسول الله صلى الله عليه وسلم مجنوناً، فأتاه فقال : إني رجل أرقي وأداوي فإن أحببت داويتك. فقال رسول الله صلى الله عليه وسلم : الحمد لله أحمده وأستعينه وأومن به وأتوكل عليه، وأعوذ بالله من شرور أنفسنا ومن سيئات أعمالنا من يهد الله فلا مضل له ومن يضلل فلا هادي له، وأشهد ألا إله إلا الله وأني محمد عبده ورسوله . فقال ضماد : أعد علي فأعاد، واستعاد ثانياً فأعاد ، فقال : والله لقد سمعت قول الكهنة والسحرة والشعراء والبلغاء فما سمعت مثل هذا الكلام قط. هات يدك أبايعك، فبايعه على الإسلام، فقال: وعلى قومي ، فقال : وعلى قومك . فبعث رسول الله صلى الله عليه وسلم بعد ذلك سرية فمروا على تلك البلاد فقال أميرهم : هل أصبتم شيئاً؟ قالوا : نعم، إداوةً . قال: ردّوها فهؤلاء قوم ضماد.  أخبرنا محمد قال: أخبرنا الحسن قال: وأخبرنا أبو العباس أحمد بن محمد بن الحسن قال: قرأت على أحمد بن عمر بن الصلت النسوي قال: أخبرنا علي بن خشرم قال: حدثنا أبو عبد الله الضرير قال: حدثنا يزيد بن زريع عن داود أبي هند به سواء.  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو أحمد محمد بن إبراهيم الصريمي المروزي قدم علينا حاجاً قال : حدثنا عبدان بن محمد بن عيسى قال : حدثنا إبراهيم بن عبدالله الخلال عن عبدالله بن المبارك عن أبي جعفر الرازي عن الربيع بن أنس قال : قدم أبو العرّاف اليماني وكان من أشراف أهل اليمن، فرأى رسول الله صلى الله عليه وسلم في حلة حمراء وهو يقول للناس : قولوا لا إله إلا الله تفلحوا . وإذا خلفه شيخ يقول: إياكم وإياه فإنه مجنون كذاب. فسأل أبو العراف عن الشيخ فقيل : عمه أبو لهب، فأتاه فقال : ما تقول في ابن أخيك؟ قال : لم نزل نداويه من الجنون . فقال : تبا لك سائر دهرك، إن كلام المجانين متفاوت غير مستقيم، وما يشبه ابن أخيك المجانين بوجه من الوجوه فقال له أبو لهب : فما هذا الذي يقول ؟ فقال : وحي ورسالة وصدق وحق، أشهد أن لا إله إلا الله وأنه عبده ورسوله . ثم أتى النبي صلى الله عليه وسلم بعدما أظهر دعوته واستفحل أمره في ثمانين فارساً من قومه مسلمين .  ١٦ والمجنون عند أهل الحقائق من ركن إلى الدنيا وعمل لها وطاب بها عيشاً، بذلك نطقت الأخبار.  أخبرنا محمد قال : أخبرنا الحسن قال : حدثني أبي قال : أخبرنا جعفر بن محمد بن سوار قال : حدثنا محمد بن رافع قال : حدثنا إسماعيل بن عبدالكريم عن عبدالصمد بن معقل عن وهب بن منبه قال : خُلق ابن آدم أحمق، ولولا حمقه ما هناه العيش .  أخبرنا محمد قال: أخبرنا الحسن قال: وسمعت أبا زكريا يحيى بن محمد بن عبدالله العنبري يقول: سمعت محمد بن المسيب الأرغباني يقول: سمعت عبد الله بن حبيق الأنطاكي يقول: سمعت يوسف بن أسباط يقول: سئل سفيان الثوري: من المجنون؟ فقال: من لم يميز غيه من رشده.  أخبرنا محمد بن أحمد قال : أخبرنا الحسن قال : سمعت أبا علي محمد بن عمر بن علي المروزي يقول : سمعت علي بن الحسن بن أبي عيسى الهلالي يقول : سمعت إبراهيم بن الأشعث يقول : سمعت الفضيل بن عياض يقول: دعاك الله إلى دار السلام وقد آثرت في دنياك المقام، وحذرك عدوك الشيطان وأنت محالفه طول الزمان، وأمرك بخلاف هواك وأنت معانقه صباحك ومساك فهل الحمق إلا ما أنت فيه؟  أخبرنا محمد قال: أخبرنا الحسن قال: سمعت أبا بكر محمد بن أحمد القطان البلخي يقول: سمعت أبا شهاب معمر بن محمد العوفي يقول: سمعت عبدالصمد بن الفضل يقول: سمعت خلف بن أيوب وسئل: من الأحمق؟ قال: من عمل لدنياه ووافق هواه وآثر على ربه سواه. وقيل لآخر من المجنون؟ قال: من لم يُبال ما نقص من دينه بعدما سلمت له دنياه. وقيل لآخر: من المجنون؟ قال: من لم يأمن على روحه ساعةً وهو يسعى في عمارة دنياه. وسئل آخر: من الأخرق؟ فقال: من خرب آخرته بدنيا غيره.  أخبرنا محمد قال: حدثنا الحسن قال: أنشدنا أبو جعفر محمد بن علي بن الطيان القمي بمرو الروذ قال: أنشدنا محمد بن سعيد بن سهل الطاجي بالبصرة: خلقنا لأمر فإن لم نكن به مؤمنين فإنا لنوكي
وإن نحن كنا به مؤمنين ولسنا نخاف فإنا لهلكي  أخبرنا محمد قال: أنشدنا الحسن قال: أنشدنا أبو بكر محمد بن عبدالله بن محمد قال: حدثنا أبو عبدالله محمد بن زكريا بن دينار الغلابي قال: أنشدنا عبيد الله بن محمد بن عائشة: ومن كانت الدنيا هواه وهمه فذلك مجنون وإن قيل عاقل وقال آخر: المجنون من التمس رضى الناس بسخط الله  أخبرنا محمد قال : حدثنا الحسن قال : أنشدني أبو الحسن محمد بن محمد بن مسعود بنسا ، قال : أنشدنا نفطويه للخليل بن أحمد : إني بليتُ بمعشر نوكي أخفّهم ثقيل
نفر إذا جالستهم نقصت بقربهم العقول
فهم كثير بي وأعلم أنني بهم قليل  ومرّ ضِلَةُ بن أشيم بقوم قد اجتمعوا على رجل مقيد، فقال: من هذا؟ قالوا: مجنون. فقال: لا تقولوا مثل هذا، إنما المجنون مثلي ومثلكم نعمر الدنيا ونخرب الآخرة.  وأخبرنا محمد قال: حدثنا الحسن قال: أنشدنا أبو نصر أحمد بن محمد بن ملحان البصري قال: أنشدنا بشر بن موسى الأسدي: إلى كم تخدم الدنيا وقد جُزْتَ الثمانينا
ويغدونا تبث العلم في قوم يروحون
فلا هم بك يعنون ولا هم عنك يُعنونا
لئن لم تك مجنونا لقد فُقْتَ المجانينا  ولقد سألني بعض أصحابي عوداً على بدء أن أصنف كتاباً في ذكر عقلاء المجانين وأوصافهم وأخبارهم، وكنت أتعامس عنه إلى أن تمادى به السؤال، فلم أجد بداً من إسعافه بطلبته، وإجابته إلى بغيته، تحرياً لرضاه وتوخياً لهواه. وكنت في حداثة سني سمعت كتباً في هذا الباب مثل كتاب الجاحظ وكتاب ابن أبي الدنيا وأحمد بن لقمان وأبي علي سهل بن علي البغدادي رحمهم الله، فوقع كل كتاب منها في جزء أو ما يقارب جزءاً، فتتبعتها وتعقبتها وضممت إليها قرائنها وعزوتها إلى أصحابها وألفت هذا الكتاب على غير سمت تلك الكتب وهو كتاب يكفي الناظر فيه الترداد وتصفح الكتب، وأرجو أني لم أسبق إلى مثله والله الموفق والمعين.  ۲۷ الجنون في اللغة الاستتار؛ تقول العرب : جنّ الشيء يجن جنوناً إذا استتر، وأجنّه غيره إجناناً إذا ستره، قال لبيد : حتى إذا ألقت يداً في كافر وأجنَّ عورات الثغور ظلامها يعني الشمس ألقت يداً في ليل مظلم وستر الظلام الفجاج والطرق.  ۲۸ أخبرنا محمد قال: حدثنا الحسن قال: أنشدني أبو عبدالله محمد بن الحسين الوضاحي: يا غافلاً عما تجن ضلوعي
أنسيت ويحك عبرتي ودموعي  ۲۹ وجن الليل يجن جنوناً وجناناً إذا دخل، ومنه قوله تعالى فلما جن عليه الليل رأى كوكباً. وأجنّ الليل الشيء إجناناً إذا غطاه بظلامه، قال العتبي: وأجنه الليل أي جعله من ظلامه في جُنّة . قال الشاعر يصف مفازة: وصـرمـاءَ مِــذكـار كأن دويها بعيد جنان الليل مما يخيل
حديث أناسي فلما سمعته إذا ليس فيه ما أبين فأعقل وقال الشاعر: ولولا جنون الليل أدرك ركضنا بذي الرمث والأرطى عياض بن ناشب الصرماء : المفازة التي تصرم الناس عن الماء أي تقطعهم، والمذكار التي لا يدخلها إلا ذكور الرجال لصعوبتها، كالمرأة المذكار التي لا تلد إلا الذكران، والجنان : القلب سمي بذلك لاستتاره .  أخبرنا محمد قال: أنشدنا أبو الحسن محمد بن علي القزاز لديك الجن : قم یا غلام عنان طرفك فاحوه عني فقد حوت الشمول عناني
سكران سكر هوى وسكر مـدامـة فمتى يفيق فتی به سکران
ما الشأن ويحك في فراق فريقهم الشأن ويحك في جُنون جناني  قال العتبي: وسميت الجن لاجتنانهم عن أعين الناس. وقيل في قوله تعالى: إلا إبليس كان من الجن أي من الملائكة، سموا جناً لاجتنانهم عن الأبصار. وقال الأعشى : وسخر من جنّ الملائك تسعة قياماً لديه يعملون بلا أجر والجنة البستان لالتفاف الأشجار والجنة الدرع والترس لأنهما يستران. والجنة بكسر الجيم الجن والجنون أيضاً، قال الله جل ذكره: ﴿وَجَعَلُوا بينه وبين الجَنَّةِ نَسَباً) حين قالوا إن الملائكة بنات الله. وقالوا في معنى الجنون: أَوَلم يَتَفَكَّرُوا ما يصاحبهِمْ مِنْ جِنَّة). وأما قوله تعالى: مِنَ الجِنَّةِ والناس) فإن أهل التفسير قالوا: معناه قل أعوذ برب الناس من الجنة والناس قال قتادة: إن الشيطان يوسوس الجن كما يوسوس الناس، فالمعنى: الذي يوسوس في صدور الجن والناس. والجنن القبر لأنه ساتر، قال الشاعر: لقد أدرجت ليلى هنالك في جنن فصبر جميل ليس ينفعك الحزن والجنين الولد في بطن الأم لأنه مستور. وتقول العرب للنبت إذا طال وكبر: تكاوس والتف واستحلس واعلنكس وتجان. وتجان الرجل [أيضاً] إذا تكلف الجنون وليس بمجنون، وكذلك تحامق وتناوم وتكاسل. قال العجاج: إذا تخازرت وما بي من خَزَر ثم كسرت العين من غيـر عـو وكل هذا يؤول إلى معنى الاستتار والمجنون المستور العقل، والفعل منه جُرَّ يُجن جنوناً فهو مجنون، وأجنّه الله فهو مجنون. وهذا الباب نادر في اللغة ونظيره: أزكما الله فهو مزكوم، وأحمه فهو محموم، وأضاده فهو مضؤود، وأحببت فلاناً فهو محبوب، هذا هو السائر وقالوا: فهو مُحبّ، قال عنترة: ولقد نزلت فلا تظني غيـره عندي بمنزلة المُحَبِّ المُكْرَم  أسماء المجانين في اللغة للمجنون في اللغة أسماء كثيرة، وقد مضى تفسير المجنون. ومنها الأحمق، والفعل منه حمق يحمق حمقاً وحماقة فهو أحمق وحمق. قال الشاعر : سبحان من أنزل الأشياء منزلها
وصير الناس موصوفاً وموموقا
فعاقل فطن أعيت مذاهبه
وجاهل حمق تلقاه مرزوقا والجمع حمقى كقولك : قتلى وصرعى وهلكى، قال الشاعر : رُزقت مالاً فعش فيما رزقت به
فلست أول من حمقى بمرزوق
 لو كان باللب تُعطى ما تعيش به
 لما ظفرت من الدنيا بثفروق  ومنها المعتوه وهو الذي يولد مجنوناً. والفعل منه عته فهو معتوه.  ٣٤ ومنها الأخرق وهو الذي لا يحسن التقدير والتدبير، والمرأة خرقاء. قال أبو عبيدة : لا يقال خالق إلا للمقدر بعلم وتدبير، فإذا قدر بغير علم قيل أخرق وخرقاء، ومنه قوله عزّ وجل : وخرقوا له بنين وبنات بغير علم . قال مجاهد : أي كذبوا، قال أبو عبيدة : اختلقوا. وقرأ أهل المدينة بالتشديد وخففه الكسائي وأبو عمرو. والاسم الخرق بضم الخاء. والخرق أيضاً جمع الأخرق.  ٣٥ ومنها المائق والفعل منه ماق يموق والاسم الموق، والموق أيضاً جمع المائق كقولهم غائط وغُوط وحائل وحول للشاة التي لم تحمل، وعائذ وعود للناقة الحديثة النتاج، وفاره وفره، قال الشاعر: وغرةُ مَرَّةٍ مِنْ فِعْلٍ غِرِّ وغرةُ مرتين فعالُ مُوق
وحسن الظن عجز في أمور وسوء الظن يأمر بالوثيق
إذا لم تتق الضحضاح زلت من الضحضاح رجلك في العميق
فلا تفرح بأمر قد تداني ولا تيأس من الأمر السحيق
فإن القرب يبعد بعد قرب ويَدْنَى البعد بالقدر المسوق أخبرنا محمد قال : أخبرنا الحسن قال : أنشدنيه أبي رحمه الله ، قال : أنشدنا أبو سلمة المؤدب لعمر بن عبدالعزيز.  ٣٦ ومنها الرقيع والمرقعان وهو الأحمق الذي يتمزق عليه رأيه وعقله، والفعل منه رفع رقاعة فهو رقيع، كقولك بلد بلادة فهو بليد. أخبرنا محمد قال : حدثنا الحسن قال : أنشدنا أبو بكر أحمد بن سعد بن نصر بن بكار الفقيه البخاري بها ، قال : أنشدنا عبيد الله بن عبدالله : وما الناس إلا وعـاة العـلوم وسائرهم غنم في قطيع
وإنا بُلينا بِبُلْهٍ حميرٍ ومحنة دهر رفیع رقيع  ۳۷ ومنها الممسوس وهو الذي تخبطه الجن أو الشيطان، والاسم المس ومنه قوله عزّ وجلّ : كما يقوم الذي يَتَخَبَّطُهُ الشَّيْطَانُ مِنَ الْمَسِّ .  ۳۸ ومنها المخبل والمختبل ، والاسم الخبل ، ويقال : رجل مخبل ومخبول ومختبل، قال الأعشى : عُلِّقْتُها عَرَضاً وعُلّقتْ رجلاً غيري وعُلِّقَ أخرى غيرها الرجل
وعلقته فتاة ما يحاولها من قومها ميّت يهذي بها وَهِلُ
وعلقتني أخرى ما تلائمني فاجتمع الحب حباً كله خَبَل
فكلنا مُغرم يهذي بصاحبه ناءٍ ودان ومخبول ومختبل  ۳۹ ومنها الأنوك، والفعل منه نوك ينوك فهو أنوك، كقولك : حَولَ فهو أحول. وسألتُ الإمام أبا منصور الأزهري رحمه الله بهراة فلم يذكر منه فعلا، والاسم النوك بضم النون والجمع نوكي، قال الشاعر: يصيب وما يدري ويخطي وما درى
وكيف يكون النوك إلا كذلكا قال الأصمعي: تضحك مني شيخة ضحوك واستنوكت وللشباب نوك
وقد يشيب الشعر السحكوك  ٤٠ ومنها البوهة شبهوه بطائر قال الشاعر : يا هند لا تنكحي بوهةً عليه عقيقته أحسبا  ٤١ == ومنها الدولة بالذال المعجمة، والمؤتة ضرب من الجنون، ولم أسمع منه للمجنون اسماً. وسمعت الإمام أبا حامد الخارزنجي يقول: الثطاة ضرب من الجنون، قال : تقول العرب : فلان من فرط ثطاته لا يعرف قطاته من لطاته . والقطاة مقعد الردف من الدابة، واللطاة دائرة في الجبهة.  ٤٢ ومنها العزهاة، قال الشاعر: ومن لم يواس الناس مما بكفه فذلك عزهاة من العقل مبلس  ومنها الأولق، والفعل منه ولق يولق، والولق الاسم. وأما الولق بسكون اللام فهو الكذب. وقرأت عائشة رضي الله عنها (إذ تلقونه بألسنتكم) والفعل منه ولق يلق ولقاً. قال الأعشى: وتصبح عن غب السرى فكأنما ألم بها من طائف الجن أولق  ٤٤ ومنها المهوس، والاسم الهوس وهو ضرب من الجنون، فإن كان قذراً في جنونه فهو أعفك.  ٤٥ ومنها الموسوس. ومنها الهلباجة وهو الأحمق الكثير الأكل، قال ابن السكيت : قال خلف الأحمر : قلت لابن كبشة ابن بنت القبعثرى : ما الهلباجة؟ فتردد في صدره ما لم يتهيأ له إخراجه ثم قال: الهلباجة الأحمق الذي لا خير عنده ولا عمل، وبلي ليعمل وضرسه أشد من عمله ولا يحاضر به القوم وبلي ليحضر ولا يتكلم . قال الخليل بن أحمد : واللكع الأحمق اللئيم. وقال غيره : هو العبد.  ٤٦- ومنها الخذب قال ابن السكيت : يقال رجل خَذِبٌ وفيه خذب والقعرب الأحمق . قال الأصمعي : يقال للرجل الأحمق الكثير الخطأ رجل هجاجة.  ٤٧ ومنها البرشاع . ابن السكيت : والرَّهْدَن الأحمق، وأنشد في كتاب الألفاظ : قلت لها إياك أن تَوَكَّنِي عندي في الجلسة أو تلبني
عليك ما عشتِ بذاك الرَّهْدَنِ قال الأصمعي : والملغ الأحمق، والجعبس الأحمق قال الراجز: لما رأيت سدّليل أَدْمَسا ليلا دَجُوجي الظلام حِرْمِسا
وضم سكراه العام الجعبسا وقرأت في كتاب النوادر لأبي زيد سعيد بن أوس : رجل مألوس أي مجنون، وقد ألس إذا جنّ . ومما يضارع هذا الباب ويقرب منه وليس بعينه : المتيم وهو المعبد، تيمه الحب أي عبده واستعبده، ومنه تيم اللات أي عبداللات .  ٤٨ ومنها الأهوج، والفعل منه هوج يهوج تهوجاً فهو أهوج.  ٤٩ ومنها الهائم وهو ذاهب العقل.  ٥٠ ومنها المدله، قال الشاعر : تركوني مدلّهاً أرتجي حجّ قابل
بعدما كنت ناسكاً زال نسكي بباطل  ومنها الأبله، والفعل منه بله بلاهة فهو أبله.  ٥٢ ومنها المستهتر، قال الشاعر: وبعثن وجداً للخلي وزدن في
برحاء وجد العاشق المستهتر  ومنها الواله، والاسم الوَله وهو عند العرب الذي فقد ولده ففقد صبره، فأقبلت والها ثكلى على عجل كل دهاها وكل عندها اجتمعا والمبنقع: الأحمق المبالغ في حمقه، قال الشاعر: ومهور نسوتهم إذا ما أُنكحوا غَذَوِيٌّ كل هَبَنْقع تِنْبَالِ فهذه كلها أسماء المجانين، وعيارها المجنون والأحمق.  ٥٤ فمنها قولهم: تحسبها حمقاء وهي باخس أي أنك تحسبها حمقاء ومع حمقها تظلم الناس. قال ثعلب هكذا جرى المثل بغير هاء. ومثلها: خرقاء عيابة، أي مع حمقها تعيب غيرها.  قال الأحمر: ومن أمثلتهم: أحمق بلغ، أي مع حمقه يبلغ حاجته.  ومن أمثالهم فيه: خرقاء ذات نيقة، أي أنها حمقاء وهي مع ذلك تتأنق في الأمور.  ٥٧ قال أبو عبيد فإذا اشتد موق الرجل قيل : ثأطةً مُدت بماء. والثاطة الحمأة، فإذا أصابها الماء ازدادت فساداً. هذا تعيب غيرها.  ٥٨ قال الأصمعي : ومن أمثالهم في هذا : أحمق من رجلة، وهي البقلة الحمقاء وحمقها أنها تنبت في الشروج ومسائل الأودية فيجيء السيل فيجرفها، وشبه بها أهل الحقائق من يعمر دنياه وهو يعلم فناءها . قالوا : ومثل عامر الدنيا مثل الباني على الماء والبناء لا يثبت عليه .  أخبرنا محمد قال: حدثنا الحسن قال: حدثنا أبو القاسم منصور بن العباس ببوشنج، قال: حدثنا أبو إسحاق بن إسماعيل قال: أخبرنا جرير بن ليث عن مجاهد قال: قال عيسى بن مريم عليه السلام : من ذا الذي يبني على موج البحر داراً؟ تلكم الدنيا فلا تتخذوها قرارا. وقال أيضاً: الدنيا قنطرة فاعبروها ولا تعمروها. وقال سابق البربري في قصيدة أنشدها: لكم بيوت بمستنّ السيول وهل 
يبقى على الماء بيت أسه مدر  ٦٠ قال أبو عمرو الشيباني ومن أمثلتهم في الحمق : إنه لأحمق من ترب العقد. والعقد عُقَدُ الرمل، وحمقه أنه ينهار ولا يثبت فيه التراب، فضرب مثلاً للذي لا يستقيم ولا يثبت على حال.  ٦١ قال ابن الكلبي : ومن أمثالهم في هذا : إنه لأحمق من دُعَة، وهي امرأة عمرو بن جندب بن العنبر، ووصف من حمقها ما يسمج ذكره .  قال الأصمعي : ومن أمثالهم : أحمق من الممهورة إحدى خدمتيها. وذلك أن زوجها قضى حاجته منها ثم طلقها، فقالت: أعطني مهري، فنزع إحدى خدمتيها ـ وهما الخلخالان - من رجلها فأعطاها فسكتت ورضيت.  تقول العرب للمبالغ في الجنون جنونه مجنون. أخبرنا محمد قال : أخبرنا الحسن يقول : سمعت أبا الحسن محمد بن الحسين الحاكم ببوشنج يقول : سمعت الربيع بن سليمان يقول : قال الشافعي رضي الله عنه لبعض أصحابه: جنونك مجنون ولست بواجد
طبيباً يداوي من جنون جنون  ما يوصف بالحمق من غير الناس فمنها الضبع، وزعموا أنها أحمق الدواب، وأنها تُشَدّ يداها ورجلاها، ويقال إنها ليست ها هنا، فتسكت وترضى . وروي عن علي بن أبي طالب رضي الله عنه أنه قال : لا أكون مثال الضبع تسمع اللدم فتخرج حتى تصاد. وكنيتها أم عامر يضرب بها المثل فيقال : خامري أم عامر، قال الشاعر : فلا تدفنوني إن دفني محرّم عليكم ولكن خامري أم عامر أي : دعوني للتي يقال لها أم عامر تأكلني ولا تدفنوني بعد موتي. وأنشدني أبي : عرقب الضبع فقالوا غائب
رضي القول وأغضى وصبر  ومنها العقعق، تقول العرب: إنه لأحمق من عقعق. ومن حمقه أن ولده أبداً ضائع.  ٦٦ - قال ابن الكلبي: وتقول العرب : إنه لأحمق من حمامة. وذلك أنها تبيض على الأعواد فربما وقع بيضها فانكسر.  أسماء جنون الدواب تقول العرب لجنون الإبل الهيام، وهو داء يأخذها فتجن وتهيم. ويقال لجنون الشاء الثول، وهي شاة ثولاء . والجنون الكلب الكلب، وهو كلب كلب. والسعر ضرب من جنون النوق، تقول العرب : ناقة مسعورة إذا كانت مجنونة . وتأول بعضهم قوله عزّ وجل : إن المجرمين في ضلال وسعر) أي : جنون .  ضروب المجانين المجانين على ضروب. فمنهم المعتوه، وقد مضى تفسيره.  ٦٩ ومنهم الممرور، وهو الذي أحرقته المرة.  ومنهم الممسوس، وهو الذي تخبطه الجن والشياطين.  ومنهم العاشق الذي تيمه الحب وأجنّه. أخبرنا محمد قال: حدثنا الحسن قال: سمعت أبا الحسن محمد بن محمد بن مسعود النسوي بها يقول: سمعت أبا محمد عبيد الله بن عبدالرحمن بن محمد بن عيسى السكري ببغداد يقول: سمعت زكريا بن يحيى بن خلاد المنقري يقول: سمعت الأصمعي يقول: لقد أكثر الناس في العشق فما سمعت بأوجز ولا أجمل من قول بعض نساء الأعراب وسئلت عن العشق فقالت: ذل وجنون.  أخبرنا محمد قال: أخبرنا الحسن قال: أنشدنا أبو محمد أحمد بن محمد بن إسحاق الجيرنجي بمرو قال: أنشدنا عبدالله بن بهلول بقرميسين: وما عاقل في الناس يحمد أمره ويذكر إلا وهو في الحب أحمق
وما من فتى ما ذاق بؤس معيشة من الناس إلا ذاقها حين يعشق  أخبرنا محمد قال : حدثنا الحسن قال : سمعت أبا الحسن المظفر بن محمد بن غالب الهمذاني يقول : سمعت أبا بكر محمد بن يحيى الصولي يقول : اعتل عبدالله بن المعتز فأتاه أبوه عائداً فقال له : ما عراك يا بني؟ فأنشأ يقول : أيها العاذلون لا تعذلوني وانظروا حسن وجهها تعذروني
وانظروا هل ترون أحسن منها إن رأيتم شبيهها فاعذلوني
بي جنون الهوى وما بي جنون وجنون الهوى جنون الجنون قال : فتتبع أبوه الحال حتى وقع عليها فابتاع الجارية التي شغف بها بسبعة آلاف دينار ووجهها إليه .  ٧٤ = أخبرنا محمد قال : أخبرنا الحسن قال : أنشدني أبو منصور مهلهل بن علي الغنوي : أبدرٌ بدا أم وجهك القمرُ السَّعْدُ أليل دجا أم شعرك الفاحم الجَعْدُ
أنرجسة هاتيك أم هي مقلة أتفاحة ذاك المضرج أم خـد
أمــوج إذا ولَّيْتِ أَم كَفَلْ يُرى أغصنُ لُجين في الغُلالة أم قَدُّ
كذا لو تأملت الذي بي لقلتِ لي أهذا جنون ثابت بك أم وَجْدُ  أخبرنا محمد قال: حدثنا الحسن قال: سمعت أبا العباس الرازي الصوفي يقول: سمعت الشبلي يقول ذات يوم لأصحابه: ألست عندكم مجنوناً وأنتم أصحاء، زاد الله في جنوني وزاد في صحتكم، ثم أنشد: قالوا جننت بمن تهوى فقلت لهم ما لذة العشق إلا للمجانين  أخبرنا محمد قال : حدثنا الحسن قال : أنشدنا أبو العباس أحمد بن سعيد المعداني قال : أنشدنا أبو عمرو محمد بن إسماعيل الضرير قال : أنشدنا أيوب بن غسان : وَدَّعتْني بِعَبْرَةٍ من جفوني أضمرت فيضها حـذار الـعـيـون
ومضت خلفها وقد خلّفتني إلْفَ ضُرّ وزفرةٍ وجنون
فشكوتُ الفراق بالنفس الداثم حتى هتكتُ ستر الظنون  أنشدني أبو سعد أحمد بن زاذبه الكاتب الفارسي : ألا قل للأحبة يَرْفُقونا فإن الحب أَوْرَثَنا جنونا  أنشدني أبي قال : أنشدنا أبو محمد الزنجاني لبعض الأعراب : أحبك حباً لو علمت بمثله أصابك من وجد علي جـنـون

لطيفاً على الأحشاء أما نهاره فسير وأما ليله فأنين  ٧٩ أخبرنا محمد قال : وقال الحسن وحكي لي عن حبيب بن محمد بن خالد الواسطي قال : دخلت يوماً على علي بن غنام فوجدته باكياً حزيناً ذاهب النفس فأنكرته فسألته عما دهاه فقال : اعلم أني مررت الآن بالخريبة فرأيت مجنوناً مصفّدًا في الحديد يتمرغ في التراب ويقول: ألا ليت أن الحب يعشق مرة فيعرف ماذا كان بالناس يصنع
يقولون فز بالصبر إنك هالك والصَّبْرُ مني ألف مرة يجزع  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا علي الحسن بن أحمد القزويني يقول: سمعت بعض السياح يقول رأيت مجنوناً في القفار يرقص ويقول حُبُّكُمُ في القفار شردني
آه من الحب ثم آهِ وهذا باب يطول شرحه إلا أنه يكثر في أثناء أخبار المجانين، وستراه في مواضعه إن شاء الله تعالى .  ومنهم من اعتقد بدعة أو ارتكب كبيرة فأدركه شؤمها فجنّ. أخبرنا محمد قال : أخبرنا الحسن قال : حدثنا أبو علي الحسن بن محمد بن شيظم الدهاسي البلخي قدم علينا حاجا قال : حدثنا أبو يعلى عبدالمؤمن بن خلف بن طفيل قال : حدثنا أبو العباس عبد الله بن عتاب الرقي بدمشق قال : حدثنا هشام بن عمار عن سعيد بن يحيى قال رأيت مجنوناً بحمص مصروعاً وقد اجتمع عليه الناس فدنوت منه فقلت : اللَّهُ أَذِنَ لكم أم على الله تفترون فجرى على لسانه : لسنا ممن يفتري على الله ، دعه يمت فإنه يقول : القرآن مخلوق.  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو القاسم منصور بن العباس ببوشنج قال : أخبرنا أبو عبد الله محمد بن إبراهيم الهروي قال: حدثنا ابن أبي الدنيا قال : حدثنا الحسين بن عبد الرحمن قال: لقيت بمنى مجنوناً مصروعاً كلما أراد أن يؤدي فريضة أو يذكر الله تعالى صرع . فقلت على ما يقوله الناس: إن كنتم يهوداً فبحق موسى، وإن كنتم نصارى فبحق عيسى، وإن كنتم مسلمين فبحق محمد إلا خليتم عنه فقال: لسنا بيهود ولا نصارى ولكنا وجدناه يبغض أبا بكر وعمر فمنعناه مراشد أموره .  أخبرنا محمد قال : أخبرنا الحسن قال : حدثنا أبو عبدالرحمن عبدالله بن عمر بن أحمد بن علي الجوهري بمرو قال : حدثنا أحمد بن الحارث بن محمد بن عبدالكريم قال : حدثنا محمد بن عبد الله بن مهزاد قال : حدثنا سلمة قال: أخبرنا عبدالله عن ابن لهيعة عن يزيد بن أبي حبيب قال: بلغني أن عامة الركب الذين ساروا إلى عثمان رضي الله عنه جنوا .  ومنهم من سمي مجنوناً بلا حقيقة كالشاب والمتصابي والسكران، وكانت العرب تسمي الشباب شعبة من الجنون. أخبرنا محمد قال : أخبرنا الحسن قال : أنشدنا أبو عبدالله محمد بن أحمد بن الحارث المؤدب ببوشنج قال : أنشدنا أبو أحمد اليماني : ما العيش إلا بجنون الصبا فإن تولّى فجـنـون الـمـدام
كأساً إذا ما الشيخ والى بها خمساً تردى برداء الغلام  ومنهم من جن من خوف الله عز وجل. أخبرنا محمد قال: أخبرنا الحسن قال: أخبرنا أبو الفضل العباس بن هزار بن محمد بن هزار الخطيب بمرو الروذ قال: حدثنا أبو القاسم عبدالله بن محمد بن عبدالعزيز البغوي قال: حدثنا علي بن الجعد قال: أخبرنا شعبة قال: بلغني عن عبدالعزيز بن يحيى النخعي أنه كان يصلي في مسجد على عهد عمر رضي الله عنه، فقرأ ذات ليلة: ولمن خاف مقام ربه جنتان، فقطع صلاته وجُنّ وهام على وجهه فلم يوقف له على أثر.  ٨٦ أخبرنا محمد قال : أخبرنا الحسن قال : حدثنا أبو الحسن عبدالله بن موسى السلامي بهراة قال : حدثنا أحمد بن يعقوب البسطامي قال: حدثنا خلف بن عمر الصوفي قال : سمعت أبا زيد يقول : جنني بي فمت، ثم جننني به فعشت، ثم جننني عني وعنه فغبت . ثم أوقفني في درجة الصحو وسألني عن أحوالي الثلاث فقلت : الجنون بي فناء، والجنون بك بقاء، والجنون عني وعنك ضناء، وأنت في كل الأحوال أولى بنا.  أخبرنا محمد قال : أخبرنا الحسن قال : حدثنا أبو الحسن المظفر بن محمد بن غالب قال : حدثنا أبو الحسن بن محمد بن أحمد البغدادي قال : حدثنا محمد بن يحيى بن مسلم عن صالح المري أن رجلاً من الزهاد مر ذات ليلة برجل يقرأ وبدا لهم من الله ما لم يكونوا يحتسبون فجعل يصيح ومزق ثيابه وغلب على عقله، فأخذ وقيد ومات على ذلك.  ۸۸ أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو جعفر محمد بن سليمان بن منصور قال : حدثنا ابن أبي الدنيا قال : حدثنا الصلت بن مسعود الجحدري قال : حدثنا فضيل بن سليمان عن يونس بن محمد بن فضالة قال : خرجنا مع الربيع بن خثيم فمررنا على حداد ومعنا فتى، فقام الربيع ينظر إلى حديدة في النار، فوقع الفتى، وأغمي عليه، فتركناه ومضينا لحاجتنا، فعدنا فإذا هو على تلك الحال : ثم بَلَغَنا أنه جُنّ فمات في جنونه .  أخبرنا محمد قال : أخبرنا الحسن قال : حدثنا محمد بن سليمان قال : حدثنا ابن أبي الدنيا قال : حدثنا محمد بن الحسين قال : حدثنا مالك بن ضيغم قال : مر بكر بن معاذ برجل يقرأ وأنذرهم يوم الأزفة إذ القلوب لدى الحناجر كاظمين ما للظالمين من حميم ولا شفيع يطاع فاضطرب وخر ثم صاح : إرحم من أُنذِرَ ثم لم يُقبل إليك بعد النذير. ثم غلب على عقله فلم يفق حتى مات.  أخبرنا محمد قال : أخبرنا الحسن قال : حدثنا أبو جعفر محمد بن موسى بن هارون القاضي الجرجاني قال : حدثنا بندار بن عيسى بن إبراهيم قال : حدثنا محمد بن شبيب قال : أخبرنا هشام بن عبيد الله قال نظر الحارث بن سعيد في قبر منخسف فخر مغشياً عليه، ثم رفع وقد زال عنه عقله فبقي كذلك حتى مات.  أخبرنا محمد قال : أخبرنا الحسن قال : حدثنا أبو بكر محمد بن الحسين الدريدي قال : حدثنا العباس بن الفرج الرياشي عن محمد بن يونس البكري قال: سمع حذيفة العابد رجلاً يقرأ وعُرضوا على ربك صفا فهام على وجهه فلم يُرَ بَعْدُ .  أخبرنا محمد قال : أخبرنا الحسن قال : حدثنا أبو القاسم منصور بن العباس قال: أخبرنا محمد بن إبراهيم بن خالد الهروي قال : حدثنا أبو الطيب محمد بن أحمد اليافي من يافا فلسطين قال : حدثنا الحسن بن محمد بن المبارك الصوري عن أبيه قال قرأ رجل بين يدي معاذ بن نصر وأنذرهم يوم الحسرة إذ قضي الأمر الآية، فجعل يتمرغ في التراب ويضطرب ويصيح ثم هام على وجهه فلم يوقف له على أثر.  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا منصور قال : حدثنا محمد بن إبراهيم قال : أخبرنا ابن أبي الدنيا قال : حدثني محمد بن الحسين عن عمارة بن عثمان عن بشر بن عبدالعزيز قال : كان عمر بن درهم لا يخرج إلا لصلاة أو جنازة فسمع قارئاً يقرأ وما أَمْرُنا إلا واحدةً كَلَمْح بالبصر فصرخ صرخة فخولط في عقله فلم يزل على ذلك حتى مات.  ومنهم من تجان وتحامق وهو صحيح العقل وهم ضروب.  ٩٥ فمنهم من تعاطى ذلك ليُوري شأنه ويستره على الناس. أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا القاسم النصر اباذي يذكر عن أبي القاسم جنيد أنه كان يقول كان مجنون بني عامر من أحباء الله ولكنه ستر شأنه بجنونه و  أخبرنا محمد قال: أخبرنا الحسن قال: سمعت أبا موسى عمران بن محمد بن الحصين يقول: سمعت إبراهيم بن الحارث الكرماني يقول: سمعت أحمد بن إبراهيم الدورقي يقول: قال مالك بن دينار رأيت بالمصيصة شيخاً في عنقه غل وسلسلة والصبيان يرمونه وهو يقول: إن من قد أرى على صـور النــاس فإن فتشوا فليسوا بناس قال: فتقدمت إليه فقلت: أمجنون أنت؟ قال: أنا مجنون الجوارح لا مجنون القلب. وأنشأ يقول: وَرَيْتُ أمري بالجنون عن الورى كيما أكون بواحدي مشغول
يا من تعجب في الأنام لمنطقي ماذا أقول ومنطقي مجهول  أخبرنا محمد قال: أخبرنا الحسن قال: سمعت أبا نصر منصور بن عبد الله الأصبهاني يقول: سمعت أبا بكر بن طاهر الأبهري يقول: سمعت عمران بن علي الرقي يقول: كان أبان بن سيار الرقي رئيس القراء والفقراء بالرقة، وكان مع ذلك يرجع إلى علم، فأكل الذئب بنياً له وكان واحده وكان مشغوفاً به، فلم يتمالك وهام على وجهه فغاب ملياً ثم عاد وقد برم بالناس فَجَنَّن نفسه وجعل لا تطمئن به الدار ولا يستقر به القرار. فخبرت بشأنه فأتيته في أصحاب لي فألفيته في الجامع يكلم بعض الأساطين، فقلت: يا أبان أجننت؟ قال: نعم عنك وعن أضرابك. فقلت: وكيف؟ فأنشأ يقول: جُبْتُ عن عقلي لديكم وما
قلبي والله بمجنون.
أُجَنُّ مني وإلهِ الورى
من اشترى دنياه بالدین  ٩٨ وكنت قد ابتعت ضيعة من بعض السلاطين فعلمت أنه يعنيني فتشورت والله وما عاودته بعد.  وقال الفرزدق : أمر عمرو بن هند للمتلمس وطرفة بكتابين إلى عامله بالبحرين بإهلاكهما وهما لا يشعران، فمرا برجل على قارعة الطريق يحدث ويفلي ويأكل فقال المتلمس : ما رأيت كاليوم أحمق من هذا فقال الرجل : وما رأيت من حمقي ؟ أخرج خبيثاً وأُدخل طيباً وأقتل عدواً . أحمق والله مني من حمل حتفه بيده. ففك المتلمس كتابه فإذا فيه : أما بعد فإذا جاءك المتلمس فاقطع يديه ورجليه وادفنه حياً فرمى بالكتاب وأنشأ يقول : قذفت بها بالثني في جنب كافر كذلك أرمي كل قط مضلل وقال الطرفة : فك كتابك وانظر فقال : إنه لا يجترىء على إهلاكي. فذهب بالكتاب فإذا فيه : إذا أتاك طرفة فاقطع أكحله ولا تشدّه حتى يموت ففعل فأنشأ طرفة يقول : ا كل خليل كنت خالته لا ترك الله له واضحة
كلّهمُ أَرْوَعُ من ثعلب ما أشبه الليلة بالبارحة  ومنهم من تحامق لينال غنى . أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا نصر محمد بن مزاحم البدخشني قدم علينا حاجاً يقول : سمعت سعيد بن علي بن عطاف الطاحي بالبصرة يقول : كان عندنا رجل عاقل أديب فهم شاعر يقال له عامر، وكان مع أدبه محروماً مُحارَفاً . فقال لي رجل من أصحابي : إن صديقك قد جنّ، فجعلت أطلبه حتى ظفرت به في بعض القرى والصبيان حوله يضحكون، فقلت له : يا عامر منذ كم صرت بهذه الحالة؟ فأنشأ يقول : جَنّنتُ نفسي لكي أنال غنى فالعقل في ذا الـزمـان حــرمـان
يا عاذلي لا تَلُمْ أخا حُمُقٍ يُضحَكُ منه فالحمق ألوان  وهذا علي بن صلاة القصيري كان ممن يجيد الشعر وكان إذ ذاك محروماً لا يؤبه له ومن جيد شعره : لسان الهوى في مقلتي لك ناطق
يخبر عني أنني لك وامق
ولي شاهد من ضر جسمي معدل
وقلب عليل في ودادك خافق
وما كنت أدري قبل حبك ما الهوى
ولكن قضاء الله في الخلق سابق  ثم تحامق وأخذ في الهزل فحسنت حالته وراج أمره حتى أن الملوك والأشراف أولعوا به. فمن قوله : غياث بن عبدالله يطعم ضيفه
رؤوس الجدايا طبخها ما زباجها
وهذا محال في الطعام لأنما
رؤوس الجدايا حقها ما استباجها
ولو كان غياث ليقبل نصحتي
لما أطعم الأضياف إلا قباجها
فإن لج في قولي وردّ نصيحتي
فإن ألج العالمين لجاجها
فآخذ عفصاً ثم صمغاً مذيّفاً
وأخلط فيه بعد ذلك زاجها
فأطلي به وجه الغياث ورأسه
وأجعل بالسلح الرقيق مزاجها  ومنه : أسهل بطني حبّ درين جارية
في الحسن كالبوم
كأنما نكهتها كامخ
أو حزمة من حزمة الثوم
جارية عذبني حبها
مطلية العانة بالموم
كأنما الثدي على نحرها
شونيزة في كفّ مزكوم
ضرطت من حبي لها ضرطة
أفزعت منها ملك الروم وما أشبه ذلك.  ١٠٤ أخبرنا محمد قال: حدثنا الحسن قال: سمعت أبا بكر محمد بن عبدالله الحفيد يقول: سمعت محمد بن زكريا بن دينار الغلابي يقول: مر بعض الأدباء بمجنون يتكلم، فتأمل كلامه فإذا هو رصين يدور على الأصول، فقال له: ما حملك على التحامق؟ فقال: لما رأيت الحظ حظ الجاهل ولم أر المغبون غير العاقل
رحلت عيساً من كرام بابل فصرت من عقلي على مراحل  سمعت عبدالله بن أحمد بن الصديق يقول : سمعت عبدالله بن علان يقول : مر بعض الأدباء بمجنون، وذكر الحكاية.  أخبرنا محمد قال : أخبرنا الحسن قال : أنشدنا أبو نصر محمد بن أحمد التميمي بسرخس : إن كنت تهوى أن تنال المالا فالبس من الحمق غداً سربالا  ومنهم من تحامق ليزجي وقتاً ويطيب عيشاً : أخبرنا محمد قال: أخبرنا الحسن قال: أخبرنا أبو عبد الله محمد بن صالح الأندلسي المعافري قال: أخبرنا بكر بن حماد التيهرتي قال: حدثنا صالح بن علي النصيبيني قال: قلت لزيد بن سعيد العبدي: ما لي أنكرت حالك وزيك؟ قال: جددت فشقيت، ثم تحامقت فأرحت واستراحت.  ۱۰۸ أخبرنا محمد قال : أخبرنا الحسن قال : أنشدنا أبو الحسين المظفر بن محمد بن غالب الهمذاني برباط فَرَاوَةً قال : أنشدنا إبراهيم بن محمد بن عرفة الأزدي قال : أنشدنا العباس بن محمد الدوري للشافعي : وأنزلني طول النوى دار غربــة إذا شئت لاقيت امراً لا أشاكله
فحامقته حتى يقال سـجـيـة ولوكان ذا عقل لكنت أعاقله  أخبرنا محمد قال: أخبرنا الحسن قال: أنشدنا أبو جعفر محمد بن علي بن الطيان القمي: تحامق تطب عيشاً ولا تَكُ عاقلاً فعَقْلُ الفتى في ذا الزمان عدوه
فكم قد رأينا ذا نهى صار خاملاً وذا حمق في الحمق منه سموه  أخبرنا محمد قال: أخبرنا الحسن قال: أنشدني أبو الربيع محمد بن علي الصفار البلخي: طاب عيش الرقيع في ذا الزمان والجهول الغفول والصفعــان
فاغتنم حمقك الذي أنت فيه تَحْظَ بالمـكــرمــات والإحسان  أنشدني أبو منصور مهلهل بن علي العنبري الروح والراحة في الحمق وفي زوال العقل والخرق
فمن أراد العيش في راحة فليلزم الجهل مع الحمق  ورأيت في بعض الكتب : إذا كان الزمان زمان حمق فإن العقل حرمان وشوم
فكن حمقاً مع الحمقى فإني أرى الدنيا بدولتهم تدوم  ۱۱۳ ومنهم من تحامق لينجو من بلاء وآفة . أخبرنا محمد قال : أخبرنا الحسن قال : حدثنا أبو أحمد محمد بن قريش بن سليمان سنة ثمان وثلاثين بمر والروذ قال : حدثنا إسحاق بن إبراهيم بن عمار الريري قال : حدثنا عبد الرزاق قال : أخبرنا معمر عن طاووس عن أبيه قال : لما وقعت الفتنة زمن عثمان رضي الله عنه قال رجل لأهله : أوثقوني فإني مجنون كيلا أوذيكم، فأوثقوه . فلما قتل عثمان رضي الله عنه قال : خلوا عني فقد صحوتُ والحمد لله الذي عافاني من قتل عثمان .  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت الحسن بن عمران الحنظلي بهراة يقول : حدثنا أبو عبد الله محمد بن جعفر الفارسي قال : حدثنا منصور بن إسماعيل الرازي قال : حدثنا قاسم بن محمد بن عُريب من ولد ولد أبي أيوب الأنصاري قال : أدخل عُبادة أيام المحنة على الواثق والناس يضربون ويُقتلون في الامتحان قال : فقلت : والله لئن امتحنني قتلني . فبدأته فقلت: أعظم الله أجرك أيها الخليفة. قال: فيمن؟ قلت : في القرآن . قال : ويحك والقرآن يموت؟ قلت : نعم، أليس كل مخلوق يموت؟ فإذا مات القرآن في شعبان فمن يصلي بالناس في رمضان؟ فقال : أخرجوه فإنه مجنون .  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا عبدالله بن محمود السعدي قال : حدثنا محمد بن يحيى القصري قال : دعا المنصور أبا حنيفة والثوري ومسعراً وشريكاً ليوليهم القضاء فقال أبو حنيفة : أخمن فيكم تخميناً : أما أنا فأحتال فأتخلص، وأما مِسْعَرٌ فيَتَجانُ فيتخلّص ، وأما سفيان فيهرب، وأما شريك فيقع . فلما أدخلوا عليه قال أبو حنيفة : أنا رجل مولى ولست من العرب، ولا تكاد العرب ترضى بأن يكون عليهم مولى، ومع هذا فإني لا أصلح لهذا الأمر. فإن كنت صادقاً في قولي فلست أصلح، وإن كنت كاذباً فلا يجوز لك أن تولي كاذباً دماء المسلمين وفروجهم . وأما سفيان فأدركه المشخص في طريق فذهب لحاجته وانصرف المشخص ينتظر فراغه، فبصر سفيان بسفينة فقال للملاح : إن مكنتني من سفينتك وإلا أُذبح، تأول قول النبي صلى الله عليه وسلم من جعل قاضياً فقد ذُبح بغير سكين فأخفاه الملاح تحت الباري. وأما مِسْعَرُ فدخل على المنصور فقال له : هات يدك، كيف أنت وأولادك ودوابك ؟ فقال : أخرجوه فإنه مجنون وأما شريك فقال له المنصور : تقلد القضاء فقال: أنا رجل خفيف الدماغ . قال : تقلد وعليك بالعصيد والنبيذ الشديد حتى عقلك. فتقلد فهجره الثوري وقال : أمكنك الهرب فلم تهرب .  أخبرنا محمد قال : أخبرنا الحسن قال : حدثنا أبو زكريا يحيى بن محمد بن عبدالله العنبري وأبو إسحاق إبراهيم بن محمد بن يحيى واللفظ له قالا : حدثنا محمد بن المسيب بن إسحاق الأرغياني قال: أخبرنا يونس بن عبد الأعلى الصدفي قال: كتب الخليفة إلى عبد الله بن وهب في قضاء مصر، فجنن نفسه ولزم بيته . فاطلع عليه رشيد بن سعد وهو يتوضأ في صحن داره فقال : ألا تخرج إلى الناس فتقضي بينهم بكتاب الله وسنة رسوله وقد جننت نفسك ولزمت بيك؟ فرفع إليه رأسه وقال : إلى ها هنا انتهى عقلك؟ أما علمت أن العلماء يحشرون مع الأنبياء والمرسلين، وأن القضاة يحشرون مع السلاطين؟! .  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت عبدالله بن أحمد بن الصديق يقول : سمعت أبا رجاء محمد بن حمدويه السبخي يقول: سمعت اليسع بن محمد يقول بلغني أن بعض العلماء أدخل على الواثق أيام المحنة فقال له : ما تقول في القرآن ؟ قال : مخلوق . فقيل له في ذلك فقال: عنيت البرد والحر.  أخبرنا محمد قال : أخبرنا الحسن قال : حدثنا أبو القاسم منصور بن العباس الفقيه ببوشنج قال : حدثنا أبو عبد الله محمد بن الرحمن السلمي قال: دعا الخليفة أيام المحنة محمد بن مقاتل الرازي وأبا الصلتِ عبد السلام بن صالح الهندري فقال لمحمد بن مقاتل : ما تقول في القرآن؟ قال: أقول : التوراة والإنجيل والزبور والقرآن هذه الأربعة مخلوقة، وأشار إلى الأصابع الأربعة فنجا. فقال لأبي الصلت : ما تقول؟ قال : تَعَزَّ يا أمير المؤمنين . قال : عمن ويلك؟ قال: عن قل هو الله أحد فإنه مات . قال : وكيف؟ قال : إن كان مخلوقاً فإنه يموت . فقال : مجنون أخرجوه، فأخرج فنجا.  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو يوسف أحمد بن محمد بن قيس السجزي قال : أخبرني عبيد الله بن محمد الدينوري قال : حدثنا إسحاق بن إبراهيم البستي عن أبيه سمعت يحيى بن معين يقول : لما أدخلت على الخليفة قال لي: ما تقول في القرآن؟ قلت: مخلوق، عنيت به قرآن ابن تمام.  أخبرنا محمد قال: أخبرنا الحسن قال: حدثنا أبو عبدالرحمن عبدالله بن عمر بن أحمد بن علك الجوهري بمرو قال: أخبرنا يحيى بن ماسويه بن عبد الكريم قال: أخبرنا علي بن حجر قال: أخبرنا شعيب بن صفوان عن أبي معشر أن رجلاً الى يميناً ألا يتزوج حتى يستشير مئة نفس لما قاسي من النساء. فاستشار تسعةً وتسعين نفساً وبقي واحد فخرج على أن يسأل أوّل من يطرأ عليه، فرأى مجنوناً قد اتخذ قلادة من عظم وسود وجهه وركب قصبةً وأخذ رمحه، فسلم عليه وقال: مسألة. فقال: سَلْ ما يعنيك، وإياك وما لا يعنيك واحذر رئحة هذا الفرس. قال: فقلت مجنون والله، ثم قلت: إني رجل لقيت من النساء بلاءً وآليت ألا أتزوج حتى أستشير مئة نفس وأنت تمام المئة. فقال: اعلم أن النساء ثلاث: واحدة لك وواحدة عليك وواحدة لا لك ولا عليك. فأما التي لك فشابة طرية لم تمس الرجال فهي لك لا عليك؛ إن رأت خيراً حمدَتْ وإن رأت شراً قالت: الرجال على مثل هذا. وأما التي عليك لا لك فامرأة ذات ولد من غيرك فهي التي تسلخ الرجل وتجمع لولدها. وأما التي لا لك ولا عليك فامرأة قد تزوجت قبلك إن رأت خيراً قالت: هكذا يجب. وإن رأت شرا حَنَّت إلى زوجها الأول. قال: فقلت: نشدتك الله ما الذي غير من أمرك ما أرى؟ قال: ألم أشترط عليك ألا تسأل عما لا يعنيك؟ فأقسمت عليه فقال: إني رُشحت للقضاء فاخترت ما ترى على القضاء.  أخبرنا محمد قال: أخبرنا الحسن قال: أخبرنا أبو موسى عمران بن موسى بن الحصين قراءةً عليه قال: حدثنا أبو عوانة يعقوب بن إسحاق المهرجاني قال: حدثنا أبو علي سهل بن علي ببغداد في الدُّورِ: حدثنا عبدالرحمن بن عبدالله بن أخي الأصمعي قال: سمعت عمي يقول: أخبرت أن الحجاج بن يوسف لما فرغ من أمر عبدالله بن الزبير وصلبه، قَدِمَ المدينة فلقي شيخاً خارجاً من المدينة فلما رآه الحجاج قال له: يا شيخ، من أهل المدينة أنت؟ قال: نعم. قال الحجاج: من أيهم أنت؟ قال: من بني فزارة. قال: كيف حال أهل المدينة؟ قال: شرّ حال. قال: ومم؟ قال: لما لحقهم من البلاء بقتل ابن حواري رسول الله صلى الله عليه وسلم. فقال له الحجاج من قتله؟ قال: الفاجر اللعين حجاج بن يوسف عليه لعائن الله وبهلته من قليل المراقبة الله. فقال الحجاج وقد استشاط غضباً: وإنك شيخ ممن حزنه ذلك وأسخطه؟ قال الشيخ: إي والله أسخطني ذلك أسخط الله الحجاج وأخزاه. فقال الحجاج: أوتعرف الحجاج إن رأيته؟ قال: إي والله إني به لعارف فلا عرفه الله خيراً ولا وقاه ضُرا. فكشف الحجاج لثامه وقال: إنك لتعلم أيها الشيخ إذا سال دمك الساعة. فلما أيقن الشيخ بالهلاك تحامق وقال: هذا والله العجب. أما والله يا حجاج لو كنت تعرفني ما قلت هذه المقالة، أنا والله يا حجاج العباس بن أبي ثور أُصْرَعُ في كل يوم خمس مرات. فقال الحجاج: انطلق فلا شفى الله الأبعد من جنونه ولا عافاه. حروف الجد والعقل
ودولة الحمق والجهل  أخبرنا محمد قال : أخبرنا الحسن قال : حدثنا أبو يعقوب إسحاق بن سعد بن الحسن بن سفيان بنسا قال : حدثنا جدي الحسن بن سفيان قال : أخبرنا حيان عن ابن المبارك عن سفيان عن منصور قال : قيل للحسن : إن علي بن سالم مع رقاعته وجهله غرق في الأموال، وإن فلاناً وفلاناً - وعد رجالاً من أهل الصفة - يموتون جوعاً فقال : على ذلك بنيت الدنيا : علماء بسوء الحال، وحمقى غرقى في الأموال وإلى الله تصير الأمور.  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا جعفر محمد بن أحمد بن سعيد الرازي يقول : سمعت العباس بن حمزة قال : سمعت أحمد بن حنبل قال : سمعت هشام بن عبيد الله الرازي يقول : سمعت أبا يوسف القاضي يقول : الناس ثلاثة : مجنون ونصف مجنون وعاقل. فأما المجنون فأنت منه في راحة، وأما نصف المجنون فأنت منه في تعب وأما العاقل فقد كفيت مؤنته.  أخبرنا محمد قال : أخبرنا الحسن قال : حدثنا أبو يعلى محمد بن أحمد بن حمدان النسوي الفقيه قال : حدثنا أبو بكر محمد بن أحمد بن القاسم المعروف بابن الأنباري قال : حدثنا سعيد بن القاسم بن المرزبان قال : قيل لأبي القلمس : لقد أسرع فيك الشيب. فقال : وكيف لا يسرع في الشيب وأنا محتاج إلى من لو نفذ فيه حكمي لسرح مع النعاج ولقط مع الدجاج ! هذا ابن حمدان يملك ثلاث مئة قرية . قصدته ذات يوم في حاجة، فعطس فقال : الحمد لله فقلت : يرحمك الله ، فقال : آمين يعرفك الله.  ١٢٥ أخبرنا محمد قال : حدثنا الحسن قال : أنشدنا الفقيه أبو علي زاهر بن أحمد بسرخس قال : أنشدنا أبو ذر القراطيسي : الحمد لله كم في الدهر من عجب ومن تغير أحوال وحالات
لا تنظرنّ إلى عقل ولا أدب إن الجدود قريبات الحماقات
واسترزق الله مما في خزائنه فكل ما هو آت مرةً آت
بينا ترى المرء في علياء مشرفة إذ زلّ يوماً إلى دحض بموماة  ١٢٦ أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا محمد عبدالله بن الحسن بن مردويه القزويني بجرجان يقول : سمعت أبا سلمة عبيد الله بن سعيد الكاتب يقول : دخل بعض الشعراء على ابن شوذب هو الذي يضرب به المثل في كثرة الأموال، فأتي برعيل من الخيل فتأملها وقال : أخرجوا منها ذلك المرعزي، ثم أتي بقطيع من الأغنام فقال : لا تذبحوا ذلك الأدهم. وكان الشاعر قد مدحه بقصيدة، فلما رأى ذلك خرج ولم ينشده وأنشأ يقول : لا يعرف الضان من المعزى ويحسب الأدهم مرعزى
صفت له الدنيا وضاقت لنا تلك لعمري قسمة ضيزى  أنشدنا أبو الفضل العباس بن القاسم الطبري : قل لدهـر عن المكارم عطل يا قبيح الفعال جهم المحيا
كم رفيع حططته من يفاع ورقيــع الـحـقـتـه بـالـشـريــا  أنشدنا أبو بكر أحمد بن عمران السوادي لابن لنكك: زمان قد تفرغ للفضول يُسوّد كل ذي حمق جهول
فإن أحببتم فيه ارتفاعاً فكونوا جاهلين بلا عقول  أنشدني أبو طاهر القاسم بن نصر الخبز أرزي لابن الرومي : دهر علا قَدْرُ الرقيــع بـه وترى الشريف يحطه شرفة
كالبحر يرسب فيه لؤلؤه سفلاً ويعلو فوقه جِيَفُه  ۱۳۰ أنشدني علي بن محمد بن قادم القزويني: عذلوني على الحماقة جهلا
وهي من عقلهم ألذ وأحلى
لو لقوا ما لقيت من حرفة العلم لساروا إلى الحمـاقــة رسـلا
ولقد قلت حين أغــروا بـلـومـي أيها اللائمون في الحمق مهلا
حُمُقي قائم بقوت عيالي ويموتون إن تعاقلت هزلا  أخبرنا محمد قال: حدثنا الحسن قال: سمعت أبا الحسن محمد بن محمد بن الحسن الكارزي يقول: سمعت إبراهيم بن محمد البيهقي يقول: سمعت أبا العباس محمد بن يزيد بن عبد الأكبر مبرد قال: كان مكتوباً على سيف علي بن أبي طالب رضي الله عنه: للناس حرص على الدنيا وتدبير وصفوها لك ممزوج بتكدير
لم يرزقوها بعقل عندما قسمت لكنهم رزقوها بالمقادير
كم من أديب لبيب لا تساعده ومائق نال دنياه بتقصير
لو كان عن قوة أو عن مغالبةٍ طار البزاة بأرزاق العصافير  أخبرنا محمد قال: حدثنا الحسن قال: أنشدني عبد السميع بن محمد بن عبدالسميع الهاشمي، قال: أنشدني أبو الحسين أبي عمر القاضي لنفسه في أيام محنته: یا محنة الله كفّي إن لم تكفّي فخفي
ما أن أن ترحميني من طول هذا التشفي
کم جاهل متشفّي وعالم متخفّي
ذهبت أطلب بختي فقيل لي قد توفي
فالحمد لله شكراً على نقاوة حُرْفي  ۱۳۳ ورأيت في كتاب ابن ممشاذ : فاستعمل الحمق تكن ذا غنى قد كسد العقل وأصحابه وفتحت للحمق أبوابه فقد مضى العقل وطلابه  أنشدني أبو عبد الله محمد بن جعفر بن محمد بن جعفر الأديب ببوشنج : إن أردت الغنى فكن ذا جنون واله عن كل عاقل ورزين
إنّ عقل اللبيب داء دوي ونفاق الأسواق للمجنون  ولبعضهم : إن شئت أن تحظى فكن مائقا تفز بما شئت من المال

واجتنب العقل وأصحابه تكن غنياً حسن الحال  أخبرنا محمد قال : أخبرنا الحسن قال : أنشدنا المظفر بن محمد بن غالب الهمذاني قال : أنشدنا العباس بن محمد الدوري للشافعي رحمه الله : إن امراً رُزق اليسار فلم يُصب حمداً ولا أجراً لغير موفق
فالجد يدني كل شيء شاسع والجد يفتح كل باب مُغْلَقِ
فإذا سمعت بأن مجدوداً حوى عوداً فأثمر في يديه فحقق
وإذا سمعت بأن محروماً أتى ماء ليشربه فغاض فصدق
وأشد خلق الله بالهم امرؤ ذو همة يُبلى برزق ضيق
ومن الدليل على القضاء وكونه بؤس اللبيب وطيب عيش الأحمق  ۱۳۷ - أنشدني عبد السميع بن محمد قال : أنشدني محمد بن سعيد المؤدب وتكايسي قال : أنشدني علي بن العباس بن جريج الرومي : جاهي أدق من الصراط وعزّ عزّي في انحطاط
يلجان في سم الخياط
وأنا الشقي بأرضكم مثل الممثل في البساط  ومن مشهور شعر علي بن محمد البرقعي : وتحاذقي
ما همتي إلا مقارعة العدى خَلَقَ الشباب وهمتي لم تخلق
والمرء كالمدفون تحت لسانه ولسانه مفتاح باب مغلق
إني أرى الأكياس قد تركوا سدى وأزمة الأملاك طـوع الأحــمــق
لو كان بالحيل الغنى لوجدتني بنجوم أقطار السماء تعلقي
لكن من رزق الحجي حرم الغنى ضدان مفترقان أي تفرق  ۱۳۹ أنشدني أبي رحمه الله : كم من أديب عاقل قلبه مستكمل العقل مقل عديم
ومن رقيع وافر ماله ذلك تقدير العزيز العليم  ولبعضهم في مثله: رأيت العقل حرماناً وشؤماً وأهل الحمق في زي كريم
فكن حَمِقاً تنل ما تشتهيه من المال الموفر والنعيم  ١٤١ == ولبعضهم في مثله : عجبتُ من عقلي وعقلي حكيم إذ حُرم العاقل فضل النعيم
ما ظُلم المرء ولكنه أريد أن يظهر عجز الحكيم  وأنشدت لابن الرومي: ومن انتكاس الدهر تعرفه وضع الكريم ورفع ذي دنس
yضحي الكريم به أخـا ضـعـةٍ
وترى اللئيم به على فرس
فهناك صحت وقلت مكتئباً يا دهر قد أمسكت بالنفس  أخبرني محمد بن سليمان الأرجاني لابن لنكك : دنیا دنت من جاهل ونأت عن كل ذي أدبٍ له حِجْر
سَلَحتْ على أربابها حتى إذا وصلت إلي أصابها الحضر  أنشدني أبو عبد الله جعفر بن محمد بن جعفر الأديب ببوشنج : صفتِ الدنيا لأولاد الزنى ولمن يُحْسِنُ عزفاً وغنا
وأخو الآداب في آدابه
خلف باب الدار يخرا في الإنا ولغيره : دنيا دنت من كل أحمق جاهل وتباعدت عن كل حر عاقل  وبلغني أن امرأة أتت بزرجمهر الحكيم فقالت: أيها الحكيم؛ ما بال الأمر يلتام للعاجز ويلتاث على الحازم؟ فقال: ليعلم العاجز أن عجزه لن يضره، وليعلم الحازم أن حزمه لن ينفعه، وأن الأمر في ذلك إلى غيرهما. وهذا باب لا ينقضي، وفيما ذكرناه مقنع.  ١٤٦ أخبرنا محمد قال : حدثنا الحسن قال : أخبرنا أبو عبدالله محمد بن عبد الله بن أحمد الصفار قال : حدثنا ابن أبي الدنيا قال : أخبرنا إسحاق بن إسماعيل قال : أخبرنا جرير عن ليث قال : قال الزهري : قال أكثم بن صيفي حكيم العرب لبنيه : إياكم وصحبة الأحمق فإنه إلى أن يضركم أقرب منه إلى أن ينفعكم.  أخبرنا محمد قال : حدثنا الحسن قال : حدثنا أبو الحسن محمد بن محمد بن مسعود النسوي قال : حدثنا أبو محمد عبيد الله بن عبدالرحمن بن محمد بن عيسى السكري ببغداد قال : حدثنا أبو يعلى زكريا بن يحيى بن خلاد المقرىء قال : حدثنا عبد الملك بن قريب الأصمعي قال : حدثنا العلاء بن جرير عن أبيه قال : قال الأحنف بن قيس لبعض أصدقائه اجتنب صحبة النوكى فإنهم لا يستقرون على حال، وإياك والعتاب فإنه مفتاح التقالي، والعتاب خير من الحقد.  ١٤٨ أخبرنا محمد قال : حدثنا الحسن قال : حدثنا أحمد بن محمد بن العباس الفقيه بغ قال : حدثنا علي بن إبراهيم قال : حدثنا أبو داود السبخي قال : حدثنا زهير بن عباد قال: حدثنا شهاب بن خراش عن أبيه عن بشر بن عمرو، وكان قد أدرك الصحابة رضوان الله عليهم قال : اتق الأحمق فليس للأحمق خير من هجرانه.  ١٤٩ أخبرنا محمد قال : حدثنا الحسن قال : حدثنا الحسن بن أحمد الخياط النسوي قال : حدثنا عبد الرحمن بن محمد البرزاباذي قال : حدثنا أبو هانىء عبد الحميد بن عبدالله قال : حدثنا عبد المنعم بن إدريس عن أبيه عن وهب بن منبه قال : الأحمق كالثوب الخلق إن رقعته من جانب انخرق من جانب آخر، وكالفخار المكسور لا يُرقع ولا يُشعب ولا يعاد طيناً.  أخبرنا محمد قال : حدثنا الحسن قال : حدثنا أبو عبدالله محمد بن إدريس القهندزي بهراة قال : حدثنا عثمان بن سعيد الدارمي قال : حدثنا روح بن عبد المؤمن الصدفي قال : حدثنا الأصمعي قال : حدثنا المعتمر بن سليمان قال: سمعت أبي يقول : كان يقال : تنكبوا عن مجاراة الأحمق فإنكم إن جاريتموه كنتم مثله، واجتنبوا صحبته فإنها الداء العضال الذي لا دواء له .  ١٥١ أخبرنا محمد قال : أخبرنا الحسن قال: سمعت أبا الحسن علي بن محمد بن عبدالله الصفار بسرخس يقول : سمعت أبا العباس محمد بن عبدالرحمن الدغولي يقول : سمعت الحسين بن لقمان يقول : سمعت نصر بن حاجب يقول : حكي لي عن الحسن البصري أنه قال : إياكم وصحبة الأحمق، فإن مصادقته جالبة العداوة، وعليكم بأهل التقى والعلم فإنكم لن تعدموا منهم رشداً.  ١٥٢ أنشدنا أبو أحمد عبدالله بن عدي الحافظ بجرجان قال : أنشدنا منصور : أجالس كلاً وإن لم يكن على مــا أحـب سـوى الأحـمـق
أجالسه مرةً وأنهض عنه فلا نلتقي فإني  أخبرنا محمد قال: أخبرنا الحسن قال: أخبرنا أبو حامد أحمد بن محمد بن إسماعيل قال: حدثنا أبو العباس محمد بن عبد الرحمن قال: حدثنا أبو بكر بن أبي خيثمة قال: سمعت محمد بن يزيد يقول: سمعت إدريس بن عيينة أخا سفيان بن عيينة يقول: قلب حجر بأرض الروم فإذا عليه مكتوب: وإياه لا تصحب أخا الحمق وإياك فكم من جاهل أردى حليماً حين آخاه
يقاس المرء بالمرء إذا ما هو ماشاه
وللقلب على القلب دليل حين يلقاه
وللناس على الناس مقاييس
وأشباه  أخبرنا محمد قال: أخبرنا الحسن قال: حدثنا أبو حاتم محمد بن الفضل بن إسحاق بن محمود بهراة قال: حدثنا أبو عبد الله محمد بن جاهك الضرير قال: حدثنا محمد بن أبي يعقوب الربعي عن الأصمعي عن سلمة بن بلال الخشاب قال: كان فتى تُعجِبُ علي بن أبي طالب رضي الله عنه قراءته يوماً يماشي رجلاً منهما فقال: وذكر الأبيات.  أخبرنا محمد قال: أخبرنا الحسن قال: حدثنا أبو عبدالله الصفار قال: حدثنا ابن أبي الدنيا قال: حدثني محمد بن المثنى قال: سمعت بشر بن الحارث يقول النظر إلى الأحمق سخنة عين والنظر إلى البخيل يُقسي القلب.  ١٥٦- وقال ابن المقفع : من صحب العاقل استفاد، ومن صحب الأحمق  أخبرنا محمد قال: أخبرنا الحسن قال: أنشدنا الفقيه أبو حامد أحمد بن محمد بن العباس البغوي قال: أنشدنا أبو الحسن علي بن إبراهيم: إنما الأحمق كالثوب الخَلَقْ
اتق الأحمق أن تصحبه
كلما رفعت منه جانباً صفقته الريح وهناً فانخرق
أو كعير السوء إن قضمته رمح الناس وإن جاع نهق  أنشدني أبي رحمه الله عوداً على بدء : وجالس كل عطار وجانِب كلَّ جزار
فَفَوْحُ المسك مبذول وإن أحرزه الجار
وما إن لجليس الكيـــر إلا شَرَرُ النار  ١٥٩ أخبرنا محمد قال: أخبرنا الحسن قال : أنشدني أبو بكر محمد بن عبدالله الحامدي الضرير قال : أنشدنا أبو الحسن البيروني الأديب، وسمعت أبا الحسن الكارزوني يقول : سمعت السراح يقول : سمعت الحسن بن شجاع السلمي يقول: سمعت سفيان بن وكيع عن ذوّاد بن علية عن أبيه أن قوماً ركبوا البحر فلجؤوا إلى جزيرة فإذا حجر عليه مكتوب مصاحبةُ النُّوكى بلاء وفتنة
وصحبة أهل العقل جالبة الفضل
فمن كان ذا عقل ذكي وفطنة فلا يصطحب ما عاش إلا أولي العقل  ١٦٠ أخبرنا محمد قال : أخبرنا الحسن قال : أنشدني أبو يعلى الحسين بن محمد الزبيري قال : أنشدنا أبو العباس محمد بن عبدالرحمن : اختر ذوي التمييز واستَبْقِهم وجانب النوكي وأهل الريب
فصحبةُ العاقل زينُ الفتى وصحبة الأنوك إحدى السبب وقد أوردنا في صدر هذا الكتاب أبواباً لم نجد بدا من إيرادها ليكون الكتاب جامعاً للفن المشار إليه. وسنعود الآن إلى الغرض المقصود في تأليفه فنذكره. أخبار عقلاء المجانين وأوصافهم  ١٦١- قال الأستاذ أبو القاسم الحسن بن محمد بن حبيب النيسابوري رحمه الله تعالى : قد أتينا على صدر الكتاب، ونحن نذكر الآن عقلاء المجانين وطبقاتهم ونعزوهم إلى بلادهم، ثم نذكر مجانين الأعراب، ثم المجانين من النساء، ثم نذكر أخبار من لا تثبت أسماؤهم من المجانين، ونسأل الله التوفيق. أويس القرني، رحمه الله  ١٦٢ وهو أويس بن أبي أويس، وهو أول من نسب إلى الجنون في الإسلام. والمعروف من حديثه ما وجدته في كتاب جدي الحسن بن جعفر أن السري بن خزيمة الأبيوردي حدثهم قال: حدثنا إبراهيم بن طارق الكوراني قال: حدثنا الفضيل بن عياض. أخبرنا محمد قال: حدثنا الحسن قال: وحدثنا عبد الله بن أحمد بن الصديق بمرو قال: حدثنا الحسين بن المصعب السبخي قال: حدثنا محمد بن علي بن الحسن بن شفيق قال: حدثنا الفضيل بن عياض رحمه الله قال: أخبرنا أبو قرة السدوسي عن سعيد بن المسيب قال: نادى عمر بن الخطاب رضي الله عنه وهو على المنبر بمنى: يا أهل قرن. فقام مشايخ فقالوا: ها نحن يا أمير المؤمنين. فقال: أفي قرن من اسمه أويس؟ فقال شيخ: يا أمير المؤمنين، ليس فينا من اسمه أويس إلا مجنون يسكن القفار والرمال لا يألف ولا يؤلف. فقال: ذلك الذي أعنيه، إذ قدمتم إلى قرن فاطلبوه وبلغوه سلامي وقولوا له إن رسول الله صلى الله عليه وسلم بشرني بك وأمرني أن أقرأ عليك سلامه. قال: فعادوا إلى قرن وطلبوه فوجدوه في الرمال، فأبلغوه سلام عمر وسلام رسول الله صلى الله عليه وسلم فقال: عرفني أمير المؤمنين وشهر باسمي، السلام على رسول الله صلى الله عليه وسلم اللهم صل عليه وعلى آله. وهام على وجهه فلم يوقف له بعد ذلك على أثر دهراً، ثم عاد في أيام علي بن أبي طالب رضي الله عنه مقاتلاً بين يديه فاستشهد في صفين أمامه فنظروا فإذا نيف وأربعون جراحة من طعنة وضربة ورمية.  أخبرنا محمد قال: وحدثنا الحسن قال: أخبرنا أبو عبدالله محمد بن يوسف بن إبراهيم الدقاق قال: أخبرنا أبو عمر محمد بن عبدالواحد صاحب ثعلب قال: قال عبيد: حدثنا أحمد بن زياد بن مهران السمسار قال: حدثنا عاصم بن عمر بن علي المُقدّمي قال: حدثنا عبيد الله بن شميط عن أبيه أنه سمع أسلم العجلي يقول: أخبرني أبو الضحاك المخزومي أنه سمع هرم بن حيان العبدي قال: قدمت الكوفة ولم يكن لي هم إلا أويس القرني أطلبه وأسأل عنه حتى سقطت عليه جالساً وحده على شاطئ الفرات نصف النهار يتوضأ ويغسل ثوبه، فعرفته بالنعت الذي نعت لي، فإذا رجل لحيم آدم شديد الأدمة محلوق الرأس كث اللحية عليه إزار من صوف ورداء من صوف كريه الوجه مهيب المنظر جداً، فسلمت عليه فرد علي وقال: حياك الله من رجل، ومددت يدي لأصافحه فأبى أن يصافحني فقلت: وأنت فحياك الله، ثم قلت: مرحباً بك يا أويس، كيف أنت رحمك الله؟ ثم سبقتني العبرة من حبي إياه ورقتي له إذ رأيت من حاله ما رأيت حتى بكيت وبكى، ثم قال: وأنت فرحمك الله يا هرم بن حيان، كيف أنت يا أخي ومن ذلك علي؟ فقلت: الله، فقال: لا إله إلا الله سبحان ربنا إن كان وعد ربنا لمفعولاً. فتعجبت حين سماني وعرفني ولا والله ما رأيته قط ولا رآني. فقلت: ومن أين عرفتني وعرفت اسمي واسم أبي ووالله ما رأيتك قط قبل اليوم؟ فقال: نبأني العليم الخبير، عرفت روحي روحك حين كلمت نفسي نفسك، إن الأرواح لها أنفس كأنفس الأحياء، إن المؤمنين ليعرف بعضهم بعضاً ويتحابون بروح الله عز وجل وإن لم يلتقوا ويتعارفون ويتكلمون وإن نأت بهم الديار وتفرقت بهم المنازل. فقلت: حدثني عن رسول الله صلى الله عليه وسلم بحديث أحفظه عنك، فقال: إني لم أدرك رسول الله صلى الله عليه وسلم ولم يكن لي معه صحبة، ولكن رأيت رجالاً قد رأوه، وبلغني من حديثه كبعض ما بلغكم، ولست أحب أن أفتح هذا الباب على نفسي، لا أحب أن أكون محدثاً ولا قاضياً ولا مفتياً، في النفس شغل عن الناس يا هرم بن حيان. فقلت: اقرأ علي آيات من كتاب الله أسمعهن منك، فإني أحبك في الله حباً شديداً وادع لي بدعوات وأوصني بوصية أحفظها. فقام فأخذ بيدي فقال: أعوذ بالسميع العليم من الشيطان الرجيم بسم الله الرحمن الرحيم، فشهق شهقة ثم بكى وقال: قال ربي، وأحق القول قول ربي وأصدق الحديث حديثه، وأحسن الكلام كلامه وما خلقنا السماوات والأرض وما بينهما لاعبين حتى بلغ إنه هو العزيز الرحيم ثم شهق شهقة ثم سكت. فنظرت إليه وأنا أحسب أن قد غشي عليه، ثم قال: يا هرم بن حيان مات أبوك ويوشك أن تموت يا بن حيان فإما إلى الجنة وإما إلى النار، ومات آدم وماتت حواء يا بن حيان، ومات نوح وإبراهيم خليل الرحمن يا بن حيان، ومات موسى نجي الرحمن يا بن حيان، ومات داود خليفة الرحمن يا بن حيان، ومات محمد رسول الله يا بن حيان، ومات أبو بكر خليفة المسلمين، ومات أخي وصديقي عمر بن الخطاب. ثم قال: واعمراه، رحم الله عمر، وعمر يومئذ حي. قال: فقلت: إن عمر حي لم يمت بعد. قال: قد نعاه إلي ربي إن كنت تفهم، قد علمت ما قلتُ وأنا وأنت في الثرى وكأن قد. ثم صلى على النبي وسلم ودعا بدعوات خفيفات، ثم قال: هذه وصيتي إياك يا هرم بن حيان، كتاب الله وبقايا الصالحين من المسلمين نعيتُ لك نفسي ونفسك، فعليك بذكر الموت فلا يفارقن قلبك طرفة عين ما بقيت، وانصح لأهل ملتك جميعاً، وإياك أن تفارق الجماعة فتفارق دينك وأنت لا تعلم فتدخل النار. ثم قال: إلهي إن هذا يزعم أنه يحبني فيك، وزارني من أجلك، اللهم عرفني وجهه في الجنة واحفظه ما دام في الدنيا حيثما كان، ورضه من الدنيا باليسير، وما أعطيته من الدنيا فيسره له واجعله لما تعطيه من نعمتك من الشاكرين، واجزه عني خير الجزاء. أستودعك الله يا هرم بن حيان والسلام عليك ورحمة الله، لا أراك بعد اليوم رحمك الله، فإني أكره الشهرة وأحب الوحدة، ولا تطلبني، واعلم أنك مني على بال وإن لم أرك وإن لم ترني، فاذكرني وادع لي فإني سأذكرك وأدعو لك إن شاء الله. وفارقني يبكي وأبكي، فجعلت أنظر في قفاه حتى دخل بعض السكك، فكم طلبته بعد ذلك وسألت عنه فما وجدتُ أحداً يخبرني عنه.  أخبرنا محمد قال: أخبرنا الحسن قال: أخبرنا أبو القاسم منصور بن العباس قال: حدثنا محمد بن إبراهيم بن خالد قال : حدثنا ابن أبي الدنيا قال : حدثني عبد الرحمن بن صالح الأزدي قال : حدثنا سعيد بن عبدالله بن الربيع عن بشر بن دعلوق عن بكر بن ماعز عن الربيع بن خثيم قال: أتيتُ أويساً القرني، فوجدته جالساً قد صلى الفجر، فقلت: لا أشغله عن التسبيح، فمكث مكانه ثم قام إلى الصلاة حتى صلى الظهر، ثم قام إلى الصلاة فقلت : لا أشغله عن العصر، فصلى العصر ثم صلى المغرب فقلت: لا بد له من أن يرجع فيفطر، فثبت مكانه حتى صلى العشاء الآخرة، فقلت: لعله يفطر بعد العشاء، فثبت مكانه حتى صلى الفجر ثم جلس، فغلبته عيناه فانتبه وقال : اللهم إني أعوذ بك من عين نوّامة، ومن بطن لا تشبع. فقلت: حسبي ما عاينت منه ورجعت.  وكان أويس رضي الله عنه يقول: هذه ليلة الركوع، فيحيي الليل كله في ركعة. ويقول: هذه ليلة السجود ويحيي ليله كله في سجدة.  ١٦٦ أخبرنا محمد قال : أخبرنا الحسن قال : حدثنا أبو القاسم عبيدالله بن المأمون بن أحمد بهراة، قال: حدثنا أبي قال: حدثنا أحمد بن عبيد الله قال : حدثنا يحيى بن الحجاج المنقري عن هشام عن قتادة عن الحسن قال : قال رسول الله صلى الله عليه وسلم يدخل بشفاعة رجل من أمتي الجنة أكثر من ربيعة ومضر، أما أسمي لكم ذلك الرجل؟ قالوا : بلى. قال : ذلك أويس القرني . ثم قال: يا عمر إن أدركته فَأَقْرِهِ مني السلام وقل له حتى يدعو لك، واعلم أنه كان به وضح فدعا الله فرفع عنه، ثم دعاه فرد عليه بعضه. فلما كان في خلافة عمر رضي الله عنه قال وهو بالموسم : ليجلس كل رجل منكم إلا من كان من قرن، فجلسوا إلا رجلا فدعاه، فقال : هل تعرف فيكم رجلاً اسمه أويس؟ قال : وما تريد منه؟ فإنه رجل لا يُعرف، يأوي الخرابات ولا يخالط الناس فقال : أقره مني السلام وقل له حتى يلقاني. فأبلغه الرجل رسالة عمر فقدم عليه فقال له عمر : أنت أويس؟ فقال: نعم يا أمير المؤمنين . فقال : صدق الله ورسوله . هل كان بك وضح فدعوت الله فرفعه عنك، ثم دعوته فرد عليك بعضه؟ فقال: نعم، من خبرك به؟ فوالله ما اطلع عليه غير الله . فقال : أخبرني به رسول الله صلى الله عليه وسلم وأمرني أن أسألك حتى تدعو لي، وقال : يدخل بشفاعة رجل من أمتي الجنة أكثر من ربيعة ومضر، ثم سماك . قال : فدعا لعمر ثم قال له : حاجتي إليك يا أمير المؤمنين أن تكتمها علي وتأذن لي في الانصراف ففعل، فلم يزل مستخفياً من الناس حتى قتل يوم نهاوند فيمن استشهد. مجنون بني عامر  وهو من جملة من يُذكر من المجانين أشهر، وحديثه أوضح وأسير. ولقد بلغ من شهرته أن جنونه غلب على اسمه حتى أنه إن سمي أو عزي إلى أبيه لم يثبت بل يقال : قال المجنون كذا، وفعل مجنون بني عامر كذا، وما أشبه ذلك، حتى عابه كثير من الشعراء بالبوح ومدحوا أنفسهم بالكتمان وأنشدنا علي سهل بن شهقور السجزي : ما كان مجنون على حاله إلا وقد كنت كما كانا
ولي عليه الفضل من أجل أن باح وأني ذبت كتمانا وأنشدني غيره : باح مجنون عامر بهواه وكتمتُ الهوى فمت بوجدي
فإذا كان في القيامة نُودي من قتيل الهوى؟ تقدمت وحدي  ١٦٨ أخبرنا محمد قال: أخبرنا الحسن قال: أخبرنا إبراهيم بن إسماعيل بن عبد الله الراوية البصري قال: أخبرنا معاذ بن سهل الأزدي عن أبيه عن الأثرم عن أبي عبيدة معمر بن المثنى قال: هو مهدي بن الملوح بن مزاحم بن قيس بن عدي بن ربيعة بن جعدة بن كعب. وقال أبو العباس محمد بن يزيد بن عبد الأكبر: هو قيس بن معاذ. بدء شأنه:  أخبرنا محمد قال: أخبرنا الحسن قال : حدثنا أبو جعفر محمد بن جعفر بن محمد بن هارون بن موسى بن جعفر بن محمد بن علي بن الحسين بن علي بن أبي طالب الموسوي قال : سمعت علي بن عمران القمي يقول : حدثنا أبو بكر القارىء قال : حدثنا نصير قال : سئل مجنون بني عامر : كيف كان سبب عشقك لليلى؟ قال: بينا أنا في عنفوان غرتي وريعان جدتي أسحب ذيل اللعب، وأرمي الكواعب من كثب، وأصبو إليهن فيفترقن وأهز أرباقهن فلا ينتصفن، إذ اعتلقتني حبائل فتاة من بني عذرة فذهلني حبها وتيمني عشقها، وأنشد: ولم أر ليلى غير موقف ساعة بخيف منى ترمي جمار المحصب
ويبدي الحصى منها إذا حذفت به من البرد أطراف البنان المخضب
ألا إنما غادرت يا أم مالك صدى أينما هبت به الريح يذهب
وأصبحت من ليلى الغداة كناظر من الصبح في أعجاز نجم مغرب  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا علي السبيعي بمرو يقول : قيل لليلى : حبك للمجنون أكثر من حبه لك؟. فقالت: بل حبي له . قيل : وكيف؟ قالت : لأن حبه لي كان مشهوراً وحبي له كان مستوراً.  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا الفضل نهيك بن محمد بن نهيك إمام الجامع بهراة يقول : سمعت أبا يزيد حاتم بن محمود الشامي يقول: سمعت العتبي يقول : ذكر ابن الكلبي أن المجنون في أول ما كلف بليلي قعد عندها يوماً يتحدث، فرآها تُعرض عنه وتقبل على غيره، فشق ذلك عليه وعرفت ليلى ذلك في نفسه فأقبلت عليه وقالت : وكل مظهر في الناس بغضاً وكل عند صاحبه مكين فخر مغشياً عليه ثم تمادى به العشق حتى ذهب عقله، فسعى عليهم ابن مساحق مُصْدِقاً ، فنزل برهط المجنون فرأى رجلاً عرياناً فألقى عليه ثوباً فمزقه، فسأل عنه فأخبر بالقصة، فدعاه فإذا هو لا يعقل شيئاً، فقالوا له : إن أردت أن يرجع إليه عقله فاذكر ليلى. فجعل يذكر ليلى فئاب إليه عقله، فرق له وقال : إني أزوجكم . فسار مع ابن مساحق إلى قومها ، فلما سمع قومها بذلك لبسوا السلاح وقالوا : لا يدخل مجنون علينا . ضمن لهم ابن مساحق ألف ناقة فأبوا، وعاد إلى جنونه، وزوجها أبوها رجلاً من قومه فشق ذلك عليه وأنشأ يقول : فو الله ثم الله إني لدائب أفكر ما ذنبي إليها وأعجب
ووالله ما أدري علام صرَمْتِني وأي أموري فيكِ يا ليل أركب
أأقطع حبل الوصل فالموت دونه أم اشرب رنقا منكم ليس يُشرب
أم اهرب حتى لا أرى لي مجاوراً أم اصنع ماذا أم أبوح فأغلب
ولو تلتقي أصداؤنا بعد موتنا ومن دوننا رمس من الأرض مكتب
لظل صدى رمسي وإن كنت رمةً لصوت صدى ليلى يهش ويطرب طرف أخباره  ۱۷۲ قال هشام محمد الكلبي : ذكر لي أن المجنون أتى رهط ليلى سراً، فصار إلى امرأة كانت عارفة بأمرهما، فشكا إليها الوجد وقلة الصبر، فرثت له ووعدته أن تجمع بينهما، فاستأذنت ليلى أمها لتحدثها، فأذنت لها فجمعت بينهما، فبكى وشكا وبكت وشكت وأنشدها وأنشدته . فلما حان فراقهما أنشأ يقول: إذا قربت دار كَلِفْتُ وإن نأت أسفتُ فلا بالقرب أسلو ولا البعد
وإن وعدت زاد الهوى لانتظارها وإن بخلت بالوعد من على الوعد  وقال الأصمعي : حدّثتُ أنّ رهط قيس قالوا لأبيه : اطلب له طبيباً لعله يطلعنا على ما به . فأتاه بطبيب فنظر إليه وعالجه ، فلما أعياه ما به خلاه فأنشأ قيس يقول : ألا يا طبيب النفس أنت طبيبها فرفقاً بنفس قد جفاها حبيبها
دعتني دواعي حبّ ليلى ودونها ذُرا قُور حِسْمَى الحزن منها قلوبها
فلبيك من داع دعا ولو انني صدى بين أحجار لظل يجيبها
وما هجرتك النفس من أجل أنها قَلَتْكِ ولكنْ قَلَّ منكِ نصيبها  ١٧٤ وذكر الأصمعي أن رهط قيس قالوا لأبيه : لو خرجت به إلى الحج فدعا الله لعله ينساها، فخرج به فبينما هو يرمي الجمار إذ نادى مناد من بعض تلك الخيام : يا ليلي فخر قيس مغشياً عليه ثم أفاق وأنشأ يقول قصيدته التي فيها يقول :  قال جنيد: حبس المجنون مع ليلى في السجن، فقيل له : اخرج. قال : لا أخرج لأن الكون مع الحبيب في السجن خير من الفراق. فأخرج فجاء الناس يعزونه بكونه ليلةً في السجن فقال : ليل الحبيب مع الحبيب نهار وكذاك أيام الوصال قصار وقال أيضاً : وسجني مع المحبوب فردوس جنتي وناري مع المحبوب أنوار مهجتي  وقال أبو عبيدة : وذكر لي أن سعيد بن العاص بن أبي ربيعة كانت بينه وبين قيس ،صداقة فلما رأى قيساً وما به قال له : فضحت نفسك وعشيرتك ونسبت إلى الجنون، فلو تناسيتها وشغلت بالصيد ومحادثة الإخوان لسلا قلبك . فقال : كيف أسلو عنها ولستُ أرى شيئاً إلا تمثلت لي دونه؟ ثم أنشأ يقول : أريد لأنسى ذكرها فكأنما تمثل لي ليلى بكل سبيل
فلا تَلْحَيَنى يا سعيد فإنني وحق إلهي هالك بقليل)  وقال خالد بن كلثوم : ومرّ قيس برجلين صيادين وقد اصطادا ظبيةً فقمطاها، فلما نظر إليها ترتكض في الحبالة دمعت عيناه وقال: خليا عنها، فأبيا فقال : لكما شاة من غنمي، فدفعاها إليه فقبلها وخلى سبيلها وأنشأ يقول : ألا يا شبه ليلى لا تراعي ولا يثنيك من وردِ التلاع
فقد أشبهتها إلا خلالاً نشوز القرن أو حمش الذراع  قال ابن الكلبي : كان قيس يحدث جماعة من قومه فقالوا له : الحب صيرك إلى هذه الدقة والنحول؟ فقال : والله ما بي داء إلا الحب، ثم غشي عليه، فقال بعضهم : ما هذا بحب إنما هو جنون، فأنشأ قيس يقول : إني لأجلس في النادي أحدثهم فأستفيق وقد غالتني الغول

يُغشى علي إذا ما كنتُ عندكم حتى يقول جليسي: أنت مخبول  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرني أبو محمد أحمد بن عبدالله المزني سنة ثمان وثلاثين وثلاث مئة قراءة عليه قال : أخبرني أبو سعيد أحمد بن سعيد القاشاني قال: حدثنا جنيد بن حكيم الدقاق قال: أخبرني أحمد بن الحارث عن علي بن محمد المدائني عن أبي الهيثم العبدي قال : قال كثير عزة : خرجت أريد أخوالاً لي فضللت الطريق، فبينا أسير في فلاة من الأرض إذا أنا برجل قاعد، فقلت: إنسي أم جني؟ قال : إنسي . فقلت : ما أقعدك ها هنا؟ قال : نصبت شَرَكاً للظباء . قال كثير : فأعجبني أن أنظر إلى صيده، فأنحتُ راحلتي قريباً منه. فبينا أنا أحدثه إذ اضطرب الحبل فقام وقمت فإذا بظبية كأحسن ما يكون من الظباء وأسمنه، فاستخرجها برفق وجعل يقبل جيدها وعينيها ، ثم أرسلها وهو يقول: اذهبي في كلاءة الرحمن أنتِ مني في ذمة وأمان
ترهبيني والجيد منكِ لليلى والحشى والبغام والعينان
لا تخافي بأن تُسامي بسوء ما تغنى الحمام في الأغصان قال كثير: فأعجبني ما رأيت منه فأقمتُ عنده. فلما كان من الغد غدا وغدوتُ فنصب حبالته فما لبثنا أن اضطرب الحبل فقام وقمت، فإذا بظبي كنحو ما كان أمس، ففعل به كما فعل بالآخر، فمضى غير بعيد ثم وقف فنظر إليه وقال : أيا شبه ليلى لا تراعي فإنني لك اليوم من وحشية لصديق
فعيناك عيناها وجيدك جيدها سوى أن عظم الساق منك دقيق
فلا تشكرني بالذي قد صنعته فأنتِ لليلى إن شكرت طليق
وما أنا ـ إن شبهتها ثم لم تؤب سليماً ـ عليها في الحياة شفيق ثم لبثنا يومنا وليلتنا، فلما كان من الغد غدا وغدوتُ وصنع مثل صنيعه، فإذا نحن بظبية، ففعل مثلما فعل ثم خلاها وأنشأ يقول : تذكرني ليلى من الوحش ظبية لها مقلتاها والمقلد والحشى
فيل دمع العين يجري لذكرها فأشفي غليل القلب بالدمع ما جرى فقلتُ : الله أبوك ما أعجب شأنك؟ فالتفت إلي ثم قال : أتلحى محباً هائماً أن رأى لمن أحب شبيهاً في الحبالة موثقا
فلما دنا منه تذكر شجوه وآنس مما قد رآه تشوقا
وهيج منه حائلا دون ذبحه فأرسله من أجل ليلى وأطلقا
ألا لا تلمه بل به اليوم حرقـةً من الوجد لا تزداد إلا تحرقا قال : فوالله إني لفي ذلك إذ أقبل راكب فقال : اللهم إني أسألك خير ما عنده . فجاء حتى وقف عليه فقال : تعز يا قيس قال : عمن ؟ قال : عن ليلى. فقام إلى بعيره و قمت إلى بعيري فشددنا عليهما ثم أقبلنا إلى الحي، فقال: أرشدني إلى قبرها. فأشار إليه، فإذا قبر حديث العهد بطين فأكب عليه يقبله ويلتزمه ويشم ترابه وهو يقول : أيا قبر ليلى لو شهدناك أعولت عليك نساء من فصيح ومن عجم
ویا قبر لیلی ما تضمنت مثلها شبيهاً لليلى في عفاف وفي كرم
ويا قبر ليلى أكرمَنَّ محلّها يكن لك ما عشنا بها عندنا نعم
ويا قبر ليلى إن في الصدر غصةً مكان الحشى شُدَّتْ مع الريق بالسلم قال : ثم شهق شهقة فمات، فدفنته أنا والراكب وأنشأت أقول : سأبكيكما ما دمت حياً وإن أمت فإني قد لاقيت ما تجدان  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا نصر منصور بن عبد الله الأصبهاني يقول : سمعت أبا محمد الحريري يقول : قيل للمجنون : أتحب ليلى؟ قال : لا . قيل : ولم ؟ قال : لأن المحبة ذريعة الوصلة وقد سقطت الذريعة فليلي أنا وأنا ليلى.  أنشدني أبو بكر محمد بن المنذر الضرير للمجنون: تذكرتُ ليلى والفؤاد عميد
وشطت نواها والمزار بعيد
يبيد الهوى من صدر كل متيم
وحبي لليلى ما حييت جديد غرر أشعاره  ١٨٢ أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو الحسن المظفر بن محمد بن غالب الهمذاني قراءة عليه قال: حدثنا أبو بكر بن الأنباري قال : حدثنا عبدالله بن خلف قال : حدثنا عبد الله بن مسلمة المروزي قال : سمعت الأصمعي يقول : لم يكن مجنون بني عامر مجنوناً ولكن كانت فيه لوثة كلوثة أبي حية النميري، وهو من أشعر الناس، ومن جيد شعره : أما والذي أبكى وأضحك والذي أمات وأحيا والذي أمره الأمر
لقد تركتني أحسد الوحش أن أرى أليفين منها لا يروعُهما الذعر
فيا حبها زدني جوى كل ليلة ويا سلوة الأحباب موعدك الحشر
ويا هَجْرَ ليلى قد بلغت بي المدى وزدت على ما لم يكن صنع الهجر
عجبت لسعي الدهر بيني وبينها فلما انقضى ما بيننا سكن الدهر  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت المظفر هذا يقول : سمعت الحسن بن علي الطبري يقول : سمعت أبي يقول : أخبرت عن الجعد بن عقبة الجرمي أنه أنشد لمجنون بني عامر وهو قيس بن معاذ : دعوت إله الناس عشرين حِجَّةً نهاراً وليلا في الجميع وخاليا
لكي يبتلي ليلى بمثل بليتي فتعلم حالي أو ترق لما بيا
فلم يستجب لي الله فيها ولم يُفِقٌ فؤادي ولكن زيد حتى برانيا
فيا ربّ حببني إليها وأَشْفني بها وأَرحٌ مما يقاسي فؤاديا  سمعت أبا بكر محمد بن المنذر الضرير يقول : مر رجل بمجنون بني عامر وهو يهذي ، فقال له : ما بالك؟ فقال: بي اليأس أو داء الهيام أصابني فإياك عني لا يصيبك ما بينا  ١٨٥ أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا علي الحسن بن أحمد البيهقي القاضي يقول: سمعت أبا بكر بن الأنباري يقول : سمعت العباس بن سالم الشيباني يقول : سمعت ابن الأعرابي يقول : من جيد شعر مجنون بني عامر قوله : يقولون عن ليلى غَنِيتَ وإنما بي اليأس عن ليلى وليس بي الصبر
فيا حبذا ليلى إذ الدهر صالح وسقياً لليلى بعدما فسد العمر
وإني لأهواها وإني لأيس هوى وإياس كيف ضمهما الصدر  وأنشدتنا غراء بنت الفقاعي البصرية: أمر مجانباً عن دار ليلى أُلِمُّ بها وفي قلبي غليل
وقلبي عند ساكنها فهل لي إلى قلبي وساكنها سبيل
ولو أن الطلول أجبن صباً لِرَحْمته أجابتني الطلول  ومن جيد شعره: يقولون مجنون بحبك مولع
ألا حبذا جنا بها وولوع
ولا خير في حب يكون كأنه
شغاف أجنته حشى وضلوع  ومنه: قالوا جننت على ليلى فقلت لهم
الحب أعظم داء بالمجانين وقد نسب مجنون ليلى إلى الجنون لأنه جعل الحب سبب الجنون وقال: جُننا على ليلى وجنت بغيرنا
وأخرى بنا مجنونة ما نريدها  ومنه: وجاؤوا إليه بالتعاويذ والرقى
وصبوا عليه الماء من ألم النكس
وقالوا به من أعين الجن لحظةً
ولو عقلوا قالوا به أعين الإنس  ومنه: وعاذلةٍ تُقطعني ملاما وفي زجر العواذل لي عزاء

وقالوا لو تشاء صبرت عنها فقلت لهم فإني لا أشاء

وكيف وحبُّها عَلق بقلبي كما عَلِقَتْ بأرشيةٍ دلاء

لها حبُّ تمكّن من فؤادي وليس له وإن زُجر انتهاء  ومنه: أفي مكتنا عنكم ليال مرضتها
تزيدينني ليلى على مرضي جهدا
تعدين ذنباً أنت ليلى جنيته
علي ولا أحصي ذنوبكم عدا
وإن شئت حرمت النساء سواكم وإن شئت لم أشرب نقاخاً ولا بردا

غداً يكثر الباكون منا ومنكم وتزداد داري من دياركم بعدا  أخبرنا محمد قال: أخبرنا الحسن قال : أنشدني المظفر بن محمد بن غالب قال : أنشدنا ابن الأنباري قال : أنشدنا عبدالله بن خلف المجنون بني عامر : أيا شبه ليلى إن ليلى مريضة وأنت صحيح إن ذا لمحال
أقول لظبي مر بي في مفازة أأنت أخو ليلى؟ فقال: يقال
فإن لا تكن ليلى غزالاً بعينها فقد أشبهتها ظبية وغزال  ۱۹۳ ومن مشهور شعره : ذكرتك والحجيج لهم ضجيج ببكة والقلوب لها وجيب
فقلتُ ونحن في بلد حرام به الله أُخلِصَتِ القلوب
أثوب إليك يا رحمن إني أسأتُ وقد تضاعفت الذنوب
فأما من هوى ليلى وحبي زيارتها فإني لا أتوب أبو عطاء سعيد المجنون الملقب بسعدون  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبدالله محمد بن الطيب ببوشنج قال : حدثنا أبو بكر حفص بن عمر بن حفص الهروي قال : حدثنا علي بن محمد بن عبد الحميد قال : حدثنا إبراهيم بن الجنيد الختلى عن محمد بن الحسين عن راشد بن علقمة البصري الأزدي قال : قال لي عطاء السلمي : احتبس علينا القطر بالبصرة فخرجنا نستسقي فإذا بسعدون المجنون، فلما أبصرني قال : يا عطاء إلى أين؟ قلت : خرجنا نستسقي . قال: بقلوب سماوية أم بقلوب خاوية؟ قلت: بقلوب سماوية قال : لا تُبهرج فإن الناقد بصير! . قلت : ما هو إلا ما حكيت لك، فاستسق لنا. فرفع رأسه إلى السماء وقال: أقسمت عليك إلا سقيتنا الغيث ثم أنشأ يقول : أيا من كلما نودي أجابا ومن بجلاله ينشي السحابا

ويا من كلّم الصديق موسى كلاماً ثم ألهمه الجوابا

ويا من ردّ يوسف بعد ضُرٌ على من كان ينتحب انتحابا

ويا من خص أحمد باصطفاء وأعطاه الرسالة والكتابا اسقنا . قال : فأرتجت السماء شآبيب كأفواه القرب . قلت : زدني قال : ليس ذا الكيل من ذاك البيدر ثم أنشأ يقول : سبحان من لم تزل له حجج قامت على خلقه بمعرفته

قد علموا أنه مليكهم
يعجز وصف الأنام عن صفته  ١٩٥ أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبدالله قال : حدثنا أبو بكر قال : حدثنا علي بن محمد عن إبراهيم بن الجنيد عن محمد بن الحسين عن عبيد الله الهاشمي قال : قال عطاء : رأيت سعدون يتفلّى ذات يوم في الشمس فانكشفت عورته فقلتُ له : استر يا أخا الجهل ، فقال : أما لك مثلها؟ فأمنته . ثم مر بي يوماً وأنا آكل رماناً في السوق، فعرك أذني وقال : من الجاهل منا أنا أم أنت؟ ثم أنشأ يقول : أرى كل إنسان يرى عيب غيره ويعمى عن العيب الذي هو فيه
وما خير من تخفى عليه عيوبه ويبدو له العيب الذي بأخيه
وكيف أرى عيباً وعيبي ظاهر وما يعرف السوءات غير سفيه  ١٩٦ أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو الحسن عيسى بن زيد العقيلي النسابة قال : أخبرنا أبو سليمان الرقي قال : حدثني جدي سليمان بن جابر قال : حدثنا داود بن سليمان قال : حدثنا عبد الله بن سويد قال : رأيت سعدون المجنون وبيده فحمة وهو يكتب بها على جدار قصر خراب : يا خاطب الدنيا إلى نفسها إنّ لها في كل يوم خليل
ما أقبح الدنيا لخُطابها تقتلهم عمداً قتيلاً قتيل
تستنكح البعل وقد وطنت في موضع آخر منه البديل
إني لمغتر وإنّ البلى يعمل في نفسي قليلا قليل
تزودوا للموت زاداً فقد نادی منادیه الرحيل الرحيل!  أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا الفضل نصر بن أبي نصر العطار بطوس يقول : سمعت سليمان بن أبي سليمان الفقيه بالرملة يقول : حدثنا محمد بن سفيان عن محمد بن الحسين عن إسماعيل بن خالد بن نصر القشيري قال قدم علينا سعدون المجنون فسمعته ليلة من الليالي يقول في دعائه: لك خشعت قلوب العارفين وإليك طمحت آمال الراجين ثم أنشأ يقول وكن لربك ذا حب لتخدمه إن المحبين للأحباب خدام  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبدالله محمد بن الطيب قال : حدثنا أبو بكر حفص بن عمر قال: حدثنا علي بن محمد قال: حدثنا إبراهيم بن الجنيد عن محمد بن الحسين عن إسماعيل بن عطاء العطار قال : مررت بسعدون المجنون فلم أسلم عليه فنظر إلي وأنشأ يقول: يا ذا الذي ترك السلام تعمداً ليس السلام بضائر من سلّمـا
إن السلام تحية مبرورة ليست تحمل قائليها مأثما  ۱۹۹ أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا أبو عبدالله محمد بن الطيب قال : حدثنا أبو بكر قال : حدثنا علي بن عبد الحميد قال : حدثنا إبراهيم بن الجنيد عن محمد بن الحسن عن ثابت بن عبد الله قال : أنشدني سعدون أبياتاً في الوصف : تفهم يا أخي وصف الملاح
وقد ركبوا النجائب في وشاح
من الحور الحسان منعماتٍ تفوق وجوههن ضيا الصباح
براهن المهيمن من عبير وشرفهن حقًا بالفلاح
فها أنا واصف منهن خَوْداً منعمةً مدلّلةً رداح
بشعرٍ فاحم رَجُلٍ أثيث وطرف سحره للقلب لاح
وصدغ فوق سالفة بمسك كشق النون في رق متاح
إذا خطرت تحيّر كل حُسْنِ وإن مرحت تعشقها المراح
تقول وقد نعمن بها العذارى ألا يا خود هل حبي بصاح
فقد نقصت لذاتى جميعاً وأعدمني هواه شرب راح  ۲۰۰ أخبرنا محمد قال : أخبرنا الحسن قال : سمعت أبا الفضل نصر بن أبي نصر العطار يقول : سمعت أباعون المصري يقول : سمعت عطاء بن خالد يقول : أنشدني سعدون المجنون : يا من لرِجُلٍ قُيدَتْ مَن غَلَّها ويمين صب بالتحرج علها
لا تُزرين على فقير يائس كالسن تحت عباءة قد خلّها
القطر ينزل عند وقت دعـائــه والعشب ينبت إن بكى وتألهـا
قل للنيام تنبهوا عن نومكم فالله أعطاني المحبة كلها  أخبرنا محمد قال : أخبرنا الحسن قال : أخبرنا محمد بن الطيب قال : حدثنا حفص بن عمر قال: حدثنا علي بن عبد الحميد عن إبراهيم بن الجنيد قال : سمعت عطاء بن خالد يقول : سمعت سعدون وقد رفع رأسه إلى السماء وهو يقول : لك ترهبت خليقتك وإليك هربت من عقوبتك. ثم تنفس وأنشأ يقول : يا من الرجل قيدت من غلها
